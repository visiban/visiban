site_name: Visiban
site_description: Open-source Kanban board where every row is an entity and every move is on the record — documentation
site_url: https://docs.visiban.com
repo_url: https://gitlab.com/visiban/visiban
repo_name: visiban/visiban
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.breadcrumbs
    - navigation.top
    - toc.integrate
    - content.code.copy

plugins:
  - search
  - include-markdown
  - mike

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

