site_name: Visiban
site_description: Swimlane pipeline board — documentation
site_url: https://docs.visiban.com
repo_url: https://gitlab.com/visiban/visiban
repo_name: visiban/visiban
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.breadcrumbs
    - navigation.top
    - toc.integrate
    - content.code.copy

plugins:
  - search
  - include-markdown
  - mike

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Kubernetes (Helm): getting-started/kubernetes.md
    - First Boot: getting-started/first-boot.md
    - OAuth Setup: getting-started/oauth.md
    - Board Setup: getting-started/board-setup.md
    - Sample Boards: getting-started/sample-boards.md
    - Onboarding Tour: getting-started/onboarding-tour.md
  - Features:
    - features/index.md
    - Board & Cards: features/board.md
    - Card Archiving: features/card-archiving.md
    - Card Descriptions: features/card-descriptions.md
    - Saved Filters: features/saved-filters.md
    - Analytics: features/analytics.md
    - Notifications: features/notifications.md
    - Real-time Updates: features/realtime.md
    - Card History: features/card-history.md
    - Stable UIDs: features/stable-uids.md
    - Groups: features/groups.md
    - Navigation: features/navigation.md
    - Personal Access Tokens: features/personal-access-tokens.md
    - Board Permissions: features/permissions.md
    - Feature Toggles: features/feature-toggles.md
    - Roles & Permissions:
      - features/rbac/index.md
      - Overview: features/rbac/roles.md
      - Group Inheritance: features/rbac/inheritance.md
      - Managing Roles: features/rbac/managing.md
  - API Reference:
    - api/index.md
    - Authentication: api/authentication.md
    - Boards: api/boards.md
    - Cards: api/cards.md
    - Groups: api/groups.md
    - Notifications: api/notifications.md
    - Admin: api/admin.md
    - WebSockets: api/websockets.md
    - Health Checks: api/health.md
    - OpenAPI Spec: api/openapi.md
  - Architecture:
    - architecture/index.md
    - Overview: architecture/overview.md
    - Data Model: architecture/data-model.md
    - Deployment: architecture/deployment.md
    - Scaling: architecture/scaling.md
    - Open-Core Boundary: architecture/open-core-boundary.md
    - API Versioning: architecture/api-versioning.md
    - Technology Decisions: architecture/decisions.md
  - Administration:
    - administration/index.md
    - Configuration: administration/configuration.md
    - Site Admins: administration/site-admins.md
    - Admin Panel: administration/admin-panel.md
    - Authentication: administration/authentication.md
    - Demo Data: administration/demo-data.md
    - Django Admin: administration/django-admin.md
    - Media Storage Security: administration/media-security.md
    - Secret Rotation: administration/secret-rotation.md
    - Upgrading: administration/upgrade.md
  - Security:
    - Security Audit: security/audit-370-headless-allauth.md
  - Changelog: changelog.md
