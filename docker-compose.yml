# Host ports are parameterized so this stack can run alongside another Compose
# project on the same machine. Override DB_PORT / BACKEND_PORT / FRONTEND_PORT
# (and COMPOSE_PROJECT_NAME) in .env when you need a second checkout to coexist.
name: ${COMPOSE_PROJECT_NAME:-visiban}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visiban
      POSTGRES_USER: visiban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiban}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visiban"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    # Valkey is the BSD-3, Linux Foundation fork of Redis (after Redis 7.4's
    # move to the non-OSI RSALv2/SSPL license). Wire-compatible with Redis 7,
    # so the redis:// URL scheme and the REDIS_URL env vars are unchanged.
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Backend reaches Valkey over the internal Compose network as `valkey:6379`,
    # so this host-port mapping is usually not needed — only useful if you want
    # to attach valkey-cli/redis-cli or a GUI client from the host. Override
    # REDIS_PORT in .env on a second checkout to avoid colliding with another
    # project's Valkey/Redis on the same machine.
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_site_admin &&
             daphne -b 0.0.0.0 -p 8000 visiban.asgi:application"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://valkey:6379/0
      REDIS_CACHE_URL: redis://valkey:6379/1
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: sh -c "rm -rf /app/node_modules/.vite && npm run dev -- --host 0.0.0.0"
    environment:
      # Tell Vite which host port the browser is reaching it on, so HMR
      # websocket URLs match when FRONTEND_PORT is remapped away from 5173.
      VITE_HMR_CLIENT_PORT: ${FRONTEND_PORT:-5173}
      # Browser-facing backend URL — must match the host port the browser
      # uses to reach the backend (track BACKEND_PORT). Baked into the bundle
      # by Vite via import.meta.env.VITE_API_URL.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
