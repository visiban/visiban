# Default nginx config for the frontend image (#1994).
#
# Replaces the stock conf.d/default.conf so that running the image on its own
# (docker run, no mounted config) sends the same response headers as the bundled
# templates (nginx/app.conf.template, nginx/app-http.conf.template) and the Helm
# chart's frontend ConfigMap. Static serving only: it has no /api/ or /ws/
# proxying, so a deployment that needs those still mounts one of those configs.
#
# scripts/helm-structure-check.sh and backend/boards/tests/test_sample_endpoints.py
# compare the headers below against the bundled template; keep them in step.
#
# Headers are server-level on purpose: a location that declares its own
# add_header drops every inherited one, so no location below declares any.
server {
    # Non-privileged port: the image runs as the non-root `nginx` user.
    listen       8080;
    server_name  localhost;

    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    # connect-src is 'self' only: this config has no known app hostname to name
    # for the WebSocket, so it relies on the browser mapping 'self' to ws/wss.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
