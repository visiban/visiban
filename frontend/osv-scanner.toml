[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
# minimatch < 11.0.1: globparts amplification DoS (MODERATE, published
# 2026-10-30). The only fix is 11.0.1; neither the 3.x line (eslint,
# @eslint/config-array, @eslint/eslintrc) nor the 10.x line
