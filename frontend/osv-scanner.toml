# when the eslint toolchain moves to minimatch >= 11.0.1 (tracked in #2018).
ignoreUntil = 2027-01-31
reason = "No minimatch fix within the 3.x/10.x ranges eslint requires; dev-only lint tooling, never sees untrusted input"
