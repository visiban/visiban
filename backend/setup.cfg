[tool:pytest]
DJANGO_SETTINGS_MODULE = visiban.settings
python_files = tests/test_*.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short
norecursedirs = .venv migrations node_modules

[coverage:run]
source = .
omit =
    .venv/*
    */migrations/*
    manage.py

# Mutation-testing pilot (#1384). Read by mutmut 2.x, which CI installs inside
# the backend-mutation job only (pinned; never in requirements*.txt). See
# docs/development/mutation-testing.md. mutmut 2.5.1 starts the runner without a
# shell and finds plain `python` through the inherited PATH: right in CI, and
# locally only with the project virtualenv activated.
[mutmut]
paths_to_mutate = boards/permissions.py
tests_dir = boards/tests/
runner = python -m pytest -x -q -p no:cacheprovider boards/tests/test_rbac.py boards/tests/test_rbac_boundaries.py boards/tests/test_explicit_permissions.py boards/tests/test_permissions_unit_mutation_gaps.py
