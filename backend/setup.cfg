[tool:pytest]
DJANGO_SETTINGS_MODULE = visiban.settings
python_files = tests/test_*.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short
norecursedirs = .venv migrations node_modules

[coverage:run]
source = .
omit =
    .venv/*
    */migrations/*
    manage.py

# Reconcile the absolute file paths baked into each shard's .coverage.* data
# file against the combine runner's checkout. The parallel backend-test shards
# and the backend-test-coverage combine job can land on runners with different
# build roots (e.g. /builds/... vs /tmp/builds/...). Without this mapping,
# `coverage combine` keeps the shard's absolute paths and `coverage report`
# fails with "No source for code" whenever the combine runner's root differs.
# The first entry (./) is canonical and resolves against the combine job's CWD
# (backend/); the others are the known GitLab runner build roots.
[coverage:paths]
source =
    ./
    /builds/visiban/visiban/backend/
    /tmp/builds/visiban/visiban/backend/
