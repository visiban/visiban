[tool:pytest]
DJANGO_SETTINGS_MODULE = visiban.settings
python_files = tests/test_*.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short
norecursedirs = .venv migrations node_modules

[coverage:run]
source = .
omit =
    .venv/*
    */migrations/*
    manage.py

# Nightly mutation testing (#1384). The targets, their test files and shard
# counts live in mutmut_config.py (TARGETS); `python mutmut_config.py run` passes
# --paths-to-mutate and --runner to mutmut explicitly, so this section holds only
# what every run shares. mutmut 2.x is installed inside the backend-mutation CI
# job only (pinned; never in requirements*.txt). See
# docs/development/mutation-testing.md.
[mutmut]
tests_dir = boards/tests/
