# ─── Catalog components ───────────────────────────────────────────────────────
#
# SAST: Semgrep-based static analysis via the official GitLab catalog component.
# Covers Python and TypeScript/JavaScript with broader rules than Bandit.
# enable_mr_pipelines: true — runs on MR pipelines in addition to branch
# pipelines, so findings gate merges. excluded_paths skips generated code.

include:
  - component: gitlab.com/components/sast/sast@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true
      excluded_paths: >-
        backend/boards/migrations,
        backend/groups/migrations,
        backend/accounts/migrations
  - component: gitlab.com/components/secret-detection/secret-detection@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true

# ─── Workflow ─────────────────────────────────────────────────────────────────
#
# Merge-request-pipeline model: feature branches get CI *only* through their
# MR, never as a standalone branch pipeline. This makes the branch+MR duplicate
# structurally impossible rather than merely suppressed.
#
# The previous `$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS when: never` dedup
# could not stop duplicates on the MR-open push: $CI_OPEN_MERGE_REQUESTS is
# empty in the branch pipeline created at the moment the MR is opened (GitLab
# hasn't associated the MR with the branch yet), so the rule missed and the
# catch-all `$CI_COMMIT_BRANCH` rule ran a second pipeline. Dropping that
# catch-all removes the only branch-pipeline path for feature work.
#
# Trade-off: pushing a feature branch with no open MR runs no CI. Open the MR
# early (Draft is fine) to get pipeline coverage — this matches our
# always-go-through-an-MR workflow.
#
# Main-branch commits always get a pipeline (post-merge verification).
# Tag pipelines run for version tags so docs-deploy can fire on release.

workflow:
  # Only cancel a running pipeline when a newer commit arrives if every job
  # in that pipeline is marked interruptible: true. Jobs default to
  # interruptible: false (see `default:` below) so main-branch pipelines
  # are never auto-canceled by a subsequent merge commit.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # all feature work
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'        # main, post-merge
    - if: '$CI_COMMIT_TAG'                                 # release tags
    # No catch-all $CI_COMMIT_BRANCH rule: a branch with no open MR gets no
    # pipeline, so the branch+MR duplicate can never be created.

# Test and build run in the same stage so they execute in parallel — build
# verification (kaniko) doesn't depend on test results, and running them
# together saves a full stage of sequential waiting.
stages:
  - lint
  - test
  - security
  - deploy

# Auto-retry on runner infrastructure failures (pod watcher sync, stuck
# cleanup, image pull transients). Only retries on runner_system_failure
# and stuck_or_timeout_failure — never on script failures.
default:
  interruptible: false
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ─── Rule templates ───────────────────────────────────────────────────────────
#
# Extend jobs with .on-mr to restrict them to MR pipelines only.
# Lint and test jobs use path-based rules so they only run when relevant
# files change, with a fallback to always run on the default branch.

.on-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── Cache templates ──────────────────────────────────────────────────────────
#
# Cache uses MinIO as the S3-compatible distributed backend so all runners
# share a warm cache across jobs and branches.
#
# Required CI/CD project variables (Settings → CI/CD → Variables):
#   MINIO_ENDPOINT   — host:port of the MinIO server, e.g. minio.internal:9000
#   MINIO_ACCESS_KEY — MinIO access key
#   MINIO_SECRET_KEY — MinIO secret key
#   MINIO_BUCKET     — bucket name, e.g. visiban-ci-cache
#
# Runner config.toml must enable the S3 backend:
#   [runners.cache]
#     Type   = "s3"
#     Shared = true
#     [runners.cache.s3]
#       ServerAddress = "<MINIO_ENDPOINT>"
#       AccessKey     = "<MINIO_ACCESS_KEY>"
#       SecretKey     = "<MINIO_SECRET_KEY>"
#       BucketName    = "<MINIO_BUCKET>"
#       Insecure      = false   # set true if MinIO has no TLS
#
# Cache keys include a fixed prefix so entries are grouped cleanly inside
# the S3 bucket. The lockfile hash provides automatic invalidation when
# dependencies change. node_modules/ is cached alongside the npm download
# cache to skip extraction on warm hits.

.npm-cache:
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [frontend/package-lock.json]
    paths:
      - .npm/
      - frontend/node_modules/
    policy: pull

# PIP_CACHE_DIR stores downloaded wheels/sdists. pip honors this env var
# automatically so no extra flags are needed in before_script.

.pip-cache:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip"
      files: [backend/requirements.txt]
    paths: [.cache/pip/]
    policy: pull

# Warm the caches on the default branch so feature-branch jobs can pull from
# them without paying the push cost on every MR pipeline. Only one job per
# cache key prefix — runs after tests succeed on main.

cache-warm-pip:
  stage: deploy
  needs: [backend-test-coverage]
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip"
      files: [backend/requirements.txt]
    paths: [.cache/pip/]
    policy: pull-push
  script:
    - pip install --quiet -r backend/requirements.txt
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cache-warm-pip-test:
  stage: deploy
  needs: [backend-test-coverage]
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip-test"
      files: [backend/requirements-test.txt]
    paths: [.cache/pip/]
    policy: pull-push
  script:
    - pip install --quiet -r backend/requirements-test.txt
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cache-warm-npm:
  stage: deploy
  needs: [frontend-test]
  image: node:20-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [frontend/package-lock.json]
    paths:
      - .npm/
      - frontend/node_modules/
    policy: pull-push
  script:
    - cd frontend && npm ci --prefer-offline
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ─── Shell scripts — lint ────────────────────────────────────────────────────
#
# shellcheck catches common shell bugs: unquoted variables, missing set -e,
# portability issues, and incorrect conditionals. Runs on every MR that touches
# scripts/ and always on main.

shellcheck:
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache shellcheck
  rules:
    - changes:
        - scripts/*.sh
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - shellcheck --severity=warning scripts/*.sh

# ─── Dockerfiles — lint ───────────────────────────────────────────────────────
#
# hadolint enforces Dockerfile best practices (layer ordering, missing WORKDIR,
# ADD vs COPY, etc.). DL3008 (pin apt versions) is ignored — rationale in
# .hadolint.yaml. Runs on every MR that touches a Dockerfile and always on main.

dockerfile-lint:
  stage: lint
  image:
    name: hadolint/hadolint:latest-alpine
    entrypoint: [""]
  rules:
    - changes:
        - "**/Dockerfile*"
        - .hadolint.yaml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - hadolint --config .hadolint.yaml
        backend/Dockerfile
        backend/Dockerfile.prod
        frontend/Dockerfile
        frontend/Dockerfile.prod

# ─── Backend — lint ───────────────────────────────────────────────────────────

# Ruff lint check + CodeClimate quality report in a single job — avoids
# spinning up two pods and installing ruff twice.
# allow_failure: true — style issues are visible but do not block merges.
backend-lint:
  extends: .pip-cache
  stage: lint
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check backend/
    - ruff check backend/ --output-format=gitlab -o code-quality-report.json || true
  artifacts:
    reports:
      codequality: code-quality-report.json
    paths:
      - code-quality-report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# ─── Backend — test ───────────────────────────────────────────────────────────
#
# Runs Django tests via pytest, sharded across 3 parallel jobs using
# pytest-split's least_duration algorithm for time-balanced distribution.
# These jobs gate the pipeline on test failures (fast, parallel).
# Coverage is measured separately by backend-test-coverage in a single-process
# run — see that job's comment for why sharded coverage combining is not used.
#
# On first run (no .test_durations in cache), pytest-split falls back to
# round-robin splitting. After one run, the durations file is cached and
# subsequent runs use time-balanced splitting.

backend-test:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  parallel: 3
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  cache:
    - key:
        prefix: "pip"
        files: [backend/requirements.txt]
      paths: [.cache/pip/]
      policy: pull
    - key:
        prefix: "pip-test"
        files: [backend/requirements-test.txt]
      paths: [.cache/pip/]
      policy: pull
    - key: test-durations
      paths: [backend/.test_durations]
      policy: pull-push
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet -r backend/requirements-test.txt
  script:
    - cd backend
    - coverage run --parallel --data-file=.coverage.${CI_NODE_INDEX} -m pytest
        --splitting-algorithm least_duration
        --store-durations
        --group $CI_NODE_INDEX
        --splits $CI_NODE_TOTAL
        --junitxml=test-results/junit-${CI_NODE_INDEX}.xml
        -q
  artifacts:
    paths:
      - backend/.coverage.*
    reports:
      junit: backend/test-results/junit-*.xml
    when: always
    expire_in: 1 day

# Combines the .coverage.* artifacts produced by the three parallel backend-test
# shards and enforces the 90% threshold.  Each shard runs with --parallel so
# coverage.py treats its data file as a fragment to be combined rather than a
# standalone measurement.  The union of all executed lines across all shards
# equals the single-process total, so no test re-run is needed here.
#
# No postgres/redis services required — this job only runs coverage combine and
# report, no Django or test execution.
backend-test-coverage:
  stage: test
  needs: [backend-test]
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - pip install --quiet coverage
  script:
    - cd backend
    - coverage combine
    - coverage report --fail-under=90
    - coverage xml -o coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    when: always

# Checks that every model change has a corresponding migration file.
# Requires a Postgres service because makemigrations --check calls
# check_consistent_history(), which connects to the DB to verify applied
# migrations are consistent with the on-disk migration files.
migration-check:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py makemigrations --check --dry-run --verbosity=1

# Validates the OpenAPI schema generated by drf-spectacular has no ERROR-level
# issues.  Does not require a database or Redis — Django loads in DEBUG mode
# with a fake DATABASE_URL so the schema introspection path runs without
# connecting.
backend-schema-validate:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@localhost:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://localhost:6379/0"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py spectacular --validate
  allow_failure: false

# ─── OIDC smoke test ─────────────────────────────────────────────────────────
#
# End-to-end smoke test for the OIDC authorization code flow.  Exercises:
#   - Discovery endpoint parsing (/.well-known/openid-configuration)
#   - IdP login form submission and code exchange
#   - Visiban callback routing and session creation
#   - Identity claim mapping (email, username) via allauth
#
# Runs a real Keycloak 24 instance as a service.  The realm, client, and test
# user are provisioned by scripts/oidc_provision.py via the Admin REST API so
# no custom Docker image or file mount is needed.
#
# The backend is started with `runserver` in the background (not daphne) so
# that the process exits cleanly when the job ends without a SIGKILL dance.
#
# FRONTEND_URL is pointed at the liveness endpoint so the post-login redirect
# resolves inside the job without needing the React dev server running.
#
# Runs on any change to OIDC-related files, and always on the default branch.
# allow_failure: true — Keycloak boot is slow on the shared small runner and the
# job historically times out far more often than it succeeds, so a red run must
# not block unrelated MRs.  The job is still reported in the pipeline summary.
#
# Debugging note: the 120s readiness budget was too tight for Keycloak's JVM boot
# when sharing a single vCPU with postgres/redis/python.  We raised the wait to
# 240s and enabled CI_DEBUG_SERVICES so the Keycloak container log is captured in
# the trace — this distinguishes a slow boot from a crash/OOM.  If the log shows
# CPU starvation rather than a crash, move this job to saas-linux-medium-amd64.

oidc-smoke:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  rules:
    - changes:
        - backend/accounts/**/*
        - backend/visiban/settings.py
        - scripts/oidc_provision.py
        - scripts/oidc_smoke_test.py
        - oidc/**/*
        - docker-compose.oidc.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true
  services:
    - name: quay.io/keycloak/keycloak:24.0.5
      alias: keycloak
      command: ["start-dev"]
      variables:
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost,127.0.0.1"
    # Capture the Keycloak (and other) service-container logs in the job trace so
    # a boot timeout can be diagnosed as slow-boot vs crash/OOM without guessing.
    CI_DEBUG_SERVICES: "true"
    OIDC_CLIENT_ID: "visiban"
    OIDC_CLIENT_SECRET: "test-oidc-secret"
    OIDC_SERVER_URL: "http://keycloak:8080/realms/visiban-test"
    OIDC_PROVIDER_NAME: "Keycloak"
    # Point post-login redirect back to the liveness endpoint so the full
    # callback flow resolves without needing the frontend running.
    FRONTEND_URL: "http://localhost:8000/api/health/liveness/"
  before_script:
    - pip install --quiet -r backend/requirements.txt requests
    # Provision Keycloak: waits for readiness, then creates realm/client/user.
    # 240s budget — Keycloak's JVM boot routinely exceeds the previous 120s when
    # sharing a single vCPU with postgres/redis/python on the small runner.
    - python scripts/oidc_provision.py --keycloak-url http://keycloak:8080 --wait-timeout 240
    # Run migrations
    - cd backend && python manage.py migrate --noinput
    # Start the backend in the background; give it a few seconds to bind
    - python manage.py runserver 0.0.0.0:8000 &
    # Poll the liveness endpoint instead of a fixed sleep — faster on warm
    # runners, reliable on slow ones. Gives up after 30 seconds.
    # Uses python requests (already installed) — no curl in python:3.12-slim.
    - |
      for i in $(seq 1 30); do
        python3 -c "import requests; requests.get('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
  script:
    - python scripts/oidc_smoke_test.py
        --base-url http://localhost:8000
        --username testuser
        --password testpassword
        --expected-email testuser@example.com

# ─── Helm — lint ─────────────────────────────────────────────────────────────
#
# Validates the Helm chart renders without errors against the default values.
# Dependency tarballs are committed under helm/visiban/charts/ so no network
# access is required. Runs on any change to the chart or values, and always
# on main so a bad chart never reaches the deploy stage undetected.

helm-lint:
  stage: lint
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  rules:
    - changes:
        - helm/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    # Render-time validation in templates/_validate.tpl refuses to render the
    # chart while values.yaml still carries placeholder secrets / hosts. CI
    # supplies these overrides so the chart can be lint+templated against its
    # committed defaults without baking real values into values.yaml.
    HELM_CI_OVERRIDES: >-
      --set-string secret.djangoSecretKey=ci-not-a-real-secret
      --set backend.email.backend=console
      --set backend.settings.allowedHosts=ci.visiban.local
  script:
    - helm lint helm/visiban -f helm/visiban/values.yaml $HELM_CI_OVERRIDES
    - helm template visiban helm/visiban -f helm/visiban/values.yaml $HELM_CI_OVERRIDES > /dev/null

# ─── Frontend — lint ──────────────────────────────────────────────────────────

# ESLint + TypeScript type checking in a single job — both need npm ci so
# combining them eliminates a redundant pod spin-up and install cycle.
frontend-lint:
  extends: .npm-cache
  stage: lint
  image: node:20-alpine
  variables:
    # Cap below available RAM so V8 GCs aggressively instead of OOM-killing.
    # 1500 MB caused exit 137 on the 2 GB runner; 512 MB forces earlier GC.
    NODE_OPTIONS: "--max-old-space-size=512"
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # Scope to src/ to avoid scanning build artefacts and reduce memory pressure
    # from eslint loading the full working tree. --max-warnings 15 matches the
    # sast job allowance for pre-existing react-hooks/exhaustive-deps warnings.
    - npm run lint -- src/ --max-warnings 15
    - npx tsc -p tsconfig.app.json --noEmit
    - npx tsc -p tsconfig.e2e.json --noEmit

# ─── Frontend — test ──────────────────────────────────────────────────────────

frontend-test:
  extends: .npm-cache
  stage: test
  needs: []
  image: node:20-alpine
  variables:
    # Match frontend-lint: cap below available RAM so V8 GCs before OOM-kill.
    NODE_OPTIONS: "--max-old-space-size=512"
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml --coverage
  coverage: '/All files\s+\|\s+(\d+(?:\.\d+)?)\s+\|/'
  artifacts:
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    when: always

# ─── Frontend — E2E (Playwright) ─────────────────────────────────────────────
#
# Runs the Playwright suite against the Vite dev server using the official
# Microsoft Playwright Docker image (browsers pre-installed, no download step).
# API calls are intercepted by page.route() so no backend is required.
#
# Starts as allow_failure: true to tolerate transient flakiness during the
# initial rollout period.  Promote to required after three consecutive clean
# weeks of pipeline history on main.
#
# Uses workers: 1 (via playwright.config.ts) to stay within the 2 GB runner
# memory budget (Chromium ~500 MB + Vite dev server ~400 MB).

playwright-e2e:
  stage: test
  needs: []
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  allow_failure: true
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx playwright test --output=test-results
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    reports:
      junit: frontend/test-results/junit.xml
    expire_in: 7 days

# ─── Changelog check (MR only) ────────────────────────────────────────────────
#
# Fails when no changelog fragment was added and the MR contains changes that
# warrant a changelog entry. Each MR drops a file in changelog.d/ instead of
# editing CHANGELOG.md directly — this eliminates merge conflicts.
#
# Fragment naming: <issue-or-slug>.<type>.md  (e.g. 434.fixed.md)
# Valid types: added, changed, fixed, security
#
# Auto-skips for MRs that only touch:
#   - CI/CD config (.gitlab-ci.yml, .gitlab/)
#   - Documentation (docs/, *.md other than changelog fragments, README*)
#   - Developer tooling (CLAUDE.md, .gitignore, scripts/, Makefile, *.sh)
#   - Test files only (frontend/src/test/, backend/*/tests/)
# To skip manually for a legitimate edge case, add the ~no-changelog label.

changelog-check:
  extends: .on-mr
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache git
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
    - BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD || echo "")
    - |
      if [ -z "$BASE" ]; then
        echo "INFO — could not determine merge base; skipping changelog check."
        exit 0
      fi
    - |
      # Skip if the MR carries the no-changelog label
      if echo "$CI_MERGE_REQUEST_LABELS" | tr ',' '\n' | grep -qx 'no-changelog'; then
        echo "INFO — 'no-changelog' label present; skipping."
        exit 0
      fi
    - CHANGED=$(git diff --name-only $BASE HEAD)
    - |
      # Strip files that never need a changelog entry
      MEANINGFUL=$(echo "$CHANGED" | grep -Ev \
        '^\.gitlab(-ci\.yml|/)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(docs/|README|CLAUDE\.md|\.gitignore|Makefile|scripts/|mkdocs\.yml)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '\.(md|sh)$' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(frontend/src/test/|frontend/e2e/|backend/.*/tests/)' \
        || true)
      if [ -z "$MEANINGFUL" ]; then
        echo "INFO — only non-product files changed; skipping changelog check."
        exit 0
      fi
    - |
      # Accept either a changelog fragment OR a direct CHANGELOG.md edit
      # (the latter supports in-flight MRs during the transition period).
      HAS_FRAGMENT=$(echo "$CHANGED" | grep -c '^changelog\.d/.*\.\(added\|changed\|fixed\|security\)\.md$' || true)
      HAS_CHANGELOG=$(echo "$CHANGED" | grep -c 'CHANGELOG.md' || true)
      if [ "$HAS_FRAGMENT" -gt 0 ]; then
        echo "OK — changelog fragment found."
      elif [ "$HAS_CHANGELOG" -gt 0 ]; then
        echo "OK — CHANGELOG.md updated directly (legacy mode)."
      else
        echo "ERROR — No changelog fragment found." >&2
        echo "" >&2
        echo "  Add a file to changelog.d/ named: <issue-or-slug>.<type>.md" >&2
        echo "  Valid types: added, changed, fixed, security" >&2
        echo "  Example:  echo 'Description of change (#123)' > changelog.d/123.fixed.md" >&2
        echo "" >&2
        echo "  Or apply the ~no-changelog label if this MR genuinely needs no entry." >&2
        exit 1
      fi

# ─── Security (MR only) ───────────────────────────────────────────────────────
#
# Security jobs run only on MR pipelines — they are the gate before merging
# and do not need to run on every WIP commit.

# bandit: Python SAST for security issues — shell injection, hardcoded
# credentials, use of random instead of secrets, SQL injection patterns, etc.
# Runs at medium severity (-ll) so only Medium/High findings block the merge.
# Skips migration files (auto-generated, safe to ignore) and test files
# (test utilities like mock tokens are intentionally insecure-looking).
backend-sast:
  extends: .pip-cache
  stage: security
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*.py
  before_script:
    - pip install --quiet bandit
  script:
    # Single scan: write JSON artifact, then print a readable summary and exit
    # with bandit's own exit code. bandit does not support two simultaneous
    # output formats, so we parse the JSON to produce log output instead of
    # running a second full scan.
    # Use && ... || ... to capture the exit code safely under set -e.
    - |
      bandit -r backend/ \
        --severity-level medium \
        --confidence-level medium \
        --exclude backend/boards/migrations,backend/groups/migrations,backend/accounts/migrations,backend/visiban/migrations \
        --skip B101 \
        -f json -o bandit-report.json && BANDIT_EXIT=0 || BANDIT_EXIT=$?
      python3 - <<'PY'
      import json
      d = json.load(open("bandit-report.json"))
      results = d.get("results", [])
      metrics = d.get("metrics", {}).get("_totals", {})
      print(f"bandit: {metrics.get('loc', '?')} lines scanned, {len(results)} issue(s)")
      for r in results:
          print(f"  [{r['issue_severity']}/{r['issue_confidence']}] {r['test_id']} {r['issue_text']}")
          print(f"    {r['filename']}:{r['line_number']}")
      PY
      exit $BANDIT_EXIT
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - bandit-report.json

# eslint-plugin-security: JS/TS SAST for injection, prototype pollution,
# non-literal regexp/require, and other common frontend security issues.
# Runs as a dedicated security job (separate from style linting) so failures
# are clearly security-attributed and block merges independently.
frontend-sast:
  extends: .npm-cache
  stage: security
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/src/**/*.{ts,tsx}
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/src/**/*.{ts,tsx}
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # ESLint v9 uses flat config and removed --no-eslintrc.  Write a temporary
    # flat config *inside the frontend dir* so bare-specifier imports resolve
    # against the local node_modules.  --no-config-lookup prevents the project's
    # eslint.config.js from being merged in, keeping this job focused only on
    # the security rules below.
    # detect-object-injection is set to warn: it fires on common TypeScript
    # bracket-access patterns and produces many false positives in React code.
    - |
      cat > eslint-security.config.mjs <<'ESLINTEOF'
      import security from 'eslint-plugin-security';
      import tsParser from '@typescript-eslint/parser';
      import reactHooks from 'eslint-plugin-react-hooks';
      import reactRefresh from 'eslint-plugin-react-refresh';
      import tseslint from 'typescript-eslint';
      const rules = { 'security/detect-object-injection': 'warn', 'security/detect-non-literal-regexp': 'error', 'security/detect-non-literal-require': 'error', 'security/detect-possible-timing-attacks': 'warn', 'security/detect-eval-with-expression': 'error' };
      // Register react-hooks, react-refresh, and @typescript-eslint plugins so that
      // eslint-disable-next-line comments referencing their rules are recognised as
      // valid (prevents "Definition for rule X was not found" errors).  No rules from
      // these plugins are enabled — only security/ rules are enforced here.
      const linterOptions = { reportUnusedDisableDirectives: 'off' };
      export default [
        { files: ['**/*.{ts,tsx}'], languageOptions: { parser: tsParser }, linterOptions, plugins: { security, 'react-hooks': reactHooks, 'react-refresh': reactRefresh, '@typescript-eslint': tseslint.plugin }, rules },
        { files: ['**/*.{js,mjs,jsx}'], linterOptions, plugins: { security }, rules },
      ];
      ESLINTEOF
      npx eslint --no-config-lookup --config eslint-security.config.mjs src/
  allow_failure: true

# pip-audit: checks Python packages against the OSV vulnerability database.
# On MRs: only when requirements.txt changes; allow_failure so a new CVE in an
# existing dep doesn't block unrelated MRs.
# On the weekly CVE schedule: always runs; allow_failure: false so the pipeline
# fails and GitLab sends a failure email to maintainers.
backend-dep-scan:
  stage: security
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/requirements.txt
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
      allow_failure: false
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit -r backend/requirements.txt --format json -o pip-audit-report.json || true
    - pip-audit -r backend/requirements.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pip-audit-report.json

# npm audit: flag HIGH or CRITICAL CVEs in frontend npm dependencies.
# Same MR / schedule split as backend-dep-scan above.
frontend-dep-scan:
  extends: .npm-cache
  stage: security
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/package-lock.json
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
      allow_failure: false
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm audit --audit-level=high
  after_script:
    - cd frontend && npm audit --json > ../npm-audit-report.json 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - npm-audit-report.json

# License compliance — flag GPL-2.0/GPL-3.0 dependencies that are incompatible
# with the project's Apache 2.0 license. Non-blocking so it warns but doesn't
# gate merges.

backend-license-check:
  extends: [.on-mr, .pip-cache]
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r backend/requirements.txt pip-licenses
  script:
    - pip-licenses --format=plain --fail-on="GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2)"
  allow_failure: true

frontend-license-check:
  extends: [.on-mr, .npm-cache]
  stage: security
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx license-checker --failOn "GPL-2.0;GPL-3.0" --summary
  allow_failure: true

# trivy: filesystem scan for OS-level CVEs in the Docker base images and
# IaC misconfigurations in Dockerfiles and Helm charts.
#
# Why trivy in addition to pip-audit / npm audit:
#   - pip-audit and npm audit only see application-layer dependencies.
#     trivy also scans the OS packages installed in the Docker image
#     (e.g. Alpine apk packages in python:3.12-slim or node:20-alpine)
#     for CVEs that the app-layer scanners never see.
#   - --scanners vuln,config catches both CVEs and IaC issues (Dockerfile
#     USER root, ADD instead of COPY, missing HEALTHCHECK, etc.) in one pass.
#
# Runs on any change to a Dockerfile, requirements.txt, package-lock.json,
# or Helm chart, plus always on main. allow_failure: true so a newly
# published OS CVE in a base image does not immediately block merges —
# findings are visible in the job log and artifact for triage.
trivy-scan:
  stage: security
  image:
    name: ghcr.io/aquasecurity/trivy:latest
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/Dockerfile
        - frontend/Dockerfile
        - backend/requirements.txt
        - frontend/package-lock.json
        - helm/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # Scan the repo filesystem — catches vuln in declared deps and IaC issues
    # in Dockerfiles and Helm templates. --exit-code 0 so the job is non-
    # blocking; severity threshold is HIGH,CRITICAL for the visible summary.
    - trivy fs .
        --scanners vuln,config
        --severity HIGH,CRITICAL
        --exit-code 0
        --format table
    - trivy fs .
        --scanners vuln,config
        --severity HIGH,CRITICAL
        --exit-code 0
        --format json
        --output trivy-report.json
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-report.json

# OSV-Scanner: unified Python + npm dependency vulnerability scan using the
# OSV.dev advisory database (PyPA, GitHub Advisory, and 20+ ecosystem feeds).
# Complements pip-audit and npm audit with first-party OSV data, which has
# lower false-positive rates than NVD.
#
# Runs on a weekly schedule (CI schedule variable OSV_SCAN="true") and on MRs
# when lockfiles change. allow_failure: true — tighten to false after a clean run.
# JSON results uploaded as artifact for triage.

dep-scan-osv:
  stage: security
  image:
    # Pinned — :latest rolled from v1 to v2, which restructured the CLI
    # (subcommands) and ships a distroless image with the binary at /osv-scanner
    # instead of on PATH.
    name: ghcr.io/google/osv-scanner:v2.3.5
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/requirements.txt
        - frontend/package-lock.json
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OSV_SCAN == "true"'
      allow_failure: true
  script:
    # Binary lives at /osv-scanner in the distroless image (not on PATH).
    # Write JSON report first (osv-scanner exits non-zero on any finding).
    - /osv-scanner scan source
        --lockfile backend/requirements.txt
        --lockfile frontend/package-lock.json
        --format json
        --output-file osv-report.json
        || true
    # Print human-readable summary; exit with osv-scanner's own exit code
    - /osv-scanner scan source
        --lockfile backend/requirements.txt
        --lockfile frontend/package-lock.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - osv-report.json

# ─── Build verification (MR only) ─────────────────────────────────────────────
#
# Verify Docker images build successfully before merging. Catches Dockerfile
# drift early without pushing to any registry.
# Uses kaniko instead of Docker-in-Docker — no privileged mode needed, works
# out of the box on Kubernetes runners.
# Runs in the test stage alongside tests — build doesn't depend on test
# results, so running them in parallel saves a full stage of waiting.

backend-docker-build:
  stage: test
  # No needs: [] — let lint finish before kaniko starts so both don't compete
  # for RAM on the same runner. resource_group serializes the two kaniko jobs
  # so they don't overlap with each other either.
  resource_group: kaniko-build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - backend/Dockerfile
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
        printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
          "$(printf '%s:%s' "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')" \
          > /kaniko/.docker/config.json
      else
        printf '{}' > /kaniko/.docker/config.json
      fi
  script:
    - /kaniko/executor --context=backend --dockerfile=backend/Dockerfile --no-push --snapshot-mode=redo

frontend-docker-build:
  stage: test
  resource_group: kaniko-build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
        printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
          "$(printf '%s:%s' "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')" \
          > /kaniko/.docker/config.json
      else
        printf '{}' > /kaniko/.docker/config.json
      fi
  script:
    - /kaniko/executor --context=frontend --dockerfile=frontend/Dockerfile --no-push --snapshot-mode=redo --build-arg NODE_OPTIONS=--max-old-space-size=512

# ─── Docker push (multi-arch: amd64 + arm64) ─────────────────────────────────
#
# Builds and pushes multi-arch images (linux/amd64 + linux/arm64) using
# docker buildx with QEMU emulation. The host Docker daemon is accessed via
# the socket mount in config.toml:
#   volumes = ["/var/run/docker.sock:/var/run/docker.sock"]
#
# Runner VM prerequisites (one-time setup, both VMs):
#   apt-get install -y qemu-user-static binfmt-support
#   docker buildx create --name multiarch --driver docker-container --bootstrap --use
#
# On main-branch merges: pushes linux/amd64 only to the GitLab registry
#   with :latest and :<short-sha> tags. ARM64 is skipped to avoid the QEMU
#   emulation penalty on every commit.
# On tag pipelines: pushes linux/amd64+arm64 to the GitLab registry and GHCR
#   with :<tag> and :latest tags. ARM64 is built only here where the cost is
#   acceptable — OSS users on Apple Silicon or Graviton pull from GHCR.
#
# --provenance=false prevents buildx from pushing an extra attestation manifest
# that confuses older registry clients.
#
# The ARM64 slice is QEMU-emulated on AMD64 runners — slower than native but
# acceptable for release-tag pipelines. The linux/arm64 image works natively
# on both Linux ARM64 servers and Apple Silicon Macs.

.docker-push-common:
  stage: deploy
  # docker:28-cli provides the Docker CLI + buildx plugin without a bundled
  # daemon — the host daemon is reached via the socket mount.
  image: docker:28-cli
  variables:
    # Pin the daemon to the mounted host socket. Job-level variables outrank a
    # runner config.toml `environment` entry, so this neutralizes any stray
    # DOCKER_HOST=tcp://docker:2375 inherited from the runner (a dind default
    # this pipeline deliberately does not use — see the socket mount above).
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker login -u "${GHCR_USER}" -p "${GHCR_TOKEN}" ghcr.io
    # Create a fresh docker-container driver builder for this job. The builder
    # instance config lives in the job container's home dir (ephemeral), so we
    # cannot reuse a builder created on the host by another user. The host's
    # QEMU binfmt_misc registrations (qemu-user-static, persistent via systemd)
    # are inherited by the buildkitd container, enabling linux/arm64 emulation.
    - docker buildx create --driver docker-container --bootstrap --use
  after_script:
    # Remove all non-default buildx builders created by this job. Each job
    # creates a docker-container driver builder (a BuildKit daemon container +
    # cache volume on the host). Without explicit removal the containers and
    # their cache volumes accumulate on the runner's Docker tmpfs and exhaust
    # space within a few builds.
    - docker buildx ls --format '{{.Name}}' | grep -v '^default' | xargs -r docker buildx rm || true

backend-docker-push:
  extends: .docker-push-common
  needs: [backend-test-coverage]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      # Release tags: multi-arch (amd64 + arm64). Main-branch merges: amd64 only.
      if [ -n "${CI_COMMIT_TAG}" ]; then
        PLATFORMS="linux/amd64,linux/arm64"
      else
        PLATFORMS="linux/amd64"
      fi
      TAGS="--tag ${CI_REGISTRY_IMAGE}/backend:latest \
            --tag ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        TAGS="${TAGS} \
          --tag ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_TAG} \
          --tag ghcr.io/visiban/visiban/backend:${CI_COMMIT_TAG} \
          --tag ghcr.io/visiban/visiban/backend:latest"
        # Stable releases (no pre-release suffix) also get the MAJOR.MINOR alias,
        # e.g. :1.0 — this is what users should pin to for production stability.
        if echo "${CI_COMMIT_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          MINOR=$(echo "${CI_COMMIT_TAG}" | grep -oE '^v[0-9]+\.[0-9]+' | tr -d 'v')
          TAGS="${TAGS} \
            --tag ${CI_REGISTRY_IMAGE}/backend:${MINOR} \
            --tag ghcr.io/visiban/visiban/backend:${MINOR}"
        fi
      fi
      docker buildx build \
        --platform ${PLATFORMS} \
        --file backend/Dockerfile \
        --provenance=false \
        --push \
        ${TAGS} \
        backend/

frontend-docker-push:
  extends: .docker-push-common
  needs: [frontend-test]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      # Release tags: multi-arch (amd64 + arm64). Main-branch merges: amd64 only.
      if [ -n "${CI_COMMIT_TAG}" ]; then
        PLATFORMS="linux/amd64,linux/arm64"
      else
        PLATFORMS="linux/amd64"
      fi
      TAGS="--tag ${CI_REGISTRY_IMAGE}/frontend:latest \
            --tag ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHORT_SHA}"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        TAGS="${TAGS} \
          --tag ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_TAG} \
          --tag ghcr.io/visiban/visiban/frontend:${CI_COMMIT_TAG} \
          --tag ghcr.io/visiban/visiban/frontend:latest"
        # Stable releases (no pre-release suffix) also get the MAJOR.MINOR alias,
        # e.g. :1.0 — this is what users should pin to for production stability.
        if echo "${CI_COMMIT_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          MINOR=$(echo "${CI_COMMIT_TAG}" | grep -oE '^v[0-9]+\.[0-9]+' | tr -d 'v')
          TAGS="${TAGS} \
            --tag ${CI_REGISTRY_IMAGE}/frontend:${MINOR} \
            --tag ghcr.io/visiban/visiban/frontend:${MINOR}"
        fi
      fi
      docker buildx build \
        --platform ${PLATFORMS} \
        --file frontend/Dockerfile \
        --build-arg NODE_OPTIONS=--max-old-space-size=512 \
        --provenance=false \
        --push \
        ${TAGS} \
        frontend/

# ─── GHCR manual push ─────────────────────────────────────────────────────────
#
# Pushes multi-arch :latest images to GHCR on demand without running the full
# CI suite. Click the play button on any pipeline's deploy stage to trigger.
#
# Builds from the commit the pipeline is running on. To push from a specific
# branch, trigger a pipeline on that branch (glab ci run -b <branch>) and
# click play here.

ghcr-push-backend:
  extends: .docker-push-common
  stage: deploy
  when: manual
  allow_failure: true
  script:
    - docker buildx build
        --platform linux/amd64,linux/arm64
        --file backend/Dockerfile
        --provenance=false
        --push
        --tag ghcr.io/visiban/visiban/backend:latest
        backend/

ghcr-push-frontend:
  extends: .docker-push-common
  stage: deploy
  when: manual
  allow_failure: true
  script:
    - docker buildx build
        --platform linux/amd64,linux/arm64
        --file frontend/Dockerfile
        --build-arg NODE_OPTIONS=--max-old-space-size=512
        --provenance=false
        --push
        --tag ghcr.io/visiban/visiban/frontend:latest
        frontend/

# ─── GitHub Release ────────────────────────────────────────────────────────────
#
# Runs only on version tag pipelines, after both images are confirmed pushed.
# Reads release notes for the tag from CHANGELOG.md and creates a GitHub Release
# with GHCR image references appended. rc/beta/alpha tags are marked pre-release.
# GH_TOKEN CI variable (repo-scoped PAT) is passed through automatically.

github-release:
  stage: deploy
  image: alpine:3.19
  needs: [backend-docker-push, frontend-docker-push]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    - apk add --no-cache github-cli
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
              | sed '/^[[:space:]]*$/d' | sed '/^---[[:space:]]*$/d')
      if [ -z "$NOTES" ]; then
        NOTES="See [CHANGELOG.md](https://gitlab.com/visiban/visiban/-/blob/main/CHANGELOG.md) for details."
      fi

      PRERELEASE_FLAG=""
      if echo "${CI_COMMIT_TAG}" | grep -qE '\-(rc|beta|alpha)\.'; then
        PRERELEASE_FLAG="--prerelease"
      fi

      NOTES_FILE=$(mktemp)
      printf '%s\n\n---\n\n**Docker images**\n\n```\nghcr.io/visiban/visiban/backend:%s\nghcr.io/visiban/visiban/frontend:%s\n```\n' \
        "$NOTES" "${CI_COMMIT_TAG}" "${CI_COMMIT_TAG}" > "$NOTES_FILE"

      gh release create "${CI_COMMIT_TAG}" \
        --repo "visiban/visiban" \
        --title "${CI_COMMIT_TAG}" \
        --notes-file "$NOTES_FILE" \
        ${PRERELEASE_FLAG}
      rm -f "$NOTES_FILE"

# ─── Docs — versioned with mike ───────────────────────────────────────────────
#
# mike manages a versioned MkDocs site on the gh-pages branch.
# Docs are deployed by scripts/release.sh as part of the release process.
#
# This CI job exists only as a manual recovery tool — e.g. if a release script
# run was interrupted after tagging but before mike deployed. To redeploy:
# CI/CD → Run pipeline on main → set DOCS_VERSION=<version tag> → play job.
# The docs content used is whatever is on main at the time of the manual trigger.
#
# After mike pushes to gh-pages, GitLab triggers a new pipeline on that branch.
# The "pages" job (which must be named exactly "pages") runs there, copies the
# branch content to public/, and GitLab Pages serves it at docs.visiban.com.
#
# Required CI/CD project variable (Settings → CI/CD → Variables):
#   DOCS_DEPLOY_TOKEN — a project access token with "write_repository" scope,
#                       used so mike can push to the gh-pages branch.
#                       Create at Settings → Access Tokens → role: Developer,
#                       scope: write_repository. Store as a masked variable.
#
# Added: 2026-03-13

docs-deploy:
  stage: deploy
  image: python:3.12-slim
  needs: []
  variables:
    DOCS_VERSION: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet -r docs/requirements.txt
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    # Restore existing gh-pages history so mike can append to it.
    # Force-update in case a stale local branch exists from a previous job on the same runner.
    - git fetch origin gh-pages --depth=1 && (git branch -f gh-pages origin/gh-pages 2>/dev/null || git branch gh-pages origin/gh-pages) || true
  script:
    - |
      VERSION="${DOCS_VERSION:-$CI_COMMIT_TAG}"
      if [ -z "$VERSION" ]; then
        # Auto-deploy from main (docs change pipeline): read version from .env.example.
        VERSION=$(grep '^APP_VERSION=' .env.example | cut -d= -f2)
        # APP_VERSION doesn't carry the v prefix; mike entries must match release tags.
        if [ -n "$VERSION" ] && ! echo "$VERSION" | grep -q '^v'; then
          VERSION="v${VERSION}"
        fi
      fi
      if [ -z "$VERSION" ]; then
        # Manual trigger from main without DOCS_VERSION set and no APP_VERSION found.
        echo "INFO: no version to deploy. Re-run with DOCS_VERSION=<tag> to publish docs."
        exit 0
      fi
      if echo "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
        MINOR=$(echo "$VERSION" | grep -oE '^v?[0-9]+\.[0-9]+')
        mike deploy --push --update-aliases "$VERSION" "${MINOR}" latest
        mike set-default --push "${MINOR}"
      else
        mike deploy --push --update-aliases "$VERSION" next
      fi
  rules:
    # Auto-deploy on version tags (pushed by scripts/release.sh)
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
      variables:
        DOCS_VERSION: $CI_COMMIT_TAG
    # Auto-deploy on main when docs content or mkdocs config changes
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - mkdocs.yml
      when: on_success
    # Manual recovery on main — set DOCS_VERSION in pipeline variables
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

# ─── Weekly CVE dependency scan ───────────────────────────────────────────────
#
# backend-dep-scan and frontend-dep-scan (defined in the security stage above)
# run on a weekly GitLab CI schedule with CVE_SCAN=true set as a schedule
# variable. Unlike their MR counterparts they use allow_failure: false, so a
# new HIGH/CRITICAL CVE causes the pipeline to fail and GitLab emails all
# maintainers who have "Failed pipeline" notifications enabled.
#
# To enable email notifications:
#   Profile → Notifications → Global notification level → "Watch"
#   or set per-project in Project → Notification settings → "Failed pipeline"
#
# The schedule itself is configured in GitLab: CI/CD → Schedules
#   Description : Weekly CVE scan
#   Interval    : 0 8 * * 1  (Mondays 08:00 UTC)
#   Target branch: main
#   Variables   : CVE_SCAN = true
#
# ─── Scheduled branch cleanup ─────────────────────────────────────────────────
#
# Deletes remote branches that have been fully merged into main.
# Runs on a GitLab CI schedule (e.g. weekly) — not on every push.
#
# Requires the same DOCS_DEPLOY_TOKEN variable used by docs-deploy
# (write_repository scope is sufficient to delete branches).
#
# Protected branches (main, gh-pages) are never touched — GitLab enforces
# this server-side regardless, but the grep exclude below makes the intent
# explicit. The gh-pages branch is managed by mike and must never be deleted.
#
# To configure the schedule: CI/CD → Schedules → New schedule → set branch
# to main and cron to "0 3 * * 1" (Mondays at 03:00 UTC).

cleanup-merged-branches:
  stage: deploy
  image: alpine:3.19
  needs: []
  before_script:
    - apk add --no-cache git
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch --prune origin
  script:
    - |
      # grep -v exits 1 when no lines match (all merged branches already gone).
      # The || true prevents pipefail from killing the job in that success case.
      merged=$(git branch -r --merged origin/main \
        | { grep -v 'origin/main$\|origin/HEAD\|origin/gh-pages' || true; } \
        | sed 's|origin/||' \
        | xargs)
      if [ -z "$merged" ]; then
        echo "No merged branches to delete."
      else
        echo "Deleting: $merged"
        echo "$merged" | xargs git push origin --delete
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ─── Demo data seed ───────────────────────────────────────────────────────────
#
# Refreshes the Visiban Demo Board on the dedicated demo environment.
# Runs weekly via a GitLab CI schedule and can be triggered manually at any time.
#
# Setup:
#   1. Create a protected CI/CD variable DEMO_DATABASE_URL pointing to the demo
#      environment's PostgreSQL instance (Settings → CI/CD → Variables).
#   2. Create a GitLab schedule (CI/CD → Schedules) targeting main with cron
#      "0 4 * * 1" (Mondays at 04:00 UTC) and set variable SEED_SCHEDULE=true.
#
# The --wipe flag deletes the "Visiban Demo Board" and recreates it from scratch.
# --force overrides the DEBUG=False guard so the command runs in CI without DEBUG=True.
# Board-scoped wipe: only the demo board is deleted; all other data is untouched.
#
# PROTECTION: The "demo" environment must be configured as a protected environment
# in GitLab (Settings → CI/CD → Protected environments) so only maintainers can
# trigger this job. Without this, any developer with push access can wipe the demo board.

seed-demo-data:
  stage: deploy
  needs: []
  image: python:3.12-slim
  environment:
    name: demo
    deployment_tier: staging
  variables:
    DATABASE_URL: $DEMO_DATABASE_URL
    REDIS_URL: $DEMO_REDIS_URL
    DJANGO_SECRET_KEY: $DEMO_SECRET_KEY
    DEBUG: "False"
    ALLOWED_HOSTS: "localhost"
    # Set SEED_VALUE in the schedule or manual trigger variables to use a custom
    # random seed. Leave unset to use the default (42).
    SEED_VALUE: ""
  before_script:
    # Fail fast with a clear message if the required CI/CD variables are missing.
    # Without these the job dies mid-pip-install with an unhelpful Django traceback.
    # Setup instructions: docs/administration/demo-data.md#required-gitlab-cicd-variables
    - |
      missing=""
      [ -z "$DJANGO_SECRET_KEY" ] && missing="$missing DEMO_SECRET_KEY"
      [ -z "$DATABASE_URL" ]      && missing="$missing DEMO_DATABASE_URL"
      [ -z "$REDIS_URL" ]         && missing="$missing DEMO_REDIS_URL"
      if [ -n "$missing" ]; then
        echo "ERROR: Required CI/CD variable(s) not set:$missing"
        echo "Add them at Settings → CI/CD → Variables (Protected + Masked, scoped to the 'demo' environment)."
        echo "See docs/administration/demo-data.md for full setup instructions."
        exit 1
      fi
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    # Use today's date (YYYYMMDD) as the random seed so each weekly refresh
    # produces a naturally varied board while remaining reproducible within
    # the same day. Override by setting SEED_VALUE in the CI schedule variables.
    - python manage.py seed_demo_data --wipe --force --seed ${SEED_VALUE:-$(date +%Y%m%d)}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SEED_SCHEDULE == "true"'
    - when: manual
      allow_failure: true

# ─── Seed export drift check ──────────────────────────────────────────────────
#
# Regenerates sample-boards/demo_board.{json,csv} and fails if they
# differ from the committed versions. Catches model changes that invalidate the
# static files. Run on MR pipelines when seed commands or models are touched.

seed-export-check:
  extends: .pip-cache
  stage: lint
  needs: []
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py migrate --run-syncdb --no-input
    - python manage.py seed_demo_data --export
    - cd ..
    - |
      if ! git diff --exit-code sample-boards/demo_board.json sample-boards/demo_board.csv; then
        echo "ERROR: sample-boards/demo_board.{json,csv} are out of date. Run 'python manage.py seed_demo_data --export' and commit the result."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/boards/management/commands/seed_demo_data.py
        - sample-boards/demo_board.*

# Runs on the gh-pages branch after docs-deploy pushes to it.
# Copies the branch content to public/ for GitLab Pages to serve.
# The job name must be exactly "pages" for GitLab Pages to pick it up.
pages:
  stage: deploy
  image: alpine:3.19
  needs: []
  script:
    - cp -r . public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages"'
