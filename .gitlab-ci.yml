# ─── Catalog components ───────────────────────────────────────────────────────
#
# SAST: Semgrep-based static analysis via the official GitLab catalog component.
# Covers Python and TypeScript/JavaScript with broader rules than Bandit.
# enable_mr_pipelines: true — runs on MR pipelines in addition to branch
# pipelines. excluded_paths skips generated code.
#
# Both components are pinned to an exact released version (#1071) instead of
# `@~latest`: a floating component can change rules, defaults, or job shape
# under us between two pipelines, so a scanner could silently stop blocking (or
# start blocking everything). Bump deliberately, in its own MR, after reading
# the component's release notes. Verify a candidate version exists with:
#   glab api "projects/components%2Fsast/releases"
#   glab api "projects/components%2Fsecret-detection/releases"
#
# These components generate the `semgrep-sast` and `secret_detection` jobs —
# they are NOT literal job keys in a plain read of this file. The overrides
# further down (search "Scanner blocking policy") are what make them blocking.

include:
  - component: gitlab.com/components/sast/sast@3.5.0
    inputs:
      stage: security
      enable_mr_pipelines: true
      excluded_paths: >-
        backend/boards/migrations,
        backend/groups/migrations,
        backend/accounts/migrations
  - component: gitlab.com/components/secret-detection/secret-detection@2.4.0
    inputs:
      stage: security
      enable_mr_pipelines: true

# ─── Scanner blocking policy (#1071) ──────────────────────────────────────────
#
# Which scanners can actually fail a pipeline. OSS push-mirrors to the
# enterprise repo and public GitHub within a minute of a merge, so a committed
# secret is public on three remotes almost immediately.
#
#   gitleaks-scan      blocks on any finding              — full working tree, MR + main
#   gitleaks-commits   blocks on any finding              — every commit the MR adds (#1612), MR only
#                      (the per-commit merge gate: gitleaks-scan sees only the final tree)
#   gitleaks-history   blocks on any finding              — history reachable from the pipeline commit, main only
#                      (runs after merge: a post-merge tripwire, not a merge gate)
#   secret_detection   blocks via secret-detection-gate    — the component job itself only reports;
#                      the gate reads its report (#1537)
#   semgrep-sast       blocks at High/Critical only       — override + sast-severity-gate
#   backend-sast       blocks (bandit, medium+)           — pre-existing
#   frontend-sast      blocks (eslint 'error' rules)      — only when frontend/src/**/*.{ts,tsx} changed
#   clients-typescript-sast  blocks (eslint 'error' rules) — only when clients/typescript/** changed (#1178)
#   trivy-scan         blocks (#1072)                     — MR when its inputs change + Nightly (#1267)
#                      dep-scan-osv, pip-audit and the license checks are deliberately
#                      outside this policy
#
# The secret-detection component cannot fail on a finding either, so
# secret-detection-gate reads gl-secret-detection-report.json and fails on any
# unsuppressed finding. Accepting one requires an entry (reason citing an issue +
# expiry date) in .gitlab/secret-detection-suppressions.json.
#
# Semgrep's Low/Medium/Info findings stay visible in the MR security widget but
# do not fail the pipeline; the SAST component has no native severity threshold,
# so sast-severity-gate reads gl-sast-report.json. Accepting a High/Critical
# finding requires an entry (reason + expiry date) in
# .gitlab/sast-suppressions.json — see docs/maintainers/security-scanners.md.

# Component-generated job: override only what we change; the rest of the job
# definition (image, script, rules, artifacts) still comes from the component.
# NOTE: GitLab's analyzers always exit 0 on findings, so allow_failure: false
# here does NOT make secret_detection block on a leak — it only makes an
# analyzer crash fail the job. Findings are gated by secret-detection-gate
# below (#1537), alongside gitleaks-scan, gitleaks-commits and gitleaks-history.
secret_detection:
  allow_failure: false

# The component's job only inspects the MR diff (GIT_DEPTH 50). Full-history
# coverage is gitleaks-commits (MR) and gitleaks-history (main) below (the component analyzer ignores
# .gitleaks.toml, so it cannot share the repo's reviewed allowlist).

semgrep-sast:
  allow_failure: false

# Fails the pipeline on a High/Critical semgrep finding that is not covered by an
# unexpired entry in .gitlab/sast-suppressions.json. Expired suppressions also
# fail, so a temporary acceptance cannot rot into a permanent one.
sast-severity-gate:
  stage: security
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  needs:
    - job: semgrep-sast
      artifacts: true
      optional: true
  # Rules match when semgrep-sast actually runs: MR pipelines and the default
  # branch (the component is included with enable_mr_pipelines: true). The
  # component has no SAST_DISABLED variable in 3.5.0; its opt-out is the
  # `excluded_analyzers` include input, which a job rule cannot read. So if
  # semgrep is ever excluded there, this gate job must be removed in the same
  # change, otherwise it fails closed on the missing report (intended).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python3 scripts/sast-severity-gate.py --self-test
    - python3 scripts/sast-severity-gate.py gl-sast-report.json .gitlab/sast-suppressions.json
  allow_failure: false

# Fails the pipeline on any secret_detection finding that is not covered by an
# unexpired entry in .gitlab/secret-detection-suppressions.json (#1537). The
# component job exits 0 on findings, so this reads its report. A missing or
# unparsable report fails closed. Runs when the component job runs (it is
# included with enable_mr_pipelines: true); if the component is ever removed
# from `include:`, remove this gate in the same change.
secret-detection-gate:
  stage: security
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  needs:
    - job: secret_detection
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python3 scripts/secret-detection-gate.py --self-test
    - python3 scripts/secret-detection-gate.py gl-secret-detection-report.json .gitlab/secret-detection-suppressions.json
  allow_failure: false

# ─── Workflow ─────────────────────────────────────────────────────────────────
#
# Merge-request-pipeline model: feature branches get CI *only* through their
# MR, never as a standalone branch pipeline. This makes the branch+MR duplicate
# structurally impossible rather than merely suppressed.
#
# The previous `$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS when: never` dedup
# could not stop duplicates on the MR-open push: $CI_OPEN_MERGE_REQUESTS is
# empty in the branch pipeline created at the moment the MR is opened (GitLab
# hasn't associated the MR with the branch yet), so the rule missed and the
# catch-all `$CI_COMMIT_BRANCH` rule ran a second pipeline. Dropping that
# catch-all removes the only branch-pipeline path for feature work.
#
# Trade-off: pushing a feature branch with no open MR runs no CI. Open the MR
# early (Draft is fine) to get pipeline coverage — this matches our
# always-go-through-an-MR workflow.
#
# Main-branch commits always get a pipeline (post-merge verification).
# Tag pipelines run for version tags so docs-deploy can fire on release.

workflow:
  # When a newer commit lands on the same ref, GitLab cancels only the jobs
  # marked `interruptible: true` in the older pipeline; non-interruptible jobs
  # keep running (and a non-interruptible job that has not started still runs
  # if its `needs:` finish). Jobs default to interruptible (see `default:`
  # below), so:
  #   * MR pipelines (#2419): a new push to the branch cancels the superseded
  #     pipeline's lint/test/security/build-verification jobs.
  #   * main: NOT auto-canceled. #2421 briefly let a newer merge cancel the
  #     older main pipeline, but a `canceled` pipeline per merge burst broke
  #     main pipeline stats (pass/fail rate, duration) and attributed failures
  #     to the wrong commit, so the main rule below sets `on_new_commit: none`.
  #     Every merge to main now runs to a real pass/fail verdict.
  #   * Every job with an external side effect (registry/chart/docs/release
  #     publishes, branch deletion, issue filing, demo seeding, SonarCloud
  #     upload) sets `interruptible: false`, so it is never canceled mid-push.
  #     Its `needs:` may still be canceled, which skips it in the superseded
  #     pipeline; the newer pipeline publishes instead (e.g. `:main`).
  #   * Tag pipelines are unique refs, so nothing supersedes them.
  #   * Scheduled pipelines also run on main. Their long scheduled-only jobs
  #     (mutation, nightly load test, deep fuzz, sonar) are non-interruptible,
  #     and a newer commit never cancels a scheduled pipeline (the rule below
  #     sets `on_new_commit: none` on it).
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # all feature work
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'        # main, post-merge
      auto_cancel:
        on_new_commit: none
    - if: '$CI_COMMIT_TAG'                                 # release tags
    # No catch-all $CI_COMMIT_BRANCH rule: a branch with no open MR gets no
    # pipeline, so the branch+MR duplicate can never be created.

# Test and build run in the same stage so they execute in parallel — build
# verification (kaniko) doesn't depend on test results, and running them
# together saves a full stage of sequential waiting.
stages:
  - lint
  - test
  - security
  - deploy

# The SAST and secret-detection components declare no `needs:`, so as `security`
# stage jobs they waited for every `test` job — including the 7-8 min helm
# drills — before starting, then ran for 15-90 s. They only read the checkout,
# so they start at pipeline creation.
semgrep-sast:
  needs: []

secret_detection:
  needs: []

# ─── Docker Hub mirror (#1198) ─────────────────────────────────────────────────
#
# Every Docker Hub image:/services:/name: reference in this file, and every
# Dockerfile's BASE_REGISTRY build arg, is written as ${DOCKERHUB_MIRROR}/<image>
# rather than a bare docker.io reference, to avoid the anonymous-pull rate limit
# (see docs/maintainers/known-ci-failures.md#docker-hub-429-too-many-requests-on-image-pulls).
#
# Defaults to the GitLab Dependency Proxy for this group, which the Dependency
# Proxy is enabled for. A project with NO working group Dependency Proxy — most
# notably an external contributor's personal-namespace fork; the Dependency
# Proxy is a group-level-only GitLab feature and does not exist for personal
# namespaces — gets CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX empty, which would
# otherwise turn every image reference into a leading-slash "/python:3.12-slim"
# and fail the whole pipeline.
#
# BASE_REGISTRY / script usages of this variable fall back automatically with
# real shell `${DOCKERHUB_MIRROR:-docker.io/library}` syntax (see the kaniko
# jobs and scripts/helm-*-drill.sh) — those self-heal with zero configuration.
# The bare `image:`/`services:`/`name:` keyword usages below CANNOT: GitLab's
# own variable expansion for those keywords is plain substitution, not a shell,
# so it has no equivalent of bash's `:-` fallback operator. A fork (or a
# self-hosted instance) with no group Dependency Proxy MUST set its own
# project CI/CD variable `DOCKERHUB_MIRROR` (e.g. `docker.io`, or its own
# pull-through mirror) to keep those jobs' own image:/services: pulls working —
# project variables take precedence over this default. See
# docs/maintainers/ci-runners.md#dependency-proxy.
variables:
  DOCKERHUB_MIRROR: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}

# Auto-retry on infrastructure failure classes ONLY (#2462; host root cause
# #2406 — see docs/maintainers/known-ci-failures.md). `script_failure` and
# `unknown_failure` are never retried: red tests here have repeatedly been real
# bugs. scripts/check-ci-retry.sh fails any retry that includes them. A job-level
# `retry:` REPLACES this default; non-idempotent publish jobs set `retry: 0`.
#
# interruptible: true (#2419) lets `workflow:auto_cancel` above cancel
# a superseded MR pipeline's read-only jobs (main pipelines are never canceled). A job with an external side effect
# MUST override it with `interruptible: false`;
# scripts/tests/ci-interruptible.test.sh fails when a publishing job loses
# that override or a job that pushes is added without it.
default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_unsupported
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure
      - data_integrity_failure
      - stale_schedule

# ─── pip floor (#1927) ────────────────────────────────────────────────────────
#
# python:3.12-slim still ships pip 26.2.1. pip < 26.2.2 always loads its own
# vendored certifi, which trusts the compromised eMudhra emSign intermediates
# (2026-10-20), so every job that runs `pip install` from PyPI first upgrades pip
# from a hash-pinned file and fails if the result is older than 26.2.2. Use it as
# the first step before any `pip install`: `- !reference [.pip-floor, script]`.
# REMOVABLE once the python:3.12-slim image ships pip >= 26.2.2: delete this key,
# every `.pip-floor` reference, scripts/ensure-pip.sh and scripts/pip-requirements.txt.
# The folded `lint-selftests-python` job also calls `sh scripts/ensure-pip.sh` inline (no
# `!reference`), so remove that call with the rest.
.pip-floor:
  script:
    - sh scripts/ensure-pip.sh

# Postgres service flags for the jobs that run pytest, plus backend-schema-fuzz and
# its -deep/-git-lens variants (#2488). The service holds a throwaway database that
# is discarded with the job, so crash durability buys nothing and fsync/WAL flushes
# are pure test-time cost. Reference with `command: *pg_ci_fast_flags` on the
# service entry; never use on a job whose database must survive (migration-check,
# drills, load tests).
.pg-ci-fast-flags: &pg_ci_fast_flags
  - postgres
  - -c
  - fsync=off
  - -c
  - synchronous_commit=off
  - -c
  - full_page_writes=off
  # Not a speed flag: pg_stat_activity keeps 16 KB of each statement instead of
  # 1 KB, so scripts/pg-activity-watch.py can EXPLAIN a stuck statement whole
  # (#2536). Shared memory cost is 16 KB per backend slot.
  - -c
  - track_activity_query_size=16384

# ─── Rule templates ───────────────────────────────────────────────────────────
#
# Extend jobs with .on-mr to restrict them to MR pipelines only.
# Lint and test jobs use path-based rules so they only run when relevant
# files change, with a fallback to always run on the default branch.

.on-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── Cache templates ──────────────────────────────────────────────────────────
#
# Cache uses MinIO as the S3-compatible distributed backend so all runners
# share a warm cache across jobs and branches.
#
# Required CI/CD project variables (Settings → CI/CD → Variables):
#   MINIO_ENDPOINT   — host:port of the MinIO server, e.g. minio.internal:9000
#   MINIO_ACCESS_KEY — MinIO access key
#   MINIO_SECRET_KEY — MinIO secret key
#   MINIO_BUCKET     — bucket name, e.g. visiban-ci-cache
#
# Runner config.toml must enable the S3 backend:
#   [runners.cache]
#     Type   = "s3"
#     Shared = true
#     [runners.cache.s3]
#       ServerAddress = "<MINIO_ENDPOINT>"
#       AccessKey     = "<MINIO_ACCESS_KEY>"
#       SecretKey     = "<MINIO_SECRET_KEY>"
#       BucketName    = "<MINIO_BUCKET>"
#       Insecure      = false   # set true if MinIO has no TLS
#
# Cache keys include a fixed prefix so entries are grouped cleanly inside
# the S3 bucket. The lockfile hash provides automatic invalidation when
# dependencies change. node_modules/ is cached alongside the npm download
# cache to skip extraction on warm hits.

.npm-cache:
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [frontend/package-lock.json]
    paths:
      - .npm/
      - frontend/node_modules/
    policy: pull

# PIP_CACHE_DIR stores downloaded wheels/sdists. pip honors this env var
# automatically so no extra flags are needed in before_script. UV_CACHE_DIR is
# the same for uv (#2496), which does not read PIP_CACHE_DIR; both live in the
# one cache. UV_LINK_MODE=copy: the cache and site-packages are on different
# filesystems in a job container, where uv's default hardlink mode only warns
# and falls back to copying anyway.

.pip-cache:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    UV_LINK_MODE: "copy"
  cache:
    key:
      prefix: "pip"
      files: [backend/requirements.txt]
    paths: [.cache/pip/, .cache/uv/]
    policy: pull

# Install uv for the backend dependency installs (#2496): `uv pip install
# --system -r <file>` installs the SAME requirements files pip did, in the
# same order (one invocation per file, so each resolves against what the
# previous one installed, exactly like the sequential pip calls it replaces),
# in a few seconds warm instead of ~16 s.
#
# Obtained the way the lock job already gets it (#1378): pip, after the
# .pip-floor upgrade, installs the hash-pinned uv wheel from
# scripts/uv-requirements.txt with --require-hashes, so a swapped wheel on the
# index fails the install. One pin file for every uv in CI; bump it together
# with UV_VERSION in scripts/lock-backend-requirements.sh.
#
# Deliberately NOT moved to uv: anything that verifies hashes or audits the
# environment (pip-audit, the pip-licenses step of license-check, the
# uv-requirements --require-hashes install itself), lock regeneration (already
# uv), clients-contract (Debian python in a venv, not the image's system
# python), and the single-tool installs (ruff, coverage, diff-cover, bandit,
# mutmut, requests, docs) where installing uv first would cost more than it
# saves. Each job runs .pip-floor before this.
.uv-install:
  script:
    - pip install --quiet --require-hashes -r scripts/uv-requirements.txt
    - uv --version

# Warm the caches on the default branch so feature-branch jobs can pull from
# them without paying the push cost on every MR pipeline. Only one job per
# cache key prefix — runs after tests succeed on main.

cache-warm-pip:
  stage: deploy
  needs: [backend-test-coverage]
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    UV_LINK_MODE: "copy"
  cache:
    key:
      prefix: "pip"
      files: [backend/requirements.txt]
    paths: [.cache/pip/, .cache/uv/]
    policy: pull-push
  script:
    - !reference [.pip-floor, script]
    # pip still warms .cache/pip for the jobs that stay on pip (#2496), and
    # the uv wheel itself lands there too. uv then installs into a THROWAWAY
    # venv: against the environment pip just filled, uv would see everything
    # installed and download nothing, leaving .cache/uv empty.
    - pip install --quiet -r backend/requirements.txt
    - !reference [.uv-install, script]
    - uv venv --quiet /tmp/uvw
    - uv pip install --python /tmp/uvw/bin/python --quiet -r backend/requirements.txt
    - du -sh .cache/uv
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cache-warm-pip-test:
  stage: deploy
  needs: [backend-test-coverage]
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    UV_LINK_MODE: "copy"
  cache:
    key:
      prefix: "pip-test"
      files: [backend/requirements-test.txt]
    paths: [.cache/pip/, .cache/uv/]
    policy: pull-push
  script:
    - !reference [.pip-floor, script]
    - pip install --quiet -r backend/requirements-test.txt
    - !reference [.uv-install, script]
    # Throwaway venv so uv must download and cache every wheel (see
    # cache-warm-pip). Same file the jobs install: requirements-test.txt.
    - uv venv --quiet /tmp/uvw
    - uv pip install --python /tmp/uvw/bin/python --quiet -r backend/requirements-test.txt
    - du -sh .cache/uv
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cache-warm-npm:
  stage: deploy
  needs: [frontend-test]
  image: ${DOCKERHUB_MIRROR}/node:22-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [frontend/package-lock.json]
    paths:
      - .npm/
      - frontend/node_modules/
    policy: pull-push
  script:
    - cd frontend && npm ci --prefer-offline
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ─── Shell scripts — lint ────────────────────────────────────────────────────
#
# shellcheck catches common shell bugs: unquoted variables, missing set -e,
# portability issues, and incorrect conditionals. Runs on any change to
# scripts/*.sh, MR or main (#1266: no unconditional main fallback — nothing
# needs this job, so a merge that didn't touch scripts/ doesn't rerun it).

shellcheck:
  stage: lint
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  before_script:
    - apk add --no-cache shellcheck
  rules:
    - changes:
        - scripts/*.sh
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - scripts/*.sh
  script:
    - shellcheck --severity=warning scripts/*.sh

# ─── Dockerfiles — lint ───────────────────────────────────────────────────────
#
# hadolint enforces Dockerfile best practices (layer ordering, missing WORKDIR,
# ADD vs COPY, etc.). DL3008 (pin apt versions) is ignored — rationale in
# .hadolint.yaml. Runs on any change to a Dockerfile, MR or main (#1266: no
# unconditional main fallback — nothing needs this job).

dockerfile-lint:
  stage: lint
  image:
    name: ${DOCKERHUB_MIRROR}/hadolint/hadolint:v2.15.1-alpine
    entrypoint: [""]
  rules:
    - changes:
        - "**/Dockerfile*"
        - .hadolint.yaml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "**/Dockerfile*"
        - .hadolint.yaml
  script:
    - hadolint --config .hadolint.yaml
        backend/Dockerfile
        backend/Dockerfile.prod
        frontend/Dockerfile
        frontend/Dockerfile.prod

# ─── Compose — shipped-stack hygiene ──────────────────────────────────────────
#
# Gates over the compose/nginx files an operator actually runs. All are cheap,
# all cover a defect that was live in this repo, and none is visible in a
# diff review:
#
#   * image pins — `certbot/certbot` shipped untagged in docker-compose.prod.yml
#     while every sibling service carried a floor, so the component that owns TLS
#     renewal floated to `latest` on each `compose pull`.
#   * project names — docker-compose.prod.yml pinned no `name:` and dev defaulted
#     to `visiban`, so on a default clone both resolved to the same project,
#     sharing `visiban_pgdata` and the `db`/`valkey`/`backend` service names.
#   * nginx HSTS rendering — nginx/app.conf.template hardcoded a 2-year HSTS
#     header for both TLS_MODE=letsencrypt and selfsigned, contradicting the
#     docs and ignoring an operator-set SECURE_HSTS_SECONDS; init-prod.sh now
#     renders it via scripts/render-nginx-hsts.sh (#1201).
#
# Each runs its `--self-test` first, per #1093: a gate observed only on a clean
# tree is indistinguishable from one that always passes. render-nginx-hsts.sh
# also gets a real invocation against the TRACKED template
# (`--check nginx/app.conf.template`), matching the other two scripts in this
# job — a completeness-check finding on #1201 noted that `--self-test` alone
# only proves the rendering logic works against synthetic fixtures; it cannot
# catch the old hardcoded header being re-committed verbatim to the real file,
# since --self-test never reads it.

# ─── Folded alpine gate self-tests (#2523) ───────────────────────────────────
#
# Twelve tiny jobs (3-68 s of work each) used to run as separate `alpine:3.19`
# jobs. Each paid its own executor setup, image pull and runner slot, and in
# pipeline 3099866726 each waited 14-16 min to start for seconds of work.
# They are now members of ONE job (`scripts/ci-fold.sh`, #2523); the member
# name is the old job name. Every member runs even when an earlier one fails,
# prints a `== <old-job-name> ==` banner, and the job's last step fails naming
# each failed member. Every script invocation below is exactly the one the old
# job ran (docs/development/ci-gates.md has the old-name -> member map).
#
#   compose-hygiene                      docker-compose*.yml, nginx templates, #1201/#1633
#   sonar-scan-selftest                  SonarCloud report rewrite self-test (#1370)
#   sonar-open-issues-selftest           open-Sonar-findings lookup parser self-test (#2528)
#   security-deferred-verdict-selftest   accepted-risk verdict + release.sh (#1521, #1520)
#   cost-ledger-selftest                 MR cost ledger scripts + kaizen reader (#2128)
#   lint:sonar-exclusions                Sonar exclusion-integrity guard (#1380)
#   gate-selftest-parity                 meta-gate for #1093: every gate's --self-test is invoked
#   image-attest-selftest                attest-image-sbom.sh, MR-time (#1093)
#   check-release-attestations-selftest  nightly check's self-test, MR-time (#1610)
#   registry-keep-regex-test             registry cleanup keep-regex pin (#1196, #1541)
#   check-chart-registry-selftest        chart registry self-test, MR-time (#1155)
#   ci-fold-selftest                     the runner itself (#2523)
#
# Rules: the union of the old jobs' `changes:`. The old jobs split in two: seven
# had a bare `changes:` rule (so they also ran in schedule and tag pipelines) and
# five were MR-or-default-branch only (gate-selftest-parity, image-attest-,
# check-release-attestations-, check-chart-registry-selftest, registry-keep-regex-test).
# A bare `changes:` is always true outside branch/MR pipelines, so the schedule
# case is identical for both kinds; only tag pipelines differ, and the MR-only
# members skip themselves there (`fold_member_not_on_tag`). `schedule-config-check`
# is schedule-only and stays its own job: folding it would run it on MRs.
#
# Order is deliberate: the two members whose old jobs ran on bare busybox
# (sonar-scan-selftest, and security-deferred-verdict-selftest's first two lines)
# run before any member installs GNU grep/sed/coreutils with `apk add`.
# Nothing `needs:` any of these jobs by name (checked).
lint-selftests-alpine:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - changes:
        - docker-compose*.yml
        - scripts/check-compose-*.sh
        - nginx/app.conf.template
        - nginx/app-http.conf.template
        - init-prod.sh
        - scripts/render-nginx-hsts.sh
        - sonar-project.properties
        - scripts/sonar-scan.sh
        - scripts/sonar-open-issues.sh
        - scripts/check-sonar-exclusions.sh
        - scripts/cost-ledger
        - scripts/cost_ledger_lines.py
        - scripts/subagent-tokens.py
        - scripts/orchestrator-tokens.py
        - scripts/est-cost.py
        - .claude/skills/wave/SKILL.md
        - scripts/cost-table.py
        - scripts/post-mr-cost.py
        - .claude/hooks/post-mr-cost.sh
        - scripts/tests/cost-ledger-golden/**/*
        - .claude/settings.json
        - scripts/lib/transcript_usage.py
        - scripts/_paths.py
        - scripts/kaizen_gate_ledger.py
        - scripts/tests/kaizen_gate_ledger.test.sh
        - scripts/tests/fixtures/kaizen/*
        - .claude/cost-ledger.json
        - .claude/model-prices.json
        - scripts/security-deferred-verdict.sh
        - scripts/check-security-deferred.sh
        - scripts/release.sh
        - scripts/extract-release-notes.sh
        - scripts/cap-release-notes.sh
        - scripts/tests/release.test.sh
        - scripts/**/*
        - docs/administration/image-verification.md
        - docs/administration/container-image-retention.md
        - .gitlab-ci.yml
  script:
    - |
      . scripts/ci-fold.sh

      m_sonar_scan() {
        sh scripts/sonar-scan.sh --self-test
      }

      # scripts/sonar-open-issues.sh lists open SonarCloud findings on the files a
      # branch touches (completeness-check runs it before push, #2528). It fails open
      # by design, so a broken parser would look identical to "no findings";
      # --self-test fixtures findings present, none present, and unavailable (#1093).
      # No network. Runs after the bare-busybox members (see Order above).
      m_sonar_open_issues() {
        apk add --no-cache python3 curl
        sh scripts/sonar-open-issues.sh --self-test
      }

      m_security_deferred() {
        sh scripts/security-deferred-verdict.sh --self-test
        sh scripts/extract-release-notes.sh --self-test
        sh scripts/cap-release-notes.sh --self-test
        apk add --no-cache bash jq git coreutils python3
        git config --global --add safe.directory '*'
        bash scripts/check-security-deferred.sh --self-test
        # release.sh gates the tag on the check above (#1520); its self-test had no CI job.
        # Invoked directly (not only via release.test.sh) so check-gate-selftest-parity.sh
        # (#1093) sees the --self-test flag on the release.sh line itself.
        bash scripts/release.sh --self-test
        # release.test.sh adds the end-to-end rollback cases in hermetic clones;
        # python3 is for assemble-changelog.sh.
        sh scripts/ci-hermetic-run.sh bash scripts/tests/release.test.sh  # #2461: poisoned + canary
      }

      m_compose_hygiene() {
        apk add --no-cache bash grep sed
        bash scripts/check-compose-image-pins.sh --self-test
        bash scripts/check-compose-image-pins.sh
        bash scripts/check-compose-project-names.sh --self-test
        bash scripts/check-compose-project-names.sh
        bash scripts/render-nginx-hsts.sh --self-test
        bash scripts/render-nginx-hsts.sh --check nginx/app.conf.template
        # SPA cache policy (#1633): a missing /assets/* must 404, never fall back to index.html.
        for t in nginx/app.conf.template nginx/app-http.conf.template; do
          grep -q 'location /assets/' "$t" && grep -A2 'location /assets/' "$t" | grep -q 'try_files \$uri =404;' || { echo "$t: /assets/ must be 'try_files \$uri =404' (#1633)"; exit 1; }
          blk="$(awk '/^map \$uri \$visiban_cache_control/,/^}/' "$t")"
          for p in 'index\\.html' 'theme-init\\.js' 'site\\.webmanifest' 'favicon' 'apple-touch-icon' 'android-chrome-' '\^/brand/'; do
            printf '%s\n' "$blk" | grep -E "$p" | grep -q '"no-cache";' || { echo "$t: cache map must bind $p to no-cache (#1633)"; exit 1; }
          done
          [ -n "$blk" ] || { echo "$t: cache map must be keyed on \$uri (#1633)"; exit 1; }
          printf '%s\n' "$blk" | grep -E '^[[:space:]]*~' | head -1 | grep -qE '^[[:space:]]*~\^/\(index\\\.html\|' || { echo "$t: first regex in cache map must be the index.html no-cache rule (#1633)"; exit 1; }
          grep -A2 'location / {' "$t" | grep -q 'try_files \$uri \$uri/ /index.html;' || { echo "$t: location / must fall back to /index.html (#1633)"; exit 1; }
          printf '%s\n' "$blk" | grep -E '\^/assets/' | grep -q 'immutable' || { echo "$t: cache map must bind ^/assets/ to immutable (#1633)"; exit 1; }
          grep -q 'add_header Cache-Control \$visiban_cache_control;' "$t" || { echo "$t: Cache-Control map not applied (#1633)"; exit 1; }
        done
      }

      m_cost_ledger() {
        apk add --no-cache python3 git bash
        git config --global --add safe.directory '*'
        python3 scripts/cost-ledger --self-test
        python3 scripts/cost-ledger status
        python3 scripts/cost_ledger_lines.py --self-test
        python3 scripts/subagent-tokens.py --self-test
        python3 scripts/orchestrator-tokens.py --self-test
        python3 scripts/est-cost.py --self-test
        python3 scripts/cost-table.py --self-test
        python3 scripts/post-mr-cost.py --self-test
        python3 scripts/kaizen_gate_ledger.py --self-test
        sh scripts/ci-hermetic-run.sh bash scripts/tests/kaizen_gate_ledger.test.sh  # #2461: poisoned + canary
      }

      m_sonar_exclusions() {
        apk add --no-cache bash git grep sed jq
        # Self-test first: a broken detector must not report green.
        bash scripts/check-sonar-exclusions.sh --self-test
        bash scripts/check-sonar-exclusions.sh
      }

      m_gate_parity() {
        apk add --no-cache bash grep
        bash scripts/check-gate-selftest-parity.sh --self-test
        bash scripts/check-gate-selftest-parity.sh
      }

      m_image_attest() {
        apk add --no-cache bash jq
        bash scripts/attest-image-sbom.sh --self-test
      }

      m_release_attestations() {
        apk add --no-cache bash git jq
        bash scripts/check-release-attestations.sh --self-test
      }

      m_registry_keep_regex() {
        apk add --no-cache bash python3
        sh scripts/ci-hermetic-run.sh bash scripts/tests/registry-keep-regex.test.sh  # #2461: poisoned + canary
      }

      m_chart_registry() {
        apk add --no-cache bash curl
        bash scripts/check-chart-registry.sh --self-test
      }

      m_ci_fold() {
        sh scripts/ci-fold.sh --self-test
      }

      fold_member sonar-scan-selftest m_sonar_scan
      fold_member security-deferred-verdict-selftest m_security_deferred
      fold_member sonar-open-issues-selftest m_sonar_open_issues
      fold_member compose-hygiene m_compose_hygiene
      fold_member cost-ledger-selftest m_cost_ledger
      fold_member lint:sonar-exclusions m_sonar_exclusions
      fold_member_not_on_tag gate-selftest-parity m_gate_parity
      fold_member_not_on_tag image-attest-selftest m_image_attest
      fold_member_not_on_tag check-release-attestations-selftest m_release_attestations
      fold_member_not_on_tag registry-keep-regex-test m_registry_keep_regex
      fold_member_not_on_tag check-chart-registry-selftest m_chart_registry
      fold_member ci-fold-selftest m_ci_fold
      fold_finish

# ─── nginx security headers (#1073) ──────────────────────────────────────────
#
# nginx inherits `add_header` into a location only when that location declares
# none of its own, so one cache or CORS header added inside a `location` drops
# CSP, HSTS, X-Frame-Options and X-Content-Type-Options from every response it
# serves, with a green pipeline. scripts/check-nginx-security-headers.sh:
#
#   * static: both templates send the full set at server level, any location
#     with an add_header re-declares all of it, and the two templates agree
#     (modulo HSTS, which is HTTPS-only, and ws:// vs wss://);
#   * --runtime: boots each template (and the frontend image's own default
#     config) in this nginx:1.27-alpine image, the frontend image's base,
#     against a stub upstream, and asserts the headers on /, an SPA deep link,
#     a static asset, a 404 asset, /api/, /accounts/, /admin/, /static/,
#     /media/ and /mcp, then proves a location add_header is caught (negative
#     control). No image is built: kaniko cannot run what it builds, and the
#     job runs the same config on the same nginx instead.
#
# The Helm ConfigMap is a separate nginx config; this script does not read it.
# scripts/helm-structure-check.sh (helm-template, #1952, #1073) asserts the
# chart sends X-Frame-Options DENY, X-Content-Type-Options nosniff,
# Referrer-Policy and a CSP identical to nginx/app.conf.template (connect-src
# hosts aside), with no location-level add_header. HSTS is not asserted on the
# chart. Chart changes trigger this job too, so the two are reviewed together.
# Runs on every main
# pipeline (seconds; header drift can also come from a script change).
nginx-security-headers:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/nginx:1.27-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - nginx/**/*
        - helm/**/*
        - frontend/nginx.default.conf
        - scripts/check-nginx-security-headers.sh
        - scripts/render-nginx-hsts.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash curl openssl grep sed
  script:
    # Self-test first (#1093): a gate observed only on a clean tree is
    # indistinguishable from one that always passes.
    - bash scripts/check-nginx-security-headers.sh --self-test
    - bash scripts/check-nginx-security-headers.sh
    - bash scripts/check-nginx-security-headers.sh --runtime

# ─── Folded python gate self-tests (#2523) ───────────────────────────────────
#
# Four tiny `python:3.12-slim` jobs, now members of one job (see
# lint-selftests-alpine above for the folding contract and the old-name ->
# member map). The member name is the old job name:
#
#   mutation-score-selftest              check_mutation_score.py (#1384) judges the weekly
#                                        backend-mutation job, which runs only on its schedule.
#                                        --check-pragmas (#1503) fails a bare `# pragma: no mutate`
#                                        on the MR that adds it, hence the backend/**/*.py path.
#                                        mutmut_config.py self-test: every source file, test file and
#                                        class the nightly target list names exists, and
#                                        backend-mutation's `parallel:` equals its shards.
#   fuzz-baseline-unobserved-selftest    fuzz_baseline_unobserved.py runs log-only in
#                                        backend-schema-fuzz's after_script, so a broken parser
#                                        would never turn a job red (#1582).
#   release-main-pipeline-guard-selftest MR-time proof of the release guard (#1093); the guard does
#                                        real work only on a release tag. MR-or-main only, so it is
#                                        skipped in tag pipelines (`fold_member_not_on_tag`).
#   nightly-load-test-selftest           the scheduled job only ran its --self-test once a night;
#                                        this catches a scenario without a budget in the MR (#1767).
#                                        `.gitlab-ci.yml` now also triggers it (it already
#                                        triggered the other three).
lint-selftests-python:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - changes:
        - scripts/check_mutation_score.py
        - scripts/_paths.py
        - backend/**/*.py
        - scripts/fuzz_baseline_unobserved.py
        - scripts/fuzz_partitions.py
        - scripts/wait-for-main-pipeline.py
        - scripts/nightly_load_test.py
        - scripts/check_email_login_plan.py
        - backend/nightly-load-test-baseline.json
        # nightly_load_test.py's self-test checks its overview limit against this (#2429).
        - frontend/src/api/analyticsLimits.ts
        - .gitlab-ci.yml
  script:
    - |
      . scripts/ci-fold.sh

      m_mutation_score() {
        python3 scripts/check_mutation_score.py --self-test
        python3 scripts/check_mutation_score.py --check-pragmas backend
        # The nightly target list (backend/mutmut_config.py TARGETS): every source file, test
        # file and class it names exists, and backend-mutation's `parallel:` equals its shards.
        python3 backend/mutmut_config.py self-test --ci-file .gitlab-ci.yml
      }

      m_fuzz_baseline() {
        python3 scripts/fuzz_baseline_unobserved.py --self-test
        # The shard partitions (#2521): the shard jobs' own `changes:` omit
        # .gitlab-ci.yml, so a CI-only MR that drops or renames a FUZZ_SHARD entry is
        # caught here, with no live schema. PyYAML for the matrix parse.
        sh scripts/ensure-pip.sh  # what `!reference [.pip-floor, script]` expands to
        pip install --quiet PyYAML==6.0.3
        python3 scripts/fuzz_partitions.py --self-test
        python3 scripts/fuzz_partitions.py check-matrix --ci-file .gitlab-ci.yml
      }

      m_release_guard() {
        python3 scripts/wait-for-main-pipeline.py --self-test
        python3 scripts/wait-for-main-pipeline.py --check-ci-file .gitlab-ci.yml
      }

      m_nightly_load_test() {
        sh scripts/ensure-pip.sh  # what `!reference [.pip-floor, script]` expands to
        pip install --quiet requests==2.33.0
        python3 scripts/nightly_load_test.py --self-test
        python3 scripts/check_email_login_plan.py --self-test
      }

      fold_member mutation-score-selftest m_mutation_score
      fold_member fuzz-baseline-unobserved-selftest m_fuzz_baseline
      fold_member_not_on_tag release-main-pipeline-guard-selftest m_release_guard
      fold_member nightly-load-test-selftest m_nightly_load_test
      fold_finish

# ─── Backend — lint ───────────────────────────────────────────────────────────

# Ruff lint check + CodeClimate quality report in a single job — avoids
# spinning up two pods and installing ruff twice.
# allow_failure: true — style issues are visible but do not block merges.
backend-lint:
  extends: .pip-cache
  stage: lint
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - changes: &backend-lint-paths
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *backend-lint-paths
  before_script:
    # Pinned: unpinned installs silently picked up ruff 0.16's much larger
    # default rule set, surfacing 600+ pre-existing findings (mostly RUF012 on
    # Django migrations' `operations = [...]`) unrelated to any given branch.
    - !reference [.pip-floor, script]
    - pip install --quiet ruff==0.15.22
  script:
    - ruff check backend/
    - ruff check backend/ --output-format=gitlab -o code-quality-report.json || true
  artifacts:
    reports:
      codequality: code-quality-report.json
    paths:
      - code-quality-report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# ─── Backend — test ───────────────────────────────────────────────────────────
#
# Runs Django tests via pytest, sharded across 8 parallel jobs using
# pytest-split's least_duration algorithm for time-balanced distribution.
# The shards skip migrations (--nomigrations -m "not migrations", #2490): the
# test DB is built from the models, saving ~73 s of setup per shard. Tests that
# need the real migration graph carry @pytest.mark.migrations and run, with the
# full migration apply, in backend-test-migrations below. Tests that cost
# >= ~10 s on Postgres (the seed/sample command suites) carry @pytest.mark.slow
# and run in backend-test-slow instead, which is path-gated on MRs (#2524).
# These jobs gate the pipeline on test failures (fast, parallel).
# Coverage is measured separately by backend-test-coverage in a single-process
# run — see that job's comment for why sharded coverage combining is not used.
#
# Balancing uses the committed backend/.test_durations file. Shards must NOT
# pass --store-durations: every shard would write only its own slice and the
# last one to push a cache would win, leaving the file stale. Regenerate it
# from these shards' own JUnit times with
# `python3 scripts/refresh_test_durations.py --pipeline latest --collect --output backend/.test_durations`
# (#2422, see docs/development/testing.md); tests missing from the file get the
# average duration, so a stale file degrades balance but never correctness.

backend-test:
  extends: .pip-cache
  stage: test
  # #2534: a shard that hangs sits silent until the project timeout and holds a
  # runner. Healthy shards take 5-14 min (up to ~2.5x slower when a host is
  # shared, #2494); 30 min leaves that headroom and cuts a hang's cost roughly
  # in half. A timeout is retried by `default: retry` (stuck_or_timeout_failure).
  timeout: 30m
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  parallel: 8
  rules: &backend-test-rules
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services: &backend-test-services
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
      command: *pg_ci_fast_flags
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables: &backend-test-variables
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    # #2536: libpq applies this to every connection. A lock wait over 3 min
    # fails with Postgres's "canceling statement due to lock timeout" instead
    # of hanging the shard; no statement_timeout, so slow statements still run.
    PGOPTIONS: "-c lock_timeout=180s"
  cache: &backend-test-cache
    - key:
        prefix: "pip"
        files: [backend/requirements.txt]
      paths: [.cache/pip/, .cache/uv/]
      policy: pull
    - key:
        prefix: "pip-test"
        files: [backend/requirements-test.txt]
      paths: [.cache/pip/, .cache/uv/]
      policy: pull
  before_script: &backend-test-before-script
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
    - uv pip install --system --quiet -r backend/requirements-test.txt
  script:
    # #2536: background server-side activity report; diagnostic only, never
    # waited on, and `|| true` keeps a watcher failure from touching the job.
    - (python scripts/pg-activity-watch.py || true) &
    - cd backend
    # #2534: shards intermittently stalled with no output, and -q hid which
    # test was running. -v prints each node id when the test FINISHES, so the
    # hung test is the one after the last printed line. faulthandler_timeout
    # dumps every thread's stack to stderr (and names the test) when a single
    # test runs over 300 s, without killing it; 300 s is about 2x the slowest
    # test in .test_durations (~154 s).
    - coverage run --parallel --data-file=.coverage.${CI_NODE_INDEX} -m pytest
        --splitting-algorithm least_duration
        --durations-path .test_durations
        --group $CI_NODE_INDEX
        --splits $CI_NODE_TOTAL
        --junitxml=test-results/junit-${CI_NODE_INDEX}.xml
        --strict-markers --nomigrations -m "not migrations and not slow"
        -o faulthandler_timeout=300
        -v
  artifacts:
    paths:
      - backend/.coverage.*
    reports:
      junit: backend/test-results/junit-*.xml
    when: always
    expire_in: 1 day

# Applies the full migration graph on an empty Postgres DB (#2490). The shards
# above build their schema from the models (--nomigrations), so this job is the
# only place a pipeline runs every migration from scratch: its test-DB creation
# is that apply, and `-m migrations` runs the tests that drive the real graph.
# It must stay blocking (allow_failure: false) and in backend-test-coverage's
# needs, or a migration that fails on apply would reach deploy green.
backend-test-migrations:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # Same rules as backend-test, spelled out rather than `*backend-test-rules`:
  # scripts/wait-for-main-pipeline.py --check-ci-file reads rules as text and
  # fails closed on an aliased rules value (it cannot rule out `manual` on main).
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services: *backend-test-services
  variables: *backend-test-variables
  cache: *backend-test-cache
  before_script: *backend-test-before-script
  script:
    - cd backend
    - coverage run --parallel --data-file=.coverage.migrations -m pytest
        -m migrations
        --strict-markers
        --junitxml=test-results/junit-migrations.xml
        -q
  allow_failure: false
  artifacts:
    paths:
      - backend/.coverage.*
    reports:
      junit: backend/test-results/junit-migrations.xml
    when: always
    expire_in: 1 day

# The slow tests (#2524): @pytest.mark.slow marks tests that cost >= ~10 s on
# Postgres (the seed/sample command suites: 25 tests, 433 s = ~7.2 runner-minutes
# per pipeline by backend/.test_durations).
# backend-test deselects them; this single job runs them, so the MR path keeps
# the cheap seed tests and pays for the expensive ones only where they can
# change. It runs on:
#   * the Nightly schedule (FUZZ_DEEP == "true") and default-branch pushes, so
#     every slow test still runs on main and every night;
#   * MRs touching the seed/sample commands, their data and fixture modules,
#     models, migrations, pytest config, requirements or this file.
# Every other schedule (the weekly mutation and nightly load-test schedules)
# skips it (Sonar and CVE ride the Nightly, which runs it). On those,
# backend-test and backend-test-coverage still run (`changes:` is always true on
# a schedule) but without .coverage.slow; measured impact ~5 statements of
# 31,449 (~0.016%) (#2489 caveat).
# Instrumented like the shards: backend-test-coverage lists it with
# `needs: optional: true`, so an MR pipeline that did not create this job still
# combines the remaining data; a pipeline that did create it waits for it.
# Rules are spelled out (no aliases) because
# scripts/wait-for-main-pipeline.py --check-ci-file reads rules as text.
backend-test-slow:
  extends: .pip-cache
  stage: test
  timeout: 30m
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUZZ_DEEP == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/boards/tests/test_seed_demo_data.py
        - backend/boards/tests/test_sample_boards.py
        - backend/boards/tests/test_container_delete_vs_card_entry_lock.py
        - backend/boards/tests/history_reconciliation.py
        - backend/boards/views/import_export.py
        - backend/boards/import_schemas.py
        - backend/boards/import_errors.py
        - backend/boards/management/commands/seed_demo_data.py
        - backend/boards/management/commands/seed_template_boards.py
        - backend/boards/management/commands/_*.py
        - backend/boards/sample_boards/**/*
        - backend/boards/seed_data/**/*
        - backend/boards/services/sample_boards.py
        - backend/**/models.py
        - backend/**/migrations/**/*
        - backend/setup.cfg
        - backend/conftest.py
        - backend/.coveragerc
        - backend/requirements*.txt
        - sample-boards/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services: *backend-test-services
  variables: *backend-test-variables
  cache: *backend-test-cache
  before_script: *backend-test-before-script
  script:
    - cd backend
    # --nomigrations like the shards. No pytest-split: one job runs the whole
    # marked set (25 tests) so there is nothing to balance.
    - coverage run --parallel --data-file=.coverage.slow -m pytest
        -m "slow and not migrations"
        --strict-markers --nomigrations
        --junitxml=test-results/junit-slow.xml
        -o faulthandler_timeout=300
        -v
  allow_failure: false
  artifacts:
    paths:
      - backend/.coverage.*
    reports:
      junit: backend/test-results/junit-slow.xml
    when: always
    expire_in: 1 day

# Combines the .coverage.* artifacts produced by the parallel backend-test
# shards *and by every feature-flagged test job* and enforces the 90% threshold.
# Each producer runs with --parallel so coverage.py treats its data file as a
# fragment to be combined rather than a standalone measurement.
#
# Every job that executes tests must be instrumented and listed in `needs`.  A
# job left out does not merely go unmeasured — the code it covers is reported
# as 0%, which is worse than not measuring it at all.  backend-test runs with
# the feature flags off, so the flag-on paths (git_lens, and any future flagged
# app) are reachable only from their dedicated jobs.
#
# No postgres/redis services required — this job only runs coverage combine and
# report, no Django or test execution.
#
# Diff coverage (MR only) — #1076 — runs in THIS job too (#2497). It used to be
# a separate backend-diff-coverage job that `needs:`-chained on this one, which
# put two runner waits (~35 s) in series on every backend MR for a second report
# over the same data. Folding it in keeps both gates and both failure conditions:
#
# - Aggregate: `coverage report --fail-under=90` over the whole codebase.
# - Diff: diff-cover over only the lines this MR adds or modifies, against the
#   coverage.xml produced here — no test re-run. The aggregate has enough
#   inertia (500+ backend test files) to absorb a fully untested new view and
#   stay green, which is why the diff gate exists at all.
#
# Both gates always run and are reported; the job fails if EITHER fails, so a
# red aggregate never hides the diff gate's uncovered-line list (or vice versa).
# coverage.xml is written FIRST, with --fail-under=0, so the artifact, the MR
# coverage widget and diff-cover all have it even when the aggregate is red.
#
# Diff threshold: 80% of changed lines, blocking. Escape hatch: an MR that
# legitimately cannot meet it (a pure refactor with moved lines, a vendored
# file) says so in its description and a reviewer overrides by approving with
# the failing job acknowledged — see
# docs/development/testing.md#diff-coverage-escape-hatch. The override is
# always visible in the MR/job history, never silent. Because the two gates now
# share a job, the log line "FAIL: diff coverage" vs "FAIL: aggregate coverage"
# is what tells a reviewer which one they are acknowledging.
#
# migrations/ is excluded from the diff gate because .coveragerc does NOT omit
# it from the aggregate run (backend-test-migrations, #2490, imports and applies
# every migration to build its test DB, so migration lines legitimately count
# toward the 90% number) — but a line
# diff-cover would flag as "uncovered" in a migration is nearly always schema,
# not behavior, and re-litigating that here would just train reviewers to
# override the gate instead of reading it.
backend-test-coverage:
  stage: test
  # One producer per line so a new instrumented job is a one-line addition.
  # Every producer of a backend/.coverage.* fragment MUST be here — see the
  # comment above. backend-test-migrations (#2490) is also what keeps a
  # migration that fails on apply from reaching deploy green.
  needs:
    - backend-test
    - backend-test-migrations
    # optional (#2524): only created on Nightly, default-branch pushes and MRs
    # touching the seed/sample paths; its absence must not fail this job.
    - job: backend-test-slow
      optional: true
    - backend-test-git-lens
    - backend-test-mcp
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - !reference [.pip-floor, script]
    - pip install --quiet coverage
    - |
      # diff-cover needs git history and the MR target branch; only the MR
      # leg runs the diff gate, so main/schedule pipelines skip this setup.
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        apt-get update -qq && apt-get install -y -qq git
        pip install --quiet diff-cover
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=100
        # Deepen the MR head too: with more branch commits than GIT_DEPTH the
        # shallow head never reaches the fetched base ("no merge base").
        git fetch origin "$CI_COMMIT_SHA" --depth=100
      fi
  script:
    - cd backend
    - coverage combine
    - coverage xml --fail-under=0 -o coverage.xml
    - |
      rc=0
      coverage report --fail-under=90 || { echo "FAIL: aggregate coverage is below 90%"; rc=1; }
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        diff-cover coverage.xml \
          --compare-branch="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" \
          --fail-under=80 \
          --show-uncovered \
          --exclude "*/migrations/*" "manage.py" \
          || { echo "FAIL: diff coverage is below 80% of changed lines"; rc=1; }
      fi
      exit "$rc"
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
    when: always

# Public-contract compatibility diff against the last GA tag (#1667). The REST
# schema and the env var names settings.py reads are a 1.0+ public contract;
# nothing diffed them against a release, so "zero removals since v1.1.0" was a
# manual claim. Fails on a removed endpoint/field/parameter, a type change, a
# new required request field, or a response field that became optional or
# nullable; additions pass. Deliberate breaks are allow-listed, with a
# mandatory issue reference, in scripts/compat-baseline/allowlist.json.
# Baseline regeneration (at each GA tag): docs/development/api-compat-gate.md.
api-compat-check:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - changes: &api-compat-paths
        - backend/**/*
        - scripts/check-api-compat.py
        - scripts/_paths.py
        - scripts/compat-baseline/**/*
        - scripts/tests/check-api-compat.test.sh
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *api-compat-paths
  variables:
    # Schema generation only introspects serializers — Django never opens a
    # connection — so a syntactically valid DATABASE_URL is all this needs.
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@localhost:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://localhost:6379/0"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    GIT_LENS_ENABLED: "True"
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
  script:
    # Self-test FIRST (#1093): prove the detector still fires before trusting
    # a green run over the real schema.
    - python3 scripts/check-api-compat.py --self-test
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/check-api-compat.test.sh  # #2461: poisoned + canary
    - python3 scripts/check-api-compat.py
  allow_failure: false

# Checks that every model change has a corresponding migration file, that no
# migration builds an index or constraint in a way that takes ACCESS EXCLUSIVE on a
# live table (#1081), and that no migration adds a constraint a populated table could
# already violate (#1098) — see docs/development/database-migrations.md.
# Requires a Postgres service because makemigrations --check calls
# check_consistent_history(), which connects to the DB to verify applied
# migrations are consistent with the on-disk migration files.
migration-check:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266): nothing downstream needs this job
  # (a pure pipeline-greenness leaf), and `changes:` already re-fires on main
  # push pipelines whenever a merge actually touches these paths — so a
  # docs-only or frontend-only merge no longer pays for a full migrate +
  # concurrency/constraint-safety cycle it cannot affect.
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py makemigrations --check --dry-run --verbosity=1
    # Fails on a new AddIndex/AddConstraint that is not concurrent. The escape
    # hatch is an inline `# concurrency-exempt: <reason>` comment on the operation.
    - python manage.py check_migration_concurrency
    # Proves the constraint-safety gate below still fires before trusting its "clean" verdict (#1093).
    - python manage.py check_migration_constraint_safety --self-test
    # Fails on a new AddConstraint/NOT NULL/unique-together that could crash-loop against
    # pre-existing rows with no preceding repair step (#1098). The escape hatch is an
    # inline `# constraint-safe: <reason>` comment on the operation.
    - python manage.py check_migration_constraint_safety

# Backend against every other supported PostgreSQL major (#2463). backend-test
# and migration-check cover the default (17); the supported range is in
# docs/administration/upgrade.md. Each leg asserts it reached the right major,
# migrates from zero and runs one rotating pytest-split group — see
# scripts/pg-matrix-check.sh. Migration-touching MRs, backend changes on main,
# and the nightly schedule only (blocking on MR/main, advisory nightly).
backend-test-pg-matrix:
  extends: .pip-cache
  stage: test
  # Blocking on MR and main (#2481), after scheduled pipeline 3101326397 passed
  # all 24 nightly legs. The nightly variant stays advisory via its own rules.
  # #2534: all three legs hung together on one rotating group and held three
  # runners for ~53 min. A leg normally takes 6-11 min; the nightly variant runs
  # one group per job, so it inherits this limit.
  timeout: 30m
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  parallel:
    matrix:
      - PG_MAJOR: ["15", "16", "18"]
  rules:
    # Schedules run the full-suite variant below, never the rotating group.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - backend/**/migrations/**/*
        - backend/requirements*.txt
        - backend/requirements*.lock
        - scripts/pg-matrix-check.sh
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - backend/**/*
        - scripts/pg-matrix-check.sh
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:${PG_MAJOR}-alpine
      alias: postgres
      # Server defaults otherwise (this matrix tests stock settings); the full
      # statement text lets pg-activity-watch EXPLAIN a stall (#2536).
      command: ["postgres", "-c", "track_activity_query_size=16384"]
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    PGOPTIONS: "-c lock_timeout=180s"  # #2536, see backend-test
  before_script:
    - !reference [.pip-floor, script]
    # uv like backend-test (#2496): the same requirements files, in order.
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
    - uv pip install --system --quiet -r backend/requirements-test.txt
  script:
    - bash scripts/pg-matrix-check.sh --self-test
    - bash scripts/pg-matrix-check.sh
  artifacts:
    reports:
      junit: backend/test-results/junit-pg*.xml
    when: always
    expire_in: 1 day

# Nightly full coverage of the PG matrix (#2463): every pytest-split group on
# every non-default major (3 majors x 8 groups = 24 jobs), so the whole suite
# is exercised on each major once per night. Schedule only, advisory, and not
# on the Sonar nightly. Everything else is inherited from the job above;
# PG_TEST_GROUP overrides the rotating group in scripts/pg-matrix-check.sh.
backend-test-pg-matrix-nightly:
  extends: backend-test-pg-matrix
  parallel:
    matrix:
      - PG_MAJOR: ["15", "16", "18"]
        PG_TEST_GROUP: ["1", "2", "3", "4", "5", "6", "7", "8"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - when: never

# Catches two branches cut off the same point on main each adding a migration
# at the same next sequential number (e.g. both add 0042_...). Django applies
# whichever merges first without complaint, and the second branch's migration
# silently never runs. migration-check above only inspects the working
# branch's own tree and has no visibility into what has landed on main since
# the branch point — this job fetches main and diffs against it (#1099).
# MR-pipeline only: needs $CI_MERGE_REQUEST_TARGET_BRANCH_NAME for a real
# merge-base, which isn't set on branch/default-branch pipelines.
migration-numbering-check:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
  before_script:
    - apk add --no-cache git bash
  script:
    # Self-test immediately before the real invocation, same image (#1093) —
    # proves the collision detector still fires before trusting it on this MR.
    - bash scripts/check-migration-numbering.sh --self-test
    - scripts/check-migration-numbering.sh

# The Dockerfiles install backend/requirements.lock (hash-pinned, --only-binary
# :all: --require-hashes, #1378), not requirements.txt. This fails the MR when
# requirements.txt was edited without re-locking, which would otherwise ship an
# image that ignores the edit. Regenerate with scripts/lock-backend-requirements.sh
# (docs/development/dependency-lock.md).
backend-lock-check:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/requirements.txt
        - backend/requirements.lock
        - backend/requirements-build.in
        - backend/requirements-build.lock
        - scripts/lock-backend-requirements.sh
        - scripts/uv-requirements.txt
        - scripts/pip-requirements.txt
        - scripts/ensure-pip.sh
  before_script:
    # Hash-pinned uv; version must match UV_VERSION in the script.
    - !reference [.pip-floor, script]
    - pip install --quiet --require-hashes -r scripts/uv-requirements.txt
  script:
    # Self-test first, same image (#1093): proves the drift detector still fires.
    - sh scripts/ensure-pip.sh --self-test
    - sh scripts/lock-backend-requirements.sh --self-test
    - sh scripts/lock-backend-requirements.sh --check

# Validates the OpenAPI schema generated by drf-spectacular has no ERROR-level
# issues.  Does not require a database or Redis — Django loads in DEBUG mode
# with a fake DATABASE_URL so the schema introspection path runs without
# connecting.
backend-schema-validate:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — see migration-check's comment above.
  rules:
    - changes:
        - backend/**/*
  variables:
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@localhost:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://localhost:6379/0"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py spectacular --validate
  allow_failure: false

# Fuzzes the OpenAPI contract itself: boots a real backend against seeded demo
# data, authenticates as a normal (non-admin) board member, and drives
# schemathesis against every documented operation, asserting the response
# actually matches the declared schema, status code, and content type
# (#1080). backend-schema-validate above only proves the generated DOCUMENT is
# well-formed — it has no way to catch a view that bypasses its serializer and
# returns a body the schema never described (the TruePPM red-team finding
# #1080 is built on: same class as their #2515/#2649, and Visiban's own
# #1108). "Authenticate as a normal board member — not a superuser" is a
# direct requirement of #1080: provision_fuzz_token refuses to mint a token
# for any user carrying is_superuser/is_site_admin/can_access_all_content.
#
# Blocking (allow_failure: false) as of #1120 — #1080's own phased plan
# (baseline non-blocking for one release, #1080 acceptance criterion 3: "blocking
# by end of 1.2"). What the baseline found and how each point was resolved:
#
#   - Undocumented 404s from version-prefix fuzzing: negative testing mutated
#     the literal `v1` URL segment because drf-spectacular's catch-all
#     `re_path(r"^api/v(?!1/)[\w]+/", ...)` (visiban/urls.py) synthesized a
#     malformed path template (`/api/v{var}[\w]/`, literal regex syntax
#     leaking into the OpenAPI path) for `UnsupportedVersionView` — schemathesis
#     dutifully fuzzed that literal template into URLs that never matched the
#     real regex, landing on Django's HTML 404 debug page instead of a JSON
#     response. Fixed by excluding the view from the schema entirely
#     (`@extend_schema(exclude=True)`) — it's an internal safety net, not a
#     documented operation, so the honest fix is to stop describing it, not to
#     carve around it with --exclude-path-regex.
#   - A second, more serious bug the same investigation turned up: any
#     board-scoped nested route (`board_pk` and friends — untyped string path
#     segments, not `<int:...>`-typed) crashed with an unhandled 500 on a
#     non-numeric value, because `boards/views/_helpers.py` and six other view
#     modules resolved them with `django.shortcuts.get_object_or_404`, which
#     doesn't catch the ORM's `ValueError` the way `rest_framework.generics`'s
#     version does. Fixed by swapping the import in all seven files (defends
#     any lookup driven by a request body/query value, e.g. `move-group`'s
#     `group_id`, not just a URL path segment). A second, independent fix
#     landed on main while this branch was in flight (board-pk-nonnumeric-404):
#     `lookup_value_regex = r"\d+"` on the six board-scoped viewsets, so a
#     non-numeric id now fails to match the URL pattern at all rather than
#     reaching the view — closes the same hole at the routing layer, which is
#     the more correct fix for anything registered through a router. That
#     routing-level fix has its own side effect, though: an URL matching
#     *nothing* is resolved by Django itself, before any view runs — the
#     *technical* 404 debug page under `DEBUG=True` (true of this job),
#     reintroducing the exact "HTML instead of JSON" noise from the point
#     above, now for the entire board-resource route family instead of just
#     the version segment. `ApiNotFoundView` (visiban/urls.py, registered
#     dead last) closes that: it makes sure *something* always matches under
#     `/api/v1/`, so Django's resolver never has to render the fallback
#     itself. It also required a genuine design decision, not just a copy of
#     `UnsupportedVersionView`'s auth-gating: `/api/v1/` mixes authenticated
#     and deliberately public routes (the anonymous email-confirmation
#     redirect), so the catch-all cannot require auth — an anonymous caller
#     who garbles a public path's URL must still get a plain 404, not a 401
#     (a real regression this branch's own test suite caught:
#     accounts/tests/test_email_confirm.py's `..._returns_404_from_router`).
#     A follow-up verification run found the catch-all's own pattern
#     (`^api/v1/.*$`) still fell through to Django's raw response for a path
#     containing a literal embedded newline byte — `.` doesn't match `\n`.
#     `re.DOTALL` isn't available here: an inline `(?s)` flag in the pattern
#     string makes Django's own reverse-resolution machinery raise
#     `ValueError: Non-reversible reg-exp portion: '(?s'` on every request
#     (found the hard way — the first attempt 500'd everything), and
#     `re_path()` doesn't accept a pre-compiled DOTALL pattern either — its
#     system checks call `.startswith(...)` on `_regex`, assuming a string.
#     Fixed with `[\s\S]*` instead of `.*` (a character class always
#     matches `\n`, no flag needed).
#   - 72 operations reachable only via 404 (random path-parameter ids never
#     matching seeded rows): `backend/schemathesis_hooks.py`, loaded via
#     SCHEMATHESIS_HOOKS below, is a `map_path_parameters` hook that substitutes
#     real ids pulled from `seed_demo_data`'s board/cards/columns/swimlanes/
#     labels/members at hook-load time. `--generation-database` (hypothesis's
#     own example-replay cache) and `--phases stateful` (schemathesis's
#     OpenAPI-`links`/Location-header-based chaining — this schema declares no
#     links, and no Visiban view sets a Location header on create) were both
#     investigated and ruled out; a path-parameter hook against real seeded
#     rows is what this schemathesis version actually supports for this.
#     Groups, custom-fields, saved-filters, attachments, and group
#     invite-links/labels previously had no seeded row at all and still 404ed
#     under fuzzing; #1125 extended seed_demo_data with one of each and
#     schemathesis_hooks.py maps their path parameters the same way as every
#     other board-scoped resource above.
#   - 12 admin-only operations returned only 403: expected — #1080 requires
#     provision_fuzz_token to refuse an admin/superuser account, so this job's
#     token can never reach `/api/v1/admin/*`. Accepted as documented residual
#     scope rather than adding a second admin-scoped pass: only 10 operations
#     sit behind IsSiteAdmin (accounts/admin_views.py's `_ADMIN_PERMISSIONS`;
#     was 9 before #1203 added AdminUserClearLockoutView), all with
#     dedicated coverage already (accounts/tests/test_admin_api.py,
#     test_invite_links.py, test_pat_scopes.py) — a second full fuzz pass for
#     that surface is disproportionate to what's actually gated.
#
# Reaching real 200-path responses (the seeding above) also let negative-data
# fuzzing reach two more unhandled 500s: CardViewSet.move and
# GroupViewSet.transfer_ownership both read `request.data.get(...)` without
# checking the parsed body is a JSON object first, so a bare number/string/
# array/null/bool body raised AttributeError. Both fixed with an
# isinstance(request.data, dict) guard. This is a repeatable pattern — a grep
# for `request.data.get(` across boards/views and groups/views turns up ~30
# more call sites with the same shape — so a future run's randomness finding
# another instance is a real, open possibility, not fully closed by this
# branch; each one found gets the same fix, following this precedent.
#
# Reaching real 200-path responses (the seeding above) surfaced the exact bug
# class #1108 fixed on CardSerializer and #1119 is tracking for Group/
# GroupDetail on several more serializers (Board, BoardFull, BoardUser,
# CurrentUser — filed as #1123) and a separate, structural gap: most write
# endpoints' 400 validation-error response isn't documented in the schema at
# all (filed as #1124). Neither was a CI-config fix, so both were recorded as
# scoped, justified baseline entries in backend/schemathesis-baseline.json
# (schemathesis's own "accepted known failures" mechanism — matched by
# operation + check + failure-class + schema-path/status-code, never by the
# random value schemathesis generated, so the file doesn't need touching every
# run) rather than blocking this flip on #1119/#1123/#1124 landing first.
# #1124's entries were pruned when visiban/schema_hooks.py started documenting
# a generic 400 (#1165). #1119/#1123 closed without their entries being pruned;
# #1170 pruned them (`st run ... --baseline PATH --baseline-update
# --baseline-prune`, two full-length runs with different seeds — a short run
# reports valid entries as unobserved, so only entries unobserved by both
# were dropped), taking the baseline from 41 entries to 12. Every surviving
# entry now carries a "reason" field explaining why it's accepted (most are
# @action/APIView endpoints with no @extend_schema, so drf-spectacular's
# automatic inference doesn't match the real response) so the job resumes
# catching a regression in the area the pruned entries used to mask.
#
# Scoped to the file classes #1080 names (views/, serializers.py, urls.py), so
# a schema-shape change gets checked without running on every unrelated
# branch (e.g. a frontend-only MR). No unconditional main fallback (#1266):
# nothing downstream `needs:` this job — it only gates pipeline greenness —
# and `changes:` already re-fires on main push pipelines whenever a merge
# actually touches these paths, so a docs-only merge no longer pays for a
# full server boot + seed + up to 300s of fuzzing per shard it cannot affect.
#
# Never on a scheduled pipeline (#1383). `changes:` evaluates true on a
# schedule, so this job used to run incidentally on every schedule at the MR
# budget. The Nightly schedule now runs `backend-schema-fuzz-deep` (below)
# instead, at a much larger budget; running this one too would only double the
# boot + seed cost for a strictly smaller search.
# Seed resolution steps shared by backend-schema-fuzz and the deep nightly job.
# A hidden key so the deep job can run them BEFORE its fuzz-started marker: a
# resolver self-test failure or a bad Fuzz-Seed trailer is a setup failure, not a
# schema-fuzz finding (#1207).
.schema-fuzz-seed-steps: &schema-fuzz-seed-steps
    # Fresh seed per run for coverage, but recorded up front (a crash before
    # st's own summary would otherwise lose it). Replay (#1207): MR pipelines cannot
    # take variables, so pin the seed with a `Fuzz-Seed: <n>` trailer on the MR head
    # commit (an empty commit works); an explicit FUZZ_SEED variable still wins.
    # scripts/resolve_fuzz_seed.py validates it as a plain integer, then picks.
    - python3 scripts/resolve_fuzz_seed.py --self-test
    - python3 scripts/resolve_fuzz_seed.py > /tmp/fuzz_seed
    - echo "${CI_JOB_NAME} seed=$(cat /tmp/fuzz_seed) max-examples=${FUZZ_MAX_EXAMPLES} max-time=${FUZZ_MAX_TIME}${FUZZ_SHARD:+ shard=${FUZZ_SHARD}}${FUZZ_INCLUDE_PATH_REGEX:+ include-path-regex=${FUZZ_INCLUDE_PATH_REGEX}}  (to replay on an MR, push an empty commit with the trailer 'Fuzz-Seed:' followed by $(cat /tmp/fuzz_seed); see docs/api/openapi.md)"

# The fuzz run itself, shared by backend-schema-fuzz, the deep nightly job and
# backend-schema-fuzz-git-lens. Two optional variables narrow it:
# FUZZ_INCLUDE_PATH_REGEX adds --include-path-regex only when set, and
# FUZZ_BASELINE defaults to the shared baseline file. The git_lens job sets both
# (#1338); each backend-schema-fuzz shard sets both to its partition (#2521);
# the deep job sets neither, so its command is unchanged.
.schema-fuzz-run-steps: &schema-fuzz-run-steps
    # The email-confirm endpoints only 302 to the SPA at FRONTEND_URL, which
    # does not run in this job — following that redirect is a "Connection
    # refused" NonFatalError, and any NonFatalError exits `st run` 1. Their
    # redirect behavior is covered by accounts/tests/test_email_confirm.py
    # instead. The 3rdparty/signup safety-net (#1321) behaved the same way, but
    # since #1736 it is excluded from the published schema itself, so the
    # `3rdparty/signup` regex alternative below can no longer match a schema
    # path; it is retained as a harmless safety net. Its redirect behavior is
    # covered by accounts/tests/test_social_signup_redirect.py.
    - |
      st run http://localhost:8000/api/schema/ \
        --seed "$(cat /tmp/fuzz_seed)" \
        -H "Authorization: Token $(cat ${VISIBAN_FUZZ_TOKEN_FILE})" \
        --exclude-path-regex 'confirm-email|3rdparty/signup' \
        --checks response_schema_conformance,status_code_conformance,content_type_conformance \
        --phases examples,fuzzing \
        --max-examples "${FUZZ_MAX_EXAMPLES}" \
        --max-time "${FUZZ_MAX_TIME}" \
        --workers 4 \
        ${FUZZ_INCLUDE_PATH_REGEX:+--include-path-regex "$FUZZ_INCLUDE_PATH_REGEX"} \
        --baseline "${FUZZ_BASELINE:-backend/schemathesis-baseline.json}" \
        --report junit,json \
        --report-junit-path schemathesis-junit.xml \
        --report-json-path schemathesis-report.json \
        --no-color

# Everything the three schema-fuzz jobs share (#2521). backend-schema-fuzz (the
# sharded MR/main job, below), backend-schema-fuzz-deep and
# backend-schema-fuzz-git-lens all `extends:` this hidden template rather than
# one another, so the MR job's `parallel: matrix:` cannot leak into the two
# single-run jobs. Each of them sets its own FUZZ_MAX_EXAMPLES/FUZZ_MAX_TIME
# and script; the rules here are the MR job's (the other two override them).
.backend-schema-fuzz-base:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  allow_failure: false
  # Baseline identities include the *check name*, and one failure class can come
  # from more than one check: an empty-body response trips MissingContentType under
  # content_type_conformance AND under response_schema_conformance (which bundles it
  # with MalformedJson). Baseline both identities or the finding still fails the job
  # deterministically — this is not flakiness, so there is no retry here (#1120).
  # A red run here is a REAL, replayable defect — never a flake (#1165). The seed
  # only chooses *which* part of the input space this run explores; a case that
  # fails is deterministic for its input, so a green re-run just means a different
  # seed missed it. Three main pipelines went red on 2026-09-26 for exactly this
  # reason (a POST /groups/ 500 and two undocumented 400s) and "passed on retry".
  # Therefore:
  #   * the only retries are the `default:` ones for runner-infrastructure
  #     failures (`runner_system_failure`/`stuck_or_timeout_failure`); an
  #     assertion failure is never retried;
  #   * the seed is generated here, printed, and overridable (FUZZ_SEED variable, or a
  #     `Fuzz-Seed:` MR head-commit trailer, #1207) so the exact failing run can be replayed (see docs/api/openapi.md);
  #   * `after_script` prints the triage steps on failure.
  # Do not "fix" a red run by re-running it or by baselining it: fix the endpoint
  # (a 5xx) or declare the response in the schema (an undocumented 4xx).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes:
        - backend/**/views/**/*
        - backend/**/serializers.py
        - backend/**/urls.py
        # Throttle rates and SPECTACULAR_SETTINGS live in settings.py (#1569);
        # the two hook files shape the schema and the fuzz run itself.
        - backend/visiban/settings.py
        - backend/visiban/schema_hooks.py
        - backend/schemathesis_hooks.py
        - backend/schemathesis_surrogates.py
        # Pruning or adding a baseline entry must run the job that consumes it (#1791).
        - backend/schemathesis-baseline.json
        # The hook resolves ids from the seeded rows (#1570), which the
        # shared history writer also touches (checklist creators, #1889).
        - backend/boards/management/commands/seed_demo_data.py
        - backend/boards/management/commands/_seed_history.py
        # The hook maps a real sample slug from the manifest (#1570).
        - backend/boards/sample_boards/manifest.json
        # Webhook views live outside backend/**/views/ (#863).
        - backend/webhooks/views.py
        # The shard partitions (#2521): a regex edit changes what each shard fuzzes.
        - scripts/fuzz_partitions.py
  # "Missing valid test data" accounting (#1570). Before it, 43 operations
  # repeatedly 404ed: the fuzz user (demo2) was not a GROUP member, so
  # GroupViewSet.get_queryset() hid every /groups/{id}/... route whatever id the
  # hook supplied; join/share/media had no hook mapping; and the card collection,
  # relations and checklist-reorder routes were unmapped. seed_demo_data now adds
  # the board's members to the demo group, and schemathesis_hooks.py mints join
  # tokens (stored hashed, so only the hook can hold the raw value), maps the
  # share token, the seeded attachment's media path and a real sample slug.
  # DELETE operations get a freshly minted disposable row per call (never the
  # shared fixture): a hard card delete cascades and removes the attachment file,
  # which otherwise 404ed every later card/media call (#1570).
  # MEASURED LOCALLY (seed 1, 10 examples, 600 s, 4 workers, same schemathesis
  # 4.27.1 and options as this job, but SQLite instead of Postgres):
  #   origin/main hook:  43 operations "Missing valid test data", 64 "Missing
  #                      authentication" (403)
  #   this branch:        6 operations "Missing valid test data", 72 "Missing
  #                      authentication" (403: more routes are now reachable and
  #                      answer their declared role-rule 403 instead of 404)
  #   every DELETE on card/attachment/comment/checklist item/relation/saved
  #   filter reached 2xx on all ~240 calls each.
  # The 6 that remain, and why (measured before #1794, when
  # DELETE /auth/me/connected-accounts/{provider}/ was still the first of them;
  # it has since left this list, so 5 are listed below):
  #   * DELETE /boards/{id}/invite-links/{link_id}/  link_id is not seeded and a
  #     plain member fails the board-admin check first (boards/views/invites.py)
  #   * POST /auth/me/pending-email/resend/  404s unless the user has a pending
  #     email change; none is seeded
  #   * POST /auth/registration/verify-email/  needs a signup confirmation key
  #   * POST /boards/import/trello/  no Trello export is seeded; the generated
  #     multipart body never parses
  #   * POST /boards/{board_pk}/cards/{id}/move/  the target column/swimlane ids
  #     are in the request BODY, which the path-parameter hook does not touch
  # DELETE /auth/me/connected-accounts/{provider}/ was the first of the 6
  # (it needed a linked social account the seed does not create). Since
  # #1794 it is session only, so the token fuzz client gets a declared 403
  # before any provider lookup: it moves from the "Missing valid test data"
  # bucket to "Missing authentication". Expected effect is one fewer / one more,
  # but the counts above were NOT re-measured; confirm in the CI job log.
  # (/boards/samples/{sample_id}/ is mapped to a real manifest slug.) The two
  # email-confirm routes are excluded above (#1321); /api/v1/admin/... is out of
  # reach for a non-admin token by design (#1080).
  # 403s that are role rules, not wrong ids, and stay: DELETE /auth/tokens/{id}/
  # for a PAT caller (#1110), DELETE /auth/me/connected-accounts/{provider}/ for
  # any token caller (#1794), group-admin, group-owner and board-admin actions.
  # Locally, DELETE card/attachment/comment/relation went from 403/404 to 2xx
  # after the hook-id fixes; the checklist item and saved filter DELETEs were 404
  # before (unmapped child id) and are 2xx now.
  # NOT reproducible locally, so confirm in the CI job log: the post-change
  # "Missing valid test data" and 403 counts on Postgres, and any finding on the
  # newly reachable routes. The local run's 500s were all SQLite artifacts
  # ("database is locked" under 4 workers; one OverflowError on a >64-bit
  # integer in POST /boards/{board_pk}/cards/, which Postgres may report as a
  # DataError instead -- if CI shows a 500 there it is a real finding).
  # A new finding is a real defect, never a flake.
  # Unobserved schemathesis-baseline.json entries are now logged by id
  # (scripts/fuzz_baseline_unobserved.py, after_script); entries are pruned only
  # after a deep run also lists them as unobserved (#1582).
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
      command: *pg_ci_fast_flags  # throwaway fuzz DB, seeded per job (#2488 review)
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    # Throttle override (#1569): the DEBUG rates are "9999/hour" and the public
    # share-link scopes have no DEBUG bypass, so a ~20k-request fuzz run was
    # answered with 429 on ~23% of requests and those cases never reached the
    # view under test. This lifts every DRF throttle rate and allauth's
    # login_failed gate for this job only; settings.py refuses the variable
    # unless DEBUG=True and production defaults are untouched.
    VISIBAN_DISABLE_THROTTLING: "True"
    # Outbound webhooks (#863): on, so the routes exist in the fuzzed schema.
    # The fuzz user is a plain MEMBER of the demo board, which would answer every
    # webhook route with the role 403, so schemathesis_hooks.py seeds a separate
    # "Schemathesis Webhook Board" where that user is ADMIN, with one subscription,
    # and maps only the webhook routes to it (#2078). The read routes and the
    # token-allowed writes (GET, name/event_types PATCH, disable, DELETE) therefore
    # return real responses checked against the schema; DELETE gets a freshly
    # minted subscription per call. A PAT still cannot reach create, url PATCH,
    # reenable, rotate or test (403 session_required), so the job opens no
    # outbound connection; the fixture URL is never dialed.
    WEBHOOKS_ENABLED: "True"
    # CI-only file; provision_fuzz_token writes the raw PAT here (mode 0600),
    # never to job output — see the command's docstring.
    VISIBAN_FUZZ_TOKEN_FILE: "/tmp/visiban_fuzz_token"
    # Loaded automatically by `st run` (schemathesis/core/hooks.py's
    # load_from_env) — a file path (not a bare module name) so it loads
    # correctly regardless of script:'s cwd; see schemathesis_hooks.py's own
    # sys.path handling for why that matters here specifically.
    SCHEMATHESIS_HOOKS: "backend/schemathesis_hooks.py"
    # `st run` is itself a Python process; a bare "Segmentation fault (core
    # dumped)" with no Python-level traceback (seen once on this branch,
    # !892) is otherwise undiagnosable from the CI log alone. Cheap and
    # inert on every normal run — only fires on an actual native-level crash.
    PYTHONFAULTHANDLER: "1"
    # Search budget (FUZZ_MAX_EXAMPLES, FUZZ_MAX_TIME): set by each job that
    # extends this template, never here (#2521).
  cache:
    - key:
        prefix: "pip"
        files: [backend/requirements.txt]
      paths: [.cache/pip/, .cache/uv/]
      policy: pull
    - key:
        prefix: "pip-test"
        files: [backend/requirements-test.txt]
      paths: [.cache/pip/, .cache/uv/]
      policy: pull
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
    - uv pip install --system --quiet -r backend/requirements-test.txt
    - cd backend
    - python manage.py migrate --noinput
    # Deterministic, git-diffable demo data — a real member's-eye view of a
    # populated board, not an empty database where every path-parameterized
    # operation 404s before schemathesis can reach its core logic.
    - python manage.py seed_demo_data --force
    # --set-random-password gives the (social-only) fuzz user a random password
    # nobody holds. The password-change routes already refuse a token-only
    # caller for a passwordless account (#1609); this is defense in depth so a
    # fuzzed change cannot revoke this PAT (#1607). Throwaway CI database only;
    # see the command's docstring.
    - python manage.py provision_fuzz_token --username demo2 --set-random-password
    # Server output goes to an artifact, not the job log (#1607). Every request
    # writes an access line (and a 4xx a django.request "Bad Request:" /
    # "Forbidden:" line); the deep run's ~100k requests hit GitLab's 16 MB log
    # cap and truncated schemathesis's own summary and unobserved-baseline
    # report. 5xx tracebacks are in schema-fuzz-server.log; after_script prints
    # the "Internal Server Error:" lines on failure.
    - python manage.py runserver 0.0.0.0:8000 > "${CI_PROJECT_DIR}/schema-fuzz-server.log" 2>&1 &
    # Poll liveness instead of a fixed sleep, same pattern as oidc-smoke.
    - |
      for i in $(seq 1 30); do
        python3 -c "import requests; requests.get('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
  # The unsharded run. No job uses this script as is (all three override it);
  # it documents the order the overrides keep: seed, then the fuzz.
  script:
    - *schema-fuzz-seed-steps
    - *schema-fuzz-run-steps
  after_script: &schema-fuzz-after-script
    # Log-only (#1582): `st run` prints just the COUNT of unobserved baseline
    # entries; list their ids from the JSON report. `|| true` so this can never
    # change the job result (after_script failures do not, but keep it explicit).
    - python3 scripts/fuzz_baseline_unobserved.py schemathesis-report.json "${FUZZ_BASELINE:-backend/schemathesis-baseline.json}" || true
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        cat <<EOF
      ============================================================================
      ${CI_JOB_NAME} FAILED — treat this as a REAL defect, not a flake.
      A different seed passing does not mean the endpoint is fine; it means that
      seed did not reach the failing input (#1165).
        1. Find the failing operation and status in the "FAILURES" section above.
        2. 5xx            -> fix the endpoint: validation belongs in the serializer
                             and must answer 400, never raise.
           undocumented 4xx -> declare the response (@extend_schema, or a
                             visiban/schema_hooks.py rule if it is a whole class).
           schema mismatch -> fix the serializer or the annotation.
        3. Reproduce: 'st replay <Test Case ID>' with the request in the log, or
           re-run with the same seed: push an empty commit to the MR whose message
           ends with the trailer line
               Fuzz-Seed: $(cat /tmp/fuzz_seed 2>/dev/null)
           (git commit --allow-empty -m "ci: replay fuzz seed" -m "Fuzz-Seed: <n>").
           Budget: FUZZ_MAX_EXAMPLES=${FUZZ_MAX_EXAMPLES} FUZZ_MAX_TIME=${FUZZ_MAX_TIME}.
           Shard: ${FUZZ_SHARD:-none (unsharded job)}. The trailer pins this seed
           on every shard; only this shard fuzzes the failing operation, so its
           log is the one to compare (docs/api/openapi.md).
           Remove the trailer commit (or push a newer commit) to go back to random.
        4. Do NOT retry the job or add a baseline entry to turn it green.
        Server output (tracebacks for any 5xx) is in the job artifact
        schema-fuzz-server.log, not this log (#1607).
      ============================================================================
      EOF
        if [ -f schema-fuzz-server.log ]; then
          echo "Server 5xx lines (first 50; full tracebacks in schema-fuzz-server.log):"
          grep -m 50 'Internal Server Error:' schema-fuzz-server.log || echo "  (none)"
          echo "401 responses: $(grep -c 'Unauthorized:' schema-fuzz-server.log || true) (nonzero means the fuzz token stopped authenticating, #1607)"
        fi
      fi
  artifacts:
    reports:
      junit: schemathesis-junit.xml
    paths:
      - schema-fuzz-server.log
      - schemathesis-report.json
    # Server log can carry request bodies in tracebacks; keep it to developers.
    access: developer
    when: always
    expire_in: 1 week

# ─── backend-schema-fuzz, sharded by path partition (#2521) ──────────────────
#
# One `st run` over all ~227 operations hit its 600 s --max-time cap on every
# run (median job 649 s; "19767 generated ... in 600.44s", job 18259260495), so
# it never finished --max-examples 10 and the operations at the end of the list
# got the least search. The job is now a matrix of path partitions, defined in
# scripts/fuzz_partitions.py: each shard is a separate job with its own
# Postgres, migrate, seed, fuzz token and server (all inherited from the
# template), fuzzing only the paths its partition's regex selects.
#
#   * Budget: FUZZ_MAX_TIME per shard is the single knob. 3 x 300 s = 900 s of
#     total search against 600 s before, for a wall clock near 300 s plus boot.
#   * Coverage: before fuzzing, every shard runs `fuzz_partitions.py check`
#     against the schema it is about to fuzz (the matrix half of it also runs
#     schema-free, with the partition --self-test, in
#     fuzz-baseline-unobserved-selftest, so a CI-file-only MR is covered). It fails if any path matches no
#     partition or more than one, if a partition selects nothing, or if this
#     matrix does not list exactly the partitions, so a gap or a double-fuzzed
#     operation can never pass green (#1075).
#   * Seed: each shard draws its own random seed and prints it with its shard
#     and regex. A `Fuzz-Seed:` trailer (or FUZZ_SEED) pins that seed on every
#     shard; replay by reading the failing shard's log.
#   * Baseline: each shard fuzzes against a copy of
#     backend/schemathesis-baseline.json filtered to its own partition
#     (FUZZ_BASELINE below), so neither `st run` nor the after_script logger
#     reports an entry as unobserved because another shard owns its path. See
#     filter_baseline() for why filtering beats aggregating across shards.
#   * Retune by editing PARTITIONS and FUZZ_SHARD below together; the check
#     fails until they agree.
backend-schema-fuzz:
  extends: .backend-schema-fuzz-base
  parallel:
    matrix:
      - FUZZ_SHARD: [board-children, boards-groups, other]
  variables:
    # A manual "Run pipeline" on main can override both, to replay a deep
    # run's seed at the deep budget through these shards (docs/api/openapi.md).
    FUZZ_MAX_EXAMPLES: "10"
    FUZZ_MAX_TIME: "300"
    # Written by the script below from the shared baseline; read by `st run`
    # and by the after_script logger, which runs in the same container.
    FUZZ_BASELINE: "/tmp/fuzz_shard_baseline.json"
  script:
    - python3 scripts/fuzz_partitions.py --self-test
    - >-
      python3 scripts/fuzz_partitions.py check
      --schema-url "http://localhost:8000/api/schema/?format=json"
      --token-file "${VISIBAN_FUZZ_TOKEN_FILE}"
      --ci-file .gitlab-ci.yml
    # A plain assignment, not `export X=$(...)`: export would swallow a failed
    # lookup and run this shard unfiltered over the whole schema.
    - FUZZ_INCLUDE_PATH_REGEX="$(python3 scripts/fuzz_partitions.py regex "${FUZZ_SHARD}")"
    - test -n "${FUZZ_INCLUDE_PATH_REGEX}"
    - export FUZZ_INCLUDE_PATH_REGEX
    - python3 scripts/fuzz_partitions.py baseline "${FUZZ_SHARD}" backend/schemathesis-baseline.json "${FUZZ_BASELINE}"
    - *schema-fuzz-seed-steps
    - *schema-fuzz-run-steps

# ─── Change-feed client (#1178) ─────────────────────────────────────────────
#
# clients/python and clients/typescript are thin consumers of the change-feed
# contract in docs/api/events.md. They are experimental (0.x) and are NOT
# published: there is deliberately no publish job here. Three jobs:
#   * clients-python-unit / clients-typescript-unit: fast, no server, driven by
#     the shared clients/contract/fixtures.json (both must agree).
#   * clients-contract: both suites against a live backend, so an API change
#     that breaks the client fails the OSS pipeline.
clients-python-unit:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - clients/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - clients/**/*
  before_script:
    - !reference [.pip-floor, script]
    - pip install --quiet 'coverage>=7.6,<8'
  script:
    - cd clients/python
    # The package is stdlib-only; PYTHONPATH stands in for an install. The live
    # tests skip themselves without VISIBAN_CONTRACT_* (clients-contract runs them).
    - export PYTHONPATH=src
    - coverage run -m unittest discover -s tests -t . -v
    - coverage report -m --fail-under=80

clients-typescript-unit:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:20-alpine  # stays on 20 on purpose: clients/typescript documents Node >=20.3 as its floor (#2374)
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm-clients-ts"
      files: [clients/typescript/package-lock.json]
    paths: [.npm/]
    policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - clients/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - clients/**/*
  script:
    - cd clients/typescript
    - npm ci --prefer-offline --ignore-scripts
    - npm run typecheck
    - npm test
    - npm run build

# Contract tests against a real backend. Same boot as backend-schema-fuzz
# (Postgres, seed_demo_data, a scoped read+write PAT for demo2, runserver), then:
#   1. feed phase: both suites create cards and page the feed from a baseline;
#   2. back-date the board's events and run the real pruner, so the cursors the
#      suites saved are now expired;
#   3. expired phase: both suites must get a Resync, then resume without a 410.
# Image: Node 20 (the TypeScript suite's floor) with Debian's Python for the
# backend. The suites assert the HTTP contract, not the interpreter; the backend
# itself is tested on python:3.12 by the backend jobs.
clients-contract:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:20-bookworm-slim  # stays on 20 on purpose: clients/typescript floor (#2374)
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes:
        - clients/**/*
        - backend/boards/views/boards.py
        - backend/boards/views/**/*
        - backend/boards/serializers.py
        - backend/boards/broadcast.py
        - backend/boards/services/feed.py
        - backend/boards/models.py
        - backend/boards/urls.py
        - backend/boards/permissions.py
        - backend/boards/management/commands/prune_board_events.py
        - backend/accounts/**/*
        - backend/visiban/settings.py
        - backend/visiban/urls.py
        - backend/visiban/permissions.py
        - backend/visiban/exceptions.py
        - backend/requirements.txt
        - .gitlab-ci.yml
        - backend/webhooks/**/*
        - docs/api/events.md
        - docs/api/webhooks.md
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    # The suites make a few hundred requests; the DEBUG throttle rates are
    # already far above that, but match the fuzz job so a rate limit never
    # masquerades as a contract failure.
    VISIBAN_DISABLE_THROTTLING: "True"
    VISIBAN_FUZZ_TOKEN_FILE: "/tmp/visiban_client_token"
    VISIBAN_CONTRACT_BASE_URL: "http://localhost:8000"
    VISIBAN_CONTRACT_TOKEN_FILE: "/tmp/visiban_client_token"
    # Fail closed: a missing or renamed VISIBAN_CONTRACT_* variable must fail the
    # job, not skip every live test and leave it green.
    VISIBAN_CONTRACT_REQUIRED: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    - key:
        prefix: "pip-clients-contract"
        files: [backend/requirements.txt]
      paths: [.cache/pip/]
      policy: pull-push
    - key:
        prefix: "npm-clients-ts"
        files: [clients/typescript/package-lock.json]
      paths: [.npm/]
      policy: pull-push
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-venv python3-pip > /dev/null
    - python3 -m venv /tmp/venv
    - . /tmp/venv/bin/activate
    - !reference [.pip-floor, script]
    # Stays on pip (#2496): this job installs into a Debian-python venv on a
    # node image, where uv's --system would target /usr instead of the venv.
    - pip install --quiet -r backend/requirements.txt
    - cd backend
    - python manage.py migrate --noinput
    - python manage.py seed_demo_data --force
    - python manage.py provision_fuzz_token --username demo2 --set-random-password
    - python manage.py runserver 0.0.0.0:8000 > "${CI_PROJECT_DIR}/clients-contract-server.log" 2>&1 &
    - |
      for i in $(seq 1 30); do
        python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
    - cd clients/typescript && npm ci --prefer-offline --ignore-scripts && cd ../..
  script:
    - export VISIBAN_CONTRACT_PHASE=feed
    - (cd clients/python && PYTHONPATH=src VISIBAN_CONTRACT_STATE=/tmp/state-python.json python -m unittest tests.test_live -v)
    - (cd clients/typescript && VISIBAN_CONTRACT_STATE=/tmp/state-typescript.json npx vitest run test/live.test.ts)
    # Back-date every event and run the real pruner: the saved cursors are now
    # below the board's prune mark, which is exactly what makes the feed answer 410.
    - |
      cd backend
      python manage.py shell -c "
      import datetime
      from django.utils import timezone
      from boards.models import BoardEvent
      BoardEvent.objects.update(created_at=timezone.now() - datetime.timedelta(days=2))"
      python manage.py prune_board_events --days 1
      cd ..
    - export VISIBAN_CONTRACT_PHASE=expired
    - (cd clients/python && PYTHONPATH=src VISIBAN_CONTRACT_STATE=/tmp/state-python.json python -m unittest tests.test_live -v)
    - (cd clients/typescript && VISIBAN_CONTRACT_STATE=/tmp/state-typescript.json npx vitest run test/live.test.ts)
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -f clients-contract-server.log ]; then
        echo "Last 100 lines of server output (artifact clients-contract-server.log):"
        tail -n 100 clients-contract-server.log
      fi
  artifacts:
    paths:
      - clients-contract-server.log
    access: developer
    when: always
    expire_in: 1 week

# ─── Deep nightly schema fuzz (#1383) ────────────────────────────────────────
#
# The deliberate, large-budget run of backend-schema-fuzz: same boot, seed,
# token, checks and shared backend/schemathesis-baseline.json (everything is
# inherited via `extends:`), with 10x the per-operation example budget and a
# 2400 s wall-clock cap (8x a shard's 300 s). Before #1383 the only scheduled fuzzing was the MR job
# running incidentally at the MR budget; that job now never runs on a schedule.
#
# Schedule-only, on the consolidated Nightly schedule (FUZZ_DEEP=true). A fresh
# seed each night, printed at the start and replayable with FUZZ_SEED, exactly
# like the MR job.
#
# allow_failure: true so a stochastic finding does not red the shared Nightly
# pipeline (and the README badge) that also carries the CVE scans — TruePPM's
# `api:fuzz` precedent. That does NOT make it a flake: a red run here is a real,
# replayable defect, same as the MR job (#1165). Because a yellow job in a green
# pipeline emails nobody, after_script files one tracking issue (or comments on
# the open one) via scripts/fuzz_deep_file_issue.py when a
# FUZZ_DEEP_API_TOKEN / KAIZEN_API_TOKEN (`api` scope) is configured, and prints
# what it would have filed otherwise. See docs/development/ci-gates.md.
#
# Budget: --max-time 2400s inside a 55m job timeout leaves ~15 minutes for pip
# install, migrate, seed and server boot (the MR job's boot is ~45s). The MR
# job's shards each exhaust their 300s cap at --max-examples 10, so --max-time is
# the binding limit here too; raise it before raising --max-examples.
backend-schema-fuzz-deep:
  interruptible: false  # scheduled-only deep fuzz; a merge must not cancel it (#2421)
  retry: 0  # files an issue in after_script; a retry would file it twice
  # The shared template, not the sharded MR job: the deep run stays one
  # unsharded `st run` over the whole schema (#2521).
  extends: .backend-schema-fuzz-base
  allow_failure: true
  timeout: 55m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUZZ_DEEP == "true"'
  variables:
    FUZZ_MAX_EXAMPLES: "100"
    FUZZ_MAX_TIME: "2400"
  script:
    # Self-test the issue filer before trusting it in after_script (#1093).
    - python3 scripts/fuzz_deep_file_issue.py --self-test
    # Resolve the seed first (self-test + validation, #1207): a failure here is
    # setup, not a finding, so it must precede the marker.
    - *schema-fuzz-seed-steps
    # Marker: the fuzz itself is about to run. after_script files an issue only
    # when this exists, so a failed filer self-test (or a failed pip install,
    # migrate or seed in before_script) is never reported as a schema-fuzz
    # finding. It is a red job like any other, not an API defect.
    - touch /tmp/fuzz_deep_started
    # GitLab flattens nested script arrays: these are backend-schema-fuzz's own
    # steps, so the two jobs cannot drift apart.
    - *schema-fuzz-run-steps
  after_script:
    - *schema-fuzz-after-script
    - |
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -f /tmp/fuzz_deep_started ]; then
        python3 scripts/fuzz_deep_file_issue.py --seed-file /tmp/fuzz_seed || true
      elif [ "$CI_JOB_STATUS" = "failed" ]; then
        echo "backend-schema-fuzz-deep failed before the fuzz ran (setup, the filer self-test, or seed resolution); not filing a schema-fuzz issue."
      fi

# ─── git_lens schema fuzz (#1338) ────────────────────────────────────────────
#
# backend-schema-fuzz runs flag-off, so the git_lens routes (mounted only with
# GIT_LENS_ENABLED) were never fuzzed, and backend-test-git-lens is plain pytest.
# This job is backend-schema-fuzz with the flag on, narrowed to the lens routes:
# same boot, migrate, seed, fuzz token, checks, seed replay and triage output
# (everything is inherited via `extends:`; only the variables and rules differ).
#
#   * Provider calls are stubbed: VISIBAN_GIT_LENS_STUB_PROVIDERS makes
#     git_lens.providers answer every GitHub/GitLab request from an in-process
#     fixture (git_lens/fuzz_stub.py), so GET /git-lens/board/{id}/ runs the real
#     normalize/pivot/cache path with no outbound network and no upstream rate
#     limit. settings.py refuses to start with it set unless DEBUG=True and
#     DEMO_MODE is off, so it cannot be enabled on a production or demo install.
#   * Seeded connection: schemathesis_hooks.py gives the demo board a GitLab
#     LensConnection (null created_by, so the #1331 nullable field is exercised)
#     when git_lens is installed, and maps {board_id} on both lens routes to it.
#     The fuzz user is a plain board member, so PUT/DELETE answer their declared
#     403 and cannot remove it.
#   * Scoped: FUZZ_INCLUDE_PATH_REGEX keeps the run to the lens routes (the rest
#     of the API is backend-schema-fuzz's job), and FUZZ_BASELINE points at a
#     git_lens-only baseline file, so this job neither reads nor writes the
#     shared backend/schemathesis-baseline.json.
#
#   * Never green on an empty selection: `st run` exits 0 when its include
#     regex selects no operation ("No test cases were generated"), so a renamed
#     route prefix or a flag that stopped mounting the app would leave this job
#     passing with nothing fuzzed (the silent-exemption class behind #1331). The
#     job's own script therefore fails before the run unless the served schema
#     has at least one path matching FUZZ_INCLUDE_PATH_REGEX, and after it unless
#     the junit report has at least one test case and the server log shows a
#     2xx and no 404 on both lens reads (connections and board), i.e. every
#     call reached the seeded connection rather than a declared 404.
#
# Measured locally on SQLite (see the MR): 5 operations selected, no failures,
# no "Missing valid test data" warning. 3 operations answer only 403 by design: connection
# PUT/DELETE (board-admin only) and /admin/git-lens/usage/ (site-admin only, out
# of reach for a non-admin token, #1080). The lens fetch budget
# (LENS_FETCH_BUDGET) still applies under the stub, so after 12 cold fetches a
# novel filter answers its declared 429: that is the endpoint's real behavior.
#
# Five operations need far less than the main job's budget; 300 s is still
# time-bound locally. Not on a schedule (no deep variant yet).
backend-schema-fuzz-git-lens:
  # The shared template, not the sharded MR job: a single run, already
  # narrowed to the lens routes by FUZZ_INCLUDE_PATH_REGEX below (#2521).
  extends: .backend-schema-fuzz-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes:
        - backend/git_lens/**/*
        # Where the lens routes are mounted (visiban/urls.py) and any other
        # URLconf, as in backend-schema-fuzz.
        - backend/**/urls.py
        # The lens views reuse these permission chains.
        - backend/**/permissions.py
        - backend/accounts/admin_views.py
        # created_by nests BoardUserSerializer.
        - backend/accounts/serializers.py
        - backend/visiban/settings.py
        - backend/visiban/schema_hooks.py
        - backend/schemathesis_hooks.py
        - backend/schemathesis_surrogates.py
        - backend/schemathesis-baseline-git-lens.json
        - backend/boards/management/commands/seed_demo_data.py
        - backend/boards/management/commands/_seed_history.py
  variables:
    GIT_LENS_ENABLED: "True"
    VISIBAN_GIT_LENS_STUB_PROVIDERS: "True"
    FUZZ_INCLUDE_PATH_REGEX: "git-lens"
    FUZZ_BASELINE: "backend/schemathesis-baseline-git-lens.json"
    FUZZ_MAX_EXAMPLES: "50"
    FUZZ_MAX_TIME: "300"
  # Same steps as backend-schema-fuzz, plus the empty-selection guards described
  # above. Defined here only, so the other two fuzz jobs' scripts are unchanged.
  script:
    - *schema-fuzz-seed-steps
    - |
      python3 - "$FUZZ_INCLUDE_PATH_REGEX" "$VISIBAN_FUZZ_TOKEN_FILE" <<'PYEOF'
      import re, sys, requests
      pattern, token_file = sys.argv[1], sys.argv[2]
      # The schema view requires auth; same token st run uses. raise_for_status so
      # a 401 fails loudly instead of reading as "no paths".
      token = open(token_file).read().strip()
      resp = requests.get("http://localhost:8000/api/schema/?format=json",
                          headers={"Authorization": f"Token {token}"}, timeout=30)
      resp.raise_for_status()
      schema = resp.json()
      hits = sorted(p for p in schema.get("paths", {}) if re.search(pattern, p))
      print(f"FUZZ_INCLUDE_PATH_REGEX={pattern!r} selects {len(hits)} schema path(s): {hits}")
      if not hits:
          sys.exit("No schema path matches; the lens routes are not mounted or were renamed. Refusing to pass with nothing fuzzed (#1338).")
      PYEOF
    - *schema-fuzz-run-steps
    - |
      cases=$(grep -c '<testcase' schemathesis-junit.xml || true)
      echo "schemathesis junit test cases: ${cases}"
      if [ "${cases:-0}" -lt 1 ]; then
        echo "No operation was fuzzed; refusing to pass on an empty run (#1338)."
        exit 1
      fi
      # A test case per operation is not enough: junit writes one even when
      # every call answered a declared 404 (e.g. a renamed route parameter no
      # longer matching schemathesis_hooks.py, so the seeded board is never
      # used). From the server's own access log, both lens reads must have a
      # 2xx AND no 404 at all: with the hook mapping every {board_id} to the
      # seeded board nothing on these two reads can 404, while an unmapped
      # parameter is random and mostly 404s. A 2xx count alone is not enough,
      # because hypothesis generates small integers often enough to hit the
      # seeded board id by chance (seen locally with the mapping broken).
      for route in connections board; do
        ok=$(grep -cE "^HTTP GET /api/v1/git-lens/${route}/[^ ]* 2[0-9][0-9] " schema-fuzz-server.log || true)
        missing=$(grep -cE "^HTTP GET /api/v1/git-lens/${route}/[^ ]* 404 " schema-fuzz-server.log || true)
        echo "GET /api/v1/git-lens/${route}/{board_id}/: ${ok:-0} x 2xx, ${missing:-0} x 404"
        if [ "${ok:-0}" -lt 1 ] || [ "${missing:-0}" -gt 0 ]; then
          echo "The fuzz did not stay on the seeded lens connection for ${route} (#1338): check the {board_id} mapping in backend/schemathesis_hooks.py."
          exit 1
        fi
      done

# ─── Backend mutation testing, weekly (#1384) ───────────────────────────────
#
# Coverage proves a line ran under test; mutation testing proves the suite would
# FAIL if the line were wrong. Ported from TruePPM's `api:mutation` (#4266) /
# `scheduler:mutation` (#2282).
#
# Schedule-only (MUTATION_TEST=true on the Weekly mutation testing schedule,
# 4485984, Sundays 06:00 America/New_York); it cannot
# run on an MR or a main push, its only rule is the schedule rule. Targets: every
# module with a manual baseline in docs/development/mutation-testing.md:
# boards/permissions.py, boards/services/cards.py, the CardMovement class of
# boards/models.py, and boards/views/import_export.py (whole module). The list,
# each target's test files and its shard count live in ONE place,
# backend/mutmut_config.py (TARGETS); `python mutmut_config.py run` maps this
# job's CI_NODE_INDEX to one (target, shard), runs mutmut and exports the shard's
# stats. `parallel:` below must equal the sum of TARGETS' shard counts: the
# driver refuses to run otherwise, and the `mutation-score-selftest` member of `lint-selftests-python` fails the MR
# that lets them drift. Each shard has its own Postgres service, so shards cannot
# collide on test data; a target's mutants are dealt round-robin over its shards
# (sizes differ by at most one). Shard sizes and the per-mutant cost behind them
# are in the doc ("Shard arithmetic"): about 30 min of mutants plus ~5 min setup
# per job (the 2026-10-18 scheduled run showed `cards` and one `import_export`
# shard blowing past 60m at the old 7 / 33 split, so the split was re-derived
# from those measurements: 3 / 16 / 2 / 29 = 50). At most 50 shards (GitLab's
# `needs:` cap for the report; the self-test enforces it). That cap is now fully
# used, so sharding can no longer absorb a hang: mutmut lets one mutant run 10x
# the baseline, and a single timed-out mutant costs minutes no split can remove.
# `timeout: 150m` is therefore headroom for those outliers (~5x the ~30 min
# average shard), not a substitute for sharding. It was 90m until #2111: the
# slowest shard (import_export 36/50) reached 82.1 min on 2026-10-28. It
# deliberately exceeds the
# project's 60 m default job timeout; as of 2026-10-21 no runner caps it (all 7
# project runners have no maximum timeout; SaaS shared runners allow up to 3 h).
#
# LOAD: measured 2026-10-10 (manual play of the schedule): 44 jobs, 1181
# runner-minutes, slowest shard 39.5 min, 1 h 17 min wall clock for the whole
# pipeline. That is too much for the Nightly schedule, so it has its own weekly
# one. Re-measured on the scheduled run of 2026-10-18 (pipeline 2960067085, main
# 6d440fb22): `cards` costs ~65-95 s per mutant in CI, not the ~50 s the shard
# sizes assumed, so 5 shards (4 `cards`, 1 `import_export`) hit `timeout: 60m`
# and the split was redone (50 jobs now). Untagged, the jobs can also land on a
# SaaS runner. No tag pin (none fits; `nuc` is for the load test). See mutation-testing.md "Runner load".
#
# FLOOR: backend-mutation-report fails (exit 1) when the MERGED adjusted score
# over all targets is under MUTATION_MIN (0.90, #1384, chosen by the maintainer
# rather than read off observed nightlies). The report is blocking
# (`allow_failure: false`, #1384); the shards stay `allow_failure: true` because
# the report already judges them: a failed or timed-out shard still lets the
# report run (it needs the shards with `artifacts: true`, no `optional`), and the
# report then exits 2 (not measured) for the missing stats file. Never set the
# floor to 0.
#
# mutmut is pip-installed here, pinned, and stays out of requirements*.txt
# (mutmut 2.x runs pytest in place, so pytest-django needs no changes; 3.x
# copies the tree into a sandbox and does not). A pin bump moves the score, so
# bump it deliberately and re-baseline. `backend-mutation-report` merges the
# shard stats files into the one `mutmut-cicd-stats.json` artifact (30 days).
backend-mutation:
  interruptible: false  # scheduled-only, up to 150 min; a merge must not cancel it (#2421)
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # = sum of TARGETS' shard counts in backend/mutmut_config.py (checked by
  # `mutmut_config.py self-test --ci-file`, run in the mutation-score-selftest member of lint-selftests-python).
  parallel: 50
  timeout: 150m
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $MUTATION_TEST == "true"'
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
      command: *pg_ci_fast_flags
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
    - uv pip install --system --quiet -r backend/requirements-test.txt
    - pip install --quiet "mutmut==2.5.1"
  script:
    - cd backend
    # --self-test here (mutmut is installed) also runs the real-mutmut pragma cases that the
    # lint-stage self-test skips (#1503); a mutmut bump that changes pragma behavior fails loudly.
    - python ../scripts/check_mutation_score.py --self-test
    # Picks the (target, shard) for CI_NODE_INDEX of CI_NODE_TOTAL, runs mutmut on it, and
    # writes mutmut-stats-${CI_NODE_INDEX}.json. Survivors are not a failure here; a run
    # that died is caught by the export (exit 2) or the report (untested mutants, exit 2).
    - python mutmut_config.py run
  artifacts:
    paths:
      - backend/mutmut-stats-*.json
    expire_in: 30 days
    when: always

# Merges the backend-mutation shards per target, then over all targets, prints
# each target's score and the merged one, and writes the single artifact
# `mutmut-cicd-stats.json` (merged counts, `targets` per target). The floor
# gates the MERGED ADJUSTED score (proven-equivalent mutants marked
# `# pragma: no mutate -- <reason>` excluded, #1503); the raw score and every
# target's own score are printed beside it so the exclusions and a weak module
# stay visible. Exit 1 = merged score below MUTATION_MIN; exit 2 = not measured
# (a shard or target missing, inconsistent shards, untested mutants), which is
# never a green. Blocking (#1384): a red report on the weekly schedule is either a
# real score under the floor (exit 1) or a run that was not measured (exit 2).
backend-mutation-report:
  interruptible: false  # scheduled-only; reports on backend-mutation (#2421)
  stage: test
  needs:
    - job: backend-mutation
      artifacts: true
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $MUTATION_TEST == "true"'
  variables:
    # A fraction, not a percentage (`90` is a config error, exit 2); never 0.
    MUTATION_MIN: "0.90"
  script:
    - python3 scripts/check_mutation_score.py --self-test
    - python3 scripts/check_mutation_score.py backend/mutmut-stats-*.json --expect-shards "$(python3 backend/mutmut_config.py expect-shards)" --min "$MUTATION_MIN" --write-merged mutmut-cicd-stats.json
  artifacts:
    paths:
      - mutmut-cicd-stats.json
    expire_in: 30 days
    when: always

# ─── Issue Board Lens (experiment) tests ─────────────────────────────────────
# The git_lens app is only installed when GIT_LENS_ENABLED=true, so its
# integration tests (models, views, RBAC, caching) cannot run in the main
# backend-test job (which runs flag-off, where they skip cleanly). This
# dedicated job enables the flag, verifies the additive migration is complete,
# and runs the full git_lens suite. Mirrors the OIDC conditional-app pattern.
backend-test-git-lens:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # Runs whenever backend-test-coverage runs, not only on git_lens changes.
  # The coverage combine job `needs` this job's data file; if it were absent
  # from the pipeline, every git_lens line would score 0% and the total would
  # drop back below the threshold on branches that touch no git_lens file.
  # `.gitlab-ci.yml` is in the list so a change to this job re-runs it.
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
      command: *pg_ci_fast_flags
    - name: ${DOCKERHUB_MIRROR}/redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    GIT_LENS_ENABLED: "True"
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
    - uv pip install --system --quiet -r backend/requirements-test.txt
  script:
    - cd backend
    - python manage.py makemigrations --check --dry-run git_lens
    # Instrumented, and the data file is published for backend-test-coverage to
    # combine.  git_lens' views/serializers/models are exercised only with
    # GIT_LENS_ENABLED=True. Of the test jobs, only this one sets it (the
    # serializer-ts-parity and backend-schema-fuzz-git-lens jobs set it too, but
    # run no pytest), so an
    # uninstrumented run made ~230 well-tested statements score 0% and pinned
    # the project total to the 88-90% knife edge the gate sits on.
    # accounts/tests/test_demo_mode.py rides along (#1179): its route-table
    # sweep walks whatever URLconf is mounted, and this is the only pytest job
    # where git_lens' routes exist, so without it the demo fence's sweep never
    # covers the lens write endpoints.
    # accounts/tests/test_auth_entry_points.py rides along for the same reason
    # (#1517): it enumerates every mounted view, and among the pytest jobs the
    # lens views exist only here.
    - coverage run --parallel --data-file=.coverage.git-lens -m pytest git_lens/ accounts/tests/test_demo_mode.py accounts/tests/test_auth_entry_points.py -q
  artifacts:
    paths:
      - backend/.coverage.*
    when: always
    expire_in: 1 day

# ─── MCP server tests ────────────────────────────────────────────────────────
# The mcp_server app is only installed and only mounts /mcp when
# MCP_SERVER_ENABLED=true, so its transport/auth/tool tests skip cleanly in the
# main backend-test job (which runs flag-off). This dedicated job enables the
# flag and runs the suite. Mirrors the git_lens conditional-app pattern above.
# ALLOWED_HOSTS must contain the host the tests use, because the MCP transport
# derives its DNS-rebinding allowlist from it.
#
# Runs whenever backend-test-coverage runs, not only on mcp_server changes.
# The coverage combine job `needs` this job's data file; if it were absent
# from the pipeline, every mcp_server line would score 0% and the total would
# drop back below the threshold on branches that touch no mcp_server file.
# `.gitlab-ci.yml` is in the list so a change to this job re-runs it, and
# `docs/api/mcp.md` because a test pins the documented error codes to it.
backend-test-mcp:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
        - docs/api/mcp.md
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
      command: *pg_ci_fast_flags
    - name: ${DOCKERHUB_MIRROR}/redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    MCP_SERVER_ENABLED: "True"
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
    - uv pip install --system --quiet -r backend/requirements-test.txt
  script:
    - cd backend
    # The app ships no models; assert that stays true so a future model addition
    # cannot land without its migration.
    - python manage.py makemigrations --check --dry-run
    # Instrumented, and the data file is published for backend-test-coverage to
    # combine. mcp_server's transport/auth/tools are exercised only with
    # MCP_SERVER_ENABLED=True, which is set here and nowhere else, so an
    # uninstrumented run scored ~400 well-tested statements as 0% and pinned
    # the project total below the 90% gate.
    - coverage run --parallel --data-file=.coverage.mcp -m pytest mcp_server/ -q
  artifacts:
    paths:
      - backend/.coverage.*
    when: always
    expire_in: 1 day

# ─── OIDC smoke test ─────────────────────────────────────────────────────────
#
# End-to-end smoke test for the OIDC authorization code flow.  Exercises:
#   - Discovery endpoint parsing (/.well-known/openid-configuration)
#   - IdP login form submission and code exchange
#   - Visiban callback routing and session creation
#   - Identity claim mapping (email, username) via allauth
#
# Runs a real Keycloak 24 instance as a service.  The realm, client, and test
# user are provisioned by scripts/oidc_provision.py via the Admin REST API so
# no custom Docker image or file mount is needed.
#
# The backend is started with `runserver` in the background (not daphne) so
# that the process exits cleanly when the job ends without a SIGKILL dance.
#
# FRONTEND_URL is pointed at the liveness endpoint so the post-login redirect
# resolves inside the job without needing the React dev server running.
#
# Runs on any change to OIDC-related files. No unconditional main fallback
# (#1266): nothing downstream needs this job, and `changes:` already re-fires
# on main push pipelines when a merge touches these paths — so an unrelated
# merge no longer pays for a Keycloak JVM boot it cannot affect. Doubly worth
# trimming here since that boot is already the slowest, flakiest leg below.
# allow_failure: true — Keycloak boot is slow on the shared small runner and the
# job historically times out far more often than it succeeds, so a red run must
# not block unrelated MRs.  The job is still reported in the pipeline summary.
#
# Debugging note: the 120s readiness budget was too tight for Keycloak's JVM boot
# when sharing a single vCPU with postgres/redis/python.  We raised the wait to
# 240s and enabled CI_DEBUG_SERVICES so the Keycloak container log is captured in
# the trace — this distinguishes a slow boot from a crash/OOM.  If the log shows
# CPU starvation rather than a crash, move this job to saas-linux-medium-amd64.

oidc-smoke:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - changes:
        - backend/accounts/**/*
        - backend/visiban/settings.py
        - scripts/oidc_provision.py
        - scripts/oidc_smoke_test.py
        - oidc/**/*
        - docker-compose.oidc.yml
  allow_failure: true
  services:
    - name: quay.io/keycloak/keycloak:24.0.5
      alias: keycloak
      command: ["start-dev"]
      variables:
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost,127.0.0.1"
    # Capture the Keycloak (and other) service-container logs in the job trace so
    # a boot timeout can be diagnosed as slow-boot vs crash/OOM without guessing.
    CI_DEBUG_SERVICES: "true"
    OIDC_CLIENT_ID: "visiban"
    OIDC_CLIENT_SECRET: "test-oidc-secret"
    OIDC_SERVER_URL: "http://keycloak:8080/realms/visiban-test"
    OIDC_PROVIDER_NAME: "Keycloak"
    # Point post-login redirect back to the liveness endpoint so the full
    # callback flow resolves without needing the frontend running.
    FRONTEND_URL: "http://localhost:8000/api/health/liveness/"
  before_script:
    # Address Keycloak by IPv4 literal.
    #
    # GitLab's service DNS returns both an A record and an IPv6 ULA (fd76::/8),
    # and glibc prefers the IPv6 one. Reached over IPv6, Keycloak classifies the
    # client as *external* — SslRequired.EXTERNAL only recognises IPv4 private
    # ranges as local — and the master realm's default sslRequired=external then
    # refuses plain HTTP outright with
    #   403 {"error":"invalid_request","error_description":"HTTPS required"}
    # on every request. That is what "did not become ready within 240s" has
    # actually been since 2026-08-03: an immediate, consistent 403, not a slow
    # boot. Pinning /etc/hosts does not help — the resolver still returns both
    # records — so the address is substituted into the URLs instead, which also
    # keeps the issuer consistent between the provisioner and Django.
    - |
      KC_IPV4="$(getent ahostsv4 keycloak | awk 'NR==1{print $1}')"
      if [ -z "${KC_IPV4}" ]; then
        echo "ERROR: could not resolve an IPv4 address for the keycloak service" >&2
        exit 1
      fi
      export KEYCLOAK_BASE="http://${KC_IPV4}:8080"
      export OIDC_SERVER_URL="${KEYCLOAK_BASE}/realms/visiban-test"
      echo "keycloak reachable at ${KEYCLOAK_BASE} (IPv4)"
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt requests
    # Provision Keycloak: waits for readiness, then creates realm/client/user.
    # 240s budget — Keycloak's JVM boot routinely exceeds the previous 120s when
    # sharing a single vCPU with postgres/redis/python on the small runner.
    - python scripts/oidc_provision.py --keycloak-url "${KEYCLOAK_BASE}" --wait-timeout 240
    # Run migrations
    - cd backend && python manage.py migrate --noinput
    # Start the backend in the background; give it a few seconds to bind.
    # Server output goes to an artifact, not the job log (#1611), same as
    # backend-schema-fuzz (#1607): per-request access / "Unauthorized:" lines
    # can fill GitLab's 16 MB log cap. after_script tails it on failure.
    - python manage.py runserver 0.0.0.0:8000 > "${CI_PROJECT_DIR}/oidc-smoke-server.log" 2>&1 &
    # Poll the liveness endpoint instead of a fixed sleep — faster on warm
    # runners, reliable on slow ones. Gives up after 30 seconds.
    # Uses python requests (already installed) — no curl in python:3.12-slim.
    - |
      for i in $(seq 1 30); do
        python3 -c "import requests; requests.get('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
  script:
    - python scripts/oidc_smoke_test.py
        --base-url http://localhost:8000
        --username testuser
        --password testpassword
        --expected-email testuser@example.com
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -f oidc-smoke-server.log ]; then
        echo "Last 200 lines of server output (full log: artifact oidc-smoke-server.log, #1611):"
        tail -n 200 oidc-smoke-server.log
      fi
  artifacts:
    paths:
      - oidc-smoke-server.log
    # Server log can carry request bodies in tracebacks; keep it to developers.
    access: developer
    when: always
    expire_in: 1 week

# ─── Helm — lint ─────────────────────────────────────────────────────────────
#
# Validates the Helm chart renders without errors, AND that its values conform
# to helm/visiban/values.schema.json. The schema is the load-bearing half:
# Helm silently accepts a values key no template reads, so before #1116 an
# invented or misspelled key changed nothing on the pod while the operator
# believed it was applied — indistinguishable from the setting having no effect.
#
# Every shipped overlay is linted separately. Linting the defaults alone would
# leave values-dev.yaml and values-prod.yaml uncovered, and the schema is the
# only thing that catches an unused key in them. Each overlay gets the minimum
# extra --set it needs to RENDER, so a schema violation is the only thing that
# can fail here.
#
# The chart has no dependencies (its last subchart, bitnami/postgresql, was
# removed in chart 0.8.0, #1911), so no network access is required. Runs on
# any change to the chart or values. The
# main-branch leg reuses the same `changes: *helm-paths` filter as
# helm-install/helm-netpol below (#1266) rather than an unconditional
# fallback: nothing needs helm-lint, and helm-template is needed only with
# `optional: true`, so neither has to rerun against a main commit that
# provably didn't touch anything they check.

.rules-helm: &rules-helm
  rules:
    # Never in the Sonar nightly (#2471): `changes:` is always true on a
    # schedule pipeline, so without this the default-branch rule below matched.
    - if: '$SONAR_SCHEDULED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &helm-paths
        - helm/**/*
        - scripts/helm-structure-check.sh
        - scripts/helm-install-drill.sh
        - scripts/helm-netpol-drill.sh
        - scripts/drill-image.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths

# helm-template alone also runs when the bundled nginx template changes: its
# structure check compares the chart's frontend security headers against
# nginx/app.conf.template (#1952) and the frontend image's default config
# against the bundled template (#1994), so those files must trigger it. Kept off
# `helm-paths` so the install/netpol drills are not widened.
.rules-helm-template: &rules-helm-template
  rules:
    # Never in the Sonar nightly (#2471): `changes:` is always true on a
    # schedule pipeline, so without this the default-branch rule below matched.
    - if: '$SONAR_SCHEDULED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - helm/**/*
        - scripts/helm-structure-check.sh
        - scripts/tests/helm-structure-check.test.sh
        - scripts/helm-install-drill.sh
        - scripts/helm-netpol-drill.sh
        - nginx/app.conf.template
        - nginx/app-http.conf.template
        - frontend/nginx.default.conf
        - frontend/Dockerfile
        - frontend/Dockerfile.prod
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - helm/**/*
        - scripts/helm-structure-check.sh
        - scripts/tests/helm-structure-check.test.sh
        - scripts/helm-install-drill.sh
        - scripts/helm-netpol-drill.sh
        - nginx/app.conf.template
        - nginx/app-http.conf.template
        - frontend/nginx.default.conf
        - frontend/Dockerfile
        - frontend/Dockerfile.prod
        - .gitlab-ci.yml

helm-lint:
  stage: lint
  image:
    name: ${DOCKERHUB_MIRROR}/alpine/helm:3.16.4
    entrypoint: [""]
  <<: *rules-helm
  variables:
    # Render-time validation in templates/_validate.tpl refuses to render the
    # chart while values.yaml still carries placeholder secrets / hosts. CI
    # supplies these overrides so the chart can be lint+templated against its
    # committed defaults without baking real values into values.yaml.
    HELM_CI_OVERRIDES: >-
      --set-string secret.djangoSecretKey=ci-not-a-real-secret
      --set-string postgresql.auth.password=ci-not-a-real-password
      --set backend.email.backend=console
      --set backend.settings.allowedHosts=ci.visiban.local
  script:
    - helm lint helm/visiban -f helm/visiban/values.yaml $HELM_CI_OVERRIDES
    - helm template visiban helm/visiban -f helm/visiban/values.yaml $HELM_CI_OVERRIDES > /dev/null
    # Overlays (#1116). values-prod.yaml selects the smtp email backend, which
    # _validate.tpl refuses to render without a real From: address.
    - helm lint helm/visiban -f helm/visiban/values-dev.yaml $HELM_CI_OVERRIDES
    - |
      helm lint helm/visiban -f helm/visiban/values-prod.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set-string postgresql.auth.password=ci-not-a-real-password \
        --set backend.settings.allowedHosts=ci.visiban.local \
        --set backend.email.fromAddress=noreply@visiban.local \
        --set backend.email.host=smtp.visiban.local
    # Public demo overlay (#1180). It deliberately ships without its secrets, so
    # the render guards refuse it until they are supplied — exactly what CI
    # supplies here, and nothing else, so the committed file is what is linted.
    - |
      helm lint helm/visiban -f helm/visiban/values-demo.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set-string postgresql.auth.password=ci-not-a-real-password \
        --set-string demo.loginHint.password=ci-visitor-pw-1 \
        --set-string demo.adminPassword=ci-admin-password-1 \
        --set-string demo.memberPassword=ci-member-password-1

# ─── Helm — template (deploy contract) ───────────────────────────────────────
#
# Static deploy-contract gate (#1116). `helm lint` proves the templates PARSE;
# it cannot know whether the rendered manifests still honor the contract a
# deploy depends on. That gap is what let #1038 ship: an OIDC env-var name
# mismatch that silently disabled SSO, a hook-ordering bug that made SECRET_KEY
# rotation impossible, and zero email wiring — all of them rendering green. It
# is also what let #1117 ship: a pre-install migrate hook that could not reach
# the database it was installed alongside.
#
# Two halves, both cluster-free and therefore always-on:
#   kubeconform -strict       every rendered object validates against the real
#                             Kubernetes API schema, unknown fields included
#   helm-structure-check.sh   the runtime contract a refactor can silently break
#                             (migrate placement, secret rotation reaching the
#                             migrating pod, nginx upstream, probe paths,
#                             transport limits, netpol coverage)
#
# The runtime half lives in helm-install and helm-netpol below.

helm-template:
  stage: lint
  image:
    name: ${DOCKERHUB_MIRROR}/alpine/helm:3.16.4
    entrypoint: [""]
  <<: *rules-helm-template
  variables:
    KUBECONFORM_VERSION: "0.6.7"
    # 4.44.3 has a confirmed upstream bug (fixed by 4.53.3): a yq expression of
    # the shape `select(cond) | field // default` run against a multi-document
    # stream emits a result for EVERY document, not just the ones matching
    # `select`, whenever the post-select pipe hits a `//` fallback. This is
    # exactly scripts/helm-structure-check.sh's shape in check_valkey_auth's
    # server_ref/server_cmd queries (section 11b), so under 4.44.3 the single
    # expected secretKeyRef line arrives buried in ~24 extra blank "/" lines —
    # a false-positive FAIL, not a real chart defect (#1211, !1096).
    YQ_VERSION: "4.53.3"
  before_script:
    # python3: scripts/ci-hermetic-run.sh's API canary (#2461).
    - apk add --no-cache bash curl tar findutils grep sed python3
    # Tool downloads fail on HTTP errors (-f) and retry transient ones, and each
    # step is its own script line so errexit stops the job AT the download — a
    # 504 must not save an HTML error page as the binary (#2160).
    - curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
    - tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
    - curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
    - chmod +x /usr/local/bin/yq
  script:
    # Render the way a real deploy is shaped — a pinned tag, NetworkPolicies on
    # (they are off by default, and section 7 of the structure check needs them)
    # and OIDC configured, since the OIDC env block is behind a conditional and
    # is exactly where #1038's blocker 1 lived. The scheduled-job CronJobs
    # (#1157) are off by default, so they are switched on here — otherwise
    # kubeconform never sees templates/cronjobs.yaml render at all.
    - |
      helm template visiban helm/visiban \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set-string postgresql.auth.password=ci-not-a-real-password \
        --set backend.settings.allowedHosts=ci.visiban.local \
        --set backend.email.backend=console \
        --set networkPolicy.enabled=true \
        --set backend.oauth.oidc.serverUrl=https://idp.ci.local/realms/visiban \
        --set scheduledJobs.enabled=true \
        --set scheduledJobs.pruneBoardEvents.enabled=true \
        --set scheduledJobs.pruneNotifications.enabled=true \
        > /tmp/rendered.yaml
    # -ignore-missing-schemas: no CRDs are rendered today, but the flag keeps a
    # future ServiceMonitor/PrometheusRule from turning this into a hard red
    # while every core kind stays validated.
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml
    # Both shipped overlays get the same treatment — a values file that renders
    # an invalid object is a values file nobody can install.
    - |
      helm template visiban helm/visiban -f helm/visiban/values-dev.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set-string postgresql.auth.password=ci-not-a-real-password \
        --set backend.settings.allowedHosts=ci.visiban.local \
        > /tmp/rendered-dev.yaml
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered-dev.yaml
    - |
      helm template visiban helm/visiban -f helm/visiban/values-prod.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set-string postgresql.auth.password=ci-not-a-real-password \
        --set backend.settings.allowedHosts=ci.visiban.local \
        --set backend.email.fromAddress=noreply@visiban.local \
        --set backend.email.host=smtp.visiban.local \
        > /tmp/rendered-prod.yaml
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered-prod.yaml
    # Public demo overlay (#1180): the seed hook Job, the reset CronJob, the demo
    # Secret, the egress NetworkPolicy, the ResourceQuota/LimitRange and the
    # demo `helm test` Pod all only render here. Rendered twice: as shipped, and
    # with the reset off (no CronJob, empty DEMO_RESET_SCHEDULE).
    - |
      for reset in true false; do
        helm template visiban helm/visiban -f helm/visiban/values-demo.yaml \
          --set-string secret.djangoSecretKey=ci-not-a-real-secret \
          --set-string postgresql.auth.password=ci-not-a-real-password \
          --set-string demo.loginHint.password=ci-visitor-pw-1 \
          --set-string demo.adminPassword=ci-admin-password-1 \
          --set-string demo.memberPassword=ci-member-password-1 \
          --set demo.reset.enabled=$reset \
          > /tmp/rendered-demo-$reset.yaml
        kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered-demo-$reset.yaml
      done
    # Self-test FIRST (#1093). This gate's failure mode is a GREEN pipeline over
    # a chart that no longer holds the contract, so "it passed" is not evidence
    # that it can still fail. The fixtures replay the #1038 shapes.
    - bash scripts/helm-structure-check.sh --lint-tmp
    # #2493: the targeted self-test's own section selection (unknown or empty
    # section fails, a section that misses its defect fails) — needs helm+yq,
    # so it runs here rather than in script-tests.
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/helm-structure-check.test.sh  # #2461: poisoned + canary
    - bash scripts/helm-structure-check.sh --self-test helm/visiban
    - bash scripts/helm-structure-check.sh helm/visiban

# ─── Helm — runtime drills (kind) ────────────────────────────────────────────
#
# The half helm-template cannot reach: actually BOOT the chart (#1116).
#
# Both jobs boot the backend and frontend images built from THIS commit and
# side-load them into kind. They deliberately do NOT pull a RELEASED image:
# drilling the HEAD chart against the last release would mean a red here is
# version skew rather than a deploy regression — which is how a drill earns a
# reputation for crying wolf and stops being read.
#
# They also no longer BUILD those images (#2492). Rebuilding both in dind with
# no layer cache cost helm-install ~170 s per run. Instead backend-docker-build
# / frontend-docker-build (kaniko, registry layer cache) push the per-commit
# image to $CI_REGISTRY_IMAGE/ci/<name> and hand its
# digest-pinned reference over in a dotenv report (DRILL_BACKEND_IMAGE /
# DRILL_FRONTEND_IMAGE). scripts/drill-image.sh pulls that digest, asserts the
# image's org.opencontainers.image.revision label equals $CI_COMMIT_SHA and its
# architecture matches the daemon, and FAILS (never rebuilds) if the variable
# is missing in CI — except on a project with no container registry
# (CI_REGISTRY_IMAGE empty, e.g. a fork with it disabled), where the build jobs
# run --no-push and the drill builds locally with a warning. Run locally, the
# scripts still build from the working tree. The build jobs' rules mirror
# these drills' rules, so `needs:` always resolves. helm-upgrade-drill and
# compose-upgrade-drill (#2463) take their HEAD images the same way.
#
# kind needs a Docker daemon, so these two are the only jobs in this file that
# use docker:dind. That is not a reversal of the kaniko decision for image
# builds (which stands, and is about pushing images without privileged mode) —
# there is simply no way to run a Kubernetes cluster in CI without one.
#
# Not `interruptible`: a rebased push must not abort a half-provisioned cluster
# and leak it into the dind daemon.

# Log the drill's dind daemon in to the project registry so it can pull the
# per-commit image (#2492). CI_REGISTRY_PASSWORD is the job's own short-lived
# registry token (read and write access to this project's registry, expires with the
# job); --password-stdin keeps it out of the process list. Skipped where the
# project has no registry (CI_REGISTRY empty): the kaniko jobs then push
# nothing (--no-push) and scripts/drill-image.sh, seeing CI_REGISTRY_IMAGE
# empty, logs a warning and builds the image locally in this dind instead.
.drill-registry-login:
  script:
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      fi

.helm-drill-base: &helm-drill-base
  stage: test
  interruptible: false
  image: ${DOCKERHUB_MIRROR}/docker:27-cli
  services:
    # Explicit name: + alias: (#1198 gate finding): GitLab derives a service's
    # DNS alias from a bare image string (`- docker:27-dind`), but that
    # derivation is not something to lean on once the image string carries a
    # registry prefix — DOCKER_HOST/APISERVER_HOST below hardcode `docker` and
    # a silently-wrong alias hangs the drill until timeout rather than failing
    # loudly.
    - name: ${DOCKERHUB_MIRROR}/docker:27-dind
      alias: docker
      # #1568 / TruePPM !2975: the shared runner host's dockerd defaults new
      # containers to a 1024-nofile soft limit, and kind never raises it, so
      # the whole nested control plane shares one 1024-fd budget. Under
      # concurrent kind-in-dind load kube-proxy crash-loops with "too many
      # open files" and the drill times out. This sets the default on the
      # INNER dockerd (the one kind talks to). Only kind drills need it, so
      # .compose-drill-base is deliberately left alone.
      command: ["--default-ulimit", "nofile=1048576:1048576"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    KIND_VERSION: "0.24.0"
    KUBECTL_VERSION: "1.31.2"
    HELM_VERSION: "3.16.4"
    # Calico is only used by helm-netpol, but it lives HERE on purpose. A
    # job-level `variables:` REPLACES an anchored one rather than merging into
    # it, so giving helm-netpol its own block to hold CALICO_VERSION silently
    # dropped every variable above — the tool URLs became ".../v/kind-linux-amd64",
    # 404'd to a small HTML page, and `tar` failed with "invalid magic" nine
    # seconds in. One shared block is the fix; do not re-split it.
    CALICO_VERSION: "v3.28.2"
    # kind writes a kubeconfig pointing at 127.0.0.1. The API server actually
    # runs inside the dind SERVICE container, which is a different container
    # from this job, so the drills retarget the kubeconfig at this hostname.
    APISERVER_HOST: "docker"
  before_script:
    - apk add --no-cache bash curl
    # Fail loudly on an empty version rather than downloading a 404 page and
    # letting `tar` report "invalid magic" from three commands later.
    - |
      for v in KIND_VERSION KUBECTL_VERSION HELM_VERSION; do
        eval "val=\${$v}"
        [ -n "$val" ] || { echo "ERROR: $v is empty — a variables: merge clobber?"; exit 1; }
      done
    # Fail on HTTP errors, retry transient ones, and keep each step on its own
    # line (no `&&` list, no pipe) so errexit stops the job at the download (#2160).
    - curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64"
    - chmod +x /usr/local/bin/kind
    - curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - chmod +x /usr/local/bin/kubectl
    - curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
    - tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - kind version && kubectl version --client=true 2>/dev/null | head -1 && helm version --short
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 2; done
    - |
      # This dind daemon is a fresh, un-authenticated container per job
      # (#1198) — unlike the runner's own image:/services: pulls, which the
      # runner authenticates to the Dependency Proxy automatically, nothing
      # logs THIS daemon in. Base images, kindest/node, and in-cluster chart
      # images are all pulled here anonymously otherwise.
      # helm-install-drill.sh and helm-netpol-drill.sh rely on this login for
      # every docker pull they do through the proxy.
      #
      # CI_DEPENDENCY_PROXY_SERVER is empty on a project with no working
      # group Dependency Proxy (e.g. a personal-namespace fork — the
      # Dependency Proxy is a group-level-only feature), so this is a no-op
      # there rather than a hard failure; DOCKERHUB_MIRROR's own fallback
      # (see the drill scripts) is what keeps such a fork building at all.
      #
      # --password-stdin, not -p: an argv-visible token is readable from the
      # container's own process list for the life of the command (#1084
      # fixup convention).
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
      fi
    - !reference [.drill-registry-login, script]

helm-install:
  # Boots the chart and asserts it SERVES. ONE `helm install --wait` of the
  # chart's own defaults completes against a cluster with no pre-existing
  # database (#1117's acceptance criterion — this needed a two-phase
  # --no-hooks workaround while the migrate Job was a pre-install hook),
  # `helm test` passes (the same hook operators run), the one-time admin
  # password is retrievable from the shared emptyDir, a placeholder SECRET_KEY
  # is REJECTED (the fail-closed guard is asserted, not assumed), a
  # DJANGO_SECRET_KEY rotation applied in a single `helm upgrade` takes effect
  # AND replaces the pods — #1038 blocker 2 on the path that actually broke —
  # three replicas migrate without deadlocking on the advisory lock, and
  # `helm uninstall` leaves nothing behind. Then the public demo (#1180): a
  # fresh install of values-demo.yaml seeds itself, `helm test` proves the
  # fence (sign-in 200, board create 403 demo_read_only, card move 200), a
  # reset from the CronJob succeeds and the published login survives it.
  # See scripts/helm-install-drill.sh.
  <<: *helm-drill-base
  timeout: 40m
  # No dependency on helm-template: the drill boots its own cluster and does not
  # consume helm-template's output. It used to wait on helm-template (a 5-8 min
  # lint job), which put the two back-to-back on the critical path of every
  # chart change. A chart that fails to render now fails both jobs instead of
  # only helm-template — an acceptable cost for running them concurrently.
  # It DOES need the per-commit images (#2492): see .helm-drill-base.
  needs: &helm-drill-image-needs
    - job: backend-docker-build
      artifacts: true
    - job: frontend-docker-build
      artifacts: true
  rules:
    # Never in the Sonar nightly (#2471): `changes:` is always true on a
    # schedule pipeline, so without this the default-branch rule below matched.
    - if: '$SONAR_SCHEDULED == "true"'
      when: never
    # Advisory on the nightly schedule: a blip on a shared runner pulling Calico
    # manifests or base images is a signal, not a hard red.
    #
    # Excludes the Sonar nightly (#1369): this 40min drill has nothing to do
    # with a coverage-import-only scan, and SONAR_SCHEDULED is meant to run
    # every night — without the exclusion, adding it would turn a weekly-ish
    # cost into a nightly one for zero benefit to either job.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *helm-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths
  script:
    # DRILL_VALKEY_AUTH=1 adds step 9, the authenticated-Valkey install
    # (#1211). Inline, not a job-level `variables:` block, which would replace
    # the shared anchor's variables (see the warning above).
    # DRILL_EXTERNAL_REDIS=1 adds step 10, valkey.enabled=false against a
    # password-protected external Valkey with externalRedis.existingSecret (#1426).
    - DRILL_VALKEY_AUTH=1 DRILL_EXTERNAL_REDIS=1 bash scripts/helm-install-drill.sh

helm-netpol:
  # NetworkPolicy ENFORCEMENT drill. A SEPARATE cluster from helm-install, with
  # disableDefaultCNI + Calico, because kind's default kindnetd DOES NOT
  # IMPLEMENT NetworkPolicy — the chart's policies are admitted there and
  # silently ignored, so a policy selecting the wrong pods passes every other
  # gate in this file. That is exactly how the migrate Job came to be missing
  # from the datastore allow-list (#1116) — that Job is gone as of #1117, but
  # the omission shape it demonstrated outlives it.
  #
  # Separate rather than a flag on helm-install so the common deploy smoke test
  # stays fast and two unrelated failure modes stay uncoupled.
  #
  # Also upgrades to values-demo.yaml and asserts the demo EGRESS policy
  # (#1180): backend and demo-seed pods reach DNS and the datastores and nothing
  # outside the pod network.
  #
  # Scoped to the whole chart, not just networkpolicy.yaml: the policies name
  # their clients by `app.kubernetes.io/component`, so ADDING a template that
  # opens a datastore connection breaks isolation without touching the policy
  # file itself.
  <<: *helm-drill-base
  timeout: 45m
  # See helm-install above.
  needs: *helm-drill-image-needs
  rules:
    # Never in the Sonar nightly (#2471): `changes:` is always true on a
    # schedule pipeline, so without this the default-branch rule below matched.
    - if: '$SONAR_SCHEDULED == "true"'
      when: never
    # Excludes the Sonar nightly (#1369) — see helm-install's identical note
    # above; this is a separate 45min cluster drill with nothing to do with a
    # coverage-import scan.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *helm-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths
  script:
    - bash scripts/helm-netpol-drill.sh

# ─── Compose — production boot drill ─────────────────────────────────────────
#
# The Compose counterpart to helm-install above (#1152). Visiban drilled the
# Helm deploy path and not the docker-compose one, even though
# docker-compose.prod.yml + init-prod.sh is the path
# docs/getting-started/installation.md and docs/administration/upgrade.md
# tell a single-server operator to run — the most-followed deployment path in
# the docs and, until this job, the least-tested one in CI. See
# scripts/prod-compose-drill.sh for what it asserts and why.

.compose-drill-base: &compose-drill-base
  stage: test
  interruptible: false
  image: ${DOCKERHUB_MIRROR}/docker:27-cli
  services:
    # Explicit name: + alias: (#1198 gate finding, same reasoning as
    # .helm-drill-base below) — the daemon must be reachable at exactly the
    # hostname PROBE_HOST defaults to.
    - name: ${DOCKERHUB_MIRROR}/docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache bash curl openssl
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 2; done
    - |
      # See .helm-drill-base's identical block below for the full rationale:
      # this dind daemon is fresh and unauthenticated per job, and every pull
      # scripts/prod-compose-drill.sh does through the Dependency Proxy relies
      # on this login.
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
      fi
    - !reference [.drill-registry-login, script]

compose-prod-drill:
  <<: *compose-drill-base
  timeout: 20m
  # The per-commit Dockerfile.prod images (#2492), pulled by digest and
  # revision-checked by scripts/drill-image.sh instead of rebuilt in dind. This
  # also stops the drill waiting for the whole lint stage (it had no needs:).
  needs:
    - job: backend-docker-build-prod
      artifacts: true
    - job: frontend-docker-build-prod
      artifacts: true
  rules:
    # Never in the Sonar nightly (#2471): `changes:` is always true on a
    # schedule pipeline, so without this the default-branch rule below matched.
    - if: '$SONAR_SCHEDULED == "true"'
      when: never
    # Blocking on MRs and the default branch, advisory on the nightly
    # schedule — the same posture as helm-install/helm-netpol. The drill went
    # green end-to-end on two main push pipelines (2902462814 and 2902655693,
    # 2026-10-01); the schedule leg has not run the job yet (earlier scheduled
    # pipelines predate the drill's merge), so it stays advisory until it
    # does. Note this job's `changes:` includes `.gitlab-ci.yml`, so it now
    # also blocks any MR touching that file — intended, since it is proven.
    #
    # Excludes the Sonar nightly (#1369) — same reasoning as helm-install /
    # helm-netpol: a 20min compose boot drill has nothing to do with a
    # coverage-import scan, and SONAR_SCHEDULED runs every night.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &compose-prod-paths
        - docker-compose.prod.yml
        - init-prod.sh
        - .env.example
        - backend/Dockerfile.prod
        - backend/requirements.lock
        - backend/requirements-build.lock
        - frontend/Dockerfile.prod
        - nginx/**/*
        - scripts/prod-compose-drill.sh
        - scripts/drill-image.sh
        - .gitlab-ci.yml
        # What step 8 (#1364) exercises: login/CSRF/origin handling and the WS gate.
        - backend/accounts/**/*
        - backend/visiban/settings.py
        - backend/visiban/asgi.py
        - backend/boards/consumers.py
        - frontend/index.html
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *compose-prod-paths
  script:
    - bash scripts/prod-compose-drill.sh

# ─── Upgrade drills: last GA release -> HEAD (#2463) ─────────────────────────
#
# The drills above install HEAD on an EMPTY database. These install the latest
# GA tag (resolved by scripts/resolve-last-ga-tag.sh, never hardcoded) from its
# PUBLISHED images, seed it, upgrade to THIS commit's images from the release
# Dockerfiles (the per-commit kaniko images, #2492 — see the build jobs), and
# assert migrate exit 0, seeded counts unchanged, readiness
# and login. See docs/development/upgrade-drills.md.
#
# MRs: only the upgrade surface (migrations, chart, compose, Dockerfiles,
# requirements). main: also any backend change. Nightly: advisory.
compose-upgrade-drill:
  <<: *compose-drill-base
  rules:
    # The Sonar nightly (the older drills exclude it the same way, #2471).
    # `changes:` always evaluates true on schedules, so this must be explicit.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &upgrade-drill-paths
        - .gitlab-ci.yml
        - backend/**/migrations/**/*
        - helm/**/*
        - docker-compose*.yml
        - backend/Dockerfile*
        - frontend/Dockerfile*
        - backend/requirements*.txt
        - backend/requirements*.lock
        - scripts/resolve-last-ga-tag.sh
        - scripts/compose-upgrade-drill.sh
        - scripts/helm-upgrade-drill.sh
        - scripts/upgrade-drill-probe.py
        - scripts/drill-image.sh
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: &upgrade-drill-main-paths
        - .gitlab-ci.yml
        - backend/**/*
        - helm/**/*
        - docker-compose*.yml
        - frontend/Dockerfile*
        - scripts/resolve-last-ga-tag.sh
        - scripts/compose-upgrade-drill.sh
        - scripts/helm-upgrade-drill.sh
        - scripts/upgrade-drill-probe.py
        - scripts/drill-image.sh
  timeout: 30m
  # This commit's backend-docker-build image (release Dockerfile), pulled by
  # digest and revision-checked by scripts/drill-image.sh instead of rebuilt
  # in dind (#2492). The FROM (last GA) image is still pulled from ghcr.io.
  needs:
    - job: backend-docker-build
      artifacts: true
  script:
    # git: the tag resolver and `git archive` of the release's compose file.
    - apk add --no-cache git tar curl
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/resolve-last-ga-tag.sh --self-test
    - bash scripts/compose-upgrade-drill.sh

helm-upgrade-drill:
  <<: *helm-drill-base
  rules:
    # The Sonar nightly (the older drills exclude it the same way, #2471).
    # `changes:` always evaluates true on schedules, so this must be explicit.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *upgrade-drill-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *upgrade-drill-main-paths
  timeout: 40m
  # The HEAD images: this commit's backend-docker-build / frontend-docker-build
  # (release Dockerfiles), same as helm-install (#2492). The FROM (last GA)
  # images are still pulled from ghcr.io.
  needs: *helm-drill-image-needs
  script:
    - apk add --no-cache git tar openssl curl
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/resolve-last-ga-tag.sh --self-test
    - bash scripts/helm-upgrade-drill.sh

# ─── Frontend — lint ──────────────────────────────────────────────────────────

# ESLint + TypeScript type checking in a single job — both need npm ci so
# combining them eliminates a redundant pod spin-up and install cycle.
frontend-lint:
  extends: .npm-cache
  stage: lint
  image: ${DOCKERHUB_MIRROR}/node:22-alpine
  variables:
    # Cap below available RAM so V8 GCs aggressively instead of OOM-killing.
    # 1500 MB caused exit 137 on the 2 GB runner; 512 MB OOMed tsc as the app grew.
    NODE_OPTIONS: "--max-old-space-size=1024"
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # Scope to src/ to avoid scanning build artefacts and reduce memory pressure
    # from eslint loading the full working tree. --max-warnings 15 matches the
    # sast job allowance for pre-existing react-hooks/exhaustive-deps warnings.
    - npm run lint -- src/ --max-warnings 15
    - npx tsc -p tsconfig.app.json --noEmit
    - npx tsc -p tsconfig.e2e.json --noEmit

# The type-aware half of the Sonar-mirroring lint rules (#2527):
# @typescript-eslint/no-floating-promises (typescript:S9383), configured in
# frontend/eslint.typeaware.config.js. Split out of frontend-lint because the
# rule needs the TypeScript program for all of src/ (projectService), and that
# run does not fit frontend-lint's 1024 MB heap cap: with the rule in
# eslint.config.js, `npm run lint` died with "Reached heap limit" under
# --max-old-space-size=1024 (node:22-alpine), and frontend-lint's 1500 MB
# attempt was already OOM-killed (exit 137) on the 2 GB runner. Measured
# 2026-11-22 on its own (node:22-alpine, docker --memory=2g): the smallest
# heap cap that passes is 1408 MB (1344 fails), peak RSS about 1.6 GB, about
# 25 s. 1536 adds about 9% headroom and is still well under the 2 GB limit.
# allow_failure: true until it has passed on the real runners: no runner's
# memory is recorded in docs/maintainers/ci-runners.md, and the frontend-lint
# 1500 MB kill above says the real headroom is smaller than a 2 GB container's.
frontend-lint-typeaware:
  extends: .npm-cache
  stage: lint
  image: ${DOCKERHUB_MIRROR}/node:22-alpine
  variables:
    NODE_OPTIONS: "--max-old-space-size=1536"
  # No unconditional main fallback (#1266): nothing needs this job.
  rules:
    - changes: &frontend-lint-typeaware-paths
        - frontend/src/**/*
        - frontend/eslint*.config.*
        - frontend/package*.json
        - frontend/tsconfig*.json
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *frontend-lint-typeaware-paths
  allow_failure: true
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm run lint:typeaware

# Validates renovate.json (#2464). Its own job, not a frontend-lint step: it runs
# only when renovate.json or this file changes, and on node 24 because
# renovate@44.165.3 declares engines.node ^24.11.0 (frontend-lint is on node 22).
# Fetched with npx so the validator adds no repo dependency; the pin matches the
# `renovate` job's image tag below. --strict fails on warnings too. The re2
# "cannot find module" notice npx prints is harmless: the validator falls back
# to the JS regex engine.
renovate-config-check:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:24-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - renovate.json
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - renovate.json
        - .gitlab-ci.yml
  script:
    - npx --yes --package renovate@44.165.3 renovate-config-validator --strict

# ─── Remaining scripts/tests/*.test.sh (#2117) ────────────────────────────────
#
# check-rbac-coverage.test.sh stayed red for weeks (#2069) because no CI job ran
# it. Every test under scripts/tests/ now runs in a job: most in their own gate's
# job above, the rest here. `check-script-tests-wired.sh` fails when a new test
# file is added without wiring it (or an entry in
# scripts/tests/unwired-allowlist.txt with a reason). wt-list/wt-prune are
# allowlisted: #1648 owns wiring them; wt-forge-timeout runs in the Debian-based
# `script-tests-glibc` job below because it needs glibc/procps process-group
# semantics (#2189).
#
# rules fire on any change under scripts/ (the scripts and their tests), the
# backend/frontend trees some tests read as fixtures, and this file.
script-tests:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &script-tests-paths
        - .gitlab-ci.yml
        - .trivyignore.yaml
        - scripts/**/*
        - .claude/kaizen-yield-state.json
        - .claude/hooks/**/*
        - backend/boards/**/*
        - backend/groups/**/*
        - backend/git_lens/**/*
        - backend/webhooks/**/*
        - frontend/src/hooks/**/*
        - frontend/src/components/Board/BoardView.tsx
        - frontend/src/pages/GroupDetail.tsx
        - frontend/package.json
        - docs/**/*
        - README.md
        - VISIBAN_FEATURES.md
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *script-tests-paths
  before_script:
    - apk add --no-cache bash git python3 py3-yaml jq nodejs npm perl perl-utils coreutils grep gawk patch  # py3-yaml: check-ci-retry.sh
    - git config --global --add safe.directory '*'
    - git config --global user.email ci@example.invalid
    - git config --global user.name ci
  script:
    # #2461: every check and test below runs through scripts/ci-hermetic-run.sh: same
    # protected-variable view (poisoned) on MR and main pipelines, and a loopback API
    # canary that fails the line if the command reached the API with inherited variables.
    - python3 scripts/ci-api-canary.py --self-test
    - bash scripts/tests/ci-hermetic-run.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/check-ci-poison-list.sh --self-test
    - sh scripts/ci-hermetic-run.sh bash scripts/check-ci-poison-list.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/check-ci-retry.sh --self-test
    - sh scripts/ci-hermetic-run.sh bash scripts/check-ci-retry.sh
    - sh scripts/ci-hermetic-run.sh python3 scripts/main-red-guard.py --self-test
    - sh scripts/ci-hermetic-run.sh python3 scripts/main-red-tripwire.py --self-test
    - sh scripts/ci-hermetic-run.sh bash scripts/check-script-tests-wired.sh --self-test
    - sh scripts/ci-hermetic-run.sh bash scripts/check-script-tests-wired.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/ci-poison-env.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/check-broadcast-deferral.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/check-docs-version-accuracy.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/check-gate-selftest-parity.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/check-serializer-ts-parity.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/check-trivyignore-expiry.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/drill-image.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/check-ws-event-reachability.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/close-milestone-issues.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/kaizen_fastpath_proposal.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/kaizen_yield_watch.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/npm-audit-gate.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/osv-severity-gate.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/pre-tool-safety.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/post-edit-checks.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/resolve-docs-version.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/wt-doctor-drift.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/ci-interruptible.test.sh
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/refresh_test_durations.test.sh
    # Upgrade-drill and PG-matrix helpers (#2463).
    - sh scripts/ci-hermetic-run.sh bash scripts/resolve-last-ga-tag.sh --self-test
    - sh scripts/ci-hermetic-run.sh bash scripts/pg-matrix-check.sh --self-test
    # Runs the canary itself (own listener, poison env).
    - bash scripts/tests/ci-api-canary.test.sh
  allow_failure: false

# wt-forge-timeout.test.sh needs glibc/Debian userland (perl alarm and process-group
# behavior differ under Alpine/busybox, so script-tests above cannot run it). It
# also exercises scripts/wt without an origin/HEAD ref, which is how Debian's
# git (no followRemoteHEAD) leaves a fresh clone's remote (#2189). Fires only on
# the script under test, its test, and this file.
script-tests-glibc:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &script-tests-glibc-paths
        - .gitlab-ci.yml
        - scripts/wt
        - scripts/tests/wt-forge-timeout.test.sh
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *script-tests-glibc-paths
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bash git perl procps
    - git config --global --add safe.directory '*'
    - git config --global user.email ci@example.invalid
    - git config --global user.name ci
  script:
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/wt-forge-timeout.test.sh  # #2461
  allow_failure: false

# Stale version claims in the docs are silent misinformation (#1083): a
# "Coming in 1.1" line after 1.1 shipped, or an RC banner surviving a GA tag.
# Scans README.md, VISIBAN_FEATURES.md and docs/**, reads the current version
# from frontend/package.json (the file scripts/release.sh rewrites), and on a
# tag pipeline also asserts the tag equals that version. Runs on MRs, main
# and tags so a bad release is caught at tag time, not by a user.
docs-version-accuracy:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache bash grep
  script:
    - bash scripts/check-docs-version-accuracy.sh --self-test
    - bash scripts/check-docs-version-accuracy.sh

# ─── Frontend — test ──────────────────────────────────────────────────────────

frontend-test:
  extends: .npm-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:22-alpine
  variables:
    # Match frontend-lint: cap below available RAM so V8 GCs before OOM-kill.
    NODE_OPTIONS: "--max-old-space-size=512"
  rules:
    - changes:
        - frontend/**/*
        - backend/boards/tests/fixtures/filter_state_keys.json
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml --coverage
  coverage: '/All files\s+\|\s+(\d+(?:\.\d+)?)\s+\|/'
  artifacts:
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/cobertura-coverage.xml
      # LCOV for SonarCloud's JS importer (#1370); consumed by sonar:scan.
      - frontend/coverage/lcov.info
    when: always

# ─── Serializer <-> TypeScript interface parity ──────────────────────────────
#
# CLAUDE.md requires Board/Card/User and related interfaces to match the backend
# serializer fields exactly. Nothing enforced it, and the failure is silent in
# both directions: a serializer field with no TypeScript field is data the SPA
# simply cannot see, and a field whose *type* drifts type-checks cleanly on both
# sides while the client reads the wrong shape (#1079).
#
# This job regenerates the OpenAPI schema with drf-spectacular — the same command
# backend-schema-validate runs, and the same reason it needs no database — and
# diffs its components against frontend/src/types/index.ts.
#
# Python, not Node, despite sitting among the frontend jobs: #1079 originally
# asked for TypeScript types generated from openapi.json, but both viable
# generators failed the dependency gate (openapi-typescript announced EOL on
# 2026-09-19; @hey-api/openapi-ts requires Node >= 22.18, which no image here
# provides, and pins a js-yaml carrying three unfixed CVSS-7.5 advisories).
# Diffing the two representations catches the same drift with no npm dependency
# at all. It stays in this position in the file so the frontend-facing gates read
# together.
#
# Known mismatches are recorded in the script's SUPPRESSIONS table, each citing a
# filed issue and each self-invalidating: a suppression whose recorded drift no
# longer matches reality fails the job and asks to be deleted, so it cannot
# outlive its reason.
serializer-ts-parity:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - changes: &serializer-ts-parity-paths
        - backend/**/*
        - frontend/src/types/index.ts
        - scripts/check-serializer-ts-parity.py
        - scripts/_paths.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *serializer-ts-parity-paths
  variables:
    # Schema generation only introspects serializers — Django never opens a
    # connection — so a syntactically valid DATABASE_URL is all this needs.
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@localhost:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://localhost:6379/0"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    # git_lens is conditionally installed; LensConnection is in COMPONENT_MAP
    # (#1338), so its serializer must be in the schema. generate_schema() in the
    # script forces this too, so a local run matches; set here to be explicit.
    GIT_LENS_ENABLED: "True"
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
  script:
    # Self-test FIRST (#1093). This gate's failure mode is a GREEN pipeline over
    # a drifted contract, so prove the detection logic still fires before
    # trusting the real run's verdict. Offline, no database, no network.
    - python3 scripts/check-serializer-ts-parity.py --self-test
    - python3 scripts/check-serializer-ts-parity.py
  allow_failure: false

# Diff coverage (MR only) — #1076. Same rationale as the diff gate in
# backend-test-coverage above (#2497 folded the backend one into that job): vitest.config.ts's aggregate thresholds (lines: 70, etc.) measure
# the whole frontend and can absorb an untested new component. This job
# reuses frontend-test's existing cobertura-coverage.xml — diff-cover reads
# Cobertura XML natively, so no new vitest reporter (e.g. lcov) is needed.
#
# src/test/ is already excluded from the coverage report itself (see
# vitest.config.ts's coverage.exclude), so those files never appear as
# "uncovered" here; the --exclude below is belt-and-suspenders per #1076's
# acceptance criteria and guards against a future reporter config change.
#
# Threshold starts at 80% of changed lines, blocking. Same escape hatch as
# the backend job — see docs/development/testing.md#diff-coverage-escape-hatch.
frontend-diff-coverage:
  stage: test
  needs: [frontend-test]
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - backend/boards/tests/fixtures/filter_state_keys.json
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - !reference [.pip-floor, script]
    - pip install --quiet diff-cover
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
    # Deepen the MR head too: with more branch commits than GIT_DEPTH the shallow head never reaches the fetched base ("no merge base")
    - git fetch origin "$CI_COMMIT_SHA" --depth=100
  script:
    - diff-cover frontend/coverage/cobertura-coverage.xml
        --compare-branch=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        --fail-under=80
        --show-uncovered
        --exclude "frontend/src/test/*" "frontend/src/**/*.test.*" "frontend/src/**/*.spec.*"

# Guards a blind spot in diff-cover that both jobs above share (#1091, follow-up
# to #1076): a brand-new source file with zero tests never appears as a row in
# coverage.xml / cobertura-coverage.xml at all, so diff-cover finds nothing to
# score for it and reports 100% — the inverse of what should happen. This is
# the per-MR counterpart to #1090 (an uninstrumented CI job reading as 0% in
# the aggregate) — same root cause, unmeasured code scored as if it were fine.
#
# Reuses the coverage.xml / cobertura-coverage.xml artifacts produced above
# rather than re-running any tests. `optional: true` on both `needs` entries
# means this job still runs (and still fails loudly, see the script's own
# "report not found" branch) even if only one of backend/frontend changed —
# but in practice a newly *added* file under backend/ or frontend/src/ always
# triggers its own coverage job via the `changes:` rules on
# backend-test-coverage / frontend-test, so both stay in lockstep with this
# job's own `changes:` list.
added-files-coverage-check:
  stage: test
  needs:
    - job: backend-test-coverage
      artifacts: true
      optional: true
    - job: frontend-test
      artifacts: true
      optional: true
  image: ${DOCKERHUB_MIRROR}/node:22-alpine
  # when: always (#2497): backend-test-coverage now also enforces the diff
  # gate, so it fails when only that gate fails, and a needs: job is otherwise
  # skipped after a failed need. This check must still run then (it used to);
  # the coverage reports are uploaded when: always and the script's own
  # "report not found" branch still fails loudly if one is missing.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - frontend/**/*
        - .gitlab-ci.yml
        - scripts/check-added-files-covered.mjs
      when: always
  before_script:
    - apk add --no-cache git
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
    # Deepen the MR head too: with more branch commits than GIT_DEPTH the shallow head never reaches the fetched base ("no merge base")
    - git fetch origin "$CI_COMMIT_SHA" --depth=100
  script:
    - node scripts/check-added-files-covered.mjs
        --target-ref origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        --no-fetch

# Self-test for added-files-coverage-check, per the house rule in #1093 (not
# yet standardized elsewhere — this is the first gate to adopt it): a bespoke
# gate script's detection logic must be provable in its own job, on the same
# image as the real check, so a shared-job skip can't silently take both down
# together. Builds its own synthetic git repo + coverage fixtures in a temp
# dir; touches nothing in this repository and needs no network or database —
# see check-added-files-covered.mjs's `selfTest()`.
added-files-coverage-check-self-test:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/check-added-files-covered.mjs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - scripts/check-added-files-covered.mjs
  before_script:
    - apk add --no-cache git
  script:
    - node scripts/check-added-files-covered.mjs --self-test

# ─── Frontend — E2E (Playwright) ─────────────────────────────────────────────
#
# Runs the Playwright suite against a production build served by `vite preview`
# (#2485) using the official
# Microsoft Playwright Docker image (browsers pre-installed, no download step).
# API calls are intercepted by page.route() so no backend is required.
#
# Blocking (allow_failure: false) as of #2392: the redesigned-board
# toHaveScreenshot baseline (frontend/e2e/board-redesign.spec.ts, Linux
# snapshots generated in this Playwright image, #2279) ran green on main
# (pipelines 3089246220 at 02b8a8645 and 3089564588 at 5820139f2) before the
# flip. A red job here now blocks the MR; release-main-pipeline-guard already
# counted it as a failure either way.
#
# Uses workers: 2 (via playwright.config.ts). Serving the prebuilt bundle with
# `vite preview` instead of the dev server (~400 MB) frees the memory for a
# second Chromium (~500 MB each) within the 2 GB runner budget. The build runs
# as its own script step so a build failure is attributed clearly and its time
# is visible; VITE_API_URL is baked in at build time because preview cannot
# inject it (all API calls are mocked via page.route()).

playwright-e2e:
  stage: test
  needs: []
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  allow_failure: false
  # No unconditional main fallback (#1266) — nothing needs this job, and it's
  # one of the more expensive ones to run needlessly (browser image pull +
  # full e2e suite).
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - VITE_API_URL=http://localhost:8000 npm run build
    - npx playwright test --output=test-results
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    reports:
      junit: frontend/test-results/junit.xml
    expire_in: 7 days

# ─── WebSocket event reachability (#1078) ────────────────────────────────────
#
# Reconciles the three places a WebSocket event name lives — emitted (the
# registries in backend/boards/broadcast.py and backend/groups/broadcast.py),
# documented (docs/api/websockets.md), handled (BoardView.tsx / GroupDetail.tsx
# and the two socket hooks) — and fails when any name is missing from one of
# them. CLAUDE.md declares the {event, data} board_* schema a public 1.0+
# contract; until this job nothing enforced it, so a name could be added to two
# of the three and look complete from every angle.
#
# Ported from the same defect class TruePPM found in its beta-readiness audit:
# a shipped alert queried a metric name the app never emitted, so the alert
# could never fire and the panel was permanently blank — while both docs pages
# had the correct name. Nothing compared the three.
#
# Pure stdlib Python and no database, so it runs on the plain python image with
# no install step. The --self-test invocation runs FIRST and on the same image:
# a bespoke gate whose detectors have silently stopped detecting is worse than
# no gate, because the green tick still reads as a verdict (#1093).
ws-event-reachability:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &ws-event-reachability-paths
        - backend/boards/**/*
        - backend/groups/**/*
        - backend/git_lens/**/*
        - frontend/src/hooks/**/*
        - frontend/src/components/Board/BoardView.tsx
        - frontend/src/pages/GroupDetail.tsx
        - docs/api/websockets.md
        - scripts/check-ws-event-reachability.py
        - scripts/_paths.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *ws-event-reachability-paths
  script:
    # Prove the detection logic fires against known-bad input before trusting
    # this job's verdict on the real tree.
    - python scripts/check-ws-event-reachability.py --self-test
    - python scripts/check-ws-event-reachability.py
  allow_failure: false

# ─── RBAC coverage (#1143) ────────────────────────────────────────────────────
#
# The deterministic half of the `rbac-check` agent gate. Three of that agent's
# six questions are mechanical — is there an authentication gate, is the caller's
# role resolved through the shared resolver, and does every write action apply a
# minimum-role check — and this asserts all three over the board/group-scoped
# view modules by AST. The other three (is this the *right* minimum role, group
# inheritance correctness, cross-board isolation beyond the mechanical lookup
# case) still need the agent, which is why this script has a distinct exit code
# for a view it cannot classify rather than a silent pass.
#
# Same conversion as #1078, #1092 and #1093: an agent round-trip per MR costs
# latency and tokens and leaves no record, while a script under a second leaves
# its misses visible as code.
#
# Pure stdlib Python, no database, no Django import — so it runs on the plain
# python image with no install step. The --self-test invocation runs FIRST and on
# the same image (#1093).
rbac-coverage:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &rbac-coverage-paths
        - backend/boards/views/**/*
        - backend/boards/models.py
        - backend/boards/permissions.py
        - backend/boards/serializers.py
        - backend/groups/views.py
        - backend/git_lens/views.py
        - backend/webhooks/views.py
        - scripts/check-rbac-coverage.py
        - scripts/_paths.py
        - scripts/tests/check-rbac-coverage.test.sh
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *rbac-coverage-paths
  script:
    # Prove the detection logic fires against known-bad input before trusting
    # this job's verdict on the real tree.
    # Shared path-containment helper (#1377) used by every gate script's CLI
    # file sinks; its self-test covers `..` traversal and symlink escape.
    - python scripts/_paths.py --self-test
    - python scripts/check-rbac-coverage.py --self-test
    # Exit 3 is "unhandled pattern — hand it to the rbac-check agent". It is a
    # failure, deliberately: a view whose authorization this script cannot read
    # must not be reported as one it checked and approved.
    - |
      set +e
      python scripts/check-rbac-coverage.py
      rc=$?
      set -e
      if [ "$rc" -eq 3 ]; then
        echo ""
        echo "FAILED (exit 3): one or more views could not be classified statically."
        echo "Run the rbac-check agent on each DEFER above, then either fix the gap"
        echo "or record its review in AGENT_REVIEWED in scripts/check-rbac-coverage.py."
        echo "See docs/development/rbac-and-broadcast-gates.md."
      fi
      [ "$rc" -eq 0 ] || exit "$rc"
    # Exit codes, CLI surface and detectors against the real view tree (#2069).
    # --self-test uses a synthetic tree, so only this notices when a real view's
    # shape drifts away from what the detectors expect. Runs after the real scan
    # so that a real missing gate is reported by handler, not as a count of
    # failed test cases.
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/check-rbac-coverage.test.sh  # #2461: poisoned + canary
  allow_failure: false

# ─── Broadcast deferral (#1143) ───────────────────────────────────────────────
#
# The deterministic half of the `broadcast-check` agent gate: every write on a
# board/group-scoped view reaches a broadcast, every raw broadcast sits inside a
# transaction.on_commit() callable, no commit hook holds an ORM row it read from
# the enclosing scope, and no emit call sits in a loop over rows of one channel.
#
# Event *naming* and the emitted/documented/handled three-way match belong to
# ws-event-reachability (#1078) and are deliberately not re-checked here. The
# per-recipient field-leak question stays with the agent — it needs to know
# which serializer fields a role may see.
#
# Same image and self-test-first discipline as rbac-coverage above.
broadcast-deferral:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &broadcast-deferral-paths
        - backend/boards/**/*
        - backend/groups/**/*
        - backend/git_lens/**/*
        - backend/webhooks/**/*
        - scripts/check-broadcast-deferral.py
        - scripts/check-rbac-coverage.py
        - scripts/_paths.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *broadcast-deferral-paths
  script:
    - python scripts/check-broadcast-deferral.py --self-test
    - |
      set +e
      python scripts/check-broadcast-deferral.py
      rc=$?
      set -e
      if [ "$rc" -eq 3 ]; then
        echo ""
        echo "FAILED (exit 3): one or more broadcasts could not be classified statically."
        echo "Run the broadcast-check agent on each DEFER above, then either fix the"
        echo "gap or record its review in AGENT_REVIEWED in"
        echo "scripts/check-broadcast-deferral.py."
        echo "See docs/development/rbac-and-broadcast-gates.md."
      fi
      exit $rc
  allow_failure: false

# ─── Changelog check (MR only) ────────────────────────────────────────────────
#
# Fails when no changelog fragment was added and the MR contains changes that
# warrant a changelog entry. Each MR drops a file in changelog.d/ instead of
# editing CHANGELOG.md directly — this eliminates merge conflicts.
#
# Fragment naming: <issue-or-slug>.<type>.md  (e.g. 434.fixed.md)
# Valid types: added, changed, fixed, security
#
# Auto-skips for MRs that only touch:
#   - CI/CD config (.gitlab-ci.yml, .gitlab/)
#   - Documentation (docs/, *.md other than changelog fragments, README*)
#   - Developer tooling (CLAUDE.md, .gitignore, scripts/, Makefile, *.sh)
#   - Test files only (frontend/src/test/, backend/*/tests/)
# To skip manually for a legitimate edge case, add the ~no-changelog label.

changelog-check:
  extends: .on-mr
  stage: lint
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  before_script:
    - apk add --no-cache git
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
    # Deepen the MR head too: with more branch commits than GIT_DEPTH the shallow head never reaches the fetched base ("no merge base")
    - git fetch origin "$CI_COMMIT_SHA" --depth=100
    - BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD || echo "")
    - |
      if [ -z "$BASE" ]; then
        echo "INFO — could not determine merge base; skipping changelog check."
        exit 0
      fi
    - |
      # Skip if the MR carries the no-changelog label
      if echo "$CI_MERGE_REQUEST_LABELS" | tr ',' '\n' | grep -qx 'no-changelog'; then
        echo "INFO — 'no-changelog' label present; skipping."
        exit 0
      fi
    - CHANGED=$(git diff --name-only $BASE HEAD)
    - |
      # Strip files that never need a changelog entry
      MEANINGFUL=$(echo "$CHANGED" | grep -Ev \
        '^\.gitlab(-ci\.yml|/)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(docs/|README|CLAUDE\.md|\.gitignore|Makefile|scripts/|mkdocs\.yml)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '\.(md|sh)$' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(frontend/src/test/|frontend/e2e/|backend/.*/tests/)' \
        || true)
      if [ -z "$MEANINGFUL" ]; then
        echo "INFO — only non-product files changed; skipping changelog check."
        exit 0
      fi
    - |
      # Accept either a changelog fragment OR a direct CHANGELOG.md edit
      # (the latter supports in-flight MRs during the transition period).
      HAS_FRAGMENT=$(echo "$CHANGED" | grep -c '^changelog\.d/.*\.\(added\|changed\|fixed\|security\)\.md$' || true)
      HAS_CHANGELOG=$(echo "$CHANGED" | grep -c 'CHANGELOG.md' || true)
      if [ "$HAS_FRAGMENT" -gt 0 ]; then
        echo "OK — changelog fragment found."
      elif [ "$HAS_CHANGELOG" -gt 0 ]; then
        echo "OK — CHANGELOG.md updated directly (legacy mode)."
      else
        echo "ERROR — No changelog fragment found." >&2
        echo "" >&2
        echo "  Add a file to changelog.d/ named: <issue-or-slug>.<type>.md" >&2
        echo "  Valid types: added, changed, fixed, security" >&2
        echo "  Example:  echo 'Description of change (#123)' > changelog.d/123.fixed.md" >&2
        echo "" >&2
        echo "  Or apply the ~no-changelog label if this MR genuinely needs no entry." >&2
        exit 1
      fi

# ─── Suppression marker check (main + schedule, not MR-only) ─────────────────
#
# #1092: a suppression (pytest skip/xfail, eslint-disable, coverage omit) is
# added for a reason that's true *today* and nothing ever revisits it — see
# #1090, where git_lens read as 0% covered for months because a job was
# uninstrumented and nothing flagged that the number had stopped meaning
# anything.
#
# Convention: a suppression waiting on tracked work (as opposed to being
# permanently intentional) carries a SUPPRESSED-UNTIL(#N) marker naming the
# issue that would remove it. This job greps for the marker, looks up each
# cited issue via the GitLab API, and fails — naming file, line, and issue —
# if any cited issue is already closed. See scripts/check-suppression-issues.sh,
# scripts/lib/gitlab-issues.sh, and docs/development/suppressions.md for the
# full contract. #1812: the same script also scans the nightly load-test
# baseline (backend/nightly-load-test-baseline.json) for `pending_budget:
# "#NNNN"` entries (budget null, measured but not gated) and fails, naming the
# endpoint and issue, when the cited issue is closed. Unit-tested in scripts/tests/check-suppression-issues.test.sh
# and scripts/tests/gitlab-issues.test.sh, both run here.
#
# Deliberately NOT MR-only: the triggering event is "an issue closed", not
# "a commit landed" on the branch that added the marker. That commit may have
# merged long before the cited issue closes, so an MR-only job would never
# fire again after merge. Also runs on MR for early feedback when a marker is
# added citing an issue that is already closed at authoring time.
#
# --self-test runs immediately before the real invocation, on the same
# image, per #1093's meta-gate (every bespoke CI gate must carry a self-test
# or main goes red when that gate lands).
#
# #1694: the script and its shared lib are bash (array-based batching of
# every cited issue into one GitLab API call), not the `sh` this job used to
# run them with — hence `bash` here and `apk add bash curl jq` (jq parses
# the batched issues response; this job previously only needed curl, sent
# directly on alpine's /bin/sh, with no jq dependency at all).
suppressions-check:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache bash curl jq python3  # python3: the ci-hermetic-run.sh canary
  script:
    # The tests run poisoned (#2461); the real check-suppression-issues.sh run below is
    # NOT wrapped, so it still reads the real API with the job's real variables.
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/gitlab-issues.test.sh  # #2461: poisoned + canary
    - sh scripts/ci-hermetic-run.sh bash scripts/tests/check-suppression-issues.test.sh  # #2461: poisoned + canary
    - bash scripts/check-suppression-issues.sh --self-test
    - bash scripts/check-suppression-issues.sh

# ─── Kaizen yield watch (scheduled, report-only by default) ──────────────────
#
# #1144: /kaizen (#1094) only ran when someone remembered to. This job folds
# newly merged MRs' `## Gates` ledgers into a running per-(gate, diff-shape)
# zero-finding streak (state: .claude/kaizen-yield-state.json) and reports
# any pair at the /kaizen threshold (10 consecutive 0-finding runs). It never
# edits CLAUDE.md or the fast-path table. Report-only unless the schedule sets
# KAIZEN_FILE_ISSUES=true AND a KAIZEN_API_TOKEN variable (opt-in; files at
# most one issue per candidate). Fails open: never blocks anything. Opt-in
# schedule variable KAIZEN_YIELD_WATCH=true, set on the consolidated Nightly
# schedule (#1383): daily is more often than it needs, but it is one small job
# in a pipeline that runs anyway, where a separate weekly schedule would spawn
# a whole extra full pipeline just for this report.
# See docs/development/kaizen-yield-watch.md.
kaizen-yield-watch:
  interruptible: false  # files GitLab issues (#2419)
  retry: 0  # files GitLab issues; a retry would duplicate them (#2462)
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $KAIZEN_YIELD_WATCH == "true"'
  script:
    - python3 scripts/kaizen_yield_watch.py --self-test
    - |
      if [ "$KAIZEN_FILE_ISSUES" = "true" ]; then
        python3 scripts/kaizen_yield_watch.py --write-state kaizen-yield-state.json --file-issues
      else
        python3 scripts/kaizen_yield_watch.py --write-state kaizen-yield-state.json
      fi
    # #1145: the fast-path table proposer reads this job's state; its table lives
    # outside the repo, so CI only proves it still fires (it is run by hand).
    # Last, so a proposer regression cannot stop the watch itself from running.
    - python3 scripts/kaizen_fastpath_proposal.py --self-test
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - kaizen-yield-state.json

# ─── Renovate (#2464) ─────────────────────────────────────────────────────────
#
# Self-hosted Renovate opens the dependency-bump MRs that the scanners
# (backend-dep-scan, frontend-dep-scan, dep-scan-osv, trivy-scan) only report.
# Inert unless ALL hold: the pipeline is the Nightly schedule (the one that
# sets CVE_SCAN=true, like check-release-attestations; never the load-test or
# mutation schedules) AND the masked/protected RENOVATE_TOKEN variable exists.
# Without the token (forks, a fresh install, every MR pipeline) the job is
# simply not created. Renovate never automerges:
# policy lives in renovate.json. Setup: docs/maintainers/renovate.md.
# pip bumps also regenerate backend/requirements.lock via postUpgradeTasks (#2482).
# Keep the image tag in step with the renovate-config-validator pin in
# renovate-config-check.
renovate:
  stage: deploy
  needs: []
  interruptible: false  # opens branches and MRs on GitLab
  image:
    name: ${DOCKERHUB_MIRROR}/renovate/renovate:44.165.3
    entrypoint: [""]
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true" && $RENOVATE_TOKEN'
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: ${CI_API_V4_URL}
    RENOVATE_REPOSITORIES: ${CI_PROJECT_PATH}
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate-bot@visiban.invalid>"
    # postUpgradeTasks run arbitrary repo code inside this job, so the allowlist
    # is one anchored regex for exactly the lock script, never a wildcard (#2482).
    # Must match the command in renovate.json.
    RENOVATE_ALLOWED_COMMANDS: '["^sh scripts/lock-backend-requirements\\.sh$"]'
  script:
    # The lock script needs uv at the version pinned in scripts/uv-requirements.txt
    # (hash-checked, same as backend-lock-check). The image ships neither uv nor pip
    # until containerbase's install-tool provides a Python; pip then installs uv into
    # that Python's bin dir, which is not on PATH by default.
    # Non-fatal: a failed bootstrap must not stop the npm/Docker/Helm bumps; only
    # pip MRs then need a manual lock. The 3.12.12 pin is maintained by hand
    # (Renovate does not bump it). Braces, not a subshell, so the PATH export sticks.
    - |
      { install-tool python 3.12.12 \
        && pip install --quiet --require-hashes -r scripts/uv-requirements.txt \
        && export PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH" \
        && uv --version; } || echo "WARNING: uv bootstrap failed; Renovate pip MRs will need a manual lock (docs/maintainers/renovate.md)"
    - renovate --token "$RENOVATE_TOKEN"

# ─── Security (MR only) ───────────────────────────────────────────────────────
#
# Security jobs run only on MR pipelines — they are the gate before merging
# and do not need to run on every WIP commit.

# bandit: Python SAST for security issues — shell injection, hardcoded
# credentials, use of random instead of secrets, SQL injection patterns, etc.
# Runs at medium severity (-ll) so only Medium/High findings block the merge.
# Skips migration files (auto-generated, safe to ignore) and test files
# (test utilities like mock tokens are intentionally insecure-looking).
backend-sast:
  extends: .pip-cache
  stage: security
  # Reads source only, not test output — runs alongside `test` instead of
  # waiting for the whole stage (including the 40-45min helm drills) to
  # finish first.
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*.py
        - clients/**/*.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*.py
        - clients/**/*.py
  before_script:
    - !reference [.pip-floor, script]
    - pip install --quiet bandit
  script:
    # Single scan: write JSON artifact, then print a readable summary and exit
    # with bandit's own exit code. bandit does not support two simultaneous
    # output formats, so we parse the JSON to produce log output instead of
    # running a second full scan.
    # Use && ... || ... to capture the exit code safely under set -e.
    - |
      bandit -r backend/ clients/python/ \
        --severity-level medium \
        --confidence-level medium \
        --exclude backend/boards/migrations,backend/groups/migrations,backend/accounts/migrations,backend/visiban/migrations \
        --skip B101 \
        -f json -o bandit-report.json && BANDIT_EXIT=0 || BANDIT_EXIT=$?
      python3 - <<'PY'
      import json
      d = json.load(open("bandit-report.json"))
      results = d.get("results", [])
      metrics = d.get("metrics", {}).get("_totals", {})
      print(f"bandit: {metrics.get('loc', '?')} lines scanned, {len(results)} issue(s)")
      for r in results:
          print(f"  [{r['issue_severity']}/{r['issue_confidence']}] {r['test_id']} {r['issue_text']}")
          print(f"    {r['filename']}:{r['line_number']}")
      PY
      exit $BANDIT_EXIT
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - bandit-report.json

# eslint-plugin-security: JS/TS SAST for injection, prototype pollution,
# non-literal regexp/require, and other common frontend security issues.
# Runs as a dedicated security job (separate from style linting) so failures
# are clearly security-attributed. Blocking (#1071): ESLint exits non-zero only
# for rules set to 'error' below (the high-confidence ones); the noisy
# detect-object-injection / timing-attack rules are 'warn' and never fail the
# job. A finding that is a genuine false positive is suppressed inline with
# `// eslint-disable-next-line security/<rule> -- <reason>` (see the
# suppression-marker convention in CLAUDE.md).
frontend-sast:
  extends: .npm-cache
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/src/**/*.{ts,tsx}
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/src/**/*.{ts,tsx}
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # ESLint v9 uses flat config and removed --no-eslintrc.  Write a temporary
    # flat config *inside the frontend dir* so bare-specifier imports resolve
    # against the local node_modules.  --no-config-lookup prevents the project's
    # eslint.config.js from being merged in, keeping this job focused only on
    # the security rules below.
    # detect-object-injection is set to warn: it fires on common TypeScript
    # bracket-access patterns and produces many false positives in React code.
    - |
      cat > eslint-security.config.mjs <<'ESLINTEOF'
      import security from 'eslint-plugin-security';
      import tsParser from '@typescript-eslint/parser';
      import reactHooks from 'eslint-plugin-react-hooks';
      import reactRefresh from 'eslint-plugin-react-refresh';
      import tseslint from 'typescript-eslint';
      import jsxA11y from 'eslint-plugin-jsx-a11y';
      import unicorn from 'eslint-plugin-unicorn';
      const rules = { 'security/detect-object-injection': 'warn', 'security/detect-non-literal-regexp': 'error', 'security/detect-non-literal-require': 'error', 'security/detect-possible-timing-attacks': 'warn', 'security/detect-eval-with-expression': 'error' };
      // Register react-hooks, react-refresh, jsx-a11y, unicorn, and @typescript-eslint plugins so that
      // eslint-disable-next-line comments referencing their rules are recognised as
      // valid (prevents "Definition for rule X was not found" errors).  No rules from
      // these plugins are enabled — only security/ rules are enforced here.
      const linterOptions = { reportUnusedDisableDirectives: 'off' };
      export default [
        { files: ['**/*.{ts,tsx}'], languageOptions: { parser: tsParser }, linterOptions, plugins: { security, 'react-hooks': reactHooks, 'react-refresh': reactRefresh, '@typescript-eslint': tseslint.plugin, 'jsx-a11y': jsxA11y, unicorn }, rules },
        { files: ['**/*.{js,mjs,jsx}'], linterOptions, plugins: { security }, rules },
      ];
      ESLINTEOF
      npx eslint --no-config-lookup --config eslint-security.config.mjs src/
  allow_failure: false

# eslint-plugin-security for clients/typescript (#1178): same rule set and
# severities as frontend-sast above ('error' rules block; the noisy
# detect-object-injection / timing-attack rules warn). The package carries its
# own eslint.config.js because it has its own dependencies; `npm run lint` also
# runs the recommended TypeScript rules.
clients-typescript-sast:
  stage: security
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:20-alpine  # stays on 20 on purpose: clients/typescript documents Node >=20.3 as its floor (#2374)
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm-clients-ts"
      files: [clients/typescript/package-lock.json]
    paths: [.npm/]
    policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - clients/typescript/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - clients/typescript/**/*
  script:
    - cd clients/typescript
    - npm ci --prefer-offline --ignore-scripts
    - npm run lint
  allow_failure: false

# pip-audit: checks Python packages against the OSV vulnerability database.
# On MRs: only when a backend requirements file, backend/osv-scanner.toml or
# scripts/pip-audit-gate.py changes; allow_failure so a new CVE in an
# existing dep doesn't block unrelated MRs.
# On the Nightly schedule (CVE_SCAN=true, #1383): always runs; allow_failure:
# false so the pipeline fails and GitLab sends a failure email to maintainers.
backend-dep-scan:
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/requirements.txt
        - backend/requirements.lock
        - backend/requirements-build.lock
        - backend/osv-scanner.toml
        - scripts/pip-audit-gate.py
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
      allow_failure: false
  before_script:
    - !reference [.pip-floor, script]
    - pip install --quiet pip-audit
  script:
    # Audit the hash-pinned lock (#1378): it is exactly what the images install,
    # transitive deps included. --require-hashes makes pip-audit trust the pins
    # instead of re-resolving them.
    #
    # Bare `pip-audit` ignores backend/osv-scanner.toml, so an accepted advisory
    # with no fix (twisted, #1688) red-walled the nightly run. Gate its JSON
    # through scripts/pip-audit-gate.py, which honors the expiring accepted risks
    # in that file (same source of truth as dep-scan-osv, #1685) and matches each
    # vuln's id and aliases.
    - python3 scripts/pip-audit-gate.py --self-test
    - pip-audit --require-hashes -r backend/requirements.lock --format json -o pip-audit-report.json || true
    - python3 scripts/pip-audit-gate.py pip-audit-report.json backend/osv-scanner.toml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pip-audit-report.json

# npm audit: flag HIGH or CRITICAL CVEs in frontend npm dependencies.
# Same MR / schedule split as backend-dep-scan above.
frontend-dep-scan:
  extends: .npm-cache
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/package-lock.json
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
      allow_failure: false
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # `npm audit` has no ignore list, so gate its JSON through
    # scripts/npm-audit-gate.mjs, which honors the expiring accepted risks in
    # frontend/osv-scanner.toml (same source of truth as dep-scan-osv, #1415).
    - node ../scripts/npm-audit-gate.mjs --self-test
    - npm audit --json > ../npm-audit-report.json || true
    - node ../scripts/npm-audit-gate.mjs ../npm-audit-report.json osv-scanner.toml
  after_script:
    - cd frontend && npm audit --json > ../npm-audit-report.json 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - npm-audit-report.json

# License compliance — flag GPL-2.0/GPL-3.0 dependencies that are incompatible
# with the project's Apache 2.0 license. Non-blocking so it warns but doesn't
# gate merges.

backend-license-check:
  extends: [.on-mr, .pip-cache]
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  before_script:
    - !reference [.pip-floor, script]
    - pip install --quiet -r backend/requirements.txt pip-licenses
  script:
    - pip-licenses --format=plain --fail-on="GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2)"
  allow_failure: true

frontend-license-check:
  extends: [.on-mr, .npm-cache]
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:22-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx license-checker --failOn "GPL-2.0;GPL-3.0" --summary
  allow_failure: true

# trivy: filesystem scan of the repository for known-vulnerable declared
# dependencies, IaC misconfigurations in Dockerfiles, and committed secrets.
#
# Why trivy in addition to pip-audit / npm audit:
#   - --scanners vuln,config,secret covers CVEs in the lockfiles, IaC issues
#     (Dockerfile without USER, ADD instead of COPY, ...) and secrets in one
#     pass. It scans the repo filesystem only: it does NOT inspect the OS
#     packages inside built base images (that needs an image scan).
#   - The Helm chart is rendered with helm/ci/trivy-values.yaml (--helm-values)
#     and its rendered templates are scanned for misconfigurations (#1536).
#     Without that file the chart's render guards reject the placeholder
#     values and trivy logs "Skipping chart" and scans nothing, so the job
#     fails if that line ever reappears. Scanned: the default render plus
#     NetworkPolicies, scheduled-job CronJobs, OIDC env and SMTP env. NOT
#     scanned: public demo mode (a different render shape) and values-*.yaml
#     overlays. (The chart has no subchart tarballs since 0.8.0, #1911.)
#
# Runs on an MR that changes a Dockerfile, a dependency lockfile, the Helm
# chart, or the scan's own inputs (this job, .trivyignore.yaml and the expiry
# script), and on the Nightly schedule (CVE_SCAN=true, #1383, #1267). There is
# deliberately no unconditional main rule: a newly disclosed CVE against an
# unchanged pinned dependency or base image is a time-based concern, so it is
# caught by the schedule (same drift-detection pattern as backend-dep-scan and
# frontend-dep-scan), not by every push to main.
#
# BLOCKING (#1072): HIGH/CRITICAL vuln, config and secret findings fail the
# job (--exit-code 1, no allow_failure). The scanner BINARY is pinned by
# digest, so it only changes in a reviewed commit; bump the version and digest
# together. (The tag was already pinned to a version before #1072; the digest
# closes the mutable-tag gap.) The data it scans against is NOT pinned: the
# vulnerability DB and the misconfiguration checks bundle (a floating
# mirror.gcr.io/aquasec/trivy-checks tag) are downloaded at scan time, so a
# newly published CVE or check can turn the job red on an unchanged tree —
# that is the point of the gate. --skip-check-update with a vendored bundle
# would be a possible later hardening; it is deliberately not used here.
# Accepted risks live in .trivyignore.yaml with an expiry date and an issue
# link; scripts/check-trivyignore-expiry.sh fails the job once an entry
# expires (trivy alone just stops honoring it).
trivy-scan:
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image:
    # 0.74.0 — pinned by multi-arch index digest, not a tag.
    name: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/Dockerfile
        - backend/Dockerfile.prod
        - frontend/Dockerfile
        - frontend/Dockerfile.prod
        - backend/requirements.txt
        - backend/requirements.lock
        - backend/requirements-build.lock
        - frontend/package-lock.json
        - clients/typescript/package-lock.json
        - helm/**/*
        - .gitlab-ci.yml
        - .trivyignore.yaml
        - scripts/check-trivyignore-expiry.sh
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
      allow_failure: false
  script:
    # Prove the expiry gate still fires, then enforce it on the real file.
    - sh scripts/check-trivyignore-expiry.sh --self-test
    - sh scripts/check-trivyignore-expiry.sh .trivyignore.yaml
    # Full report first (non-blocking, all scanners, for the artifact), so it
    # is produced even when the blocking pass below fails the job.
    - trivy fs .
        --scanners vuln,config,secret
        --severity HIGH,CRITICAL
        --helm-values helm/ci/trivy-values.yaml
        --ignorefile .trivyignore.yaml
        --exit-code 0
        --format json
        --output trivy-report.json
        2> trivy-stderr.log || { cat trivy-stderr.log; exit 1; }
    - cat trivy-stderr.log
    # A skipped chart is a silent coverage loss (#1536). Two independent checks
    # so a reworded trivy log line cannot hide it: the report must contain a
    # result for the rendered chart templates, and the skip warning must be
    # absent. (grep, not jq: the trivy image is minimal.)
    - |
      if ! grep -q '"Target": "helm/visiban/templates/' trivy-report.json; then
        echo "trivy-report.json has no result for helm/visiban/templates/; the chart was not scanned (see issue 1536)"
        exit 1
      fi
    - |
      if grep -q "Skipping chart" trivy-stderr.log; then
        echo "trivy skipped the Helm chart; fix helm/ci/trivy-values.yaml (see issue 1536)"
        exit 1
      fi
    # Blocking pass: any unsuppressed HIGH/CRITICAL fails the job.
    - trivy fs .
        --scanners vuln,config,secret
        --severity HIGH,CRITICAL
        --helm-values helm/ci/trivy-values.yaml
        --ignorefile .trivyignore.yaml
        --exit-code 1
        --format table
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-report.json

# OSV-Scanner: unified Python + npm dependency vulnerability scan using the
# OSV.dev advisory database (PyPA, GitHub Advisory, and 20+ ecosystem feeds).
# Complements pip-audit and npm audit with first-party OSV data, which has
# lower false-positive rates than NVD.
#
# Runs unconditionally on every MR and on main — no `changes:` filter. OSV
# advisories are database-driven: a HIGH can be published against a version
# already sitting in a committed, unchanged lockfile, so a changes-gated rule
# would only ever catch it after it lands on main. The job is a few seconds of
# static-binary download plus a fast scan, so running it on every pipeline is
# cheap. Also runs on the Nightly schedule (OSV_SCAN=true, #1383) for the same
# reason pip-audit / npm-audit do: to catch a freshly-published advisory
# against dependencies nobody touched today either. (The main-branch rule
# already matches a schedule targeting main; the OSV_SCAN rule states the
# intent and keeps schedule-config-check asserting the schedule exists.)
#
# Severity gate: OSV-Scanner has no native severity threshold (confirmed on
# v2.3.5 — no --severity / --fail-on / --audit-level flag), so it exits
# non-zero on ANY non-ignored advisory. scripts/osv-severity-gate.sh
# classifies the JSON output and FAILS only on HIGH/CRITICAL (blocks the
# pipeline); MEDIUM/LOW/unscored WARN (exit 2, mapped to allow_failure below —
# visible in the pipeline as a yellow warning, but non-blocking). Accepted
# risks are suppressed via an osv-scanner.toml next to the relevant lockfile
# (auto-discovered — do not pass --config, which would force a single global
# file), with a documented, expiring IgnoredVulns entry — same escape-hatch
# shape as migration-check's `# concurrency-exempt:` comment. See
# scripts/osv-severity-gate.sh for the full exit-code contract; it is
# unit-tested in scripts/tests/osv-severity-gate.test.sh.
#
# Runs on alpine + a pinned binary download rather than the distroless
# ghcr.io/google/osv-scanner image: the severity gate needs a shell and jq,
# which the distroless image doesn't have. Matches the gitleaks-scan /
# trivy-scan jobs' pinned-binary approach.
dep-scan-osv:
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OSV_SCAN == "true"'
  allow_failure:
    exit_codes:
      - 2
  before_script:
    - apk add --no-cache curl jq
    - curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.3.5/osv-scanner_linux_amd64"
    - chmod +x /usr/local/bin/osv-scanner
  script:
    # Write JSON report first (osv-scanner exits non-zero on any finding; the
    # severity verdict is delegated entirely to the gate script below).
    - osv-scanner scan source
        --lockfile backend/requirements.txt
        --lockfile frontend/package-lock.json
        --lockfile clients/typescript/package-lock.json
        --format json
        --output-file osv-report.json
        || true
    # Self-test immediately before the real invocation, same image (#1093) —
    # proves the severity classifier still fires before trusting its verdict.
    - sh scripts/osv-severity-gate.sh --self-test
    - sh scripts/osv-severity-gate.sh osv-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - osv-report.json

# gitleaks: full working-tree secret scan using the upstream default ruleset.
# Complements the GitLab secret-detection component included at the top of
# this file (different implementation and ruleset), and — unlike it — is not
# limited to what a diff-scoped analyzer sees: `gitleaks dir .` scans every
# file in the checkout, unconditionally, since a secret can land in any file.
# Scoped, documented allowlist for genuine false positives (npm lockfile
# integrity hashes, API doc examples, test fixtures) lives in .gitleaks.toml.
# Pinned static binary, matching the osv/trivy jobs.
#
# Also wired as a local pre-commit hook (scripts/gitleaks-precommit.sh, via
# scripts/setup-hooks.sh) so a secret is caught before it is even committed.
# That hook matters here specifically: per the workflow rules above, a branch
# with no open MR gets zero CI, so a secret pushed to such a branch would
# otherwise go unscanned by anything in this file until an MR is opened.
gitleaks-scan:
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache curl
    - curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - chmod +x /usr/local/bin/gitleaks
  script:
    - gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

# gitleaks-history (#1071): the same pinned gitleaks and .gitleaks.toml as
# gitleaks-scan, but `gitleaks git` walks every commit, not just the checkout.
# A secret that was committed and later "removed" is still retrievable from the
# public GitHub and enterprise mirrors, so main must prove its whole history is
# clean. Main only: a full-history scan on every MR is slow and would re-report
# the same findings forever; MRs get the cheap per-commit scan gitleaks-commits
# instead. GIT_DEPTH 0 because GitLab's default shallow clone would hide
# everything older than the fetch depth.
#
# The walk is pinned to the pipeline commit's ancestry (--log-opts="$CI_COMMIT_SHA")
# because `gitleaks git` otherwise runs `git log --all`. Some runners reuse their
# build dir, so refs fetched by OTHER pipelines (unmerged branches) persist in the
# clone and would be scanned too, making the result depend on runner placement (#1612).
gitleaks-history:
  stage: security
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.20
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
  before_script:
    - apk add --no-cache curl git
    - curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - chmod +x /usr/local/bin/gitleaks
  script:
    # Fail closed on a shallow clone: GIT_DEPTH 0 should give full history, but a
    # runner-level override would silently turn this into a partial scan that
    # still reports green. A guard (rather than GIT_STRATEGY: clone) keeps the
    # fast fetch and makes the misconfiguration loud.
    - |
      if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
        echo "ERROR: shallow clone; gitleaks-history needs full history (GIT_DEPTH 0)." >&2
        exit 1
      fi
    - gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1 --log-opts="$CI_COMMIT_SHA"
  allow_failure: false

# gitleaks-commits (#1612): the per-commit merge gate. gitleaks-scan only sees the
# final tree, so a secret that an MR adds in one commit and removes or annotates
# (`# gitleaks:allow`) in a later one passes it, yet — with merge_method=merge —
# every commit enters main's history and the public mirrors. This scans exactly
# the commits the MR adds (merge-base..HEAD) with the same pinned gitleaks and
# .gitleaks.toml. GIT_DEPTH 0 so the diff base is present; the guards fail closed
# rather than scan nothing and report green. If merged-results/merge-train pipelines
# are ever enabled, CI_COMMIT_SHA becomes the merge commit and the range also walks
# target-branch commits: that widens the scan but keeps it correct.
gitleaks-commits:
  stage: security
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.20
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache curl git
    - curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - chmod +x /usr/local/bin/gitleaks
  script:
    - |
      if [ -z "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        echo "ERROR: CI_MERGE_REQUEST_DIFF_BASE_SHA is empty; cannot scope the commit scan." >&2
        exit 1
      fi
      if ! git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}"; then
        echo "ERROR: diff base $CI_MERGE_REQUEST_DIFF_BASE_SHA is not in the clone (GIT_DEPTH 0 expected); refusing to scan nothing." >&2
        exit 1
      fi
    - gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1 --log-opts="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
  allow_failure: false

# ─── Nightly SonarCloud scan (#1369, part of the #1368 quality epic) ─────────
#
# There is no SonarCloud job in this file today — the dashboard only refreshes
# when someone runs `sonar-scanner` by hand, so it is stale and never carries
# coverage. Mirrors TruePPM's `sonar:scan` (trueppm/.gitlab-ci.yml).
#
# Trigger: ONLY the dedicated nightly schedule (SONAR_SCHEDULED == "true"),
# never MR or push pipelines, so day-to-day pipeline latency is unchanged.
# SonarCloud does not run tests; it imports the coverage reports the `test`
# stage already produces via the `sonar.*.reportPaths` in
# sonar-project.properties.
#
# `needs:` backend-test-coverage and frontend-test with `artifacts: true` so
# their reports land in this job's workspace. Both already run on every
# scheduled pipeline (their rules fall back to `$CI_COMMIT_BRANCH ==
# $CI_DEFAULT_BRANCH`, which is true for any schedule targeting main, Sonar's
# included) — no rule change needed on either job. stage: security keeps this
# job after `test` (a job cannot `needs:` a later-stage job).
#
# allow_failure: true so a Sonar/network hiccup never turns the nightly red.
# Failure visibility: this job is NOT wired to any alert — a red run is only
# visible by looking at the schedule's pipeline history or the SonarCloud
# dashboard itself (no new analysis for that day). That is a known, accepted
# gap for this first cut; #1382 owns writing it up in the maintainer runbook.
#
# Coverage import (#1370): sonar-project.properties points
# `sonar.python.coverage.reportPaths` / `sonar.javascript.lcov.reportPaths` at
# the rewritten reports that scripts/sonar-scan.sh --prep-only generates from
# the two producer artifacts. A missing report only warns, so a single failed
# producer (e.g. an allow_failure coverage job) still lets the rest of the
# import proceed instead of aborting the whole scan.
sonar:scan:
  interruptible: false  # uploads an analysis to SonarCloud; scheduled-only (#2419)
  stage: security
  image: ${DOCKERHUB_MIRROR}/sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
  needs:
    - job: backend-test-coverage
      artifacts: true
    - job: frontend-test
      artifacts: true
  variables:
    # Full history so SonarCloud's new-code detection and SCM blame are
    # accurate (the default shallow clone makes Sonar warn and skip blame
    # attribution).
    GIT_DEPTH: "0"
    # Keep the analysis cache inside the workspace so it can be cached below.
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  cache:
    key: sonar-scanner
    paths:
      - .sonar/cache
  script:
    # Rewrite both coverage reports so their file paths resolve from the repo
    # root (backend <source> root, frontend `SF:src/` -> `SF:frontend/src/`).
    # The rewrites live in scripts/sonar-scan.sh so CI and a developer's local
    # scan share one implementation; it is POSIX sh because this image has no
    # bash. A missing report only warns, so one failed producer still lets the
    # other import proceed.
    - sh scripts/sonar-scan.sh --prep-only
    # SONAR_TOKEN (masked, protected CI/CD variable) and SONAR_HOST_URL
    # (defaults to sonarcloud.io) are read from the environment by
    # sonar-scanner automatically. Don't block on the quality-gate compute
    # task — this is a dashboard refresh, not a merge gate.
    - sonar-scanner -Dsonar.qualitygate.wait=false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED == "true"'
  allow_failure: true

# Online half of the Sonar exclusion guard (#1425). the lint:sonar-exclusions member of lint-selftests-alpine stays
# hermetic on MRs; this sibling runs in the nightly schedule, the one context with
# a SONAR_TOKEN, and asks SonarCloud whether every ignore-criterion ruleKey is
# still ACTIVE in the project's quality profile (a deactivated or renamed rule
# otherwise leaves a suppression that excuses nothing). The script fails open on
# a missing token, network error or unparseable response (warning, exit 0), so
# only a genuinely inactive rule turns this yellow. allow_failure matches
# sonar:scan: advisory, never blocks the schedule.
sonar:rules-check:
  stage: security
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  before_script:
    - apk add --no-cache bash git grep sed jq curl
  script:
    - bash scripts/check-sonar-exclusions.sh --online
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED == "true"'
  allow_failure: true

# ─── Build verification + per-commit drill images ────────────────────────────
#
# Verify the Docker images build, and publish the per-commit build for the
# drills that boot it (#2492). Uses kaniko instead of Docker-in-Docker — no
# privileged mode needed, works out of the box on Kubernetes runners.
#
# Each job pushes to a CI-ONLY path, $CI_REGISTRY_IMAGE/ci/<name>, never to a
# release path: nothing outside this pipeline's drills consumes it,
# and the release push jobs (.kaniko-push-common) still build from scratch with
# no cache, so a ci/ image or cache layer can never reach a published image.
# Registry push over a --tar-path artifact because the backend image is several
# hundred MB per pipeline as an artifact, while the registry deduplicates
# layers across pipelines and is what kaniko's layer cache needs anyway. The
# push uses the job's own CI_REGISTRY_* token (a fork MR pipeline runs in the
# fork and pushes to the FORK's registry). Cleanup of ci/ tags and the cache
# repo: docs/maintainers/ci-runners.md "Per-commit drill images".
#
# The digest kaniko pushed is handed to the drill as a dotenv report
# (DRILL_*_IMAGE=<repo>@sha256:...), so the drill pulls exactly these bytes;
# the revision label (org.opencontainers.image.revision=$CI_COMMIT_SHA) lets it
# prove they came from its own commit. Because the drill pins the DIGEST, the
# tag is only a handle: it is the branch slug, not the SHA, so each branch
# overwrites one tag instead of minting one per commit. The superseded
# manifest goes untagged and the registry's own garbage collection reclaims
# it; a per-SHA tag would instead be retained by the cleanup policy for 90
# days (keep_n 10 / older_than 90d, docs/administration/container-image-retention.md).
#
# Layer cache (--cache-repo .../ci/cache/<name>): a helm-only or CI-only change
# reuses every layer, so the build is mostly pull-and-push of cached layers.
#
# Rules: each build job must exist whenever a drill that needs it exists, or
# the pipeline fails to create. So each job's rules are the UNION of its old
# MR-time verification rule and its drills' rules, in the drills' order. Keep
# them in step with helm-install / helm-netpol / compose-prod-drill /
# compose-upgrade-drill / helm-upgrade-drill (including whatever #2471 does to
# the drills' schedule legs). backend-docker-build feeds helm-install,
# helm-netpol, helm-upgrade-drill and compose-upgrade-drill (which upgrades to
# the release Dockerfile's image, not Dockerfile.prod); frontend-docker-build
# feeds the three helm drills; the -prod pair feeds compose-prod-drill only.
#
# No resource_group and needs: [] (#2492). They used to share the project-wide
# `kaniko-build` resource_group and wait for the lint stage, to keep kaniko off
# runners busy with lint. Now the drills wait on these jobs, and a project-wide
# resource_group serializes kaniko across EVERY concurrent pipeline, which
# would queue each drill behind other MRs' image builds. On DRILL pipelines net
# RAM pressure goes down: each drill used to run two uncached `docker build`s
# inside its own dind (up to nine concurrent builds with all five drills). On
# non-drill (backend-only / frontend-only) MRs it goes the other way: kaniko
# now starts at t=0 alongside lint and the test shards. Not redesigned here;
# the first MR pipeline's shard timings are the check on that.
#
# --cache-ttl=24h: the Dockerfiles run unpinned `apt-get install`, so a layer
# cached for kaniko's default 14 days could differ from the uncached release
# build. 24h bounds that drift.

.kaniko-ci-image:
  stage: test
  needs: []
  # Pushes the ci/ image and layer cache to the registry: an external side
  # effect, so it must not be auto-canceled mid-push (#2419 rule above).
  # Cost, accepted: these jobs used to be interruptible at MR time, so a
  # superseded push now runs its kaniko builds (~1-2 min) to completion.
  # Drill interruptibility is tracked in #2495.
  interruptible: false
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      # Auths: the project registry (push the ci/ image and its layer cache),
      # the Dependency Proxy (the Dockerfile's FROM resolves through
      # DOCKERHUB_MIRROR via --build-arg BASE_REGISTRY, #1198), and
      # DOCKERHUB_USERNAME/TOKEN as a fallback in case a FROM line is ever
      # pointed back at docker.io directly. CI_DEPENDENCY_PROXY_SERVER is empty
      # on a project with no working group Dependency Proxy (e.g. a
      # personal-namespace fork), and CI_REGISTRY on a project with its
      # container registry disabled, hence the guards.
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS=""
      add_auth() { [ -n "$AUTHS" ] && AUTHS="${AUTHS},"; AUTHS="${AUTHS}\"$1\":{\"auth\":\"$(b64 "$2" "$3")\"}"; }
      if [ -n "${CI_REGISTRY:-}" ]; then
        add_auth "${CI_REGISTRY}" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}"
      fi
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        add_auth "${CI_DEPENDENCY_PROXY_SERVER}" "${CI_DEPENDENCY_PROXY_USER}" "${CI_DEPENDENCY_PROXY_PASSWORD}"
      fi
      if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        add_auth "https://index.docker.io/v1/" "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}"
      fi
      printf '{"auths":{%s}}' "${AUTHS}" > /kaniko/.docker/config.json
  script:
    - |
      set -eu
      if [ -z "${CI_REGISTRY_IMAGE:-}" ]; then
        # No container registry on this project (e.g. a fork with it
        # disabled): GitLab leaves CI_REGISTRY_IMAGE undefined, so there is
        # nowhere to push. Keep the build verification (as before #2492) and
        # hand over no image; scripts/drill-image.sh then builds locally in
        # the drill's dind, which it allows in CI ONLY in this case.
        echo "NOTE: CI_REGISTRY_IMAGE is empty (no container registry on this project): building ${CI_IMAGE_NAME} with --no-push and writing no dotenv; the drills fall back to a local dind build."
        # shellcheck disable=SC2086 — CI_IMAGE_EXTRA_ARGS is a word list on purpose.
        /kaniko/executor \
          --context="${CI_IMAGE_CONTEXT}" \
          --dockerfile="${CI_IMAGE_DOCKERFILE}" \
          --no-push \
          --snapshot-mode=redo \
          --build-arg "BASE_REGISTRY=${DOCKERHUB_MIRROR:-docker.io/library}" \
          ${CI_IMAGE_EXTRA_ARGS:-}
        exit 0
      fi
      REPO="${CI_REGISTRY_IMAGE}/ci/${CI_IMAGE_NAME}"
      # shellcheck disable=SC2086 — CI_IMAGE_EXTRA_ARGS is a word list on purpose.
      /kaniko/executor \
        --context="${CI_IMAGE_CONTEXT}" \
        --dockerfile="${CI_IMAGE_DOCKERFILE}" \
        --destination="${REPO}:${CI_COMMIT_REF_SLUG}" \
        --cache=true \
        --cache-ttl=24h \
        --cache-repo="${CI_REGISTRY_IMAGE}/ci/cache/${CI_IMAGE_NAME}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --digest-file="${CI_PROJECT_DIR}/ci-image.digest" \
        --snapshot-mode=redo \
        --build-arg "BASE_REGISTRY=${DOCKERHUB_MIRROR:-docker.io/library}" \
        ${CI_IMAGE_EXTRA_ARGS:-}
      DIGEST="$(cat "${CI_PROJECT_DIR}/ci-image.digest")"
      case "$DIGEST" in
        sha256:????????????????????????????????????????????????????????????????) ;;
        *) echo "ERROR: kaniko wrote no usable digest ('$DIGEST')"; exit 1 ;;
      esac
      echo "${CI_IMAGE_DOTENV_VAR}=${REPO}@${DIGEST}" | tee "${CI_PROJECT_DIR}/ci-image.env"
  artifacts:
    reports:
      dotenv: ci-image.env
    expire_in: 1 day

backend-docker-build:
  extends: .kaniko-ci-image
  variables:
    CI_IMAGE_NAME: backend
    CI_IMAGE_CONTEXT: backend
    CI_IMAGE_DOCKERFILE: backend/Dockerfile
    CI_IMAGE_DOTENV_VAR: DRILL_BACKEND_IMAGE
  rules:
    # Drills' schedule leg (advisory there, like the drills themselves).
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    # MR-time build verification, as before #2492.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - backend/Dockerfile
    # helm-install / helm-netpol need this image.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *helm-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths
    # compose-upgrade-drill / helm-upgrade-drill need this image too.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *upgrade-drill-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *upgrade-drill-main-paths

frontend-docker-build:
  extends: .kaniko-ci-image
  variables:
    CI_IMAGE_NAME: frontend
    CI_IMAGE_CONTEXT: frontend
    CI_IMAGE_DOCKERFILE: frontend/Dockerfile
    CI_IMAGE_DOTENV_VAR: DRILL_FRONTEND_IMAGE
    CI_IMAGE_EXTRA_ARGS: "--build-arg NODE_OPTIONS=--max-old-space-size=2048"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
    # helm-install / helm-netpol / helm-upgrade-drill need this image.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *helm-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *upgrade-drill-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *upgrade-drill-main-paths

# Dockerfile.prod images for compose-prod-drill only. Same build args the drill
# used for its in-dind build (BASE_REGISTRY only). Rules mirror the drill's.
backend-docker-build-prod:
  extends: .kaniko-ci-image
  variables:
    CI_IMAGE_NAME: backend-prod
    CI_IMAGE_CONTEXT: backend
    CI_IMAGE_DOCKERFILE: backend/Dockerfile.prod
    CI_IMAGE_DOTENV_VAR: DRILL_BACKEND_PROD_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *compose-prod-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *compose-prod-paths

frontend-docker-build-prod:
  extends: .kaniko-ci-image
  variables:
    CI_IMAGE_NAME: frontend-prod
    CI_IMAGE_CONTEXT: frontend
    CI_IMAGE_DOCKERFILE: frontend/Dockerfile.prod
    CI_IMAGE_DOTENV_VAR: DRILL_FRONTEND_PROD_IMAGE
  # Same rules as backend-docker-build-prod, spelled out rather than aliased:
  # scripts/wait-for-main-pipeline.py --check-ci-file reads rules as text and
  # fails closed on an aliased rules value (see backend-test-migrations).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *compose-prod-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *compose-prod-paths

# ─── Release guard: the tag's commit must have passed main (#1154) ───────────
#
# Pushing `main` and a `v*` tag at one commit starts two pipelines that nothing
# links. The publish jobs below were gated only on the one test job in their own
# `needs:`, so a tag could publish while playwright-e2e, migration-check or a
# security gate was red on that exact commit. scripts/release.sh checks the
# merge commit's pipeline before tagging, but a hand-pushed tag skips it and it
# reads the aggregate status, which an `allow_failure: true` failure leaves green.
#
# This job resolves the newest `main` pipeline (source push/web) at
# $CI_COMMIT_SHA and judges it job by job, not by its top-level status (which
# `docs-deploy` left `manual` keeps unresolved): every job must be `success`
# unless scripts/wait-for-main-pipeline.py exempts it, allow_failure or not, and
# a fixed set that runs on every main pipeline must be present. It polls while
# main is still running, then fails closed: no pipeline, an API error or a
# timeout all refuse. Every publish job `needs:` this job directly, and
# `--check-ci-file` fails if one stops doing so. There is no bypass variable.
#
# Also runs on main/schedule pipelines, where it exits at once: the docker-push
# and docs-deploy jobs that need it exist there too, and a strict `needs:` (not
# `optional: true`) makes GitLab refuse to create a tag pipeline in which the
# guard is missing, rather than publishing without it.
#
# Reads pipelines and jobs with GITLAB_API_TOKEN (a personal access token with
# read_api, owned by an account with Reporter+ on this project; project access
# tokens need Premium on GitLab.com; masked + protected) and refuses when unset.
# CI_JOB_TOKEN cannot list pipelines, and anonymous reads share gitlab.com's
# hourly per-IP limit with every tenant on the runner's IP. Setup:
# docs/maintainers/tokens-and-rotation.md. Diagnosing a refusal:
# docs/maintainers/known-ci-failures.md.
release-main-pipeline-guard:
  interruptible: false  # seconds on main; keeps docs-deploy's only need from being canceled (#2421)
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # The wait is capped at MAIN_PIPELINE_GUARD_TIMEOUT_SECONDS (default 45 min);
  # a main pipeline takes about 13.
  timeout: 1h
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python3 scripts/wait-for-main-pipeline.py --self-test
    - python3 scripts/wait-for-main-pipeline.py --check-ci-file .gitlab-ci.yml
    - |
      if [ -z "${CI_COMMIT_TAG:-}" ]; then
        echo "Branch pipeline: no release tag to gate, nothing to check."
        exit 0
      fi
      python3 scripts/wait-for-main-pipeline.py --sha "${CI_COMMIT_SHA}"

# ─── Red-main guard (#2460) ───────────────────────────────────────────────────
#
# 17 of 161 main pipelines failed in the 2026-11-21 audit, 7 in a row on
# `script-tests`, while merges kept landing: MR pipelines were green. Free tier
# has no merge trains, so: the tripwire files one `main is red` issue, the
# guard fails MRs while the latest finished main push pipeline is red (escape
# hatch: label `main-fix`). Both fail OPEN on API trouble. Runbook:
# docs/maintainers/known-ci-failures.md. Self-tests run in `script-tests`.
main-red-tripwire:
  interruptible: false  # files/closes the tracking issue
  retry: 0  # posts issue comments; a retry would double-post
  resource_group: main-red-tripwire  # one tripwire at a time: no two pipelines open two issues
  stage: .post  # built-in last stage: runs after every other stage, so it never reads a still-running pipeline as green
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  allow_failure: true  # never turns a green main red; the script fails open
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'  # push only: the guard judges push pipelines; web/api/trigger/schedule runs must not open or close the issue
      when: always  # on_failure alone could never close the issue on a green pipeline
  script:
    - python3 scripts/main-red-tripwire.py

main-red-guard:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - python3 scripts/main-red-guard.py

# ─── Docker push (amd64 + arm64) ───────────────────────────────────────────────
#
# Builds and pushes images with kaniko — the same daemonless builder the
# MR-time *-docker-build jobs already use. No Docker daemon, no privileged
# mode, no self-hosted runner.
#
# Why this changed (2026-09-14, !852): these jobs previously ran `docker
# buildx` against a Docker socket mounted by a self-hosted runner's
# config.toml. That runner ("nuc runner", group runner 53511568) went stale on
# 2026-07-18; every push since had been scheduled onto a GitLab SaaS runner and
# failed with "Cannot connect to the Docker daemon at unix:///var/run/docker.sock".
# The last successful push was 2026-06-26. kaniko removes that single point of
# failure for amd64 — these jobs run on any runner.
#
# ARM64 (#1084, restored here): kaniko cannot cross-build, so amd64 stays on
# kaniko and arm64 gets its own native leg below (`*-docker-push-arm64`) on the
# dedicated Apple Silicon runner (tag: arm64, Max1-Runner-Visiban, id
# 56802474) — a SHELL executor against that runner's own Docker Desktop
# daemon, whose VM is itself arm64, so the build is NATIVE with no QEMU. This
# is the same shape TruePPM uses (`.docker-publish-arm64-base`). A prior
# attempt at this in the same GitLab-SaaS-arm64-runner shape kaniko amd64 uses
# hit `no_matching_runner` (verified on pipeline 2845582400) — this project's
# GitLab plan has no usable SaaS arm64 runner, hence the dedicated host.
#
# A `*-manifest` job per image assembles the amd64 (kaniko) and arm64 (native)
# single-arch images — each pushed under a `-amd64`/`-arm64` suffixed tag on
# BOTH registries, since a manifest list can only reference digests in its own
# repository — into the real `:<tag>` tag always, plus `:latest` and (for
# stable releases only) `:MAJOR.MINOR`, as proper multi-arch manifest lists,
# via `manifest-tool`. A pre-release tag gets no `:latest`/`:MAJOR.MINOR`
# alias at all — only its own exact `:<tag>`.
#
# Fail-loud, not hang: a `no_matching_runner` job sits pending forever rather
# than failing, which would silently hang a release pipeline (the exact
# failure mode this design avoided re-introducing the first time). Rather than
# rely on a job `timeout:` (does not cover pending/queue time — see
# docs/maintainers/ci-runners.md), `arm64-runner-preflight` below queries the
# GitLab Runners API directly for an online runner tagged `arm64` and fails
# within seconds if none is found, before either arm64 leg is even scheduled.
#
# On main-branch merges: :main and :<short-sha> to the GitLab registry
# (amd64 only — arm64 and the manifest jobs run on release tags only, see
# their `rules:`). Never :latest — that name is stable-release-only (#1409).
# On release tags: this leg pushes only arch-suffixed intermediate tags (see
# the destinations() comment below) — the real :<tag> tag, and (for stable
# releases only) the :latest/:MAJOR.MINOR aliases, are written exclusively by
# `*-manifest`, on both the GitLab registry and GHCR, as multi-arch
# (linux/amd64 + linux/arm64) manifest lists. A pre-release tag gets no
# :latest/:MAJOR.MINOR alias at all.

.kaniko-push-common:
  interruptible: false  # registry push (GitLab registry, GHCR) — never cancel mid-push (#2419)
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      # Assemble a docker config covering every registry a push job may touch:
      # the GitLab registry (push), GHCR (push on tags), the GitLab Dependency
      # Proxy (pull — the Dockerfiles' base images now resolve through it via
      # --build-arg BASE_REGISTRY, #1198), and Docker Hub directly as a
      # fallback. Each entry is added only when its credentials are present,
      # so a fork without GHCR_TOKEN still builds and pushes to its own
      # registry.
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      # CI_DEPENDENCY_PROXY_SERVER is empty on a project with no working group
      # Dependency Proxy (e.g. a personal-namespace fork) — guarded so that
      # case doesn't inject an empty-keyed auth entry.
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        AUTHS="${AUTHS},\"${CI_DEPENDENCY_PROXY_SERVER}\":{\"auth\":\"$(b64 "${CI_DEPENDENCY_PROXY_USER}" "${CI_DEPENDENCY_PROXY_PASSWORD}")\"}"
      fi
      if [ -n "${GHCR_USER}" ] && [ -n "${GHCR_TOKEN}" ]; then
        AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      fi
      if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
        AUTHS="${AUTHS},\"https://index.docker.io/v1/\":{\"auth\":\"$(b64 "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}")\"}"
      fi
      printf '{"auths":{%s}}' "${AUTHS}" > /kaniko/.docker/config.json
    - |
      # Emit the --destination flags for one image. $1 = image name under
      # each registry root.
      #
      # Corrected 2026-09-28 (#1084 re-audit): this used to push the real,
      # unsuffixed `:<tag>`/`:latest`/`:MINOR` names directly on a release tag,
      # on BOTH registries, in addition to the `-amd64`-suffixed intermediate
      # tags — on the theory that `*-manifest` below would immediately
      # overwrite them with the real multi-arch manifest. It does, when the
      # arm64 leg succeeds. But `*-manifest` `needs:` the arm64 leg, so if
      # that leg (or `arm64-runner-preflight` above it) ever fails — which it
      # would have on the very next release tag after #1084 first merged, see
      # the token fix above; no tag had actually been cut yet when this was
      # caught — the amd64-only push here would have ALREADY landed under the
      # real tag names on both registries, including GHCR `:latest`, with
      # nothing to roll it back. The pipeline goes red; the bad image is
      # already live.
      #
      # Now: on a release tag, this leg pushes ONLY `-amd64`-suffixed
      # destinations, on both registries. `*-manifest` (which needs both this
      # job and the arm64 leg) is the ONLY thing that ever writes the real
      # `:<tag>`/`:latest`/`:MINOR` names — so a failed or skipped arm64 leg
      # leaves whatever was already published under those names (the previous
      # stable release) untouched,
      # rather than silently replacing it with an incomplete one.
      #
      # On an ordinary main-branch merge (no tag): plain amd64-only
      # :main/:<short-sha> to the GitLab registry only (NOT :latest — that
      # is written only by `*-manifest` on stable tags, so it always means
      # the newest stable release, multi-arch, on both registries; #1409) — no
      # arm64 leg or manifest job runs off a branch push (see their `rules:`
      # — release tags only), so there is no multi-arch alternative to defer
      # to here, and GHCR is untouched by main-branch merges as before.
      destinations() {
        img="$1"
        if [ -n "${CI_COMMIT_TAG}" ]; then
          # Only the exact-tag `-amd64` destination — no `${MINOR}-amd64`
          # (removed 2026-09-28, #1084 re-audit): `*-manifest`'s
          # `manifest-tool` call below builds the multi-arch manifest from
          # `${TAG}-ARCH` sources only and aliases `:latest`/`:MINOR` onto
          # that SAME manifest via `--tags`, so a separate `${MINOR}-ARCH`
          # source was never read by anything — dead registry clutter.
          echo "--destination=${CI_REGISTRY_IMAGE}/${img}:${CI_COMMIT_TAG}-amd64"
          echo "--destination=ghcr.io/visiban/visiban/${img}:${CI_COMMIT_TAG}-amd64"
        else
          echo "--destination=${CI_REGISTRY_IMAGE}/${img}:main"
          echo "--destination=${CI_REGISTRY_IMAGE}/${img}:${CI_COMMIT_SHORT_SHA}"
        fi
      }

backend-docker-push:
  extends: .kaniko-push-common
  needs: [release-main-pipeline-guard, backend-test-coverage]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      # shellcheck disable=SC2046 — word splitting is intended; one flag per line.
      /kaniko/executor \
        --context=backend \
        --dockerfile=backend/Dockerfile \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=${DOCKERHUB_MIRROR:-docker.io/library} \
        $(destinations backend)

frontend-docker-push:
  extends: .kaniko-push-common
  needs: [release-main-pipeline-guard, frontend-test]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      /kaniko/executor \
        --context=frontend \
        --dockerfile=frontend/Dockerfile \
        --snapshot-mode=redo \
        --build-arg NODE_OPTIONS=--max-old-space-size=2048 \
        --build-arg BASE_REGISTRY=${DOCKERHUB_MIRROR:-docker.io/library} \
        $(destinations frontend)

# ─── Docker push — arm64 preflight (#1084) ────────────────────────────────────
#
# GitLab has no native "job has been pending too long with no runner" failure:
# a job `timeout:` only covers execution time once a runner has picked it up,
# not queue time. Without this job, a release tag pipeline whose one arm64
# runner (Max1-Runner-Visiban, id 56802474, tags: arm, arm64, apple, macosx,
# mac, ios) is offline would leave `backend-docker-push-arm64` /
# `frontend-docker-push-arm64` sitting `pending` indefinitely — exactly the
# `no_matching_runner` hang this feature was deliberately left out of !852 to
# avoid re-introducing.
#
# Queries the group Runners API directly (`GET /groups/visiban/runners`, same
# read the human-run `glab api "projects/visiban%2Fvisiban/runners?type=group_type"`
# in docs/maintainers/ci-runners.md approximates from the project side) and
# fails within seconds if no runner tagged `arm64` is online, before either
# arm64 leg is scheduled.
#
# Needs RUNNER_STATUS_TOKEN: a fine-grained PAT with the `read_runner`
# permission, scoped to the `visiban` group (id 126306686) — the Runners API
# is not part of GitLab's CI_JOB_TOKEN-allowed endpoint set, so a job token
# cannot make this call. See docs/maintainers/tokens-and-rotation.md.
#
# Corrected 2026-09-28: this job originally referenced a variable named
# RUNNERS_READ_TOKEN, which was never actually created — only RUNNER_STATUS_TOKEN
# (same purpose, described "ARM64") exists as a configured project variable. No
# release tag had been cut since #1084 first merged, so the mismatch had not
# yet failed a real pipeline, but the next one would have — this preflight would
# have skipped both arm64 legs and the manifest jobs silently (see the
# destinations() fix below for why that's worse than it sounds). Also corrected
# here: the query now hits `/groups/visiban/runners`, not
# `/projects/${CI_PROJECT_ID}/runners` — RUNNER_STATUS_TOKEN's `read_runner`
# grant is scoped to the group, not the project, and verified directly
# (`glab api "groups/visiban/runners?tag_list=arm64"` returns
# Max1-Runner-Visiban) against the endpoint this job actually calls.
#
# Do NOT use the runner's reported `architecture` field to sanity-check
# anything beyond "is it online" — `Max1-Runner-Visiban` reports `amd64`
# there because the gitlab-runner binary runs under Rosetta, despite the
# host and every image it builds being genuinely native arm64.
arm64-runner-preflight:
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    - apk add --no-cache bash curl jq
  script:
    # The arm64 legs source scripts/docker-push-retry.sh rather than invoke it;
    # its daemon-free self-test runs here, ahead of them (gate-selftest-parity).
    - bash scripts/docker-push-retry.sh --self-test
    - |
      # `set -eu` only, not `-o pipefail` — alpine's default /bin/sh (busybox
      # ash) doesn't support that option and errors out immediately on it,
      # matching every other inline script in this file (none use pipefail).
      set -eu
      if [ -z "${RUNNER_STATUS_TOKEN:-}" ]; then
        echo "ERROR: RUNNER_STATUS_TOKEN not set — cannot verify an arm64 runner is online"
        echo "before scheduling the arm64 build jobs. Configure a fine-grained PAT with the"
        echo "read_runner permission, scoped to the visiban group, under Settings -> CI/CD ->"
        echo "Variables (Masked + Protected). See docs/maintainers/tokens-and-rotation.md."
        exit 1
      fi
      ONLINE_ARM64="$(curl -sSf --header "PRIVATE-TOKEN: ${RUNNER_STATUS_TOKEN}" \
        "${CI_API_V4_URL}/groups/visiban/runners?scope=online&tag_list=arm64" \
        | jq 'map(select(.online == true)) | length')"
      if [ "${ONLINE_ARM64:-0}" -lt 1 ]; then
        echo "ERROR: no online runner tagged 'arm64' found (expected Max1-Runner-Visiban,"
        echo "id 56802474). Without this check, backend-docker-push-arm64 /"
        echo "frontend-docker-push-arm64 would sit pending forever (no_matching_runner)"
        echo "and hang this release pipeline instead of failing."
        echo "Bring the runner online — see docs/maintainers/ci-runners.md — then re-run"
        echo "this pipeline."
        exit 1
      fi
      echo "OK: ${ONLINE_ARM64} online runner(s) tagged arm64."

# ─── Docker push — arm64 native leg (#1084) ────────────────────────────────────
#
# Runs on the dedicated Apple Silicon macOS runner (tag: arm64) under the
# SHELL executor — no `image:`/`services:` (meaningless under a shell
# executor) and no dind, matching TruePPM's `.docker-publish-arm64-base`
# shape. Builds against that runner's own already-running Docker Desktop,
# whose VM is itself arm64, producing a NATIVE linux/arm64 image with no
# QEMU emulation.
#
# `--provenance=false --sbom=false`: Docker Desktop's BuildKit otherwise
# attaches a provenance/SBOM attestation even to a single-platform build,
# turning the pushed `-arm64` tag into a small manifest list rather than a
# plain image manifest. `manifest-tool`'s `--template`/`--platforms`
# substitution (in `*-manifest` below) expects a plain per-platform manifest
# at each source tag, so this keeps the arm64 leg's output in that shape.
#
# Pushes ONLY the `-arm64`-suffixed tag, to BOTH registries (a manifest list
# can only reference digests in its own repository) — `*-manifest` assembles
# the real `:<tag>` tag (always) plus `:latest` / `:MINOR` (stable releases
# only) from this plus the amd64 leg's `-amd64`-suffixed tag. `resource_group`
# serializes the backend/frontend legs
# since both run against the one physical host's Docker Desktop daemon.
# `after_script` always logs out and removes the tags this job pushed, so the
# arch-suffixed images and registry credentials don't linger on the shared
# host daemon between releases. This now includes the GitLab Dependency Proxy
# login taken in before_script below (#1204, follow-up to #1198's
# DOCKERHUB_MIRROR rollout) — the arm64 Dockerfile builds pull their base
# images through the same proxy the amd64 kaniko legs use.
.arm64-docker-push-base:
  interruptible: false  # registry push — never cancel mid-push (#2419)
  stage: deploy
  tags: [arm64]
  resource_group: arm64-docker-build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    - |
      set -eu
      if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — the arm64 leg pushes to GHCR too"
        echo "(a manifest list can only reference digests in its own repository), so"
        echo "this cannot proceed silently."
        exit 1
      fi
      # --password-stdin, never -p: on this persistent shared host a password in
      # argv is readable via `ps` by anything else running there (#1205).
      printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
      printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
      # Base images now resolve through DOCKERHUB_MIRROR (#1198) via
      # --build-arg BASE_REGISTRY in each job's script below — the GitLab
      # Dependency Proxy on a project where it's enabled — so this persistent
      # shell runner needs its own proxy login too, same convention as the
      # kaniko jobs' /kaniko/.docker/config.json and .helm-drill-base (see
      # docs/maintainers/ci-runners.md#dependency-proxy), just via `docker
      # login` since this is a real Docker daemon rather than kaniko's
      # credential file. Guarded on CI_DEPENDENCY_PROXY_SERVER being
      # non-empty: it's empty on a project with no working group Dependency
      # Proxy (e.g. a personal-namespace fork), where DOCKERHUB_MIRROR's shell
      # fallback below already sends the build straight to docker.io/library
      # and needs no login. This fails loud rather than degrading silently: if
      # the proxy variable IS set but the login itself fails (expired/bad
      # credential), that's a real misconfiguration on a project that expects
      # the proxy to work — better to stop the release here than let this leg
      # quietly fall through to an anonymous docker.io pull mid-build and risk
      # the #1198 rate limit, or worse, push a base image the amd64 kaniko leg
      # never used.
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        printf '%s' "${CI_DEPENDENCY_PROXY_PASSWORD}" | docker login "${CI_DEPENDENCY_PROXY_SERVER}" -u "${CI_DEPENDENCY_PROXY_USER}" --password-stdin
      fi

backend-docker-push-arm64:
  extends: .arm64-docker-push-base
  needs:
    - job: release-main-pipeline-guard
    - job: arm64-runner-preflight
    - job: backend-test-coverage
  script:
    - |
      set -eu
      TAG="${CI_COMMIT_TAG}"
      GL_REF="${CI_REGISTRY_IMAGE}/backend:${TAG}-arm64"
      GH_REF="ghcr.io/visiban/visiban/backend:${TAG}-arm64"
      . "${CI_PROJECT_DIR}/scripts/docker-push-retry.sh"
      docker build \
        --provenance=false \
        --sbom=false \
        --file backend/Dockerfile \
        --build-arg BASE_REGISTRY="${DOCKERHUB_MIRROR:-docker.io/library}" \
        --tag "${GL_REF}" \
        backend
      ARCH="$(docker image inspect "${GL_REF}" --format '{{.Architecture}}')"
      if [ "${ARCH}" != "arm64" ]; then
        echo "ERROR: built image reports architecture '${ARCH}', expected arm64."
        echo "This runner may no longer be the Apple Silicon host — see docs/maintainers/ci-runners.md."
        exit 1
      fi
      push_with_retry "${GL_REF}"
      docker tag "${GL_REF}" "${GH_REF}"
      push_with_retry "${GH_REF}"
  after_script:
    - docker rmi "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_TAG}-arm64" "ghcr.io/visiban/visiban/backend:${CI_COMMIT_TAG}-arm64" 2>/dev/null || true
    - docker logout "${CI_REGISTRY}" || true
    - docker logout ghcr.io || true
    # Tolerates never having logged in (e.g. a fork with no group Dependency
    # Proxy, where the before_script login above was skipped) — `|| true`
    # covers both "not logged in" and any other logout failure, so a proxy
    # credential never lingers on this persistent shared host (#1204).
    - '[ -z "${CI_DEPENDENCY_PROXY_SERVER:-}" ] || docker logout "${CI_DEPENDENCY_PROXY_SERVER}" || true'

frontend-docker-push-arm64:
  extends: .arm64-docker-push-base
  needs:
    - job: release-main-pipeline-guard
    - job: arm64-runner-preflight
    - job: frontend-test
  script:
    - |
      set -eu
      TAG="${CI_COMMIT_TAG}"
      GL_REF="${CI_REGISTRY_IMAGE}/frontend:${TAG}-arm64"
      GH_REF="ghcr.io/visiban/visiban/frontend:${TAG}-arm64"
      . "${CI_PROJECT_DIR}/scripts/docker-push-retry.sh"
      docker build \
        --provenance=false \
        --sbom=false \
        --file frontend/Dockerfile \
        --build-arg NODE_OPTIONS=--max-old-space-size=2048 \
        --build-arg BASE_REGISTRY="${DOCKERHUB_MIRROR:-docker.io/library}" \
        --tag "${GL_REF}" \
        frontend
      ARCH="$(docker image inspect "${GL_REF}" --format '{{.Architecture}}')"
      if [ "${ARCH}" != "arm64" ]; then
        echo "ERROR: built image reports architecture '${ARCH}', expected arm64."
        echo "This runner may no longer be the Apple Silicon host — see docs/maintainers/ci-runners.md."
        exit 1
      fi
      push_with_retry "${GL_REF}"
      docker tag "${GL_REF}" "${GH_REF}"
      push_with_retry "${GH_REF}"
  after_script:
    - docker rmi "${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_TAG}-arm64" "ghcr.io/visiban/visiban/frontend:${CI_COMMIT_TAG}-arm64" 2>/dev/null || true
    - docker logout "${CI_REGISTRY}" || true
    - docker logout ghcr.io || true
    # See backend-docker-push-arm64's after_script above.
    - '[ -z "${CI_DEPENDENCY_PROXY_SERVER:-}" ] || docker logout "${CI_DEPENDENCY_PROXY_SERVER}" || true'

# ─── Docker push — manifest assembly (#1084) ───────────────────────────────────
#
# Combines the amd64 (kaniko, `-amd64`-suffixed) and arm64 (native leg above,
# `-arm64`-suffixed) single-arch images into real multi-arch manifest lists
# under `:<tag>` always, plus `:latest` and (for stable releases only)
# `:MAJOR.MINOR`, on both the GitLab registry and GHCR. A pre-release tag
# (`-alpha`/`-beta`/`-rc`) gets no `--tags` at all — only its own exact
# `:<tag>` — so it never re-points `:latest` at an in-development build (a
# bug that did exactly that from v1.2.0-alpha.1 through v1.2.0-alpha.3 on
# both registries, fixed here). `manifest-tool push from-args --template
# <repo>:<tag>-ARCH --target <repo>:<tag> [--tags latest[,MINOR]]` was
# verified to expand this tag set correctly.
#
# `manifest-tool` reads registry credentials from an existing Docker client
# config file (its 3rd, non-interactive auth option) — built the same way
# `.kaniko-push-common` builds one, so no `docker` CLI/daemon is needed here;
# a plain `alpine` image suffices.
#
# Binary is fetched as a version-pinned, checksum-verified release tarball
# (matching this file's Cosign/Trivy/Syft/manifest-tool-elsewhere pinning
# convention) rather than piping an install script through `sh`. The tarball's
# internal layout isn't part of the pin — only its sha256 is — so the
# linux-amd64 binary is located defensively rather than assumed at a
# hardcoded path.
.manifest-tool-common:
  interruptible: false  # writes multi-arch manifests to the registries (#2419)
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    # bash: scripts/classify-release-tag.sh (stable-vs-pre-release alias
    # decision, below) is a bash script, kept consistent with
    # resolve-docs-version.sh and scripts/release.sh's own classification.
    - apk add --no-cache bash curl tar
    - |
      set -eu
      MANIFEST_TOOL_VERSION=2.2.2
      MANIFEST_TOOL_SHA256=bdca525326694849594ab3ba63638fdb664690c9384df947bd3cff943d14736b
      curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/estesp/manifest-tool/releases/download/v${MANIFEST_TOOL_VERSION}/binaries-manifest-tool-${MANIFEST_TOOL_VERSION}.tar.gz" -o /tmp/manifest-tool.tar.gz
      echo "${MANIFEST_TOOL_SHA256}  /tmp/manifest-tool.tar.gz" | sha256sum -c -
      mkdir -p /tmp/manifest-tool-extracted
      tar xzf /tmp/manifest-tool.tar.gz -C /tmp/manifest-tool-extracted
      MT_BIN="$(find /tmp/manifest-tool-extracted -type f -name '*linux-amd64*' | head -1)"
      if [ -z "${MT_BIN}" ]; then
        echo "ERROR: no linux-amd64 binary found in the manifest-tool release tarball. Contents:"
        find /tmp/manifest-tool-extracted -type f
        exit 1
      fi
      cp "${MT_BIN}" /usr/local/bin/manifest-tool
      chmod +x /usr/local/bin/manifest-tool
    - |
      set -eu
      if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot assemble the GHCR manifest list."
        exit 1
      fi
      mkdir -p /root/.docker
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      printf '{"auths":{%s}}' "${AUTHS}" > /root/.docker/config.json

backend-manifest:
  extends: .manifest-tool-common
  needs:
    - job: release-main-pipeline-guard
    - job: backend-docker-push
    - job: backend-docker-push-arm64
  script:
    # Self-test runs first, per #1093's gate-selftest-parity rule. Also run in
    # frontend-manifest below, deliberately duplicated rather than relying on
    # "the classifier is deterministic, one proof covers both": the two jobs
    # have no `needs:` on each other and run in parallel within the same
    # stage, so a self-test only in one job would still let the other race
    # ahead and push a possibly-wrong alias before the pipeline reads red.
    - bash scripts/classify-release-tag.sh --self-test
    - |
      set -eu
      IMG="backend"
      TAG="${CI_COMMIT_TAG}"
      # `latest`/`MINOR` are stable-release aliases only — delegated to
      # scripts/classify-release-tag.sh so this and frontend-manifest below
      # share one classifier instead of two copies of the same regex that can
      # silently drift apart (exactly how this bug happened the first time:
      # TAGS_ARG defaulted to "latest" unconditionally while only MINOR was
      # gated, so every alpha/beta/rc tag re-pointed backend:latest/
      # frontend:latest, on both registries, at that pre-release build, from
      # v1.2.0-alpha.1 through v1.2.0-alpha.3). See classify-release-tag.sh
      # for the regex and its --self-test.
      STABLE_TAGS="$(bash scripts/classify-release-tag.sh "${TAG}" | sed -n 's/^ALIASES=//p')"
      for REG in "${CI_REGISTRY_IMAGE}" "ghcr.io/visiban/visiban"; do
        if [ -n "${STABLE_TAGS}" ]; then
          manifest-tool push from-args \
            --platforms linux/amd64,linux/arm64 \
            --template "${REG}/${IMG}:${TAG}-ARCH" \
            --target "${REG}/${IMG}:${TAG}" \
            --tags "${STABLE_TAGS}"
        else
          manifest-tool push from-args \
            --platforms linux/amd64,linux/arm64 \
            --template "${REG}/${IMG}:${TAG}-ARCH" \
            --target "${REG}/${IMG}:${TAG}"
        fi
      done

frontend-manifest:
  extends: .manifest-tool-common
  needs:
    - job: release-main-pipeline-guard
    - job: frontend-docker-push
    - job: frontend-docker-push-arm64
  script:
    # See backend-manifest above: self-test runs here too, not shared across
    # the two jobs — they race in parallel with no `needs:` between them.
    - bash scripts/classify-release-tag.sh --self-test
    - |
      set -eu
      IMG="frontend"
      TAG="${CI_COMMIT_TAG}"
      # Classification itself is shared via scripts/classify-release-tag.sh,
      # not duplicated here — only the self-test call above is per-job.
      STABLE_TAGS="$(bash scripts/classify-release-tag.sh "${TAG}" | sed -n 's/^ALIASES=//p')"
      for REG in "${CI_REGISTRY_IMAGE}" "ghcr.io/visiban/visiban"; do
        if [ -n "${STABLE_TAGS}" ]; then
          manifest-tool push from-args \
            --platforms linux/amd64,linux/arm64 \
            --template "${REG}/${IMG}:${TAG}-ARCH" \
            --target "${REG}/${IMG}:${TAG}" \
            --tags "${STABLE_TAGS}"
        else
          manifest-tool push from-args \
            --platforms linux/amd64,linux/arm64 \
            --template "${REG}/${IMG}:${TAG}-ARCH" \
            --target "${REG}/${IMG}:${TAG}"
        fi
      done

# ─── Image signing + SBOM attestation (release tags, #1153) ──────────────────
#
# `helm-publish` signs the chart; until #1153 the images it pulls were neither
# signed nor SBOM'd. These jobs close that: each released backend/frontend
# image is cosign-signed (index + each platform manifest, `--recursive`) and a
# syft CycloneDX SBOM is `cosign attest`ed to EACH per-platform digest, then
# `cosign verify`/`verify-attestation` run in the same job and the returned
# SBOMs are asserted to name their own image, version and architecture.
# All of the logic, and every assertion, lives in scripts/attest-image-sbom.sh.
#
# Where, and why here rather than in the arch legs:
#   * After `*-manifest`, because only then do both platform digests exist
#     under one index — this job reads them FROM the published index, so it
#     attests exactly what a puller resolves, on each platform. Attesting in
#     the legs would mean the amd64 kaniko job (no cosign, no index yet) and
#     the arm64 leg (a persistent shared macOS shell runner) each did half, and
#     the arm64 half would put a Sigstore identity token and registry creds on
#     a host that outlives the job. Attesting only the index would go green
#     while covering nothing: an index has no filesystem.
#   * On BOTH registries: cosign stores signatures/attestations as tags in the
#     image's own repository, so a GHCR attestation is invisible to someone
#     verifying registry.gitlab.com/visiban/visiban (and vice versa). The
#     script loops over both; syft runs per registry so each SBOM names the
#     repository it is attached to.
#   * Plain alpine on the default (amd64) runners — syft reads a platform
#     digest from the registry without running it, so nothing needs arm64.
#
# Keyless via `id_tokens: SIGSTORE_ID_TOKEN` (same as helm-publish); the
# certificate identity is this job on refs/tags/<tag>. The script refuses to
# sign or attest when GITLAB_CI/CI_JOB_ID/SIGSTORE_ID_TOKEN are absent.
#
# Pins (version + sha256 of the release asset, verified against the upstream
# checksums file and an independent download, 2026-10-08):
#   * syft 1.51.1 (Apache-2.0) — no OSV advisories at this version; 1.18.1
#     (TruePPM's pin) carries GHSA-rjcw-vg7j-m9rc, fixed in 1.42.3.
#   * cosign 2.6.5 (Apache-2.0) — pinned once in `.cosign-pin` below and shared
#     with `helm-publish` (#1543). This job's assertion IS `verify-attestation`,
#     and 2.4.3 had GHSA-whqx-f9j3-ch6m (fixed 2.6.2) and GO-2026-5694 (verify
#     false positive, fixed 2.6.3). The one remaining v2 advisory, GO-2026-4529,
#     applies only when transparency-log verification is skipped, which
#     nothing here does. Stays on v2: v3 changes the default bundle/storage
#     format, which would change the verification commands operators run.
# Single source of truth for the cosign pin (version + sha256 of the
# cosign-linux-amd64 release asset). Both `.image-attest-common` and
# `helm-publish` extend this, so they cannot drift apart again (#1543).
# Both run on linux/amd64 runners and fetch the same asset.
.cosign-pin:
  variables:
    COSIGN_VERSION: "2.6.5"
    COSIGN_SHA256: "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644"

.image-attest-common:
  interruptible: false  # attaches cosign signatures/attestations in the registry (#2419)
  retry: 0  # cosign signing appends signatures; a retry duplicates them (#2462)
  extends: .cosign-pin
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache bash curl jq crane tar
    - |
      set -eu
      SYFT_VERSION=1.51.1
      SYFT_SHA256=8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
      curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -o /tmp/syft.tar.gz
      echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
      tar xzf /tmp/syft.tar.gz -C /usr/local/bin syft
      curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
      echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
    # One Docker config file serves crane, syft and cosign alike (all three
    # resolve auth through go-containerregistry's default keychain) — the
    # `cosign login` helm-publish needs (#1284) is the same fix, done once.
    - |
      set -eu
      if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot sign or attest the GHCR images."
        exit 1
      fi
      mkdir -p "$HOME/.docker"
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      printf '{"auths":{%s}}' "${AUTHS}" > "$HOME/.docker/config.json"

backend-image-attest:
  extends: .image-attest-common
  needs: [release-main-pipeline-guard, backend-manifest]
  script:
    - bash scripts/attest-image-sbom.sh --self-test
    - bash scripts/attest-image-sbom.sh --image backend --tag "${CI_COMMIT_TAG}"

frontend-image-attest:
  extends: .image-attest-common
  needs: [release-main-pipeline-guard, frontend-manifest]
  script:
    - bash scripts/attest-image-sbom.sh --self-test
    - bash scripts/attest-image-sbom.sh --image frontend --tag "${CI_COMMIT_TAG}"

# MANUAL backfill for releases published before #1153 (or whose attest job
# failed): signs + attests an already-published tag's images, both images, both
# registries, without re-cutting the release. Set BACKFILL_TAG (e.g.
# v1.2.0-alpha.4) in the "Run job" dialog. Default branch only, never blocks a
# pipeline. Digests that already verify are skipped (script default), so
# re-playing it is safe.
#
# Certificate identity differs from a tag pipeline's: this job runs on main, so
# its SAN ends `@refs/heads/main`, not `@refs/tags/v…` — an already-released
# tag cannot be re-run without moving it. Only backfilled versions need the
# main-or-tag verification regexp; releases cut after #1153 verify with the
# tag-only one. See docs/administration/image-verification.md.
#
# Trust model: backfill is trust-on-first-use — it signs whatever the tag
# points at when the job runs, so only Maintainers should run it, and only
# after checking the tag's current digests (`attest-image-sbom.sh --dry-run`
# prints them, read-only, from anywhere) against the original release
# pipeline's manifest-job log. Not gated by a protected environment:
# protected environments are a GitLab Premium feature and this project is on
# Free; who can run it is bounded by who can run manual jobs on `main`.
image-attest-backfill:
  extends: .image-attest-common
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true
  variables:
    BACKFILL_TAG: ""
  script:
    - bash scripts/attest-image-sbom.sh --self-test
    - |
      set -eu
      if [ -z "${BACKFILL_TAG}" ]; then
        echo "ERROR: set BACKFILL_TAG (e.g. v1.2.0-alpha.4) when running this job."
        exit 1
      fi
      # Whole-string validation (rejects a multi-line or metacharacter value
      # typed into the Run-job dialog) before anything is signed — the same
      # validate_tag the script applies to --tag.
      bash scripts/attest-image-sbom.sh _t validate_tag "${BACKFILL_TAG}"
      for IMG in backend frontend; do
        bash scripts/attest-image-sbom.sh --image "${IMG}" --tag "${BACKFILL_TAG}"
      done

# ─── Latest-tag stability check (release tags) ───────────────────────────────
#
# Fails the TAG PIPELINE ITSELF, immediately, if backend:latest/frontend:latest
# on either registry does not point at the current newest STABLE release —
# the automatic version of the manual check that caught the 2026-10 incident
# (backend-manifest/frontend-manifest re-pointing :latest at every alpha/beta/
# rc tag for ~3 days before anyone noticed). A fixed bug with nothing watching
# it is one unrelated refactor away from quietly coming back; this is that
# watch. See scripts/check-latest-tag-stability.sh for the full rationale.
#
# needs: both manifest jobs, so this only runs once the (possibly-wrong)
# :latest alias has actually been written and there's something real to check
# — not racing them.
#
# Deliberately NOT allow_failure: a self-hoster doing a plain `docker pull`
# with no tag getting a different, unvetted build than the one the docs
# describe is exactly the failure class check-release-images.sh (below) also
# refuses to let go green silently.
latest-tag-stability-check:
  stage: deploy
  needs: [backend-manifest, frontend-manifest]
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    - apk add --no-cache bash git crane
    - |
      mkdir -p "$HOME/.docker"
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      if [ -n "${GHCR_USER}" ] && [ -n "${GHCR_TOKEN}" ]; then
        AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      fi
      printf '{"auths":{%s}}' "${AUTHS}" > "$HOME/.docker/config.json"
    # Tag pipelines may otherwise clone at the project's default depth, which
    # can miss historical tags — fetch them explicitly so
    # resolve_latest_stable_tag() sees the real newest stable release.
    - git fetch origin --tags --force
  script:
    - bash scripts/check-latest-tag-stability.sh --self-test
    - bash scripts/check-latest-tag-stability.sh

# ─── Helm — publish chart to GHCR (release tags) ─────────────────────────────
#
# The chart is the deployment path docs/getting-started/kubernetes.md recommends
# for production, and until #1116 it was published nowhere: operators had to
# `git clone` the repo to install it. The backend and frontend images already go
# to ghcr.io/visiban/visiban on a release tag; the chart now goes with them, as
# an OCI artifact, so `helm install oci://ghcr.io/visiban/charts/visiban` works.
#
# Cosign-signed keyless (Sigstore via SIGSTORE_ID_TOKEN), so an operator can
# `cosign verify` the chart they pull rather than trusting the registry.
#
# Credentials: GHCR_USER + GHCR_TOKEN (the existing `visiban-ghcr-push` PAT,
# scope write:packages). Missing credentials FAIL this job rather than skipping
# it — a release that silently ships no chart is the failure mode this job
# exists to prevent.

helm-publish:
  interruptible: false  # pushes the chart to the OCI registry (#2419)
  retry: 0  # OCI chart push is not safely repeatable (#2462)
  extends: .cosign-pin
  stage: deploy
  image:
    name: ${DOCKERHUB_MIRROR}/alpine/helm:3.16.4
    entrypoint: [""]
  # needs the manifest jobs (added 2026-09-28, #1084 re-audit): the chart's
  # appVersion check below only confirms Chart.yaml matches the release tag,
  # not that an image actually exists at that tag on GHCR. Before this, a
  # failed/skipped arm64 leg could leave the real :<tag> image unpublished
  # while this job still ran unconditionally, signed, and pushed a chart
  # pointing at an image reference that doesn't exist — the same "published
  # something that points at nothing" failure class this whole branch fixes,
  # just one hop further downstream (see backend-manifest/frontend-manifest).
  #
  # docs-version-accuracy is included here too, deliberately: before this
  # `needs:` existed, this job (stage: deploy) implicitly wouldn't start
  # until every `stage: lint` job — including docs-version-accuracy, which
  # exists "so a bad release is caught at tag time" — had passed, via
  # GitLab's default stage ordering. Adding an explicit `needs:` list
  # replaces that implicit ordering rather than adding to it, so leaving
  # docs-version-accuracy off here would have silently dropped a gate this
  # job used to have.
  #
  # `*-image-attest` (#1153): a signed chart pointing at unsigned, un-SBOM'd
  # images is the inconsistent trust boundary #1153 was filed about, so the
  # chart is not published until both images verify.
  needs: [release-main-pipeline-guard, backend-manifest, frontend-manifest, backend-image-attest, frontend-image-attest, docs-version-accuracy]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache bash curl
    # Pinned and checksum-verified: an unpinned signing tool is a supply-chain
    # hole in the job whose whole purpose is supply-chain provenance.
    # COSIGN_VERSION / COSIGN_SHA256 come from `.cosign-pin`, shared with
    # `.image-attest-common` (#1543).
    # Subshell: `set -eu` must not leak into the script section (shared shell),
    # or the GHCR_USER/GHCR_TOKEN guard would abort on "parameter not set".
    - |
      (
        set -eu
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
        echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
        chmod +x /usr/local/bin/cosign
      )
  script:
    - |
      if [ -z "${GHCR_USER}" ] || [ -z "${GHCR_TOKEN}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot publish the Helm chart."
        echo "Configure both under Settings → CI/CD → Variables (Masked + Protected) before tagging."
        exit 1
      fi
    # The chart's appVersion must match the tag being released. A chart that
    # ships pointing at the previous release's images is #1038's root cause
    # (a chart two minor versions stale), and it is invisible until someone
    # installs it.
    - |
      APP_VERSION="$(helm show chart helm/visiban | awk '/^appVersion:/{print $2}' | tr -d '"')"
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: Chart.yaml appVersion ($APP_VERSION) does not match the release tag ($TAG_VERSION)."
        echo "Bump appVersion in helm/visiban/Chart.yaml before tagging."
        exit 1
      fi
      echo "appVersion check passed: $APP_VERSION"
    - printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
    # `helm registry login` above only populates Helm's own registry config —
    # it has no effect on cosign, which resolves registry auth through
    # go-containerregistry's default keychain (the Docker credential store).
    # Without this, `cosign sign` below fails closed with
    # "UNAUTHORIZED: authentication required" even though the push two lines
    # down succeeds — the two tools simply don't share a credential store
    # (#1284, first caught on v1.2.0-alpha.2 once #1268 let execution reach
    # this far for the first time).
    - printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "$GHCR_USER" --password-stdin
    - |
      # The chart version to publish (#1155). Chart.yaml's `version:` is the
      # stable chart line, bumped by hand (#1194). A pre-release tag publishes
      # `<version>-<pre-release>` (v1.3.0-beta.1 -> 0.8.0-beta.1): publishing the
      # plain version from a pre-release tag is exactly what let a stable chart
      # carrying beta images outrank every later pre-release. This only changes
      # the packaged version; Chart.yaml in git is untouched.
      CHART_BASE_VERSION="$(helm show chart helm/visiban | awk '/^version:/{print $2}' | tr -d '"')"
      case "$CI_COMMIT_TAG" in
        *-*) CHART_VERSION="${CHART_BASE_VERSION}-${CI_COMMIT_TAG#*-}" ;;
        *)   CHART_VERSION="$CHART_BASE_VERSION" ;;
      esac
      CHART_NAME="$(helm show chart helm/visiban | awk '/^name:/{print $2}')"
      # Publish guard, before anything is pushed: refuses a stable version from
      # a pre-release tag, a version already in the registry (helm push would
      # overwrite it), and a pre-release whose plain stable is already published
      # (it could never outrank it). Exit 2 (registry unreadable) also fails the
      # job: this guard fails closed. CI_COMMIT_TAG reaches it from the job env.
      bash scripts/check-chart-registry.sh --candidate "$CHART_VERSION"
      helm package helm/visiban --version "$CHART_VERSION" --destination /tmp
      CHART_FILE="/tmp/${CHART_NAME}-${CHART_VERSION}.tgz"
      helm push "$CHART_FILE" "oci://ghcr.io/visiban/charts" 2>&1 | tee /tmp/helm-push.log
      # Sign the by-digest reference `helm push` reports, not the tag — a tag can
      # be moved, a digest cannot.
      CHART_DIGEST="$(awk '/Digest: /{print $2}' /tmp/helm-push.log)"
      cosign sign --yes "ghcr.io/visiban/charts/${CHART_NAME}@${CHART_DIGEST}"

# ─── GHCR manual push — REMOVED (2026-09-28, #1084 re-audit) ──────────────────
#
# `ghcr-push-backend` / `ghcr-push-frontend` used to push :latest to GHCR
# on demand (kaniko, amd64-only) via the play button on any pipeline's
# deploy stage. Removed: since #1084 restored multi-arch publishing, GHCR
# `:latest` is a real linux/amd64+arm64 manifest list between release tags
# (see the "Docker push" comment block above; main merges push `:main`,
# never `:latest`, since #1409) — these jobs had no `rules:`
# restricting them to any particular pipeline, so clicking either one on
# ANY pipeline would silently overwrite that multi-arch manifest with a
# single-arch amd64 image, with no arm64 leg or manifest-assembly step to
# put it back. A manual job nobody remembers exists is exactly how that
# regression ships. There is no arch-safe on-demand equivalent yet — an
# on-demand GHCR push would need the same runner-preflight + per-arch +
# manifest-assembly shape as the real release path above, for a job whose
# entire reason to exist was being cheaper than that. If one is needed
# again, it must be arch-proofed the same way, not resurrected as a bare
# kaniko destination. See docs/maintainers/tokens-and-rotation.md for the
# GHCR_TOKEN rotation test this removal changes.
#
# `.gitlab/ghcr-push.yml`, a standalone alternate-config pipeline with the
# same amd64-only kaniko-to-`:latest` shape, was removed alongside these for
# the same reason — it wasn't included in this file's pipeline and no
# schedule targeted it, but a maintainer running it manually (CI/CD → Run
# pipeline → select that config file) would have hit the identical
# regression.

# ─── Scheduled — release image survival ───────────────────────────────────────
#
# TruePPM's beta-readiness audit #0 (🔴 URGENT, see #1074): a GitLab
# container-registry cleanup policy with no keep-regex deleted the released
# v0.3.0-alpha.3 backend/frontend images days after that release shipped —
# confirmed 404, no version-pinned install possible, rollback impossible. The
# publish jobs had gone green; the images vanished afterward, from a project
# setting that lives outside this repo and that no pipeline asserts. There is
# no commit to review and no job that goes red on its own when that happens —
# the only way to notice is to go look, on a schedule.
#
# Checks the newest vX.Y.Z release's backend/frontend images on BOTH
# registries Visiban publishes to (${CI_REGISTRY_IMAGE} and
# ghcr.io/visiban/visiban — see
# docs/administration/container-image-retention.md for the retention setting
# recorded on each). Runs on every scheduled pipeline, same slot helm-install
# and helm-netpol already use, so this needs no new schedule infrastructure.
# Deliberately NOT allow_failure (unlike those two): a self-hoster who cannot
# pull the version the docs told them to run has no working install, so a
# missing image is a release defect and must read red.
#
# `crane` (go-containerregistry) inspects manifests without a daemon or a
# pull — kaniko-free, matching the rest of this repo's registry tooling.
# Same docker-config auth shape as .kaniko-push-common, read-only here.
check-release-images:
  stage: deploy
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache bash git crane jq
    - |
      mkdir -p "$HOME/.docker"
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      if [ -n "${GHCR_USER}" ] && [ -n "${GHCR_TOKEN}" ]; then
        AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      fi
      printf '{"auths":{%s}}' "${AUTHS}" > "$HOME/.docker/config.json"
    # Scheduled pipelines otherwise clone at the project's default depth,
    # which may not include every historical tag — fetch them explicitly so
    # resolve_latest_release_tag() sees the real newest release.
    - git fetch origin --tags --force
  script:
    - bash scripts/check-release-images.sh --self-test
    - bash scripts/check-release-images.sh

# ─── Scheduled — the chart a bare `helm install` resolves to (#1155) ──────────
#
# Nothing else reads the chart registry after a release. A chart published
# under a plain version before its pre-release line (0.9.0 ahead of
# 0.9.0-beta.N) outranks every pre-release under semver, so a bare
# `helm install oci://ghcr.io/visiban/charts/visiban` keeps resolving to it,
# even with --devel, while every pipeline stays green: a wrong artifact sitting
# in a registry is not a diff event. This job resolves what a bare install gets
# (the highest STABLE chart, since Helm skips pre-releases), reads its
# appVersion, and requires the default image tag (v<appVersion>) to exist for
# the backend and frontend images. Registry reads only, no cluster.
# An unreadable registry exits 2 (red), never "absent". Deliberately NOT
# allow_failure, for the same reason as check-release-images above. The publish
# side of the same script runs in helm-publish (`--candidate`).
check-chart-registry:
  # cosign from `.cosign-pin` (#2373): the live check verifies the resolved
  # chart's signature, same pinned+checksummed install as helm-publish.
  extends: .cosign-pin
  stage: deploy
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
  before_script:
    - apk add --no-cache bash curl
    - |
      (
        set -eu
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
        echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
        chmod +x /usr/local/bin/cosign
      )
  script:
    - bash scripts/check-chart-registry.sh --self-test
    - bash scripts/check-chart-registry.sh

# ─── Scheduled — release signature + SBOM survival (#1542) ────────────────────
#
# check-release-images (above) proves the released image still exists. It does
# not look at the `sha256-<digest>.sig` / `.att` tags cosign stores beside it
# (#1153), so a registry cleanup sweep (the GitLab registry's current policy
# can delete them ~90 days after a release, #1541) or a manual delete would
# remove every signature and SBOM with no job going red. This job re-runs
# `cosign verify` and `cosign verify-attestation --type cyclonedx` for the
# newest ATTEST_CHECK_COUNT releases (default 3) whose own .gitlab-ci.yml
# defines the image-attest jobs, i.e. that were signed at release time, on
# both images, BOTH registries, the index and each platform digest, with the documented tag-only identity
# (docs/administration/image-verification.md). Zero attestations is a failure.
# Releases cut before #1153 were never signed and are listed as not checked
# (#1606); until one is cut after #1153 the job exits 0 with a notice.
# GIT_DEPTH 0: the script reads .gitlab-ci.yml at each tag and fails on a tag
# commit missing from the clone, so it needs full history, not a shallow
# clone plus whatever `git fetch --tags` happens to deepen.
#
# Gated on the Nightly schedule's existing CVE_SCAN=true variable rather than
# "any schedule": it spends cosign downloads and Sigstore transparency-log
# lookups, and the Nightly schedule is already the daily slot for registry-
# facing checks. No new schedule or schedule variable is needed, and
# schedule-config-check already sees CVE_SCAN covered. Not allow_failure, for
# the same reason as check-release-images.
#
# Releases signed later by `image-attest-backfill` carry the main-or-tag
# identity (and, if they predate #1153, are only in scope once listed): list
# each one in ATTEST_BACKFILLED_TAGS (space-separated) with the
# issue that justified it. A permanent per-reference exception goes in
# ATTEST_ACCEPTED_GAPS, likewise with a comment. Both are empty on purpose.
# cosign comes from `.cosign-pin`, shared with image-attest and helm-publish.
check-release-attestations:
  extends: .cosign-pin
  stage: deploy
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
  variables:
    GIT_DEPTH: "0"
    ATTEST_CHECK_COUNT: "3"
    ATTEST_BACKFILLED_TAGS: ""
    ATTEST_ACCEPTED_GAPS: ""
  before_script:
    - apk add --no-cache bash git curl jq crane
    - |
      set -eu
      curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
      echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
      if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot verify the GHCR images."
        exit 1
      fi
      mkdir -p "$HOME/.docker"
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      printf '{"auths":{%s}}' "${AUTHS}" > "$HOME/.docker/config.json"
    # Fetch every tag so the newest N releases are the real newest N. GIT_DEPTH
    # 0 does not unshallow a build dir the fetch strategy reuses from an
    # earlier shallow clone, and the script fails on a shallow repo (ancestry
    # decides pre-signing vs. signing dropped, #1606), so unshallow first.
    - |
      # Fail closed like gitleaks-history: anything but "false" is treated as
      # shallow; the shallow-file guard keeps a complete repo from erroring.
      if [ "$(git rev-parse --is-shallow-repository)" != "false" ] \
          && [ -f "$(git rev-parse --git-dir)/shallow" ]; then
        git fetch --unshallow origin
      fi
    - git fetch origin --tags --force
  script:
    - bash scripts/check-release-attestations.sh --self-test
    - bash scripts/check-release-attestations.sh

# ─── GitHub Release ────────────────────────────────────────────────────────────
#
# Runs only on version tag pipelines, after both images are confirmed pushed
# and (#1084) the multi-arch manifest lists assembled — so the GHCR references
# in the release notes already resolve to linux/amd64+arm64 by the time the
# release is visible.
# Reads release notes for the tag from CHANGELOG.md and creates a GitHub Release
# with GHCR image references appended. Any tag that is not strictly vX.Y.Z is
# marked pre-release, as classified by scripts/classify-release-tag.sh (#1410).
# GH_TOKEN CI variable (repo-scoped PAT) is passed through automatically.

github-release:
  interruptible: false  # creates the GitHub release (#2419)
  retry: 0  # a second release create fails on the one already made (#2462)
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  needs: [release-main-pipeline-guard, backend-docker-push, frontend-docker-push, backend-manifest, frontend-manifest]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    # bash: scripts/classify-release-tag.sh has a bash shebang and uses `local`.
    - apk add --no-cache github-cli bash
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      # The dated section opens with the approved roll-up summary (stable feature
      # releases, #1995), so this body carries the same content as the GitLab
      # Release's (whitespace between fragment bullets may differ; a summary cannot
      # contain `---` lines, release.sh refuses them), except that it is capped when
      # over GitHub's 125,000-character limit (see the cap below, #2537). The extraction
      # lives in a script that release.sh --self-test also exercises.
      NOTES=$(sh scripts/extract-release-notes.sh "${VERSION}" CHANGELOG.md)
      if [ -z "$NOTES" ]; then
        NOTES="See [CHANGELOG.md](https://gitlab.com/visiban/visiban/-/blob/main/CHANGELOG.md) for details."
      fi

      # Pre-release classification comes from the same script that gates the
      # :latest registry aliases in backend-manifest/frontend-manifest, so the
      # GitHub "pre-release" badge can never disagree with them (#1410). Anything
      # not strictly vX.Y.Z (alpha/beta/rc, or any other suffix) is a pre-release.
      STABLE="$(bash scripts/classify-release-tag.sh "${CI_COMMIT_TAG}" | sed -n 's/^STABLE=//p')"
      # No pipefail in alpine sh: a missing/crashed script would leave STABLE empty
      # and silently flag a real stable release as --prerelease, so fail loudly.
      [ -n "$STABLE" ] || { echo "classify-release-tag.sh produced no STABLE value for ${CI_COMMIT_TAG}" >&2; exit 1; }
      PRERELEASE_FLAG=""
      if [ "$STABLE" != "true" ]; then
        PRERELEASE_FLAG="--prerelease"
      fi

      # GitHub refuses a Release body over 125,000 characters (#2537); 1.3.0-alpha.1's
      # notes are ~179,000. Cap them (Security and the summary stay whole) and link the
      # full notes on the GitLab Release, which release.sh created before this tag ran.
      # 124000 bytes leaves room for the Docker images footer below.
      NOTES=$(printf '%s\n' "$NOTES" | sh scripts/cap-release-notes.sh 124000 "https://gitlab.com/visiban/visiban/-/releases/${CI_COMMIT_TAG}")

      NOTES_FILE=$(mktemp)
      printf '%s\n\n---\n\n**Docker images**\n\n```\nghcr.io/visiban/visiban/backend:%s\nghcr.io/visiban/visiban/frontend:%s\n```\n' \
        "$NOTES" "${CI_COMMIT_TAG}" "${CI_COMMIT_TAG}" > "$NOTES_FILE"

      gh release create "${CI_COMMIT_TAG}" \
        --repo "visiban/visiban" \
        --title "${CI_COMMIT_TAG}" \
        --notes-file "$NOTES_FILE" \
        ${PRERELEASE_FLAG}
      rm -f "$NOTES_FILE"

# ─── Docs — versioned with mike ───────────────────────────────────────────────
#
# mike manages a versioned MkDocs site on the gh-pages branch.
# Docs are deployed by scripts/release.sh as part of the release process.
#
# This CI job exists only as a manual recovery tool — e.g. if a release script
# run was interrupted after tagging but before mike deployed. To redeploy:
# CI/CD → Run pipeline on main → set DOCS_VERSION=<version tag> → play job.
# The docs content used is whatever is on main at the time of the manual trigger.
#
# After mike pushes to gh-pages, GitLab triggers a new pipeline on that branch.
# The "pages" job (which must be named exactly "pages") runs there, copies the
# branch content to public/, and GitLab Pages serves it at docs.visiban.com.
#
# Required CI/CD project variable (Settings → CI/CD → Variables):
#   DOCS_DEPLOY_TOKEN — a project access token with "write_repository" scope,
#                       used so mike can push to the gh-pages branch.
#                       Create at Settings → Access Tokens → role: Developer,
#                       scope: write_repository. Store as a masked variable.
#
# Added: 2026-03-13

docs-deploy:
  interruptible: false  # publishes the docs site (#2419)
  retry: 0  # publishes the docs site; not re-run blindly (#2462)
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # #1154: the tag-pipeline run waits for the guard. On main the guard exits at
  # once, so the main run is not gated; #1997: instead, main skips any version
  # whose tag is not on origin yet (`resolve-docs-version.sh --require-tag`). The
  # release merge sets APP_VERSION=<tag> before the tag exists, so its versioned
  # docs are now published only by the tag pipeline, after the guard.
  needs: [release-main-pipeline-guard]
  variables:
    DOCS_VERSION: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - !reference [.pip-floor, script]
    - pip install --quiet -r docs/requirements.txt
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    # Restore existing gh-pages history so mike can append to it.
    # Force-update in case a stale local branch exists from a previous job on the same runner.
    - git fetch origin gh-pages --depth=1 && (git branch -f gh-pages origin/gh-pages 2>/dev/null || git branch gh-pages origin/gh-pages) || true
  script:
    # Self-test runs first, per #1093's gate-selftest-parity rule.
    - bash scripts/resolve-docs-version.sh --self-test
    - |
      # Resolution + v-prefix normalization lives in a standalone script so
      # it's unit-testable (scripts/tests/resolve-docs-version.test.sh) —
      # see scripts/resolve-docs-version.sh for why normalization must be
      # unconditional across all three VERSION sources (#1270).
      # --require-tag (#1997): a push to main whose APP_VERSION tag does not exist
      # yet (the release merge) deploys nothing; the tag pipeline publishes it.
      # #2398: also requires the tag pipeline's release-main-pipeline-guard job to
      # be `success` (read with GITLAB_API_TOKEN, the guard's own variable), so a
      # refused release's tag cannot publish its docs from main.
      rc=0; VERSION=$(scripts/resolve-docs-version.sh --require-tag) || rc=$?
      if [ "$rc" -eq 3 ]; then
        echo "INFO: the release tag does not exist yet; its versioned docs are published by the tag pipeline, after release-main-pipeline-guard."
        exit 0
      elif [ "$rc" -eq 5 ]; then
        echo "INFO: the release tag exists but its release-main-pipeline-guard job is not success (refused, still running, or missing); not deploying its docs from main. The tag pipeline's docs-deploy publishes them once the guard passes (#2398)."
        exit 0
      elif [ "$rc" -eq 4 ]; then
        echo "ERROR: could not look up the release tag or its release-main-pipeline-guard status (is GITLAB_API_TOKEN available on main?); failing rather than silently skipping the docs deploy." >&2
        exit 1
      elif [ "$rc" -ne 0 ]; then
        # Manual trigger from main without DOCS_VERSION set and no APP_VERSION found.
        echo "INFO: no version to deploy. Re-run with DOCS_VERSION=<tag> to publish docs."
        exit 0
      fi
      if echo "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
        MINOR=$(echo "$VERSION" | grep -oE '^v?[0-9]+\.[0-9]+')
        mike deploy --push --update-aliases "$VERSION" "${MINOR}" latest
        mike set-default --push "${MINOR}"
      else
        mike deploy --push --update-aliases "$VERSION" next
      fi
  rules:
    # Auto-deploy on version tags (pushed by scripts/release.sh)
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
      variables:
        DOCS_VERSION: $CI_COMMIT_TAG
    # Auto-deploy on main when docs content or mkdocs config changes
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - mkdocs.yml
      when: on_success
    # Manual recovery on main — set DOCS_VERSION in pipeline variables
    #
    # allow_failure: true is required here even though this is already a
    # manual job: when `when: manual` is set inside a `rules:` entry (as
    # opposed to bare at the job level), GitLab defaults allow_failure to
    # false, not true — so without this, an un-triggered docs-deploy blocks
    # main's pipeline from ever reporting "success", which shows as
    # "blocked"/manual (not green) on the pipeline widget and the
    # shields.io/GitLab pipeline badge. seed-demo-data and nightly-load-test
    # already set this explicitly for the same reason.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

# ─── Nightly schedule: CVE/OSV, Sonar, deep fuzz, kaizen (#1383) ─────────────
#
# One consolidated schedule instead of one per job, so the project pays for one
# full scheduled pipeline a night rather than N. backend-dep-scan and
# frontend-dep-scan and trivy-scan (security stage above) run on it with
# CVE_SCAN=true (trivy-scan has no other main trigger, #1267).
# Unlike their MR counterparts they use allow_failure: false, so a new
# HIGH/CRITICAL CVE causes the pipeline to fail and GitLab emails all
# maintainers who have "Failed pipeline" notifications enabled.
#
# To enable email notifications:
#   Profile → Notifications → Global notification level → "Watch"
#   or set per-project in Project → Notification settings → "Failed pipeline"
#
# The schedule itself is configured in GitLab: CI/CD → Schedules (schedule id
# 4176726, formerly "Weekly CVE scan"):
#   Description : Nightly (CVE/OSV, Sonar, deep fuzz, kaizen)
#   Interval    : 0 3 * * *  (daily 03:00 America/New_York, three hours after the load test)
#   Target branch: main
#   Variables   : CVE_SCAN=true OSV_SCAN=true SONAR_SCHEDULED=true
#                 FUZZ_DEEP=true KAIZEN_YIELD_WATCH=true
# backend-mutation keeps its own weekly schedule (4485984, Sundays 06:00
# America/New_York, MUTATION_TEST=true): 50 shards are too heavy for the Nightly.
# nightly-load-test keeps its own 00:00 America/New_York schedule
# (LOAD_TEST_SCHEDULE=true): its latency budgets are noisy on a busy runner. The full schedule table, and
# what red means for each job, is in docs/development/ci-gates.md.
#
# ─── Scheduled branch cleanup ─────────────────────────────────────────────────
#
# Deletes remote branches that have been fully merged into main.
# Runs on a GitLab CI schedule (e.g. weekly) — not on every push.
#
# Requires the same DOCS_DEPLOY_TOKEN variable used by docs-deploy
# (write_repository scope is sufficient to delete branches).
#
# Protected branches (main, gh-pages) are never touched — GitLab enforces
# this server-side regardless, but the grep exclude below makes the intent
# explicit. The gh-pages branch is managed by mike and must never be deleted.
#
# To configure the schedule: CI/CD → Schedules → New schedule → set branch
# to main and cron to "0 3 * * 1" (Mondays at 03:00 UTC).

cleanup-merged-branches:
  interruptible: false  # deletes remote branches (#2419)
  retry: 0  # deletes remote branches (#2462)
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  needs: []
  before_script:
    - apk add --no-cache git
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch --prune origin
  script:
    - |
      # grep -v exits 1 when no lines match (all merged branches already gone).
      # The || true prevents pipefail from killing the job in that success case.
      merged=$(git branch -r --merged origin/main \
        | { grep -v 'origin/main$\|origin/HEAD\|origin/gh-pages' || true; } \
        | sed 's|origin/||' \
        | xargs)
      if [ -z "$merged" ]; then
        echo "No merged branches to delete."
      else
        echo "Deleting: $merged"
        echo "$merged" | xargs git push origin --delete
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ─── Demo data seed ───────────────────────────────────────────────────────────
#
# Refreshes the Visiban Demo Board on the dedicated demo environment.
# Manual-only, on main (#1232). It has no pipeline schedule: try.visiban.com
# (k3s Helm chart demo mode, #1180) replaced the weekly CI reseed, and the
# DEMO_* variables this job needs were never provisioned. Kept as an on-demand
# path for a legacy Compose-based demo environment.
#
# Setup (only if you use this job):
#   Create protected CI/CD variables DEMO_DATABASE_URL, DEMO_REDIS_URL and
#   DEMO_SECRET_KEY (Settings → CI/CD → Variables), then run the job manually
#   from a main pipeline.
#
# The --wipe flag deletes the "Visiban Demo Board" and recreates it from scratch.
# --force overrides the DEBUG=False guard so the command runs in CI without DEBUG=True.
# Board-scoped wipe: only the demo board is deleted; all other data is untouched.
#
# PROTECTION: The "demo" environment must be configured as a protected environment
# in GitLab (Settings → CI/CD → Protected environments) so only maintainers can
# trigger this job. Without this, any developer with push access can wipe the demo board.

seed-demo-data:
  interruptible: false  # writes to the demo environment (#2419)
  retry: 0  # writes to the demo environment (#2462)
  stage: deploy
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  environment:
    name: demo
    deployment_tier: staging
  variables:
    DATABASE_URL: $DEMO_DATABASE_URL
    REDIS_URL: $DEMO_REDIS_URL
    DJANGO_SECRET_KEY: $DEMO_SECRET_KEY
    DEBUG: "False"
    ALLOWED_HOSTS: "localhost"
    # Set SEED_VALUE in the manual trigger variables to use a custom random
    # seed. Leave unset to use the default (today's date, YYYYMMDD).
    SEED_VALUE: ""
  before_script:
    # Fail fast with a clear message if the required CI/CD variables are missing.
    # Without these the job dies mid-pip-install with an unhelpful Django traceback.
    # Setup instructions: docs/administration/demo-data.md#required-gitlab-cicd-variables
    - |
      missing=""
      [ -z "$DJANGO_SECRET_KEY" ] && missing="$missing DEMO_SECRET_KEY"
      [ -z "$DATABASE_URL" ]      && missing="$missing DEMO_DATABASE_URL"
      [ -z "$REDIS_URL" ]         && missing="$missing DEMO_REDIS_URL"
      if [ -n "$missing" ]; then
        echo "ERROR: Required CI/CD variable(s) not set:$missing"
        echo "Add them at Settings → CI/CD → Variables (Protected + Masked, scoped to the 'demo' environment)."
        echo "See docs/administration/demo-data.md for full setup instructions."
        exit 1
      fi
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
  script:
    - cd backend
    # Use today's date (YYYYMMDD) as the random seed so each refresh
    # produces a naturally varied board while remaining reproducible within
    # the same day. Override by setting SEED_VALUE in the manual trigger variables.
    - python manage.py seed_demo_data --wipe --force --seed ${SEED_VALUE:-$(date +%Y%m%d)}
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

# ─── Query-count benchmark gate ────────────────────────────────────────────────
#
# Runs `manage.py benchmark --fail-on-budget` (#1341). The command seeds its own
# throw-away board, so no seed_demo_data step is needed. It fails the job on a
# non-2xx response (CommandError, #1330), on DEBUG being off (CommandError), or
# on any endpoint exceeding its query budget (exit 1).
#
# MANUAL on purpose (owner decision on #1341): the identical
# `benchmark --fail-on-budget` already runs on Postgres inside backend-test on
# every backend MR (BenchmarkCommandCiGateTests.test_within_budget_passes_with_fail_on_budget),
# so an automatic job would be near-redundant and cost a Postgres+Valkey pair per
# MR. Run it on demand for: DEBUG from the environment, a run outside a TestCase
# transaction, and a fresh `migrate`. allow_failure: true so an unrun manual job
# never blocks the pipeline. Never on schedules or tags.
# Latency/index regressions stay with nightly-load-test.
backend-benchmark:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  allow_failure: true
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    # DEBUG is required to count queries; the command hard-fails without it.
    DEBUG: "True"
    # Deliberately restrictive: proves the command's own "testserver" host
    # scoping works (#1330) rather than relying on a permissive setting.
    ALLOWED_HOSTS: "localhost"
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py migrate --noinput
    - python manage.py benchmark --fail-on-budget
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: manual
      allow_failure: true

# ─── Nightly load test ─────────────────────────────────────────────────────────
#
# Measures p50/p95/p99 latency for the endpoints most sensitive to data volume
# and fails the pipeline if any exceeds its committed budget (#1082).
#
# Why this exists alongside perf-check/perf-bench: those two are both a
# query-COUNT check (static N+1 review and on-demand query counting) — neither
# can see a regression that keeps the query count and query text identical and
# just makes the same queries slower, which is the normal shape of a missing-
# index or data-volume regression. This job measures wall-clock latency
# directly, against a large seeded fixture, closing that gap. See
# docs/development/nightly-load-test.md for the full contract (fixture size,
# budget-derivation rule, how to re-derive at each release) and
# backend/nightly-load-test-baseline.json for the committed budgets.
#
# To configure the schedule: CI/CD → Schedules → New schedule → target branch
# main, cron "0 0 * * *" in timezone America/New_York (midnight Eastern, i.e.
# 04:00 UTC in daylight time), variable LOAD_TEST_SCHEDULE=true.
# Can also be run manually at any time (advisory — allow_failure: true) via
# "Run pipeline" or the pipeline's manual job button.
nightly-load-test:
  interruptible: false  # scheduled-only latency baseline; a merge must not cancel it (#2421)
  extends: .pip-cache
  stage: test
  needs: []
  # Latency budgets are absolute ms measured on a NUC runner (see
  # backend/nightly-load-test-baseline.json), so the job must run on the same
  # hardware class. Untagged, it landed on gitlab-runner-dell-01-visiban on
  # 2026-10-08 and failed three light endpoints by 1.3-1.8x with no code change.
  tags: [nuc]
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    # Swimlane-replication factor for seed_demo_data --scale — see that
    # command's docstring. 20 -> 200 swimlanes, ~2,400 cards, matching the
    # fixture backend/nightly-load-test-baseline.json's budgets were derived
    # against. Override in a manual pipeline run to test a different fixture
    # size without editing this file.
    LOAD_TEST_SCALE: "20"
    LOAD_TEST_ITERATIONS: "40"
    LOAD_TEST_WARMUP: "5"
    # CI-only file; provision_fuzz_token writes the raw PAT here (mode 0600),
    # never to job output — same pattern as backend-schema-fuzz.
    VISIBAN_LOAD_TEST_TOKEN_FILE: "/tmp/visiban_load_test_token"
    # Second token, for demo1 (the load-test board's owner), used ONLY by the
    # board_list scenario (#1723): demo2 is a plain member, so the board-list
    # access query would only ever see demo2's own membership row and the
    # board's 20 members would not be exercised.
    VISIBAN_LOAD_TEST_OWNER_TOKEN_FILE: "/tmp/visiban_load_test_owner_token"
    # Third token, for demo3 (owner of the --extra-boards fixture, so it can access
    # ~200 boards), used ONLY by the card_search_multi_board scenario (#1810).
    VISIBAN_LOAD_TEST_MULTI_BOARD_TOKEN_FILE: "/tmp/visiban_load_test_multi_board_token"
    # Extra boards demo3 owns (#1810): 199 + the load-test board = 200 accessible ids.
    LOAD_TEST_EXTRA_BOARDS: "199"
    # Fourth token, for loadtest_analytics, the only member of the aged and linked
    # boards (#2430, #2424): their own account keeps every other scenario's data as
    # the committed budgets were derived on it.
    VISIBAN_LOAD_TEST_ANALYTICS_TOKEN_FILE: "/tmp/visiban_load_test_analytics_token"
    # Archived generations on the aged board, 90 days apart: 4 is about a year of
    # history (about 12k cards, 125k movements) behind 2.4k active cards (#2430).
    LOAD_TEST_AGED_GENERATIONS: "4"
    # runserver's PID, so the script can read its peak RSS from /proc (#2430).
    VISIBAN_LOAD_TEST_SERVER_PID_FILE: "/tmp/visiban_load_test_server.pid"
  before_script:
    - !reference [.pip-floor, script]
    - !reference [.uv-install, script]
    - uv pip install --system --quiet -r backend/requirements.txt
    - cd backend
    - python manage.py migrate --noinput
    # A dedicated, larger board — never the normal demo board — so this job's
    # fixture size is independent of and cannot collide with seed-demo-data's
    # manual refresh of "Visiban Demo Board".
    - python manage.py seed_demo_data --force --scale ${LOAD_TEST_SCALE} --extra-boards ${LOAD_TEST_EXTRA_BOARDS} --with-notifications --aged-generations ${LOAD_TEST_AGED_GENERATIONS} --linked-boards
    # --set-random-password: same defense in depth as backend-schema-fuzz
    # (#1607, #1609); the load profile does not change passwords today, but the
    # token must not be revocable by one. Throwaway CI database only.
    - python manage.py provision_fuzz_token --username demo2 --token-file "${VISIBAN_LOAD_TEST_TOKEN_FILE}" --set-random-password
    - python manage.py provision_fuzz_token --username demo1 --token-file "${VISIBAN_LOAD_TEST_OWNER_TOKEN_FILE}" --set-random-password
    - python manage.py provision_fuzz_token --username demo3 --token-file "${VISIBAN_LOAD_TEST_MULTI_BOARD_TOKEN_FILE}" --set-random-password
    - python manage.py provision_fuzz_token --username loadtest_analytics --token-file "${VISIBAN_LOAD_TEST_ANALYTICS_TOKEN_FILE}" --set-random-password
    # The seed bulk-inserts about 100k+ movements just before measuring. Production
    # databases are autovacuumed; a fresh CI Postgres may not be yet, so the job could
    # measure on stale statistics, with no visibility map, or overlapping autovacuum
    # (#2518). VACUUM ANALYZE cannot run in a transaction block; Django's default
    # autocommit connection is fine. A failure raises and fails the job.
    - |
      python manage.py shell -c "
      from django.db import connection
      with connection.cursor() as c:
          c.execute('VACUUM ANALYZE')
          c.execute(\"SELECT last_analyze IS NOT NULL FROM pg_stat_user_tables WHERE relname = 'card_movements'\")
          print('VACUUM ANALYZE done; card_movements manually analyzed:', c.fetchone()[0])
      "
    # Server output goes to an artifact, not the job log (#1611), same as
    # backend-schema-fuzz (#1607). after_script tails it on failure.
    # --noreload: the autoreloader would make $! the reloader parent, whose RSS is not
    # the server's. The PID file is how the script reads the server's peak RSS (#2430).
    - python manage.py runserver --noreload 0.0.0.0:8000 > "${CI_PROJECT_DIR}/nightly-load-test-server.log" 2>&1 &
    - echo $! > "${VISIBAN_LOAD_TEST_SERVER_PID_FILE}"
    # Poll liveness instead of a fixed sleep, same pattern as oidc-smoke /
    # backend-schema-fuzz.
    - |
      for i in $(seq 1 30); do
        python3 -c "import requests; requests.get('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
  script:
    # Self-test immediately before the real invocation, same image (#1093) —
    # proves the percentile/budget-comparison detection logic still fires
    # before trusting this run's verdict.
    - python3 scripts/nightly_load_test.py --self-test
    - python3 scripts/check_email_login_plan.py --self-test
    - |
      set +e
      python3 scripts/nightly_load_test.py \
        --base-url http://localhost:8000 \
        --token-file "${VISIBAN_LOAD_TEST_TOKEN_FILE}" \
        --owner-token-file "${VISIBAN_LOAD_TEST_OWNER_TOKEN_FILE}" \
        --multi-board-token-file "${VISIBAN_LOAD_TEST_MULTI_BOARD_TOKEN_FILE}" \
        --analytics-token-file "${VISIBAN_LOAD_TEST_ANALYTICS_TOKEN_FILE}" \
        --server-pid-file "${VISIBAN_LOAD_TEST_SERVER_PID_FILE}" \
        --min-multi-boards "$((LOAD_TEST_EXTRA_BOARDS + 1))" \
        --board-name "Visiban Load Test Board" \
        --budget-file backend/nightly-load-test-baseline.json \
        --iterations "${LOAD_TEST_ITERATIONS}" \
        --warmup "${LOAD_TEST_WARMUP}" \
        --output nightly-load-test-results.json
      latency_rc=$?
      # Email login (#1298): a plan check, not a latency scenario. A login is two
      # password hashes (hundreds of ms), which hide a 2-3 ms sequential scan at 20k
      # users, so this tops the users table up to a realistic size (after every
      # latency scenario, so it cannot move a budget) and fails if the real
      # resolve_login_user lookup stops using user_email_upper_idx. It runs even when
      # a latency budget failed, so one red run reports both.
      python3 scripts/check_email_login_plan.py --users 20000
      plan_rc=$?
      [ "$latency_rc" -ne 0 ] && echo "FAILED: latency step (exit ${latency_rc})"
      [ "$plan_rc" -ne 0 ] && echo "FAILED: email login plan check (exit ${plan_rc})"
      [ "$latency_rc" -eq 0 ] && [ "$plan_rc" -eq 0 ]
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -f nightly-load-test-server.log ]; then
        echo "Last 200 lines of server output (full log: artifact nightly-load-test-server.log, #1611):"
        tail -n 200 nightly-load-test-server.log
      fi
  artifacts:
    when: always
    # One artifacts block per job, so the server log shares the results file's
    # 90-day expiry and developer-only access (#1611).
    access: developer
    expire_in: 90 days
    paths:
      - nightly-load-test-results.json
      - nightly-load-test-server.log
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LOAD_TEST_SCHEDULE == "true"'
    - when: manual
      allow_failure: true

# ─── Scheduled — pipeline schedule configuration audit ─────────────────────────
#
# #1213: nightly-load-test above required a manual, one-time GitLab UI step
# (CI/CD → Schedules → New schedule) that was never done, and nothing in this
# repo asserted it existed — the schedule is GitLab project configuration,
# not a file a diff touches. The gap sat unnoticed long enough for a real
# ~40% p95 regression to ship undetected. Same failure shape as
# check-release-images (#1074): config that lives outside the repo, that no
# commit touches and no job goes red on, so the only way to notice it
# drifting is to go and look, on a schedule.
#
# Derives the set of variables every `$CI_PIPELINE_SOURCE == "schedule" &&
# $VAR == "true"` rule in this file actually needs (never hardcoded — same
# reasoning as gate-selftest-parity) and fails, naming the variable, if no
# *active* GitLab pipeline schedule sets it. See scripts/check-pipeline-schedules.sh
# and docs/development/ci-gates.md.
#
# Runs on every scheduled pipeline, same slot check-release-images/
# helm-install/helm-netpol already use, so this needs no new schedule of its
# own to be exercised. It only asserts anything when a GITLAB_API_TOKEN CI
# variable (personal access token, read_api scope, owner Maintainer, since
# GitLab returns schedule variables only to Maintainers and schedule owners;
# see docs/maintainers/tokens-and-rotation.md) is
# configured: CI_JOB_TOKEN cannot read pipeline schedules, so without
# GITLAB_API_TOKEN the lookup is inconclusive and the job warns and passes
# rather than report a false MISSING. The project has had one since
# 2026-10-31 (#1996), so the check now asserts. Before #1383 the script also stopped at the rejected CI_JOB_TOKEN and
# never tried GITLAB_API_TOKEN at all; it now falls through.
#
# SCHEDULE_AUDIT_ACCEPTED_GAPS (unset here, so empty) once listed gaps #1213's own
# audit found and filed as #1232 — a documented, temporary exception (same shape as
# check-release-images' ACCEPTED_GAPS), not a way to quiet this gate
# permanently. #1232's entries are all resolved, and MUTATION_TEST (#1384), the
# last temporary entry, was removed once a schedule carried it, so the
# list is empty (the script's default) and every schedule-gated variable must
# be on an active schedule.
schedule-config-check:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/check-pipeline-schedules.sh --self-test
    - bash scripts/check-pipeline-schedules.sh

# Runs on the gh-pages branch after docs-deploy pushes to it.
# Copies the branch content to public/ for GitLab Pages to serve.
# The job name must be exactly "pages" for GitLab Pages to pick it up.
pages:
  interruptible: false  # GitLab Pages deploy (#2419)
  retry: 0  # GitLab Pages deploy; not re-run blindly (#2462)
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  needs: []
  script:
    - cp -r . public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages"'
