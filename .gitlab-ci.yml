stages:
  - lint
  - test
  - security

# ─── Backend ──────────────────────────────────────────────────────────────────

backend-test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: visiban_test
    POSTGRES_USER: visiban
    POSTGRES_PASSWORD: ci_password
    DATABASE_URL: "postgres://visiban:ci_password@postgres:5432/visiban_test"
    REDIS_URL: "redis://redis:6379/0"
    DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet coverage
  script:
    - cd backend
    - coverage run --source=. manage.py test boards accounts groups --verbosity=0
    - coverage report --skip-covered
    - coverage xml -o coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    when: always

# ─── Frontend ─────────────────────────────────────────────────────────────────

frontend-lint:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm run lint

frontend-test:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm test -- --reporter=verbose
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
    - when: never

# ─── Code quality ─────────────────────────────────────────────────────────────

# Ruff is a fast Python linter (replaces flake8 + isort + pyupgrade).
# allow_failure: true — style warnings do not block merges but are visible in CI.
backend-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check backend/
  allow_failure: true

# ─── Security — SAST ──────────────────────────────────────────────────────────

# Bandit: Python SAST. Flags common issues — SQL injection, shell injection,
# hardcoded secrets, weak crypto, unsafe deserialization, etc.
# --severity-level medium skips low/informational noise.
backend-sast:
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install --quiet bandit
  script:
    - bandit -r backend/
      --severity-level medium
      --confidence-level medium
      --exclude backend/boards/migrations,backend/groups/migrations,backend/accounts/migrations
      -f txt
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - bandit-report.json
  after_script:
    - bandit -r backend/
      --severity-level medium
      --confidence-level medium
      --exclude backend/boards/migrations,backend/groups/migrations,backend/accounts/migrations
      -f json -o bandit-report.json 2>/dev/null || true

# ─── Security — Dependency CVE scanning ───────────────────────────────────────

# pip-audit: checks Python packages against the OSV vulnerability database.
# Fails on any known CVE — pin or upgrade before merging.
backend-dep-scan:
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit -r backend/requirements.txt --format json -o pip-audit-report.json || true
    - pip-audit -r backend/requirements.txt
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pip-audit-report.json

# npm audit: flag HIGH or CRITICAL CVEs in frontend npm dependencies.
frontend-dep-scan:
  stage: security
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm audit --audit-level=high
  allow_failure: true
  after_script:
    - cd frontend && npm audit --json > ../npm-audit-report.json 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - npm-audit-report.json

# ─── Security — Secret detection ──────────────────────────────────────────────

# detect-secrets: regex scan for accidentally committed API keys, tokens, etc.
# A .secrets.baseline file (committed) lets you track and acknowledge
# any intentional false-positives so the job stays green.
secret-detection:
  stage: security
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet detect-secrets
  script:
    - |
      if [ -f .secrets.baseline ]; then
        detect-secrets scan --baseline .secrets.baseline .
      else
        detect-secrets scan . > .secrets.baseline
        echo "No baseline found — created one. Review and commit .secrets.baseline."
      fi
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .secrets.baseline
