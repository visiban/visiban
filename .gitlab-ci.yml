stages:
  - test
  - lint

# ─── Backend ──────────────────────────────────────────────────────────────────

backend-test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: visiban_test
    POSTGRES_USER: visiban
    POSTGRES_PASSWORD: ci_password
    DATABASE_URL: "postgres://visiban:ci_password@postgres:5432/visiban_test"
    REDIS_URL: "redis://redis:6379/0"
    DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet coverage
  script:
    - cd backend
    - coverage run --source=. manage.py test boards --verbosity=0
    - coverage report --skip-covered
    - coverage xml -o coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    when: always

# ─── Frontend ─────────────────────────────────────────────────────────────────

frontend-lint:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm run lint

frontend-test:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm test -- --reporter=verbose
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
    - when: never
