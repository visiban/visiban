# ─── Catalog components ───────────────────────────────────────────────────────
#
# SAST: Semgrep-based static analysis via the official GitLab catalog component.
# Covers Python and TypeScript/JavaScript with broader rules than Bandit.
# enable_mr_pipelines: true — runs on MR pipelines in addition to branch
# pipelines, so findings gate merges. excluded_paths skips generated code.

include:
  - component: gitlab.com/components/sast/sast@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true
      excluded_paths: >-
        backend/boards/migrations,
        backend/groups/migrations,
        backend/accounts/migrations

# ─── Workflow ─────────────────────────────────────────────────────────────────
#
# Suppress branch pipelines when an MR is already open — the MR pipeline
# covers the same commit, so running both just wastes runner minutes.
# Main-branch commits always get a pipeline (post-merge verification).
# Tag pipelines run for version tags so docs-deploy can fire on release.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# Test and build run in the same stage so they execute in parallel — build
# verification (kaniko) doesn't depend on test results, and running them
# together saves a full stage of sequential waiting.
stages:
  - lint
  - test
  - security
  - deploy

# Auto-retry on runner infrastructure failures (pod watcher sync, stuck
# cleanup, image pull transients). Only retries on runner_system_failure
# and stuck_or_timeout_failure — never on script failures.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ─── Rule templates ───────────────────────────────────────────────────────────
#
# Extend jobs with .on-mr to restrict them to MR pipelines only.
# Lint and test jobs use path-based rules so they only run when relevant
# files change, with a fallback to always run on the default branch.

.on-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── Cache templates ──────────────────────────────────────────────────────────
#
# Cache uses MinIO as the S3-compatible distributed backend so all runners
# share a warm cache across jobs and branches.
#
# Required CI/CD project variables (Settings → CI/CD → Variables):
#   MINIO_ENDPOINT   — host:port of the MinIO server, e.g. minio.internal:9000
#   MINIO_ACCESS_KEY — MinIO access key
#   MINIO_SECRET_KEY — MinIO secret key
#   MINIO_BUCKET     — bucket name, e.g. visiban-ci-cache
#
# Runner config.toml must enable the S3 backend:
#   [runners.cache]
#     Type   = "s3"
#     Shared = true
#     [runners.cache.s3]
#       ServerAddress = "<MINIO_ENDPOINT>"
#       AccessKey     = "<MINIO_ACCESS_KEY>"
#       SecretKey     = "<MINIO_SECRET_KEY>"
#       BucketName    = "<MINIO_BUCKET>"
#       Insecure      = false   # set true if MinIO has no TLS
#
# Cache keys include a fixed prefix so entries are grouped cleanly inside
# the S3 bucket. The lockfile hash provides automatic invalidation when
# dependencies change. node_modules/ is cached alongside the npm download
# cache to skip extraction on warm hits.

.npm-cache:
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [frontend/package-lock.json]
    paths:
      - .npm/
      - frontend/node_modules/
    policy: pull-push

# PIP_CACHE_DIR stores downloaded wheels/sdists. pip honors this env var
# automatically so no extra flags are needed in before_script.

.pip-cache:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip"
      files: [backend/requirements.txt]
    paths: [.cache/pip/]
    policy: pull-push

# ─── Backend — lint ───────────────────────────────────────────────────────────

# Ruff lint check + CodeClimate quality report in a single job — avoids
# spinning up two pods and installing ruff twice.
# allow_failure: true — style issues are visible but do not block merges.
backend-lint:
  extends: .pip-cache
  stage: lint
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check backend/
    - ruff check backend/ --output-format=json -o ruff-raw.json || true
    - |
      python3 - <<'PY'
      import json, hashlib
      raw = json.load(open("ruff-raw.json"))
      issues = []
      for issue in raw:
          path = issue["filename"]
          row = issue["location"]["row"]
          code = issue.get("code") or "RUFF"
          msg = issue["message"]
          fp = hashlib.md5(f"{path}:{row}:{code}".encode()).hexdigest()
          issues.append({
              "type": "issue",
              "check_name": code,
              "description": f"[{code}] {msg}",
              "categories": ["Style"],
              "severity": "minor",
              "fingerprint": fp,
              "location": {"path": path, "lines": {"begin": row}},
          })
      json.dump(issues, open("code-quality-report.json", "w"))
      print(f"{len(issues)} code quality issues")
      PY
  artifacts:
    reports:
      codequality: code-quality-report.json
    paths:
      - code-quality-report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# ─── Backend — test ───────────────────────────────────────────────────────────

backend-test:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: visiban_test
    POSTGRES_USER: visiban
    POSTGRES_PASSWORD: ci_password
    DATABASE_URL: "postgres://visiban:ci_password@postgres:5432/visiban_test"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet coverage unittest-xml-reporting
  script:
    - cd backend
    - coverage run --source=. manage.py test boards accounts groups
        --testrunner=xmlrunner.extra.djangotestrunner.XMLTestRunner
        --verbosity=0
    - coverage report --skip-covered --fail-under=90
    - coverage xml -o coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      junit: backend/test-results/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    when: always

# Checks that every model change has a corresponding migration file.
# Does not connect to the database — pure filesystem + model introspection.
migration-check:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
    REDIS_URL: "redis://localhost:6379/0"
    DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py makemigrations --check --dry-run --verbosity=1

# ─── Helm — lint ─────────────────────────────────────────────────────────────
#
# Validates the Helm chart renders without errors against the default values.
# Dependency tarballs are committed under helm/visiban/charts/ so no network
# access is required. Runs on any change to the chart or values, and always
# on main so a bad chart never reaches the deploy stage undetected.

helm-lint:
  stage: lint
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  rules:
    - changes:
        - helm/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - helm lint helm/visiban -f helm/visiban/values.yaml
    - helm template visiban helm/visiban -f helm/visiban/values.yaml > /dev/null

# ─── Frontend — lint ──────────────────────────────────────────────────────────

# ESLint + TypeScript type checking in a single job — both need npm ci so
# combining them eliminates a redundant pod spin-up and install cycle.
frontend-lint:
  extends: .npm-cache
  stage: lint
  image: node:20-alpine
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm run lint
    - npx tsc -p tsconfig.app.json --noEmit

# ─── Frontend — test ──────────────────────────────────────────────────────────

frontend-test:
  extends: .npm-cache
  stage: test
  needs: []
  image: node:20-alpine
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml --coverage
  coverage: '/All files\s+\|\s+(\d+(?:\.\d+)?)\s+\|/'
  artifacts:
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    when: always

# ─── Changelog check (MR only) ────────────────────────────────────────────────
#
# Fails when CHANGELOG.md was not updated and the MR contains changes that
# warrant a changelog entry. Auto-skips for MRs that only touch:
#   - CI/CD config (.gitlab-ci.yml, .gitlab/)
#   - Documentation (docs/, *.md other than CHANGELOG.md, README*)
#   - Developer tooling (CLAUDE.md, .gitignore, scripts/, Makefile, *.sh)
#   - Test files only (frontend/src/test/, backend/*/tests/)
# To skip manually for a legitimate edge case, add the ~no-changelog label.

changelog-check:
  extends: .on-mr
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache git
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=20
    - BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD || echo "")
    - |
      if [ -z "$BASE" ]; then
        echo "INFO — could not determine merge base; skipping changelog check."
        exit 0
      fi
    - |
      # Skip if the MR carries the no-changelog label
      if echo "$CI_MERGE_REQUEST_LABELS" | tr ',' '\n' | grep -qx 'no-changelog'; then
        echo "INFO — 'no-changelog' label present; skipping."
        exit 0
      fi
    - CHANGED=$(git diff --name-only $BASE HEAD)
    - |
      # Strip files that never need a changelog entry
      MEANINGFUL=$(echo "$CHANGED" | grep -Ev \
        '^\.gitlab(-ci\.yml|/)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(docs/|README|CLAUDE\.md|\.gitignore|Makefile|scripts/)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '\.(md|sh)$' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(frontend/src/test/|backend/.*/tests/)' \
        || true)
      if [ -z "$MEANINGFUL" ]; then
        echo "INFO — only non-product files changed; skipping changelog check."
        exit 0
      fi
    - |
      if echo "$CHANGED" | grep -q "CHANGELOG.md"; then
        echo "OK — CHANGELOG.md updated."
      else
        echo "ERROR — CHANGELOG.md was not updated. Add an entry under [Unreleased], or apply the ~no-changelog label if this MR genuinely needs no entry."
        exit 1
      fi

# ─── Security (MR only) ───────────────────────────────────────────────────────
#
# Security jobs run only on MR pipelines — they are the gate before merging
# and do not need to run on every WIP commit.

# bandit: Python SAST for security issues — shell injection, hardcoded
# credentials, use of random instead of secrets, SQL injection patterns, etc.
# Runs at medium severity (-ll) so only Medium/High findings block the merge.
# Skips migration files (auto-generated, safe to ignore) and test files
# (test utilities like mock tokens are intentionally insecure-looking).
backend-sast:
  extends: .pip-cache
  stage: security
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*.py
  before_script:
    - pip install --quiet bandit
  script:
    - bandit -r backend/
        --severity-level medium
        --confidence-level medium
        --exclude backend/boards/migrations,backend/groups/migrations,backend/accounts/migrations,backend/visiban/migrations
        --skip B101
        -f json -o bandit-report.json || true
    - bandit -r backend/
        --severity-level medium
        --confidence-level medium
        --exclude backend/boards/migrations,backend/groups/migrations,backend/accounts/migrations,backend/visiban/migrations
        --skip B101
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - bandit-report.json

# eslint-plugin-security: JS/TS SAST for injection, prototype pollution,
# non-literal regexp/require, and other common frontend security issues.
# Runs as a dedicated security job (separate from style linting) so failures
# are clearly security-attributed and block merges independently.
frontend-sast:
  extends: .npm-cache
  stage: security
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/src/**/*.{ts,tsx}
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/src/**/*.{ts,tsx}
  before_script:
    - cd frontend
    - npm ci --prefer-offline
    - npm install --save-dev eslint-plugin-security --prefer-offline 2>/dev/null || true
  script:
    # ESLint v9 uses flat config and removed --no-eslintrc.  Write a temporary
    # flat config *inside the frontend dir* so bare-specifier imports (e.g.
    # 'eslint-plugin-security') resolve against the local node_modules.  This
    # bypasses the project's full config (which has pre-existing react-hooks
    # warnings) and runs only the security rules we care about.
    - |
      cat > eslint-security.config.mjs <<'ESLINTEOF'
      import security from 'eslint-plugin-security';
      export default [{ files: ['**/*.{js,mjs,ts,tsx,jsx}'], plugins: { security }, rules: { 'security/detect-object-injection': 'error', 'security/detect-non-literal-regexp': 'error', 'security/detect-non-literal-require': 'error', 'security/detect-possible-timing-attacks': 'warn', 'security/detect-eval-with-expression': 'error' } }];
      ESLINTEOF
      npx eslint --config eslint-security.config.mjs --max-warnings 0 src/

# pip-audit: checks Python packages against the OSV vulnerability database.
backend-dep-scan:
  stage: security
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/requirements.txt
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit -r backend/requirements.txt --format json -o pip-audit-report.json || true
    - pip-audit -r backend/requirements.txt
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pip-audit-report.json

# npm audit: flag HIGH or CRITICAL CVEs in frontend npm dependencies.
frontend-dep-scan:
  extends: .npm-cache
  stage: security
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/package-lock.json
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm audit --audit-level=high
  allow_failure: true
  after_script:
    - cd frontend && npm audit --json > ../npm-audit-report.json 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - npm-audit-report.json

# detect-secrets: regex scan for accidentally committed API keys, tokens, etc.
# A .secrets.baseline file (committed) lets you track and acknowledge
# any intentional false-positives so the job stays green.
secret-detection:
  extends: .on-mr
  stage: security
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet detect-secrets
  script:
    - |
      if [ -f .secrets.baseline ]; then
        detect-secrets scan --baseline .secrets.baseline .
      else
        detect-secrets scan . > .secrets.baseline
        echo "No baseline found — created one. Review and commit .secrets.baseline."
      fi
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .secrets.baseline

# License compliance — flag GPL-2.0/GPL-3.0 dependencies that are incompatible
# with the project's Apache 2.0 license. Non-blocking so it warns but doesn't
# gate merges.

backend-license-check:
  extends: [.on-mr, .pip-cache]
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r backend/requirements.txt pip-licenses
  script:
    - pip-licenses --format=plain --fail-on="GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2)"
  allow_failure: true

frontend-license-check:
  extends: [.on-mr, .npm-cache]
  stage: security
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx license-checker --failOn "GPL-2.0;GPL-3.0" --summary
  allow_failure: true

# ─── Build verification (MR only) ─────────────────────────────────────────────
#
# Verify Docker images build successfully before merging. Catches Dockerfile
# drift early without pushing to any registry.
# Uses kaniko instead of Docker-in-Docker — no privileged mode needed, works
# out of the box on Kubernetes runners.
# Runs in the test stage alongside tests — build doesn't depend on test
# results, so running them in parallel saves a full stage of waiting.

backend-docker-build:
  stage: test
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - backend/Dockerfile
  script:
    - /kaniko/executor --context=backend --dockerfile=backend/Dockerfile --no-push

frontend-docker-build:
  stage: test
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
  script:
    - /kaniko/executor --context=frontend --dockerfile=frontend/Dockerfile --no-push

# ─── Docker push (main only) ──────────────────────────────────────────────────
#
# Pushes backend and frontend images to the GitLab container registry after
# every merge to main. Runs unconditionally on main so images are always
# up to date regardless of which files changed.
#
# Tags: latest (for Helm chart) + short SHA (for rollback).
# Pruning: configure a cleanup policy in Settings → Packages & Registries →
#   Cleanup policies to keep the last N tags — this costs zero runner minutes.
#
# Requires no extra CI variables — GitLab injects CI_REGISTRY,
# CI_REGISTRY_USER, and CI_REGISTRY_PASSWORD automatically.

backend-docker-push:
  stage: deploy
  needs: [backend-test]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}"
      > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context=backend
      --dockerfile=backend/Dockerfile
      --destination=${CI_REGISTRY_IMAGE}/backend:latest
      --destination=${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}

frontend-docker-push:
  stage: deploy
  needs: [frontend-test]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}"
      > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context=frontend
      --dockerfile=frontend/Dockerfile
      --destination=${CI_REGISTRY_IMAGE}/frontend:latest
      --destination=${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHORT_SHA}

# ─── Docs — versioned with mike ───────────────────────────────────────────────
#
# mike manages a versioned MkDocs site on the gh-pages branch.
# Docs are deployed by scripts/release.sh as part of the release process.
#
# This CI job exists only as a manual recovery tool — e.g. if a release script
# run was interrupted after tagging but before mike deployed. To redeploy:
# CI/CD → Run pipeline on main → set DOCS_VERSION=<version tag> → play job.
# The docs content used is whatever is on main at the time of the manual trigger.
#
# After mike pushes to gh-pages, GitLab triggers a new pipeline on that branch.
# The "pages" job (which must be named exactly "pages") runs there, copies the
# branch content to public/, and GitLab Pages serves it at docs.visiban.com.
#
# Required CI/CD project variable (Settings → CI/CD → Variables):
#   DOCS_DEPLOY_TOKEN — a project access token with "write_repository" scope,
#                       used so mike can push to the gh-pages branch.
#                       Create at Settings → Access Tokens → role: Developer,
#                       scope: write_repository. Store as a masked variable.
#
# Added: 2026-03-13

docs-deploy:
  stage: deploy
  image: python:3.12-slim
  needs: []
  variables:
    DOCS_VERSION: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet -r docs/requirements.txt
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    # Restore existing gh-pages history so mike can append to it.
    # The || true is intentional: first-ever deploy has no gh-pages branch yet.
    - git fetch origin gh-pages --depth=1 && git branch gh-pages origin/gh-pages || true
  script:
    - |
      VERSION="${DOCS_VERSION:-$CI_COMMIT_TAG}"
      if [ -z "$VERSION" ]; then
        echo "ERROR: no version to deploy. Either run from a version tag or set the DOCS_VERSION variable."
        exit 1
      fi
      if echo "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
        mike deploy --push --update-aliases "$VERSION" latest
        mike set-default --push latest
      else
        mike deploy --push --update-aliases "$VERSION" next
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

# ─── Scheduled branch cleanup ─────────────────────────────────────────────────
#
# Deletes remote branches that have been fully merged into main.
# Runs on a GitLab CI schedule (e.g. weekly) — not on every push.
#
# Requires the same DOCS_DEPLOY_TOKEN variable used by docs-deploy
# (write_repository scope is sufficient to delete branches).
#
# Protected branches (main, gh-pages) are never touched — GitLab enforces
# this server-side regardless, but the grep exclude below makes the intent
# explicit. The gh-pages branch is managed by mike and must never be deleted.
#
# To configure the schedule: CI/CD → Schedules → New schedule → set branch
# to main and cron to "0 3 * * 1" (Mondays at 03:00 UTC).

cleanup-merged-branches:
  stage: deploy
  image: alpine:3.19
  needs: []
  before_script:
    - apk add --no-cache git
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch --prune origin
  script:
    - |
      merged=$(git branch -r --merged origin/main \
        | grep -v 'origin/main$\|origin/HEAD\|origin/gh-pages' \
        | sed 's|origin/||' \
        | xargs)
      if [ -z "$merged" ]; then
        echo "No merged branches to delete."
      else
        echo "Deleting: $merged"
        echo "$merged" | xargs git push origin --delete
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ─── Demo data seed ───────────────────────────────────────────────────────────
#
# Refreshes the Visiban Demo Board on the dedicated demo environment.
# Runs weekly via a GitLab CI schedule and can be triggered manually at any time.
#
# Setup:
#   1. Create a protected CI/CD variable DEMO_DATABASE_URL pointing to the demo
#      environment's PostgreSQL instance (Settings → CI/CD → Variables).
#   2. Create a GitLab schedule (CI/CD → Schedules) targeting main with cron
#      "0 4 * * 1" (Mondays at 04:00 UTC) and set variable SEED_SCHEDULE=true.
#
# The --wipe flag deletes the "Visiban Demo Board" and recreates it from scratch.
# --force overrides the DEBUG=False guard so the command runs in CI without DEBUG=True.
# Board-scoped wipe: only the demo board is deleted; all other data is untouched.

seed-demo-data:
  stage: deploy
  needs: []
  image: python:3.12-slim
  environment: demo
  variables:
    DATABASE_URL: $DEMO_DATABASE_URL
    REDIS_URL: $DEMO_REDIS_URL
    DJANGO_SECRET_KEY: $DEMO_SECRET_KEY
    DEBUG: "False"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py seed_demo_data --wipe --force
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SEED_SCHEDULE == "true"'
    - when: manual

# ─── Seed export drift check ──────────────────────────────────────────────────
#
# Regenerates scripts/seed/demo_board.{json,csv} and fails if they differ from
# the committed versions. Catches model changes that invalidate the static files.
# Run on MR pipelines when the seed command or models are touched.

seed-export-check:
  extends: .pip-cache
  stage: lint
  needs: []
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: visiban_seed_check
    POSTGRES_USER: visiban
    POSTGRES_PASSWORD: ci_password
    DATABASE_URL: "postgres://visiban:ci_password@postgres:5432/visiban_seed_check"
    REDIS_URL: ""
    DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py migrate --run-syncdb --no-input
    - python manage.py seed_demo_data --export
    - |
      if ! git diff --exit-code ../scripts/seed/; then
        echo "ERROR: scripts/seed/ files are out of date. Run 'python manage.py seed_demo_data --export' and commit the result."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/boards/management/commands/seed_demo_data.py
        - backend/boards/models.py
        - scripts/seed/**/*

# Runs on the gh-pages branch after docs-deploy pushes to it.
# Copies the branch content to public/ for GitLab Pages to serve.
# The job name must be exactly "pages" for GitLab Pages to pick it up.
pages:
  stage: deploy
  image: alpine:3.19
  needs: []
  script:
    - cp -r . public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages"'
