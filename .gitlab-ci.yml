# ─── Catalog components ───────────────────────────────────────────────────────
#
# SAST: Semgrep-based static analysis via the official GitLab catalog component.
# Covers Python and TypeScript/JavaScript with broader rules than Bandit.
# enable_mr_pipelines: true — runs on MR pipelines in addition to branch
# pipelines, so findings gate merges. excluded_paths skips generated code.

include:
  - component: gitlab.com/components/sast/sast@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true
      excluded_paths: >-
        backend/boards/migrations,
        backend/groups/migrations,
        backend/accounts/migrations
  - component: gitlab.com/components/secret-detection/secret-detection@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true

# ─── Workflow ─────────────────────────────────────────────────────────────────
#
# Merge-request-pipeline model: feature branches get CI *only* through their
# MR, never as a standalone branch pipeline. This makes the branch+MR duplicate
# structurally impossible rather than merely suppressed.
#
# The previous `$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS when: never` dedup
# could not stop duplicates on the MR-open push: $CI_OPEN_MERGE_REQUESTS is
# empty in the branch pipeline created at the moment the MR is opened (GitLab
# hasn't associated the MR with the branch yet), so the rule missed and the
# catch-all `$CI_COMMIT_BRANCH` rule ran a second pipeline. Dropping that
# catch-all removes the only branch-pipeline path for feature work.
#
# Trade-off: pushing a feature branch with no open MR runs no CI. Open the MR
# early (Draft is fine) to get pipeline coverage — this matches our
# always-go-through-an-MR workflow.
#
# Main-branch commits always get a pipeline (post-merge verification).
# Tag pipelines run for version tags so docs-deploy can fire on release.

workflow:
  # Only cancel a running pipeline when a newer commit arrives if every job
  # in that pipeline is marked interruptible: true. Jobs default to
  # interruptible: false (see `default:` below) so main-branch pipelines
  # are never auto-canceled by a subsequent merge commit.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # all feature work
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'        # main, post-merge
    - if: '$CI_COMMIT_TAG'                                 # release tags
    # No catch-all $CI_COMMIT_BRANCH rule: a branch with no open MR gets no
    # pipeline, so the branch+MR duplicate can never be created.

# Test and build run in the same stage so they execute in parallel — build
# verification (kaniko) doesn't depend on test results, and running them
# together saves a full stage of sequential waiting.
stages:
  - lint
  - test
  - security
  - deploy

# Auto-retry on runner infrastructure failures (pod watcher sync, stuck
# cleanup, image pull transients). Only retries on runner_system_failure
# and stuck_or_timeout_failure — never on script failures.
default:
  interruptible: false
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ─── Rule templates ───────────────────────────────────────────────────────────
#
# Extend jobs with .on-mr to restrict them to MR pipelines only.
# Lint and test jobs use path-based rules so they only run when relevant
# files change, with a fallback to always run on the default branch.

.on-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── Cache templates ──────────────────────────────────────────────────────────
#
# Cache uses MinIO as the S3-compatible distributed backend so all runners
# share a warm cache across jobs and branches.
#
# Required CI/CD project variables (Settings → CI/CD → Variables):
#   MINIO_ENDPOINT   — host:port of the MinIO server, e.g. minio.internal:9000
#   MINIO_ACCESS_KEY — MinIO access key
#   MINIO_SECRET_KEY — MinIO secret key
#   MINIO_BUCKET     — bucket name, e.g. visiban-ci-cache
#
# Runner config.toml must enable the S3 backend:
#   [runners.cache]
#     Type   = "s3"
#     Shared = true
#     [runners.cache.s3]
#       ServerAddress = "<MINIO_ENDPOINT>"
#       AccessKey     = "<MINIO_ACCESS_KEY>"
#       SecretKey     = "<MINIO_SECRET_KEY>"
#       BucketName    = "<MINIO_BUCKET>"
#       Insecure      = false   # set true if MinIO has no TLS
#
# Cache keys include a fixed prefix so entries are grouped cleanly inside
# the S3 bucket. The lockfile hash provides automatic invalidation when
# dependencies change. node_modules/ is cached alongside the npm download
# cache to skip extraction on warm hits.

.npm-cache:
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [frontend/package-lock.json]
    paths:
      - .npm/
      - frontend/node_modules/
    policy: pull

# PIP_CACHE_DIR stores downloaded wheels/sdists. pip honors this env var
# automatically so no extra flags are needed in before_script.

.pip-cache:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip"
      files: [backend/requirements.txt]
    paths: [.cache/pip/]
    policy: pull

# Warm the caches on the default branch so feature-branch jobs can pull from
# them without paying the push cost on every MR pipeline. Only one job per
# cache key prefix — runs after tests succeed on main.

cache-warm-pip:
  stage: deploy
  needs: [backend-test-coverage]
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip"
      files: [backend/requirements.txt]
    paths: [.cache/pip/]
    policy: pull-push
  script:
    - pip install --quiet -r backend/requirements.txt
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cache-warm-pip-test:
  stage: deploy
  needs: [backend-test-coverage]
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip-test"
      files: [backend/requirements-test.txt]
    paths: [.cache/pip/]
    policy: pull-push
  script:
    - pip install --quiet -r backend/requirements-test.txt
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cache-warm-npm:
  stage: deploy
  needs: [frontend-test]
  image: node:20-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [frontend/package-lock.json]
    paths:
      - .npm/
      - frontend/node_modules/
    policy: pull-push
  script:
    - cd frontend && npm ci --prefer-offline
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ─── Shell scripts — lint ────────────────────────────────────────────────────
#
# shellcheck catches common shell bugs: unquoted variables, missing set -e,
# portability issues, and incorrect conditionals. Runs on every MR that touches
# scripts/ and always on main.

shellcheck:
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache shellcheck
  rules:
    - changes:
        - scripts/*.sh
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - shellcheck --severity=warning scripts/*.sh

# ─── Dockerfiles — lint ───────────────────────────────────────────────────────
#
# hadolint enforces Dockerfile best practices (layer ordering, missing WORKDIR,
# ADD vs COPY, etc.). DL3008 (pin apt versions) is ignored — rationale in
# .hadolint.yaml. Runs on every MR that touches a Dockerfile and always on main.

dockerfile-lint:
  stage: lint
  image:
    name: hadolint/hadolint:v2.15.1-alpine
    entrypoint: [""]
  rules:
    - changes:
        - "**/Dockerfile*"
        - .hadolint.yaml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - hadolint --config .hadolint.yaml
        backend/Dockerfile
        backend/Dockerfile.prod
        frontend/Dockerfile
        frontend/Dockerfile.prod

# ─── Backend — lint ───────────────────────────────────────────────────────────

# Ruff lint check + CodeClimate quality report in a single job — avoids
# spinning up two pods and installing ruff twice.
# allow_failure: true — style issues are visible but do not block merges.
backend-lint:
  extends: .pip-cache
  stage: lint
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    # Pinned: unpinned installs silently picked up ruff 0.16's much larger
    # default rule set, surfacing 600+ pre-existing findings (mostly RUF012 on
    # Django migrations' `operations = [...]`) unrelated to any given branch.
    - pip install --quiet ruff==0.15.22
  script:
    - ruff check backend/
    - ruff check backend/ --output-format=gitlab -o code-quality-report.json || true
  artifacts:
    reports:
      codequality: code-quality-report.json
    paths:
      - code-quality-report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# ─── Backend — test ───────────────────────────────────────────────────────────
#
# Runs Django tests via pytest, sharded across 3 parallel jobs using
# pytest-split's least_duration algorithm for time-balanced distribution.
# These jobs gate the pipeline on test failures (fast, parallel).
# Coverage is measured separately by backend-test-coverage in a single-process
# run — see that job's comment for why sharded coverage combining is not used.
#
# On first run (no .test_durations in cache), pytest-split falls back to
# round-robin splitting. After one run, the durations file is cached and
# subsequent runs use time-balanced splitting.

backend-test:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  parallel: 3
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  cache:
    - key:
        prefix: "pip"
        files: [backend/requirements.txt]
      paths: [.cache/pip/]
      policy: pull
    - key:
        prefix: "pip-test"
        files: [backend/requirements-test.txt]
      paths: [.cache/pip/]
      policy: pull
    - key: test-durations
      paths: [backend/.test_durations]
      policy: pull-push
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet -r backend/requirements-test.txt
  script:
    - cd backend
    - coverage run --parallel --data-file=.coverage.${CI_NODE_INDEX} -m pytest
        --splitting-algorithm least_duration
        --store-durations
        --group $CI_NODE_INDEX
        --splits $CI_NODE_TOTAL
        --junitxml=test-results/junit-${CI_NODE_INDEX}.xml
        -q
  artifacts:
    paths:
      - backend/.coverage.*
    reports:
      junit: backend/test-results/junit-*.xml
    when: always
    expire_in: 1 day

# Combines the .coverage.* artifacts produced by the three parallel backend-test
# shards *and by every feature-flagged test job* and enforces the 90% threshold.
# Each producer runs with --parallel so coverage.py treats its data file as a
# fragment to be combined rather than a standalone measurement.
#
# Every job that executes tests must be instrumented and listed in `needs`.  A
# job left out does not merely go unmeasured — the code it covers is reported
# as 0%, which is worse than not measuring it at all.  backend-test runs with
# the feature flags off, so the flag-on paths (git_lens, and any future flagged
# app) are reachable only from their dedicated jobs.
#
# No postgres/redis services required — this job only runs coverage combine and
# report, no Django or test execution.
backend-test-coverage:
  stage: test
  needs: [backend-test, backend-test-git-lens, backend-test-mcp]
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - pip install --quiet coverage
  script:
    - cd backend
    - coverage combine
    - coverage report --fail-under=90
    - coverage xml -o coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
    when: always

# Diff coverage (MR only) — #1076.
#
# The aggregate --fail-under=90 above measures the whole codebase, not the
# change. With 500+ backend test files already in the tree, that aggregate
# has enough inertia to absorb a fully untested new view or method and stay
# green. This job instead measures coverage of only the lines this MR adds
# or modifies, using diff-cover against the coverage.xml produced above — no
# test re-run, just a second report over the same data.
#
# Threshold starts at 80% of changed lines, blocking. Escape hatch: an MR
# that legitimately cannot meet it (a pure refactor with moved lines, a
# vendored file) says so in its description and a reviewer overrides by
# approving with the failing job acknowledged — see
# docs/development/testing.md#diff-coverage-escape-hatch. The override is
# always visible in the MR/job history, never silent.
#
# migrations/ is excluded because .coveragerc does NOT omit it from the
# aggregate run (Django imports every migration to build the test DB, so
# migration lines legitimately count toward the 90% number) — but a line
# diff-cover would flag as "uncovered" in a migration is nearly always
# schema, not behavior, and re-litigating that here would just train
# reviewers to override the gate instead of reading it.
backend-diff-coverage:
  extends: .pip-cache
  stage: test
  needs: [backend-test-coverage]
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet diff-cover
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
  script:
    - cd backend
    - diff-cover coverage.xml
        --compare-branch=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        --fail-under=80
        --show-uncovered
        --exclude "*/migrations/*" "manage.py"

# Checks that every model change has a corresponding migration file, that no
# migration builds an index or constraint in a way that takes ACCESS EXCLUSIVE on a
# live table (#1081), and that no migration adds a constraint a populated table could
# already violate (#1098) — see docs/development/database-migrations.md.
# Requires a Postgres service because makemigrations --check calls
# check_consistent_history(), which connects to the DB to verify applied
# migrations are consistent with the on-disk migration files.
migration-check:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py makemigrations --check --dry-run --verbosity=1
    # Fails on a new AddIndex/AddConstraint that is not concurrent. The escape
    # hatch is an inline `# concurrency-exempt: <reason>` comment on the operation.
    - python manage.py check_migration_concurrency
    # Proves the constraint-safety gate below still fires before trusting its "clean" verdict (#1093).
    - python manage.py check_migration_constraint_safety --self-test
    # Fails on a new AddConstraint/NOT NULL/unique-together that could crash-loop against
    # pre-existing rows with no preceding repair step (#1098). The escape hatch is an
    # inline `# constraint-safe: <reason>` comment on the operation.
    - python manage.py check_migration_constraint_safety

# Catches two branches cut off the same point on main each adding a migration
# at the same next sequential number (e.g. both add 0042_...). Django applies
# whichever merges first without complaint, and the second branch's migration
# silently never runs. migration-check above only inspects the working
# branch's own tree and has no visibility into what has landed on main since
# the branch point — this job fetches main and diffs against it (#1099).
# MR-pipeline only: needs $CI_MERGE_REQUEST_TARGET_BRANCH_NAME for a real
# merge-base, which isn't set on branch/default-branch pipelines.
migration-numbering-check:
  stage: test
  needs: []
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
  before_script:
    - apk add --no-cache git bash
  script:
    - scripts/check-migration-numbering.sh

# Validates the OpenAPI schema generated by drf-spectacular has no ERROR-level
# issues.  Does not require a database or Redis — Django loads in DEBUG mode
# with a fake DATABASE_URL so the schema introspection path runs without
# connecting.
backend-schema-validate:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@localhost:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://localhost:6379/0"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py spectacular --validate
  allow_failure: false

# Fuzzes the OpenAPI contract itself: boots a real backend against seeded demo
# data, authenticates as a normal (non-admin) board member, and drives
# schemathesis against every documented operation, asserting the response
# actually matches the declared schema, status code, and content type
# (#1080). backend-schema-validate above only proves the generated DOCUMENT is
# well-formed — it has no way to catch a view that bypasses its serializer and
# returns a body the schema never described (the TruePPM red-team finding
# #1080 is built on: same class as their #2515/#2649, and Visiban's own
# #1108). "Authenticate as a normal board member — not a superuser" is a
# direct requirement of #1080: provision_fuzz_token refuses to mint a token
# for any user carrying is_superuser/is_site_admin/can_access_all_content.
#
# Blocking (allow_failure: false) as of #1120 — #1080's own phased plan
# (baseline non-blocking for one release, #1080 acceptance criterion 3: "blocking
# by end of 1.2"). What the baseline found and how each point was resolved:
#
#   - Undocumented 404s from version-prefix fuzzing: negative testing mutated
#     the literal `v1` URL segment because drf-spectacular's catch-all
#     `re_path(r"^api/v(?!1/)[\w]+/", ...)` (visiban/urls.py) synthesized a
#     malformed path template (`/api/v{var}[\w]/`, literal regex syntax
#     leaking into the OpenAPI path) for `UnsupportedVersionView` — schemathesis
#     dutifully fuzzed that literal template into URLs that never matched the
#     real regex, landing on Django's HTML 404 debug page instead of a JSON
#     response. Fixed by excluding the view from the schema entirely
#     (`@extend_schema(exclude=True)`) — it's an internal safety net, not a
#     documented operation, so the honest fix is to stop describing it, not to
#     carve around it with --exclude-path-regex.
#   - A second, more serious bug the same investigation turned up: any
#     board-scoped nested route (`board_pk` and friends — untyped string path
#     segments, not `<int:...>`-typed) crashed with an unhandled 500 on a
#     non-numeric value, because `boards/views/_helpers.py` and six other view
#     modules resolved them with `django.shortcuts.get_object_or_404`, which
#     doesn't catch the ORM's `ValueError` the way `rest_framework.generics`'s
#     version does. Fixed by swapping the import in all seven files (defends
#     any lookup driven by a request body/query value, e.g. `move-group`'s
#     `group_id`, not just a URL path segment). A second, independent fix
#     landed on main while this branch was in flight (board-pk-nonnumeric-404):
#     `lookup_value_regex = r"\d+"` on the six board-scoped viewsets, so a
#     non-numeric id now fails to match the URL pattern at all rather than
#     reaching the view — closes the same hole at the routing layer, which is
#     the more correct fix for anything registered through a router. That
#     routing-level fix has its own side effect, though: an URL matching
#     *nothing* is resolved by Django itself, before any view runs — the
#     *technical* 404 debug page under `DEBUG=True` (true of this job),
#     reintroducing the exact "HTML instead of JSON" noise from the point
#     above, now for the entire board-resource route family instead of just
#     the version segment. `ApiNotFoundView` (visiban/urls.py, registered
#     dead last) closes that: it makes sure *something* always matches under
#     `/api/v1/`, so Django's resolver never has to render the fallback
#     itself. It also required a genuine design decision, not just a copy of
#     `UnsupportedVersionView`'s auth-gating: `/api/v1/` mixes authenticated
#     and deliberately public routes (the anonymous email-confirmation
#     redirect), so the catch-all cannot require auth — an anonymous caller
#     who garbles a public path's URL must still get a plain 404, not a 401
#     (a real regression this branch's own test suite caught:
#     accounts/tests/test_email_confirm.py's `..._returns_404_from_router`).
#     A follow-up verification run found the catch-all's own pattern
#     (`^api/v1/.*$`) still fell through to Django's raw response for a path
#     containing a literal embedded newline byte — `.` doesn't match `\n`.
#     `re.DOTALL` isn't available here: an inline `(?s)` flag in the pattern
#     string makes Django's own reverse-resolution machinery raise
#     `ValueError: Non-reversible reg-exp portion: '(?s'` on every request
#     (found the hard way — the first attempt 500'd everything), and
#     `re_path()` doesn't accept a pre-compiled DOTALL pattern either — its
#     system checks call `.startswith(...)` on `_regex`, assuming a string.
#     Fixed with `[\s\S]*` instead of `.*` (a character class always
#     matches `\n`, no flag needed).
#   - 72 operations reachable only via 404 (random path-parameter ids never
#     matching seeded rows): `backend/schemathesis_hooks.py`, loaded via
#     SCHEMATHESIS_HOOKS below, is a `map_path_parameters` hook that substitutes
#     real ids pulled from `seed_demo_data`'s board/cards/columns/swimlanes/
#     labels/members at hook-load time. `--generation-database` (hypothesis's
#     own example-replay cache) and `--phases stateful` (schemathesis's
#     OpenAPI-`links`/Location-header-based chaining — this schema declares no
#     links, and no Visiban view sets a Location header on create) were both
#     investigated and ruled out; a path-parameter hook against real seeded
#     rows is what this schemathesis version actually supports for this. Some
#     resource families have no seeded row at all (groups, custom-fields,
#     saved-filters, attachments, group invite-links/labels) and still 404 —
#     tracked as #1125 rather than blocking this flip on extending
#     seed_demo_data's committed sample-boards/ export.
#   - 12 admin-only operations returned only 403: expected — #1080 requires
#     provision_fuzz_token to refuse an admin/superuser account, so this job's
#     token can never reach `/api/v1/admin/*`. Accepted as documented residual
#     scope rather than adding a second admin-scoped pass: only 9 operations
#     sit behind IsSiteAdmin (accounts/admin_views.py's `_ADMIN_PERMISSIONS`),
#     all with dedicated coverage already (accounts/tests/test_admin_api.py,
#     test_invite_links.py, test_pat_scopes.py) — a second full fuzz pass for
#     that surface is disproportionate to what's actually gated.
#
# Reaching real 200-path responses (the seeding above) also let negative-data
# fuzzing reach two more unhandled 500s: CardViewSet.move and
# GroupViewSet.transfer_ownership both read `request.data.get(...)` without
# checking the parsed body is a JSON object first, so a bare number/string/
# array/null/bool body raised AttributeError. Both fixed with an
# isinstance(request.data, dict) guard. This is a repeatable pattern — a grep
# for `request.data.get(` across boards/views and groups/views turns up ~30
# more call sites with the same shape — so a future run's randomness finding
# another instance is a real, open possibility, not fully closed by this
# branch; each one found gets the same fix, following this precedent.
#
# Reaching real 200-path responses (the seeding above) surfaced the exact bug
# class #1108 fixed on CardSerializer and #1119 is tracking for Group/
# GroupDetail on several more serializers (Board, BoardFull, BoardUser,
# CurrentUser — filed as #1123) and a separate, structural gap: most write
# endpoints' 400 validation-error response isn't documented in the schema at
# all (filed as #1124). Neither is a CI-config fix, so both are recorded as
# scoped, justified baseline entries in backend/schemathesis-baseline.json
# (schemathesis's own "accepted known failures" mechanism — matched by
# operation + check + failure-class + schema-path/status-code, never by the
# random value schemathesis generated, so the file doesn't need touching every
# run) rather than blocking this flip on #1119/#1123/#1124 landing first.
# Closing any of those three issues should prune its entries
# (`st run ... --baseline PATH --baseline-update --baseline-prune`) so the job
# starts catching a regression in that area again.
#
# Scoped to the file classes #1080 names (views/, serializers.py, urls.py)
# plus always on main, so a schema-shape change gets checked before merge
# without running on every unrelated branch (e.g. a frontend-only MR).
backend-schema-fuzz:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  allow_failure: false
  # Baseline identities include the *check name*, and one failure class can come
  # from more than one check: an empty-body response trips MissingContentType under
  # content_type_conformance AND under response_schema_conformance (which bundles it
  # with MalformedJson). Baseline both identities or the finding still fails the job
  # deterministically — this is not flakiness, so there is no retry here (#1120).
  rules:
    - changes:
        - backend/**/views/**/*
        - backend/**/serializers.py
        - backend/**/urls.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    # CI-only file; provision_fuzz_token writes the raw PAT here (mode 0600),
    # never to job output — see the command's docstring.
    VISIBAN_FUZZ_TOKEN_FILE: "/tmp/visiban_fuzz_token"
    # Loaded automatically by `st run` (schemathesis/core/hooks.py's
    # load_from_env) — a file path (not a bare module name) so it loads
    # correctly regardless of script:'s cwd; see schemathesis_hooks.py's own
    # sys.path handling for why that matters here specifically.
    SCHEMATHESIS_HOOKS: "backend/schemathesis_hooks.py"
    # `st run` is itself a Python process; a bare "Segmentation fault (core
    # dumped)" with no Python-level traceback (seen once on this branch,
    # !892) is otherwise undiagnosable from the CI log alone. Cheap and
    # inert on every normal run — only fires on an actual native-level crash.
    PYTHONFAULTHANDLER: "1"
  cache:
    - key:
        prefix: "pip"
        files: [backend/requirements.txt]
      paths: [.cache/pip/]
      policy: pull
    - key:
        prefix: "pip-test"
        files: [backend/requirements-test.txt]
      paths: [.cache/pip/]
      policy: pull
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet -r backend/requirements-test.txt
    - cd backend
    - python manage.py migrate --noinput
    # Deterministic, git-diffable demo data — a real member's-eye view of a
    # populated board, not an empty database where every path-parameterized
    # operation 404s before schemathesis can reach its core logic.
    - python manage.py seed_demo_data --force
    - python manage.py provision_fuzz_token --username demo2
    - python manage.py runserver 0.0.0.0:8000 &
    # Poll liveness instead of a fixed sleep, same pattern as oidc-smoke.
    - |
      for i in $(seq 1 30); do
        python3 -c "import requests; requests.get('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
  script:
    # The two email-confirm endpoints only 302 to the SPA at FRONTEND_URL, which
    # does not run in this job — following that redirect is a "Connection refused"
    # NonFatalError, and any NonFatalError exits `st run` 1. Their redirect
    # behavior is covered by accounts/tests/test_email_confirm.py instead.
    - |
      st run http://localhost:8000/api/schema/ \
        -H "Authorization: Token $(cat ${VISIBAN_FUZZ_TOKEN_FILE})" \
        --exclude-path-regex 'confirm-email' \
        --checks response_schema_conformance,status_code_conformance,content_type_conformance \
        --phases examples,fuzzing \
        --max-examples 10 \
        --max-time 600 \
        --workers 4 \
        --baseline backend/schemathesis-baseline.json \
        --report junit \
        --report-junit-path schemathesis-junit.xml \
        --no-color
  artifacts:
    reports:
      junit: schemathesis-junit.xml
    when: always
    expire_in: 1 week

# ─── Issue Board Lens (experiment) tests ─────────────────────────────────────
# The git_lens app is only installed when GIT_LENS_ENABLED=true, so its
# integration tests (models, views, RBAC, caching) cannot run in the main
# backend-test job (which runs flag-off, where they skip cleanly). This
# dedicated job enables the flag, verifies the additive migration is complete,
# and runs the full git_lens suite. Mirrors the OIDC conditional-app pattern.
backend-test-git-lens:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  # Runs whenever backend-test-coverage runs, not only on git_lens changes.
  # The coverage combine job `needs` this job's data file; if it were absent
  # from the pipeline, every git_lens line would score 0% and the total would
  # drop back below the threshold on branches that touch no git_lens file.
  # `.gitlab-ci.yml` is in the list so a change to this job re-runs it.
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    GIT_LENS_ENABLED: "True"
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet -r backend/requirements-test.txt
  script:
    - cd backend
    - python manage.py makemigrations --check --dry-run git_lens
    # Instrumented, and the data file is published for backend-test-coverage to
    # combine.  git_lens' views/serializers/models are exercised only with
    # GIT_LENS_ENABLED=True, which is set here and nowhere else, so an
    # uninstrumented run made ~230 well-tested statements score 0% and pinned
    # the project total to the 88-90% knife edge the gate sits on.
    - coverage run --parallel --data-file=.coverage.git-lens -m pytest git_lens/ -q
  artifacts:
    paths:
      - backend/.coverage.*
    when: always
    expire_in: 1 day

# ─── MCP server tests ────────────────────────────────────────────────────────
# The mcp_server app is only installed and only mounts /mcp when
# MCP_SERVER_ENABLED=true, so its transport/auth/tool tests skip cleanly in the
# main backend-test job (which runs flag-off). This dedicated job enables the
# flag and runs the suite. Mirrors the git_lens conditional-app pattern above.
# ALLOWED_HOSTS must contain the host the tests use, because the MCP transport
# derives its DNS-rebinding allowlist from it.
#
# Runs whenever backend-test-coverage runs, not only on mcp_server changes.
# The coverage combine job `needs` this job's data file; if it were absent
# from the pipeline, every mcp_server line would score 0% and the total would
# drop back below the threshold on branches that touch no mcp_server file.
# `.gitlab-ci.yml` is in the list so a change to this job re-runs it.
backend-test-mcp:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    MCP_SERVER_ENABLED: "True"
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet -r backend/requirements-test.txt
  script:
    - cd backend
    # The app ships no models; assert that stays true so a future model addition
    # cannot land without its migration.
    - python manage.py makemigrations --check --dry-run
    # Instrumented, and the data file is published for backend-test-coverage to
    # combine. mcp_server's transport/auth/tools are exercised only with
    # MCP_SERVER_ENABLED=True, which is set here and nowhere else, so an
    # uninstrumented run scored ~400 well-tested statements as 0% and pinned
    # the project total below the 90% gate.
    - coverage run --parallel --data-file=.coverage.mcp -m pytest mcp_server/ -q
  artifacts:
    paths:
      - backend/.coverage.*
    when: always
    expire_in: 1 day

# ─── OIDC smoke test ─────────────────────────────────────────────────────────
#
# End-to-end smoke test for the OIDC authorization code flow.  Exercises:
#   - Discovery endpoint parsing (/.well-known/openid-configuration)
#   - IdP login form submission and code exchange
#   - Visiban callback routing and session creation
#   - Identity claim mapping (email, username) via allauth
#
# Runs a real Keycloak 24 instance as a service.  The realm, client, and test
# user are provisioned by scripts/oidc_provision.py via the Admin REST API so
# no custom Docker image or file mount is needed.
#
# The backend is started with `runserver` in the background (not daphne) so
# that the process exits cleanly when the job ends without a SIGKILL dance.
#
# FRONTEND_URL is pointed at the liveness endpoint so the post-login redirect
# resolves inside the job without needing the React dev server running.
#
# Runs on any change to OIDC-related files, and always on the default branch.
# allow_failure: true — Keycloak boot is slow on the shared small runner and the
# job historically times out far more often than it succeeds, so a red run must
# not block unrelated MRs.  The job is still reported in the pipeline summary.
#
# Debugging note: the 120s readiness budget was too tight for Keycloak's JVM boot
# when sharing a single vCPU with postgres/redis/python.  We raised the wait to
# 240s and enabled CI_DEBUG_SERVICES so the Keycloak container log is captured in
# the trace — this distinguishes a slow boot from a crash/OOM.  If the log shows
# CPU starvation rather than a crash, move this job to saas-linux-medium-amd64.

oidc-smoke:
  extends: .pip-cache
  stage: test
  needs: []
  image: python:3.12-slim
  rules:
    - changes:
        - backend/accounts/**/*
        - backend/visiban/settings.py
        - scripts/oidc_provision.py
        - scripts/oidc_smoke_test.py
        - oidc/**/*
        - docker-compose.oidc.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true
  services:
    - name: quay.io/keycloak/keycloak:24.0.5
      alias: keycloak
      command: ["start-dev"]
      variables:
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
    - name: postgres:17-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost,127.0.0.1"
    # Capture the Keycloak (and other) service-container logs in the job trace so
    # a boot timeout can be diagnosed as slow-boot vs crash/OOM without guessing.
    CI_DEBUG_SERVICES: "true"
    OIDC_CLIENT_ID: "visiban"
    OIDC_CLIENT_SECRET: "test-oidc-secret"
    OIDC_SERVER_URL: "http://keycloak:8080/realms/visiban-test"
    OIDC_PROVIDER_NAME: "Keycloak"
    # Point post-login redirect back to the liveness endpoint so the full
    # callback flow resolves without needing the frontend running.
    FRONTEND_URL: "http://localhost:8000/api/health/liveness/"
  before_script:
    # Address Keycloak by IPv4 literal.
    #
    # GitLab's service DNS returns both an A record and an IPv6 ULA (fd76::/8),
    # and glibc prefers the IPv6 one. Reached over IPv6, Keycloak classifies the
    # client as *external* — SslRequired.EXTERNAL only recognises IPv4 private
    # ranges as local — and the master realm's default sslRequired=external then
    # refuses plain HTTP outright with
    #   403 {"error":"invalid_request","error_description":"HTTPS required"}
    # on every request. That is what "did not become ready within 240s" has
    # actually been since 2026-08-03: an immediate, consistent 403, not a slow
    # boot. Pinning /etc/hosts does not help — the resolver still returns both
    # records — so the address is substituted into the URLs instead, which also
    # keeps the issuer consistent between the provisioner and Django.
    - |
      KC_IPV4="$(getent ahostsv4 keycloak | awk 'NR==1{print $1}')"
      if [ -z "${KC_IPV4}" ]; then
        echo "ERROR: could not resolve an IPv4 address for the keycloak service" >&2
        exit 1
      fi
      export KEYCLOAK_BASE="http://${KC_IPV4}:8080"
      export OIDC_SERVER_URL="${KEYCLOAK_BASE}/realms/visiban-test"
      echo "keycloak reachable at ${KEYCLOAK_BASE} (IPv4)"
    - pip install --quiet -r backend/requirements.txt requests
    # Provision Keycloak: waits for readiness, then creates realm/client/user.
    # 240s budget — Keycloak's JVM boot routinely exceeds the previous 120s when
    # sharing a single vCPU with postgres/redis/python on the small runner.
    - python scripts/oidc_provision.py --keycloak-url "${KEYCLOAK_BASE}" --wait-timeout 240
    # Run migrations
    - cd backend && python manage.py migrate --noinput
    # Start the backend in the background; give it a few seconds to bind
    - python manage.py runserver 0.0.0.0:8000 &
    # Poll the liveness endpoint instead of a fixed sleep — faster on warm
    # runners, reliable on slow ones. Gives up after 30 seconds.
    # Uses python requests (already installed) — no curl in python:3.12-slim.
    - |
      for i in $(seq 1 30); do
        python3 -c "import requests; requests.get('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
  script:
    - python scripts/oidc_smoke_test.py
        --base-url http://localhost:8000
        --username testuser
        --password testpassword
        --expected-email testuser@example.com

# ─── Helm — lint ─────────────────────────────────────────────────────────────
#
# Validates the Helm chart renders without errors, AND that its values conform
# to helm/visiban/values.schema.json. The schema is the load-bearing half:
# Helm silently accepts a values key no template reads, so before #1116 an
# invented or misspelled key changed nothing on the pod while the operator
# believed it was applied — indistinguishable from the setting having no effect.
#
# Every shipped overlay is linted separately. Linting the defaults alone would
# leave values-dev.yaml and values-prod.yaml uncovered, and the schema is the
# only thing that catches an unused key in them. Each overlay gets the minimum
# extra --set it needs to RENDER, so a schema violation is the only thing that
# can fail here.
#
# Dependency tarballs are committed under helm/visiban/charts/ so no network
# access is required. Runs on any change to the chart or values, and always
# on main so a bad chart never reaches the deploy stage undetected.

.rules-helm: &rules-helm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &helm-paths
        - helm/**/*
        - scripts/helm-structure-check.sh
        - scripts/helm-install-drill.sh
        - scripts/helm-netpol-drill.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

helm-lint:
  stage: lint
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  <<: *rules-helm
  variables:
    # Render-time validation in templates/_validate.tpl refuses to render the
    # chart while values.yaml still carries placeholder secrets / hosts. CI
    # supplies these overrides so the chart can be lint+templated against its
    # committed defaults without baking real values into values.yaml.
    HELM_CI_OVERRIDES: >-
      --set-string secret.djangoSecretKey=ci-not-a-real-secret
      --set backend.email.backend=console
      --set backend.settings.allowedHosts=ci.visiban.local
  script:
    - helm lint helm/visiban -f helm/visiban/values.yaml $HELM_CI_OVERRIDES
    - helm template visiban helm/visiban -f helm/visiban/values.yaml $HELM_CI_OVERRIDES > /dev/null
    # Overlays (#1116). values-prod.yaml selects the smtp email backend, which
    # _validate.tpl refuses to render without a real From: address.
    - helm lint helm/visiban -f helm/visiban/values-dev.yaml $HELM_CI_OVERRIDES
    - |
      helm lint helm/visiban -f helm/visiban/values-prod.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set backend.settings.allowedHosts=ci.visiban.local \
        --set backend.email.fromAddress=noreply@visiban.local \
        --set backend.email.host=smtp.visiban.local

# ─── Helm — template (deploy contract) ───────────────────────────────────────
#
# Static deploy-contract gate (#1116). `helm lint` proves the templates PARSE;
# it cannot know whether the rendered manifests still honor the contract a
# deploy depends on. That gap is what let #1038 ship: an OIDC env-var name
# mismatch that silently disabled SSO, a hook-ordering bug that made SECRET_KEY
# rotation impossible, and zero email wiring — all of them rendering green. It
# is also what let #1117 ship: a pre-install migrate hook that could not reach
# the database it was installed alongside.
#
# Two halves, both cluster-free and therefore always-on:
#   kubeconform -strict       every rendered object validates against the real
#                             Kubernetes API schema, unknown fields included
#   helm-structure-check.sh   the runtime contract a refactor can silently break
#                             (migrate placement, secret rotation reaching the
#                             migrating pod, nginx upstream, probe paths,
#                             transport limits, netpol coverage)
#
# The runtime half lives in helm-install and helm-netpol below.

helm-template:
  stage: lint
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  <<: *rules-helm
  variables:
    KUBECONFORM_VERSION: "0.6.7"
    YQ_VERSION: "4.44.3"
  before_script:
    - apk add --no-cache bash curl tar findutils grep sed
    - curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
    - curl -sSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
    - chmod +x /usr/local/bin/yq
  script:
    # Render the way a real deploy is shaped — a pinned tag, NetworkPolicies on
    # (they are off by default, and section 7 of the structure check needs them)
    # and OIDC configured, since the OIDC env block is behind a conditional and
    # is exactly where #1038's blocker 1 lived.
    - |
      helm template visiban helm/visiban \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set backend.settings.allowedHosts=ci.visiban.local \
        --set backend.email.backend=console \
        --set networkPolicy.enabled=true \
        --set backend.oauth.oidc.serverUrl=https://idp.ci.local/realms/visiban \
        > /tmp/rendered.yaml
    # -ignore-missing-schemas: no CRDs are rendered today, but the flag keeps a
    # future ServiceMonitor/PrometheusRule from turning this into a hard red
    # while every core kind stays validated.
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml
    # Both shipped overlays get the same treatment — a values file that renders
    # an invalid object is a values file nobody can install.
    - |
      helm template visiban helm/visiban -f helm/visiban/values-dev.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set backend.settings.allowedHosts=ci.visiban.local \
        > /tmp/rendered-dev.yaml
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered-dev.yaml
    - |
      helm template visiban helm/visiban -f helm/visiban/values-prod.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set backend.settings.allowedHosts=ci.visiban.local \
        --set backend.email.fromAddress=noreply@visiban.local \
        --set backend.email.host=smtp.visiban.local \
        > /tmp/rendered-prod.yaml
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered-prod.yaml
    # Self-test FIRST (#1093). This gate's failure mode is a GREEN pipeline over
    # a chart that no longer holds the contract, so "it passed" is not evidence
    # that it can still fail. The fixtures replay the #1038 shapes.
    - bash scripts/helm-structure-check.sh --self-test helm/visiban
    - bash scripts/helm-structure-check.sh helm/visiban

# ─── Helm — runtime drills (kind) ────────────────────────────────────────────
#
# The half helm-template cannot reach: actually BOOT the chart (#1116).
#
# Both jobs build the backend and frontend images from the working tree and
# side-load them into kind. They deliberately do NOT pull a published image:
# the MR-time *-docker-build jobs run kaniko with --no-push, so there is no
# per-commit image to pull, and drilling the HEAD chart against the last
# RELEASED image would mean a red here is version skew rather than a deploy
# regression — which is how a drill earns a reputation for crying wolf and
# stops being read.
#
# kind needs a Docker daemon, so these two are the only jobs in this file that
# use docker:dind. That is not a reversal of the kaniko decision for image
# builds (which stands, and is about pushing images without privileged mode) —
# there is simply no way to run a Kubernetes cluster in CI without one.
#
# Not `interruptible`: a rebased push must not abort a half-provisioned cluster
# and leak it into the dind daemon.

.helm-drill-base: &helm-drill-base
  stage: test
  interruptible: false
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    KIND_VERSION: "0.24.0"
    KUBECTL_VERSION: "1.31.2"
    HELM_VERSION: "3.16.4"
    # Calico is only used by helm-netpol, but it lives HERE on purpose. A
    # job-level `variables:` REPLACES an anchored one rather than merging into
    # it, so giving helm-netpol its own block to hold CALICO_VERSION silently
    # dropped every variable above — the tool URLs became ".../v/kind-linux-amd64",
    # 404'd to a small HTML page, and `tar` failed with "invalid magic" nine
    # seconds in. One shared block is the fix; do not re-split it.
    CALICO_VERSION: "v3.28.2"
    # kind writes a kubeconfig pointing at 127.0.0.1. The API server actually
    # runs inside the dind SERVICE container, which is a different container
    # from this job, so the drills retarget the kubeconfig at this hostname.
    APISERVER_HOST: "docker"
  before_script:
    - apk add --no-cache bash curl
    # Fail loudly on an empty version rather than downloading a 404 page and
    # letting `tar` report "invalid magic" from three commands later.
    - |
      for v in KIND_VERSION KUBECTL_VERSION HELM_VERSION; do
        eval "val=\${$v}"
        [ -n "$val" ] || { echo "ERROR: $v is empty — a variables: merge clobber?"; exit 1; }
      done
    - curl -fsSLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64" && chmod +x /usr/local/bin/kind
    - curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
    - curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp linux-amd64/helm && mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - kind version && kubectl version --client=true 2>/dev/null | head -1 && helm version --short
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 2; done

helm-install:
  # Boots the chart and asserts it SERVES. ONE `helm install --wait` of the
  # chart's own defaults completes against a cluster with no pre-existing
  # database (#1117's acceptance criterion — this needed a two-phase
  # --no-hooks workaround while the migrate Job was a pre-install hook),
  # `helm test` passes (the same hook operators run), the one-time admin
  # password is retrievable from the shared emptyDir, a placeholder SECRET_KEY
  # is REJECTED (the fail-closed guard is asserted, not assumed), a
  # DJANGO_SECRET_KEY rotation applied in a single `helm upgrade` takes effect
  # AND replaces the pods — #1038 blocker 2 on the path that actually broke —
  # three replicas migrate without deadlocking on the advisory lock, and
  # `helm uninstall` leaves nothing behind. See scripts/helm-install-drill.sh.
  <<: *helm-drill-base
  timeout: 40m
  rules:
    # Advisory on the nightly schedule: a blip on a shared runner pulling Calico
    # manifests or base images is a signal, not a hard red.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *helm-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths
  script:
    - bash scripts/helm-install-drill.sh

helm-netpol:
  # NetworkPolicy ENFORCEMENT drill. A SEPARATE cluster from helm-install, with
  # disableDefaultCNI + Calico, because kind's default kindnetd DOES NOT
  # IMPLEMENT NetworkPolicy — the chart's policies are admitted there and
  # silently ignored, so a policy selecting the wrong pods passes every other
  # gate in this file. That is exactly how the migrate Job came to be missing
  # from the datastore allow-list (#1116) — that Job is gone as of #1117, but
  # the omission shape it demonstrated outlives it.
  #
  # Separate rather than a flag on helm-install so the common deploy smoke test
  # stays fast and two unrelated failure modes stay uncoupled.
  #
  # Scoped to the whole chart, not just networkpolicy.yaml: the policies name
  # their clients by `app.kubernetes.io/component`, so ADDING a template that
  # opens a datastore connection breaks isolation without touching the policy
  # file itself.
  <<: *helm-drill-base
  timeout: 45m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *helm-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths
  script:
    - bash scripts/helm-netpol-drill.sh

# ─── Frontend — lint ──────────────────────────────────────────────────────────

# ESLint + TypeScript type checking in a single job — both need npm ci so
# combining them eliminates a redundant pod spin-up and install cycle.
frontend-lint:
  extends: .npm-cache
  stage: lint
  image: node:20-alpine
  variables:
    # Cap below available RAM so V8 GCs aggressively instead of OOM-killing.
    # 1500 MB caused exit 137 on the 2 GB runner; 512 MB forces earlier GC.
    NODE_OPTIONS: "--max-old-space-size=512"
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # Scope to src/ to avoid scanning build artefacts and reduce memory pressure
    # from eslint loading the full working tree. --max-warnings 15 matches the
    # sast job allowance for pre-existing react-hooks/exhaustive-deps warnings.
    - npm run lint -- src/ --max-warnings 15
    - npx tsc -p tsconfig.app.json --noEmit
    - npx tsc -p tsconfig.e2e.json --noEmit

# ─── Frontend — test ──────────────────────────────────────────────────────────

frontend-test:
  extends: .npm-cache
  stage: test
  needs: []
  image: node:20-alpine
  variables:
    # Match frontend-lint: cap below available RAM so V8 GCs before OOM-kill.
    NODE_OPTIONS: "--max-old-space-size=512"
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml --coverage
  coverage: '/All files\s+\|\s+(\d+(?:\.\d+)?)\s+\|/'
  artifacts:
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/cobertura-coverage.xml
    when: always

# Diff coverage (MR only) — #1076. Same rationale as backend-diff-coverage
# above: vitest.config.ts's aggregate thresholds (lines: 70, etc.) measure
# the whole frontend and can absorb an untested new component. This job
# reuses frontend-test's existing cobertura-coverage.xml — diff-cover reads
# Cobertura XML natively, so no new vitest reporter (e.g. lcov) is needed.
#
# src/test/ is already excluded from the coverage report itself (see
# vitest.config.ts's coverage.exclude), so those files never appear as
# "uncovered" here; the --exclude below is belt-and-suspenders per #1076's
# acceptance criteria and guards against a future reporter config change.
#
# Threshold starts at 80% of changed lines, blocking. Same escape hatch as
# the backend job — see docs/development/testing.md#diff-coverage-escape-hatch.
frontend-diff-coverage:
  stage: test
  needs: [frontend-test]
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet diff-cover
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
  script:
    - diff-cover frontend/coverage/cobertura-coverage.xml
        --compare-branch=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        --fail-under=80
        --show-uncovered
        --exclude "frontend/src/test/*" "frontend/src/**/*.test.*" "frontend/src/**/*.spec.*"

# Guards a blind spot in diff-cover that both jobs above share (#1091, follow-up
# to #1076): a brand-new source file with zero tests never appears as a row in
# coverage.xml / cobertura-coverage.xml at all, so diff-cover finds nothing to
# score for it and reports 100% — the inverse of what should happen. This is
# the per-MR counterpart to #1090 (an uninstrumented CI job reading as 0% in
# the aggregate) — same root cause, unmeasured code scored as if it were fine.
#
# Reuses the coverage.xml / cobertura-coverage.xml artifacts produced above
# rather than re-running any tests. `optional: true` on both `needs` entries
# means this job still runs (and still fails loudly, see the script's own
# "report not found" branch) even if only one of backend/frontend changed —
# but in practice a newly *added* file under backend/ or frontend/src/ always
# triggers its own coverage job via the `changes:` rules on
# backend-test-coverage / frontend-test, so both stay in lockstep with this
# job's own `changes:` list.
added-files-coverage-check:
  stage: test
  needs:
    - job: backend-test-coverage
      artifacts: true
      optional: true
    - job: frontend-test
      artifacts: true
      optional: true
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - frontend/**/*
        - .gitlab-ci.yml
        - scripts/check-added-files-covered.mjs
  before_script:
    - apk add --no-cache git
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
  script:
    - node scripts/check-added-files-covered.mjs
        --target-ref origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        --no-fetch

# Self-test for added-files-coverage-check, per the house rule in #1093 (not
# yet standardized elsewhere — this is the first gate to adopt it): a bespoke
# gate script's detection logic must be provable in its own job, on the same
# image as the real check, so a shared-job skip can't silently take both down
# together. Builds its own synthetic git repo + coverage fixtures in a temp
# dir; touches nothing in this repository and needs no network or database —
# see check-added-files-covered.mjs's `selfTest()`.
added-files-coverage-check-self-test:
  stage: test
  needs: []
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/check-added-files-covered.mjs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - scripts/check-added-files-covered.mjs
  before_script:
    - apk add --no-cache git
  script:
    - node scripts/check-added-files-covered.mjs --self-test

# ─── Frontend — E2E (Playwright) ─────────────────────────────────────────────
#
# Runs the Playwright suite against the Vite dev server using the official
# Microsoft Playwright Docker image (browsers pre-installed, no download step).
# API calls are intercepted by page.route() so no backend is required.
#
# Starts as allow_failure: true to tolerate transient flakiness during the
# initial rollout period.  Promote to required after three consecutive clean
# weeks of pipeline history on main.
#
# Uses workers: 1 (via playwright.config.ts) to stay within the 2 GB runner
# memory budget (Chromium ~500 MB + Vite dev server ~400 MB).

playwright-e2e:
  stage: test
  needs: []
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  allow_failure: true
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx playwright test --output=test-results
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    reports:
      junit: frontend/test-results/junit.xml
    expire_in: 7 days

# ─── Changelog check (MR only) ────────────────────────────────────────────────
#
# Fails when no changelog fragment was added and the MR contains changes that
# warrant a changelog entry. Each MR drops a file in changelog.d/ instead of
# editing CHANGELOG.md directly — this eliminates merge conflicts.
#
# Fragment naming: <issue-or-slug>.<type>.md  (e.g. 434.fixed.md)
# Valid types: added, changed, fixed, security
#
# Auto-skips for MRs that only touch:
#   - CI/CD config (.gitlab-ci.yml, .gitlab/)
#   - Documentation (docs/, *.md other than changelog fragments, README*)
#   - Developer tooling (CLAUDE.md, .gitignore, scripts/, Makefile, *.sh)
#   - Test files only (frontend/src/test/, backend/*/tests/)
# To skip manually for a legitimate edge case, add the ~no-changelog label.

changelog-check:
  extends: .on-mr
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache git
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
    - BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD || echo "")
    - |
      if [ -z "$BASE" ]; then
        echo "INFO — could not determine merge base; skipping changelog check."
        exit 0
      fi
    - |
      # Skip if the MR carries the no-changelog label
      if echo "$CI_MERGE_REQUEST_LABELS" | tr ',' '\n' | grep -qx 'no-changelog'; then
        echo "INFO — 'no-changelog' label present; skipping."
        exit 0
      fi
    - CHANGED=$(git diff --name-only $BASE HEAD)
    - |
      # Strip files that never need a changelog entry
      MEANINGFUL=$(echo "$CHANGED" | grep -Ev \
        '^\.gitlab(-ci\.yml|/)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(docs/|README|CLAUDE\.md|\.gitignore|Makefile|scripts/|mkdocs\.yml)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '\.(md|sh)$' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(frontend/src/test/|frontend/e2e/|backend/.*/tests/)' \
        || true)
      if [ -z "$MEANINGFUL" ]; then
        echo "INFO — only non-product files changed; skipping changelog check."
        exit 0
      fi
    - |
      # Accept either a changelog fragment OR a direct CHANGELOG.md edit
      # (the latter supports in-flight MRs during the transition period).
      HAS_FRAGMENT=$(echo "$CHANGED" | grep -c '^changelog\.d/.*\.\(added\|changed\|fixed\|security\)\.md$' || true)
      HAS_CHANGELOG=$(echo "$CHANGED" | grep -c 'CHANGELOG.md' || true)
      if [ "$HAS_FRAGMENT" -gt 0 ]; then
        echo "OK — changelog fragment found."
      elif [ "$HAS_CHANGELOG" -gt 0 ]; then
        echo "OK — CHANGELOG.md updated directly (legacy mode)."
      else
        echo "ERROR — No changelog fragment found." >&2
        echo "" >&2
        echo "  Add a file to changelog.d/ named: <issue-or-slug>.<type>.md" >&2
        echo "  Valid types: added, changed, fixed, security" >&2
        echo "  Example:  echo 'Description of change (#123)' > changelog.d/123.fixed.md" >&2
        echo "" >&2
        echo "  Or apply the ~no-changelog label if this MR genuinely needs no entry." >&2
        exit 1
      fi

# ─── Security (MR only) ───────────────────────────────────────────────────────
#
# Security jobs run only on MR pipelines — they are the gate before merging
# and do not need to run on every WIP commit.

# bandit: Python SAST for security issues — shell injection, hardcoded
# credentials, use of random instead of secrets, SQL injection patterns, etc.
# Runs at medium severity (-ll) so only Medium/High findings block the merge.
# Skips migration files (auto-generated, safe to ignore) and test files
# (test utilities like mock tokens are intentionally insecure-looking).
backend-sast:
  extends: .pip-cache
  stage: security
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*.py
  before_script:
    - pip install --quiet bandit
  script:
    # Single scan: write JSON artifact, then print a readable summary and exit
    # with bandit's own exit code. bandit does not support two simultaneous
    # output formats, so we parse the JSON to produce log output instead of
    # running a second full scan.
    # Use && ... || ... to capture the exit code safely under set -e.
    - |
      bandit -r backend/ \
        --severity-level medium \
        --confidence-level medium \
        --exclude backend/boards/migrations,backend/groups/migrations,backend/accounts/migrations,backend/visiban/migrations \
        --skip B101 \
        -f json -o bandit-report.json && BANDIT_EXIT=0 || BANDIT_EXIT=$?
      python3 - <<'PY'
      import json
      d = json.load(open("bandit-report.json"))
      results = d.get("results", [])
      metrics = d.get("metrics", {}).get("_totals", {})
      print(f"bandit: {metrics.get('loc', '?')} lines scanned, {len(results)} issue(s)")
      for r in results:
          print(f"  [{r['issue_severity']}/{r['issue_confidence']}] {r['test_id']} {r['issue_text']}")
          print(f"    {r['filename']}:{r['line_number']}")
      PY
      exit $BANDIT_EXIT
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - bandit-report.json

# eslint-plugin-security: JS/TS SAST for injection, prototype pollution,
# non-literal regexp/require, and other common frontend security issues.
# Runs as a dedicated security job (separate from style linting) so failures
# are clearly security-attributed and block merges independently.
frontend-sast:
  extends: .npm-cache
  stage: security
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/src/**/*.{ts,tsx}
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/src/**/*.{ts,tsx}
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # ESLint v9 uses flat config and removed --no-eslintrc.  Write a temporary
    # flat config *inside the frontend dir* so bare-specifier imports resolve
    # against the local node_modules.  --no-config-lookup prevents the project's
    # eslint.config.js from being merged in, keeping this job focused only on
    # the security rules below.
    # detect-object-injection is set to warn: it fires on common TypeScript
    # bracket-access patterns and produces many false positives in React code.
    - |
      cat > eslint-security.config.mjs <<'ESLINTEOF'
      import security from 'eslint-plugin-security';
      import tsParser from '@typescript-eslint/parser';
      import reactHooks from 'eslint-plugin-react-hooks';
      import reactRefresh from 'eslint-plugin-react-refresh';
      import tseslint from 'typescript-eslint';
      const rules = { 'security/detect-object-injection': 'warn', 'security/detect-non-literal-regexp': 'error', 'security/detect-non-literal-require': 'error', 'security/detect-possible-timing-attacks': 'warn', 'security/detect-eval-with-expression': 'error' };
      // Register react-hooks, react-refresh, and @typescript-eslint plugins so that
      // eslint-disable-next-line comments referencing their rules are recognised as
      // valid (prevents "Definition for rule X was not found" errors).  No rules from
      // these plugins are enabled — only security/ rules are enforced here.
      const linterOptions = { reportUnusedDisableDirectives: 'off' };
      export default [
        { files: ['**/*.{ts,tsx}'], languageOptions: { parser: tsParser }, linterOptions, plugins: { security, 'react-hooks': reactHooks, 'react-refresh': reactRefresh, '@typescript-eslint': tseslint.plugin }, rules },
        { files: ['**/*.{js,mjs,jsx}'], linterOptions, plugins: { security }, rules },
      ];
      ESLINTEOF
      npx eslint --no-config-lookup --config eslint-security.config.mjs src/
  allow_failure: true

# pip-audit: checks Python packages against the OSV vulnerability database.
# On MRs: only when requirements.txt changes; allow_failure so a new CVE in an
# existing dep doesn't block unrelated MRs.
# On the weekly CVE schedule: always runs; allow_failure: false so the pipeline
# fails and GitLab sends a failure email to maintainers.
backend-dep-scan:
  stage: security
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/requirements.txt
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
      allow_failure: false
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit -r backend/requirements.txt --format json -o pip-audit-report.json || true
    - pip-audit -r backend/requirements.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pip-audit-report.json

# npm audit: flag HIGH or CRITICAL CVEs in frontend npm dependencies.
# Same MR / schedule split as backend-dep-scan above.
frontend-dep-scan:
  extends: .npm-cache
  stage: security
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/package-lock.json
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
      allow_failure: false
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm audit --audit-level=high
  after_script:
    - cd frontend && npm audit --json > ../npm-audit-report.json 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - npm-audit-report.json

# License compliance — flag GPL-2.0/GPL-3.0 dependencies that are incompatible
# with the project's Apache 2.0 license. Non-blocking so it warns but doesn't
# gate merges.

backend-license-check:
  extends: [.on-mr, .pip-cache]
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r backend/requirements.txt pip-licenses
  script:
    - pip-licenses --format=plain --fail-on="GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2)"
  allow_failure: true

frontend-license-check:
  extends: [.on-mr, .npm-cache]
  stage: security
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx license-checker --failOn "GPL-2.0;GPL-3.0" --summary
  allow_failure: true

# trivy: filesystem scan for OS-level CVEs in the Docker base images and
# IaC misconfigurations in Dockerfiles and Helm charts.
#
# Why trivy in addition to pip-audit / npm audit:
#   - pip-audit and npm audit only see application-layer dependencies.
#     trivy also scans the OS packages installed in the Docker image
#     (e.g. Alpine apk packages in python:3.12-slim or node:20-alpine)
#     for CVEs that the app-layer scanners never see.
#   - --scanners vuln,config catches both CVEs and IaC issues (Dockerfile
#     USER root, ADD instead of COPY, missing HEALTHCHECK, etc.) in one pass.
#
# Runs on any change to a Dockerfile, requirements.txt, package-lock.json,
# or Helm chart, plus always on main. allow_failure: true so a newly
# published OS CVE in a base image does not immediately block merges —
# findings are visible in the job log and artifact for triage.
trivy-scan:
  stage: security
  image:
    name: ghcr.io/aquasecurity/trivy:0.74.0
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/Dockerfile
        - frontend/Dockerfile
        - backend/requirements.txt
        - frontend/package-lock.json
        - helm/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # Scan the repo filesystem — catches vuln in declared deps and IaC issues
    # in Dockerfiles and Helm templates. --exit-code 0 so the job is non-
    # blocking; severity threshold is HIGH,CRITICAL for the visible summary.
    - trivy fs .
        --scanners vuln,config
        --severity HIGH,CRITICAL
        --exit-code 0
        --format table
    - trivy fs .
        --scanners vuln,config
        --severity HIGH,CRITICAL
        --exit-code 0
        --format json
        --output trivy-report.json
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-report.json

# OSV-Scanner: unified Python + npm dependency vulnerability scan using the
# OSV.dev advisory database (PyPA, GitHub Advisory, and 20+ ecosystem feeds).
# Complements pip-audit and npm audit with first-party OSV data, which has
# lower false-positive rates than NVD.
#
# Runs unconditionally on every MR and on main — no `changes:` filter. OSV
# advisories are database-driven: a HIGH can be published against a version
# already sitting in a committed, unchanged lockfile, so a changes-gated rule
# would only ever catch it after it lands on main. The job is a few seconds of
# static-binary download plus a fast scan, so running it on every pipeline is
# cheap. Also runs on the weekly CVE schedule for the same reason pip-audit /
# npm-audit do: to catch a freshly-published advisory against dependencies
# nobody touched this week either.
#
# Severity gate: OSV-Scanner has no native severity threshold (confirmed on
# v2.3.5 — no --severity / --fail-on / --audit-level flag), so it exits
# non-zero on ANY non-ignored advisory. scripts/osv-severity-gate.sh
# classifies the JSON output and FAILS only on HIGH/CRITICAL (blocks the
# pipeline); MEDIUM/LOW/unscored WARN (exit 2, mapped to allow_failure below —
# visible in the pipeline as a yellow warning, but non-blocking). Accepted
# risks are suppressed via an osv-scanner.toml next to the relevant lockfile
# (auto-discovered — do not pass --config, which would force a single global
# file), with a documented, expiring IgnoredVulns entry — same escape-hatch
# shape as migration-check's `# concurrency-exempt:` comment. See
# scripts/osv-severity-gate.sh for the full exit-code contract; it is
# unit-tested in scripts/tests/osv-severity-gate.test.sh.
#
# Runs on alpine + a pinned binary download rather than the distroless
# ghcr.io/google/osv-scanner image: the severity gate needs a shell and jq,
# which the distroless image doesn't have. Matches the gitleaks-scan /
# trivy-scan jobs' pinned-binary approach.
dep-scan-osv:
  stage: security
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OSV_SCAN == "true"'
  allow_failure:
    exit_codes:
      - 2
  before_script:
    - apk add --no-cache wget jq
    - wget -q -O /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.3.5/osv-scanner_linux_amd64"
    - chmod +x /usr/local/bin/osv-scanner
  script:
    # Write JSON report first (osv-scanner exits non-zero on any finding; the
    # severity verdict is delegated entirely to the gate script below).
    - osv-scanner scan source
        --lockfile backend/requirements.txt
        --lockfile frontend/package-lock.json
        --format json
        --output-file osv-report.json
        || true
    - sh scripts/osv-severity-gate.sh osv-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - osv-report.json

# gitleaks: full working-tree secret scan using the upstream default ruleset.
# Complements the GitLab secret-detection component included at the top of
# this file (different implementation and ruleset), and — unlike it — is not
# limited to what a diff-scoped analyzer sees: `gitleaks dir .` scans every
# file in the checkout, unconditionally, since a secret can land in any file.
# Scoped, documented allowlist for genuine false positives (npm lockfile
# integrity hashes, API doc examples, test fixtures) lives in .gitleaks.toml.
# Pinned static binary, matching the osv/trivy jobs.
#
# Also wired as a local pre-commit hook (scripts/gitleaks-precommit.sh, via
# scripts/setup-hooks.sh) so a secret is caught before it is even committed.
# That hook matters here specifically: per the workflow rules above, a branch
# with no open MR gets zero CI, so a secret pushed to such a branch would
# otherwise go unscanned by anything in this file until an MR is opened.
gitleaks-scan:
  stage: security
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache wget
    - wget -q -O /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - chmod +x /usr/local/bin/gitleaks
  script:
    - gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

# ─── Build verification (MR only) ─────────────────────────────────────────────
#
# Verify Docker images build successfully before merging. Catches Dockerfile
# drift early without pushing to any registry.
# Uses kaniko instead of Docker-in-Docker — no privileged mode needed, works
# out of the box on Kubernetes runners.
# Runs in the test stage alongside tests — build doesn't depend on test
# results, so running them in parallel saves a full stage of waiting.

backend-docker-build:
  stage: test
  # No needs: [] — let lint finish before kaniko starts so both don't compete
  # for RAM on the same runner. resource_group serializes the two kaniko jobs
  # so they don't overlap with each other either.
  resource_group: kaniko-build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - backend/Dockerfile
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
        printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
          "$(printf '%s:%s' "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')" \
          > /kaniko/.docker/config.json
      else
        printf '{}' > /kaniko/.docker/config.json
      fi
  script:
    - /kaniko/executor --context=backend --dockerfile=backend/Dockerfile --no-push --snapshot-mode=redo

frontend-docker-build:
  stage: test
  resource_group: kaniko-build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
        printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
          "$(printf '%s:%s' "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')" \
          > /kaniko/.docker/config.json
      else
        printf '{}' > /kaniko/.docker/config.json
      fi
  script:
    - /kaniko/executor --context=frontend --dockerfile=frontend/Dockerfile --no-push --snapshot-mode=redo --build-arg NODE_OPTIONS=--max-old-space-size=512

# ─── Docker push (amd64) ──────────────────────────────────────────────────────
#
# Builds and pushes images with kaniko — the same daemonless builder the
# MR-time *-docker-build jobs already use. No Docker daemon, no privileged
# mode, no self-hosted runner.
#
# Why this changed: these jobs previously ran `docker buildx` against a Docker
# socket mounted by a self-hosted runner's config.toml. That runner ("nuc
# runner", group runner 53511568) went stale on 2026-07-18; every push since has
# been scheduled onto a GitLab SaaS runner and failed with "Cannot connect to
# the Docker daemon at unix:///var/run/docker.sock". The last successful push
# was 2026-06-26. kaniko removes that single point of failure — these jobs now
# run on any runner.
#
# ARCHITECTURE: amd64 only.
#
# The buildx path this replaces also emitted linux/arm64 via QEMU emulation on
# the self-hosted runner. kaniko cannot cross-build, so arm64 would need a
# native arm64 runner — and `saas-linux-medium-arm64` resolves to
# `no_matching_runner` on this project's plan (verified on pipeline 2845582400).
# arm64 has not actually been published since 2026-06-26 regardless, because the
# runner that built it is gone. Restoring it needs a runner that can build arm64
# natively, so it is tracked separately in #1084 (milestone 1.2) rather than left
# here as a job that would hang a release pipeline on no_matching_runner.
#
# On main-branch merges: :latest and :<short-sha> to the GitLab registry.
# On release tags: additionally :<tag> and, for stable releases, the
#   :MAJOR.MINOR alias — on both the GitLab registry and GHCR.

.kaniko-push-common:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      # Assemble a docker config covering every registry a push job may touch:
      # the GitLab registry (push), GHCR (push on tags), and Docker Hub (pull —
      # the Dockerfiles' base images; anonymous pulls are rate limited). Each
      # entry is added only when its credentials are present, so a fork without
      # GHCR_TOKEN still builds and pushes to its own registry.
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      if [ -n "${GHCR_USER}" ] && [ -n "${GHCR_TOKEN}" ]; then
        AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      fi
      if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
        AUTHS="${AUTHS},\"https://index.docker.io/v1/\":{\"auth\":\"$(b64 "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}")\"}"
      fi
      printf '{"auths":{%s}}' "${AUTHS}" > /kaniko/.docker/config.json
    - |
      # Emit the --destination flags for one image, matching the tag set the
      # buildx jobs published. $1 = image name under each registry root.
      # Stable releases (no pre-release suffix) also get the :MAJOR.MINOR alias,
      # which is what users should pin to for production stability.
      destinations() {
        img="$1"
        echo "--destination=${CI_REGISTRY_IMAGE}/${img}:latest"
        echo "--destination=${CI_REGISTRY_IMAGE}/${img}:${CI_COMMIT_SHORT_SHA}"
        if [ -n "${CI_COMMIT_TAG}" ]; then
          echo "--destination=${CI_REGISTRY_IMAGE}/${img}:${CI_COMMIT_TAG}"
          echo "--destination=ghcr.io/visiban/visiban/${img}:${CI_COMMIT_TAG}"
          echo "--destination=ghcr.io/visiban/visiban/${img}:latest"
          if echo "${CI_COMMIT_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            MINOR="$(echo "${CI_COMMIT_TAG}" | grep -oE '^v[0-9]+\.[0-9]+' | tr -d 'v')"
            echo "--destination=${CI_REGISTRY_IMAGE}/${img}:${MINOR}"
            echo "--destination=ghcr.io/visiban/visiban/${img}:${MINOR}"
          fi
        fi
      }

backend-docker-push:
  extends: .kaniko-push-common
  needs: [backend-test-coverage]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      # shellcheck disable=SC2046 — word splitting is intended; one flag per line.
      /kaniko/executor \
        --context=backend \
        --dockerfile=backend/Dockerfile \
        --snapshot-mode=redo \
        $(destinations backend)

frontend-docker-push:
  extends: .kaniko-push-common
  needs: [frontend-test]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      /kaniko/executor \
        --context=frontend \
        --dockerfile=frontend/Dockerfile \
        --snapshot-mode=redo \
        --build-arg NODE_OPTIONS=--max-old-space-size=512 \
        $(destinations frontend)

# ─── Helm — publish chart to GHCR (release tags) ─────────────────────────────
#
# The chart is the deployment path docs/getting-started/kubernetes.md recommends
# for production, and until #1116 it was published nowhere: operators had to
# `git clone` the repo to install it. The backend and frontend images already go
# to ghcr.io/visiban/visiban on a release tag; the chart now goes with them, as
# an OCI artifact, so `helm install oci://ghcr.io/visiban/charts/visiban` works.
#
# Cosign-signed keyless (Sigstore via SIGSTORE_ID_TOKEN), so an operator can
# `cosign verify` the chart they pull rather than trusting the registry.
#
# Credentials: GHCR_USER + GHCR_TOKEN (the existing `visiban-ghcr-push` PAT,
# scope write:packages). Missing credentials FAIL this job rather than skipping
# it — a release that silently ships no chart is the failure mode this job
# exists to prevent.

helm-publish:
  stage: deploy
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache bash curl
    # Pinned and checksum-verified: an unpinned signing tool is a supply-chain
    # hole in the job whose whole purpose is supply-chain provenance.
    - |
      COSIGN_VERSION=2.4.3
      COSIGN_SHA256=caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708
      curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
      echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
  script:
    - |
      if [ -z "${GHCR_USER}" ] || [ -z "${GHCR_TOKEN}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot publish the Helm chart."
        echo "Configure both under Settings → CI/CD → Variables (Masked + Protected) before tagging."
        exit 1
      fi
    # The chart's appVersion must match the tag being released. A chart that
    # ships pointing at the previous release's images is #1038's root cause
    # (a chart two minor versions stale), and it is invisible until someone
    # installs it.
    - |
      APP_VERSION="$(helm show chart helm/visiban | awk '/^appVersion:/{print $2}' | tr -d '"')"
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: Chart.yaml appVersion ($APP_VERSION) does not match the release tag ($TAG_VERSION)."
        echo "Bump appVersion in helm/visiban/Chart.yaml before tagging."
        exit 1
      fi
      echo "appVersion check passed: $APP_VERSION"
    - helm registry login ghcr.io -u "$GHCR_USER" -p "$GHCR_TOKEN"
    - helm package helm/visiban --destination /tmp
    - |
      CHART_FILE="$(ls /tmp/visiban-*.tgz)"
      CHART_NAME="$(helm show chart helm/visiban | awk '/^name:/{print $2}')"
      helm push "$CHART_FILE" "oci://ghcr.io/visiban/charts" 2>&1 | tee /tmp/helm-push.log
      # Sign the by-digest reference `helm push` reports, not the tag — a tag can
      # be moved, a digest cannot.
      CHART_DIGEST="$(awk '/Digest: /{print $2}' /tmp/helm-push.log)"
      cosign sign --yes "ghcr.io/visiban/charts/${CHART_NAME}@${CHART_DIGEST}"

# ─── GHCR manual push ─────────────────────────────────────────────────────────
#
# Pushes :latest to GHCR on demand without running the full CI suite. Click the
# play button on any pipeline's deploy stage to trigger.
#
# Builds from the commit the pipeline is running on. To push from a specific
# branch, trigger a pipeline on that branch (glab ci run -b <branch>) and
# click play here.

ghcr-push-backend:
  extends: .kaniko-push-common
  when: manual
  allow_failure: true
  script:
    - /kaniko/executor
        --context=backend
        --dockerfile=backend/Dockerfile
        --snapshot-mode=redo
        --destination=ghcr.io/visiban/visiban/backend:latest

ghcr-push-frontend:
  extends: .kaniko-push-common
  when: manual
  allow_failure: true
  script:
    - /kaniko/executor
        --context=frontend
        --dockerfile=frontend/Dockerfile
        --snapshot-mode=redo
        --build-arg NODE_OPTIONS=--max-old-space-size=512
        --destination=ghcr.io/visiban/visiban/frontend:latest

# ─── GitHub Release ────────────────────────────────────────────────────────────
#
# Runs only on version tag pipelines, after both images are confirmed pushed.
# Reads release notes for the tag from CHANGELOG.md and creates a GitHub Release
# with GHCR image references appended. rc/beta/alpha tags are marked pre-release.
# GH_TOKEN CI variable (repo-scoped PAT) is passed through automatically.

github-release:
  stage: deploy
  image: alpine:3.19
  needs: [backend-docker-push, frontend-docker-push]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    - apk add --no-cache github-cli
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
              | sed '/^[[:space:]]*$/d' | sed '/^---[[:space:]]*$/d')
      if [ -z "$NOTES" ]; then
        NOTES="See [CHANGELOG.md](https://gitlab.com/visiban/visiban/-/blob/main/CHANGELOG.md) for details."
      fi

      PRERELEASE_FLAG=""
      if echo "${CI_COMMIT_TAG}" | grep -qE '\-(rc|beta|alpha)\.'; then
        PRERELEASE_FLAG="--prerelease"
      fi

      NOTES_FILE=$(mktemp)
      printf '%s\n\n---\n\n**Docker images**\n\n```\nghcr.io/visiban/visiban/backend:%s\nghcr.io/visiban/visiban/frontend:%s\n```\n' \
        "$NOTES" "${CI_COMMIT_TAG}" "${CI_COMMIT_TAG}" > "$NOTES_FILE"

      gh release create "${CI_COMMIT_TAG}" \
        --repo "visiban/visiban" \
        --title "${CI_COMMIT_TAG}" \
        --notes-file "$NOTES_FILE" \
        ${PRERELEASE_FLAG}
      rm -f "$NOTES_FILE"

# ─── Docs — versioned with mike ───────────────────────────────────────────────
#
# mike manages a versioned MkDocs site on the gh-pages branch.
# Docs are deployed by scripts/release.sh as part of the release process.
#
# This CI job exists only as a manual recovery tool — e.g. if a release script
# run was interrupted after tagging but before mike deployed. To redeploy:
# CI/CD → Run pipeline on main → set DOCS_VERSION=<version tag> → play job.
# The docs content used is whatever is on main at the time of the manual trigger.
#
# After mike pushes to gh-pages, GitLab triggers a new pipeline on that branch.
# The "pages" job (which must be named exactly "pages") runs there, copies the
# branch content to public/, and GitLab Pages serves it at docs.visiban.com.
#
# Required CI/CD project variable (Settings → CI/CD → Variables):
#   DOCS_DEPLOY_TOKEN — a project access token with "write_repository" scope,
#                       used so mike can push to the gh-pages branch.
#                       Create at Settings → Access Tokens → role: Developer,
#                       scope: write_repository. Store as a masked variable.
#
# Added: 2026-03-13

docs-deploy:
  stage: deploy
  image: python:3.12-slim
  needs: []
  variables:
    DOCS_VERSION: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet -r docs/requirements.txt
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    # Restore existing gh-pages history so mike can append to it.
    # Force-update in case a stale local branch exists from a previous job on the same runner.
    - git fetch origin gh-pages --depth=1 && (git branch -f gh-pages origin/gh-pages 2>/dev/null || git branch gh-pages origin/gh-pages) || true
  script:
    - |
      VERSION="${DOCS_VERSION:-$CI_COMMIT_TAG}"
      if [ -z "$VERSION" ]; then
        # Auto-deploy from main (docs change pipeline): read version from .env.example.
        VERSION=$(grep '^APP_VERSION=' .env.example | cut -d= -f2)
        # APP_VERSION doesn't carry the v prefix; mike entries must match release tags.
        if [ -n "$VERSION" ] && ! echo "$VERSION" | grep -q '^v'; then
          VERSION="v${VERSION}"
        fi
      fi
      if [ -z "$VERSION" ]; then
        # Manual trigger from main without DOCS_VERSION set and no APP_VERSION found.
        echo "INFO: no version to deploy. Re-run with DOCS_VERSION=<tag> to publish docs."
        exit 0
      fi
      if echo "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
        MINOR=$(echo "$VERSION" | grep -oE '^v?[0-9]+\.[0-9]+')
        mike deploy --push --update-aliases "$VERSION" "${MINOR}" latest
        mike set-default --push "${MINOR}"
      else
        mike deploy --push --update-aliases "$VERSION" next
      fi
  rules:
    # Auto-deploy on version tags (pushed by scripts/release.sh)
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
      variables:
        DOCS_VERSION: $CI_COMMIT_TAG
    # Auto-deploy on main when docs content or mkdocs config changes
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - mkdocs.yml
      when: on_success
    # Manual recovery on main — set DOCS_VERSION in pipeline variables
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

# ─── Weekly CVE dependency scan ───────────────────────────────────────────────
#
# backend-dep-scan and frontend-dep-scan (defined in the security stage above)
# run on a weekly GitLab CI schedule with CVE_SCAN=true set as a schedule
# variable. Unlike their MR counterparts they use allow_failure: false, so a
# new HIGH/CRITICAL CVE causes the pipeline to fail and GitLab emails all
# maintainers who have "Failed pipeline" notifications enabled.
#
# To enable email notifications:
#   Profile → Notifications → Global notification level → "Watch"
#   or set per-project in Project → Notification settings → "Failed pipeline"
#
# The schedule itself is configured in GitLab: CI/CD → Schedules
#   Description : Weekly CVE scan
#   Interval    : 0 8 * * 1  (Mondays 08:00 UTC)
#   Target branch: main
#   Variables   : CVE_SCAN = true
#
# ─── Scheduled branch cleanup ─────────────────────────────────────────────────
#
# Deletes remote branches that have been fully merged into main.
# Runs on a GitLab CI schedule (e.g. weekly) — not on every push.
#
# Requires the same DOCS_DEPLOY_TOKEN variable used by docs-deploy
# (write_repository scope is sufficient to delete branches).
#
# Protected branches (main, gh-pages) are never touched — GitLab enforces
# this server-side regardless, but the grep exclude below makes the intent
# explicit. The gh-pages branch is managed by mike and must never be deleted.
#
# To configure the schedule: CI/CD → Schedules → New schedule → set branch
# to main and cron to "0 3 * * 1" (Mondays at 03:00 UTC).

cleanup-merged-branches:
  stage: deploy
  image: alpine:3.19
  needs: []
  before_script:
    - apk add --no-cache git
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch --prune origin
  script:
    - |
      # grep -v exits 1 when no lines match (all merged branches already gone).
      # The || true prevents pipefail from killing the job in that success case.
      merged=$(git branch -r --merged origin/main \
        | { grep -v 'origin/main$\|origin/HEAD\|origin/gh-pages' || true; } \
        | sed 's|origin/||' \
        | xargs)
      if [ -z "$merged" ]; then
        echo "No merged branches to delete."
      else
        echo "Deleting: $merged"
        echo "$merged" | xargs git push origin --delete
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ─── Demo data seed ───────────────────────────────────────────────────────────
#
# Refreshes the Visiban Demo Board on the dedicated demo environment.
# Runs weekly via a GitLab CI schedule and can be triggered manually at any time.
#
# Setup:
#   1. Create a protected CI/CD variable DEMO_DATABASE_URL pointing to the demo
#      environment's PostgreSQL instance (Settings → CI/CD → Variables).
#   2. Create a GitLab schedule (CI/CD → Schedules) targeting main with cron
#      "0 4 * * 1" (Mondays at 04:00 UTC) and set variable SEED_SCHEDULE=true.
#
# The --wipe flag deletes the "Visiban Demo Board" and recreates it from scratch.
# --force overrides the DEBUG=False guard so the command runs in CI without DEBUG=True.
# Board-scoped wipe: only the demo board is deleted; all other data is untouched.
#
# PROTECTION: The "demo" environment must be configured as a protected environment
# in GitLab (Settings → CI/CD → Protected environments) so only maintainers can
# trigger this job. Without this, any developer with push access can wipe the demo board.

seed-demo-data:
  stage: deploy
  needs: []
  image: python:3.12-slim
  environment:
    name: demo
    deployment_tier: staging
  variables:
    DATABASE_URL: $DEMO_DATABASE_URL
    REDIS_URL: $DEMO_REDIS_URL
    DJANGO_SECRET_KEY: $DEMO_SECRET_KEY
    DEBUG: "False"
    ALLOWED_HOSTS: "localhost"
    # Set SEED_VALUE in the schedule or manual trigger variables to use a custom
    # random seed. Leave unset to use the default (42).
    SEED_VALUE: ""
  before_script:
    # Fail fast with a clear message if the required CI/CD variables are missing.
    # Without these the job dies mid-pip-install with an unhelpful Django traceback.
    # Setup instructions: docs/administration/demo-data.md#required-gitlab-cicd-variables
    - |
      missing=""
      [ -z "$DJANGO_SECRET_KEY" ] && missing="$missing DEMO_SECRET_KEY"
      [ -z "$DATABASE_URL" ]      && missing="$missing DEMO_DATABASE_URL"
      [ -z "$REDIS_URL" ]         && missing="$missing DEMO_REDIS_URL"
      if [ -n "$missing" ]; then
        echo "ERROR: Required CI/CD variable(s) not set:$missing"
        echo "Add them at Settings → CI/CD → Variables (Protected + Masked, scoped to the 'demo' environment)."
        echo "See docs/administration/demo-data.md for full setup instructions."
        exit 1
      fi
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    # Use today's date (YYYYMMDD) as the random seed so each weekly refresh
    # produces a naturally varied board while remaining reproducible within
    # the same day. Override by setting SEED_VALUE in the CI schedule variables.
    - python manage.py seed_demo_data --wipe --force --seed ${SEED_VALUE:-$(date +%Y%m%d)}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SEED_SCHEDULE == "true"'
    - when: manual
      allow_failure: true

# ─── Seed export drift check ──────────────────────────────────────────────────
#
# Regenerates sample-boards/demo_board.{json,csv} and fails if they
# differ from the committed versions. Catches model changes that invalidate the
# static files. Run on MR pipelines when seed commands or models are touched.

seed-export-check:
  extends: .pip-cache
  stage: lint
  needs: []
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py migrate --run-syncdb --no-input
    - python manage.py seed_demo_data --export
    - cd ..
    - |
      if ! git diff --exit-code sample-boards/demo_board.json sample-boards/demo_board.csv; then
        echo "ERROR: sample-boards/demo_board.{json,csv} are out of date. Run 'python manage.py seed_demo_data --export' and commit the result."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/boards/management/commands/seed_demo_data.py
        - sample-boards/demo_board.*

# Runs on the gh-pages branch after docs-deploy pushes to it.
# Copies the branch content to public/ for GitLab Pages to serve.
# The job name must be exactly "pages" for GitLab Pages to pick it up.
pages:
  stage: deploy
  image: alpine:3.19
  needs: []
  script:
    - cp -r . public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages"'
