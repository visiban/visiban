# ─── Catalog components ───────────────────────────────────────────────────────
#
# SAST: Semgrep-based static analysis via the official GitLab catalog component.
# Covers Python and TypeScript/JavaScript with broader rules than Bandit.
# enable_mr_pipelines: true — runs on MR pipelines in addition to branch
# pipelines, so findings gate merges. excluded_paths skips generated code.

include:
  - component: gitlab.com/components/sast/sast@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true
      excluded_paths: >-
        backend/boards/migrations,
        backend/groups/migrations,
        backend/accounts/migrations

# ─── Workflow ─────────────────────────────────────────────────────────────────
#
# Suppress branch pipelines when an MR is already open — the MR pipeline
# covers the same commit, so running both just wastes runner minutes.
# Main-branch commits always get a pipeline (post-merge verification).

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - test
  - build
  - security

# ─── Rule templates ───────────────────────────────────────────────────────────
#
# Extend jobs with .on-mr to restrict them to MR pipelines only.
# Lint and test jobs have no rules so they run on every pipeline.

.on-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── Backend — lint ───────────────────────────────────────────────────────────

# Ruff: fast Python linter (replaces flake8 + isort + pyupgrade).
# allow_failure: true — style issues are visible but do not block commits.
backend-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check backend/
  allow_failure: true

# Code quality report — converts ruff JSON output to CodeClimate format so
# GitLab shows inline quality annotations on MR diffs.
backend-code-quality:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check backend/ --output-format=json -o ruff-raw.json || true
    - |
      python3 - <<'PY'
      import json, hashlib
      raw = json.load(open("ruff-raw.json"))
      issues = []
      for issue in raw:
          path = issue["filename"]
          row = issue["location"]["row"]
          code = issue.get("code") or "RUFF"
          msg = issue["message"]
          fp = hashlib.md5(f"{path}:{row}:{code}".encode()).hexdigest()
          issues.append({
              "type": "issue",
              "check_name": code,
              "description": f"[{code}] {msg}",
              "categories": ["Style"],
              "severity": "minor",
              "fingerprint": fp,
              "location": {"path": path, "lines": {"begin": row}},
          })
      json.dump(issues, open("code-quality-report.json", "w"))
      print(f"{len(issues)} code quality issues")
      PY
  artifacts:
    reports:
      codequality: code-quality-report.json
    paths:
      - code-quality-report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# ─── Backend — test ───────────────────────────────────────────────────────────

backend-test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: visiban_test
    POSTGRES_USER: visiban
    POSTGRES_PASSWORD: ci_password
    DATABASE_URL: "postgres://visiban:ci_password@postgres:5432/visiban_test"
    REDIS_URL: "redis://redis:6379/0"
    DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet coverage
  script:
    - cd backend
    - coverage run --source=. manage.py test boards accounts groups --verbosity=0
    - coverage report --skip-covered --fail-under=90
    - coverage xml -o coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    when: always

# Checks that every model change has a corresponding migration file.
# Does not connect to the database — pure filesystem + model introspection.
migration-check:
  stage: test
  image: python:3.12-slim
  variables:
    DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
    REDIS_URL: "redis://localhost:6379/0"
    DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py makemigrations --check --dry-run --verbosity=1

# ─── Frontend — lint ──────────────────────────────────────────────────────────

frontend-lint:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm run lint

# TypeScript type checking — separate from ESLint, catches type errors that
# linting misses. Checks tsconfig.app.json (application code) only; vite.config.ts
# is excluded because vitest 2.x ships its own vite 5.x bundle which conflicts
# with the project's vite 7.x when importing its types.
frontend-typecheck:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx tsc -p tsconfig.app.json --noEmit

# ─── Frontend — test ──────────────────────────────────────────────────────────

frontend-test:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm test -- --reporter=verbose

# ─── Security (MR only) ───────────────────────────────────────────────────────
#
# Security jobs run only on MR pipelines — they are the gate before merging
# and do not need to run on every WIP commit.

# pip-audit: checks Python packages against the OSV vulnerability database.
backend-dep-scan:
  extends: .on-mr
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit -r backend/requirements.txt --format json -o pip-audit-report.json || true
    - pip-audit -r backend/requirements.txt
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pip-audit-report.json

# npm audit: flag HIGH or CRITICAL CVEs in frontend npm dependencies.
frontend-dep-scan:
  extends: .on-mr
  stage: security
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm audit --audit-level=high
  allow_failure: true
  after_script:
    - cd frontend && npm audit --json > ../npm-audit-report.json 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - npm-audit-report.json

# detect-secrets: regex scan for accidentally committed API keys, tokens, etc.
# A .secrets.baseline file (committed) lets you track and acknowledge
# any intentional false-positives so the job stays green.
secret-detection:
  extends: .on-mr
  stage: security
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet detect-secrets
  script:
    - |
      if [ -f .secrets.baseline ]; then
        detect-secrets scan --baseline .secrets.baseline .
      else
        detect-secrets scan . > .secrets.baseline
        echo "No baseline found — created one. Review and commit .secrets.baseline."
      fi
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .secrets.baseline

# ─── Build verification (MR only) ─────────────────────────────────────────────
#
# Verify Docker images build successfully before merging. Catches Dockerfile
# drift early without pushing to any registry.

backend-docker-build:
  extends: .on-mr
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build backend/ -f backend/Dockerfile

frontend-docker-build:
  extends: .on-mr
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build frontend/ -f frontend/Dockerfile
