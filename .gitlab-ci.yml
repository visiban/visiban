# ─── Catalog components ───────────────────────────────────────────────────────
#
# SAST: Semgrep-based static analysis via the official GitLab catalog component.
# Covers Python and TypeScript/JavaScript with broader rules than Bandit.
# enable_mr_pipelines: true — runs on MR pipelines in addition to branch
# pipelines, so findings gate merges. excluded_paths skips generated code.

include:
  - component: gitlab.com/components/sast/sast@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true
      excluded_paths: >-
        backend/boards/migrations,
        backend/groups/migrations,
        backend/accounts/migrations
  - component: gitlab.com/components/secret-detection/secret-detection@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true

# ─── Workflow ─────────────────────────────────────────────────────────────────
#
# Merge-request-pipeline model: feature branches get CI *only* through their
# MR, never as a standalone branch pipeline. This makes the branch+MR duplicate
# structurally impossible rather than merely suppressed.
#
# The previous `$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS when: never` dedup
# could not stop duplicates on the MR-open push: $CI_OPEN_MERGE_REQUESTS is
# empty in the branch pipeline created at the moment the MR is opened (GitLab
# hasn't associated the MR with the branch yet), so the rule missed and the
# catch-all `$CI_COMMIT_BRANCH` rule ran a second pipeline. Dropping that
# catch-all removes the only branch-pipeline path for feature work.
#
# Trade-off: pushing a feature branch with no open MR runs no CI. Open the MR
# early (Draft is fine) to get pipeline coverage — this matches our
# always-go-through-an-MR workflow.
#
# Main-branch commits always get a pipeline (post-merge verification).
# Tag pipelines run for version tags so docs-deploy can fire on release.

workflow:
  # Only cancel a running pipeline when a newer commit arrives if every job
  # in that pipeline is marked interruptible: true. Jobs default to
  # interruptible: false (see `default:` below) so main-branch pipelines
  # are never auto-canceled by a subsequent merge commit.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # all feature work
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'        # main, post-merge
    - if: '$CI_COMMIT_TAG'                                 # release tags
    # No catch-all $CI_COMMIT_BRANCH rule: a branch with no open MR gets no
    # pipeline, so the branch+MR duplicate can never be created.

# Test and build run in the same stage so they execute in parallel — build
# verification (kaniko) doesn't depend on test results, and running them
# together saves a full stage of sequential waiting.
stages:
  - lint
  - test
  - security
  - deploy

# ─── Docker Hub mirror (#1198) ─────────────────────────────────────────────────
#
# Every Docker Hub image:/services:/name: reference in this file, and every
# Dockerfile's BASE_REGISTRY build arg, is written as ${DOCKERHUB_MIRROR}/<image>
# rather than a bare docker.io reference, to avoid the anonymous-pull rate limit
# (see docs/maintainers/known-ci-failures.md#docker-hub-429-too-many-requests-on-image-pulls).
#
# Defaults to the GitLab Dependency Proxy for this group, which the Dependency
# Proxy is enabled for. A project with NO working group Dependency Proxy — most
# notably an external contributor's personal-namespace fork; the Dependency
# Proxy is a group-level-only GitLab feature and does not exist for personal
# namespaces — gets CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX empty, which would
# otherwise turn every image reference into a leading-slash "/python:3.12-slim"
# and fail the whole pipeline.
#
# BASE_REGISTRY / script usages of this variable fall back automatically with
# real shell `${DOCKERHUB_MIRROR:-docker.io/library}` syntax (see the kaniko
# jobs and scripts/helm-*-drill.sh) — those self-heal with zero configuration.
# The bare `image:`/`services:`/`name:` keyword usages below CANNOT: GitLab's
# own variable expansion for those keywords is plain substitution, not a shell,
# so it has no equivalent of bash's `:-` fallback operator. A fork (or a
# self-hosted instance) with no group Dependency Proxy MUST set its own
# project CI/CD variable `DOCKERHUB_MIRROR` (e.g. `docker.io`, or its own
# pull-through mirror) to keep those jobs' own image:/services: pulls working —
# project variables take precedence over this default. See
# docs/maintainers/ci-runners.md#dependency-proxy.
variables:
  DOCKERHUB_MIRROR: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}

# Auto-retry on runner infrastructure failures (pod watcher sync, stuck
# cleanup, image pull transients). Only retries on runner_system_failure
# and stuck_or_timeout_failure — never on script failures.
default:
  interruptible: false
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ─── Rule templates ───────────────────────────────────────────────────────────
#
# Extend jobs with .on-mr to restrict them to MR pipelines only.
# Lint and test jobs use path-based rules so they only run when relevant
# files change, with a fallback to always run on the default branch.

.on-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── Cache templates ──────────────────────────────────────────────────────────
#
# Cache uses MinIO as the S3-compatible distributed backend so all runners
# share a warm cache across jobs and branches.
#
# Required CI/CD project variables (Settings → CI/CD → Variables):
#   MINIO_ENDPOINT   — host:port of the MinIO server, e.g. minio.internal:9000
#   MINIO_ACCESS_KEY — MinIO access key
#   MINIO_SECRET_KEY — MinIO secret key
#   MINIO_BUCKET     — bucket name, e.g. visiban-ci-cache
#
# Runner config.toml must enable the S3 backend:
#   [runners.cache]
#     Type   = "s3"
#     Shared = true
#     [runners.cache.s3]
#       ServerAddress = "<MINIO_ENDPOINT>"
#       AccessKey     = "<MINIO_ACCESS_KEY>"
#       SecretKey     = "<MINIO_SECRET_KEY>"
#       BucketName    = "<MINIO_BUCKET>"
#       Insecure      = false   # set true if MinIO has no TLS
#
# Cache keys include a fixed prefix so entries are grouped cleanly inside
# the S3 bucket. The lockfile hash provides automatic invalidation when
# dependencies change. node_modules/ is cached alongside the npm download
# cache to skip extraction on warm hits.

.npm-cache:
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [frontend/package-lock.json]
    paths:
      - .npm/
      - frontend/node_modules/
    policy: pull

# PIP_CACHE_DIR stores downloaded wheels/sdists. pip honors this env var
# automatically so no extra flags are needed in before_script.

.pip-cache:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip"
      files: [backend/requirements.txt]
    paths: [.cache/pip/]
    policy: pull

# Warm the caches on the default branch so feature-branch jobs can pull from
# them without paying the push cost on every MR pipeline. Only one job per
# cache key prefix — runs after tests succeed on main.

cache-warm-pip:
  stage: deploy
  needs: [backend-test-coverage]
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip"
      files: [backend/requirements.txt]
    paths: [.cache/pip/]
    policy: pull-push
  script:
    - pip install --quiet -r backend/requirements.txt
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cache-warm-pip-test:
  stage: deploy
  needs: [backend-test-coverage]
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      prefix: "pip-test"
      files: [backend/requirements-test.txt]
    paths: [.cache/pip/]
    policy: pull-push
  script:
    - pip install --quiet -r backend/requirements-test.txt
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cache-warm-npm:
  stage: deploy
  needs: [frontend-test]
  image: ${DOCKERHUB_MIRROR}/node:20-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [frontend/package-lock.json]
    paths:
      - .npm/
      - frontend/node_modules/
    policy: pull-push
  script:
    - cd frontend && npm ci --prefer-offline
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ─── Shell scripts — lint ────────────────────────────────────────────────────
#
# shellcheck catches common shell bugs: unquoted variables, missing set -e,
# portability issues, and incorrect conditionals. Runs on any change to
# scripts/*.sh, MR or main (#1266: no unconditional main fallback — nothing
# needs this job, so a merge that didn't touch scripts/ doesn't rerun it).

shellcheck:
  stage: lint
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  before_script:
    - apk add --no-cache shellcheck
  rules:
    - changes:
        - scripts/*.sh
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - scripts/*.sh
  script:
    - shellcheck --severity=warning scripts/*.sh

# ─── Dockerfiles — lint ───────────────────────────────────────────────────────
#
# hadolint enforces Dockerfile best practices (layer ordering, missing WORKDIR,
# ADD vs COPY, etc.). DL3008 (pin apt versions) is ignored — rationale in
# .hadolint.yaml. Runs on any change to a Dockerfile, MR or main (#1266: no
# unconditional main fallback — nothing needs this job).

dockerfile-lint:
  stage: lint
  image:
    name: ${DOCKERHUB_MIRROR}/hadolint/hadolint:v2.15.1-alpine
    entrypoint: [""]
  rules:
    - changes:
        - "**/Dockerfile*"
        - .hadolint.yaml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "**/Dockerfile*"
        - .hadolint.yaml
  script:
    - hadolint --config .hadolint.yaml
        backend/Dockerfile
        backend/Dockerfile.prod
        frontend/Dockerfile
        frontend/Dockerfile.prod

# ─── Compose — shipped-stack hygiene ──────────────────────────────────────────
#
# Gates over the compose/nginx files an operator actually runs. All are cheap,
# all cover a defect that was live in this repo, and none is visible in a
# diff review:
#
#   * image pins — `certbot/certbot` shipped untagged in docker-compose.prod.yml
#     while every sibling service carried a floor, so the component that owns TLS
#     renewal floated to `latest` on each `compose pull`.
#   * project names — docker-compose.prod.yml pinned no `name:` and dev defaulted
#     to `visiban`, so on a default clone both resolved to the same project,
#     sharing `visiban_pgdata` and the `db`/`valkey`/`backend` service names.
#   * nginx HSTS rendering — nginx/app.conf.template hardcoded a 2-year HSTS
#     header for both TLS_MODE=letsencrypt and selfsigned, contradicting the
#     docs and ignoring an operator-set SECURE_HSTS_SECONDS; init-prod.sh now
#     renders it via scripts/render-nginx-hsts.sh (#1201).
#
# Each runs its `--self-test` first, per #1093: a gate observed only on a clean
# tree is indistinguishable from one that always passes. render-nginx-hsts.sh
# also gets a real invocation against the TRACKED template
# (`--check nginx/app.conf.template`), matching the other two scripts in this
# job — a completeness-check finding on #1201 noted that `--self-test` alone
# only proves the rendering logic works against synthetic fixtures; it cannot
# catch the old hardcoded header being re-committed verbatim to the real file,
# since --self-test never reads it.

compose-hygiene:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - changes: &compose-hygiene-paths
        - docker-compose*.yml
        - scripts/check-compose-*.sh
        - nginx/app.conf.template
        - init-prod.sh
        - scripts/render-nginx-hsts.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *compose-hygiene-paths
  before_script:
    - apk add --no-cache bash grep sed
  script:
    - bash scripts/check-compose-image-pins.sh --self-test
    - bash scripts/check-compose-image-pins.sh
    - bash scripts/check-compose-project-names.sh --self-test
    - bash scripts/check-compose-project-names.sh
    - bash scripts/render-nginx-hsts.sh --self-test
    - bash scripts/render-nginx-hsts.sh --check nginx/app.conf.template

# ─── SonarCloud report-rewrite self-test (#1370) ─────────────────────────────
#
# scripts/sonar-scan.sh rewrites the coverage reports so SonarCloud can resolve
# their paths; a regression resolves zero files and reports 0.0% with nothing
# red. --self-test fixtures both rewrites (#1093 house rule). sonar:scan itself
# runs only on the nightly schedule, so this runs on MRs touching the inputs.
sonar-scan-selftest:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - changes: &sonar-scan-selftest-paths
        - scripts/sonar-scan.sh
        - sonar-project.properties
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *sonar-scan-selftest-paths
  script:
    - sh scripts/sonar-scan.sh --self-test

# ─── Backend — lint ───────────────────────────────────────────────────────────

# Ruff lint check + CodeClimate quality report in a single job — avoids
# spinning up two pods and installing ruff twice.
# allow_failure: true — style issues are visible but do not block merges.
backend-lint:
  extends: .pip-cache
  stage: lint
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - changes: &backend-lint-paths
        - backend/**/*
        - requirements*.txt
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *backend-lint-paths
  before_script:
    # Pinned: unpinned installs silently picked up ruff 0.16's much larger
    # default rule set, surfacing 600+ pre-existing findings (mostly RUF012 on
    # Django migrations' `operations = [...]`) unrelated to any given branch.
    - pip install --quiet ruff==0.15.22
  script:
    - ruff check backend/
    - ruff check backend/ --output-format=gitlab -o code-quality-report.json || true
  artifacts:
    reports:
      codequality: code-quality-report.json
    paths:
      - code-quality-report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# ─── Backend — test ───────────────────────────────────────────────────────────
#
# Runs Django tests via pytest, sharded across 3 parallel jobs using
# pytest-split's least_duration algorithm for time-balanced distribution.
# These jobs gate the pipeline on test failures (fast, parallel).
# Coverage is measured separately by backend-test-coverage in a single-process
# run — see that job's comment for why sharded coverage combining is not used.
#
# On first run (no .test_durations in cache), pytest-split falls back to
# round-robin splitting. After one run, the durations file is cached and
# subsequent runs use time-balanced splitting.

backend-test:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  parallel: 3
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  cache:
    - key:
        prefix: "pip"
        files: [backend/requirements.txt]
      paths: [.cache/pip/]
      policy: pull
    - key:
        prefix: "pip-test"
        files: [backend/requirements-test.txt]
      paths: [.cache/pip/]
      policy: pull
    - key: test-durations
      paths: [backend/.test_durations]
      policy: pull-push
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet -r backend/requirements-test.txt
  script:
    - cd backend
    - coverage run --parallel --data-file=.coverage.${CI_NODE_INDEX} -m pytest
        --splitting-algorithm least_duration
        --store-durations
        --group $CI_NODE_INDEX
        --splits $CI_NODE_TOTAL
        --junitxml=test-results/junit-${CI_NODE_INDEX}.xml
        -q
  artifacts:
    paths:
      - backend/.coverage.*
    reports:
      junit: backend/test-results/junit-*.xml
    when: always
    expire_in: 1 day

# Combines the .coverage.* artifacts produced by the three parallel backend-test
# shards *and by every feature-flagged test job* and enforces the 90% threshold.
# Each producer runs with --parallel so coverage.py treats its data file as a
# fragment to be combined rather than a standalone measurement.
#
# Every job that executes tests must be instrumented and listed in `needs`.  A
# job left out does not merely go unmeasured — the code it covers is reported
# as 0%, which is worse than not measuring it at all.  backend-test runs with
# the feature flags off, so the flag-on paths (git_lens, and any future flagged
# app) are reachable only from their dedicated jobs.
#
# No postgres/redis services required — this job only runs coverage combine and
# report, no Django or test execution.
backend-test-coverage:
  stage: test
  needs: [backend-test, backend-test-git-lens, backend-test-mcp]
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - pip install --quiet coverage
  script:
    - cd backend
    - coverage combine
    - coverage report --fail-under=90
    - coverage xml -o coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
    when: always

# Diff coverage (MR only) — #1076.
#
# The aggregate --fail-under=90 above measures the whole codebase, not the
# change. With 500+ backend test files already in the tree, that aggregate
# has enough inertia to absorb a fully untested new view or method and stay
# green. This job instead measures coverage of only the lines this MR adds
# or modifies, using diff-cover against the coverage.xml produced above — no
# test re-run, just a second report over the same data.
#
# Threshold starts at 80% of changed lines, blocking. Escape hatch: an MR
# that legitimately cannot meet it (a pure refactor with moved lines, a
# vendored file) says so in its description and a reviewer overrides by
# approving with the failing job acknowledged — see
# docs/development/testing.md#diff-coverage-escape-hatch. The override is
# always visible in the MR/job history, never silent.
#
# migrations/ is excluded because .coveragerc does NOT omit it from the
# aggregate run (Django imports every migration to build the test DB, so
# migration lines legitimately count toward the 90% number) — but a line
# diff-cover would flag as "uncovered" in a migration is nearly always
# schema, not behavior, and re-litigating that here would just train
# reviewers to override the gate instead of reading it.
backend-diff-coverage:
  extends: .pip-cache
  stage: test
  needs: [backend-test-coverage]
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet diff-cover
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
  script:
    - cd backend
    - diff-cover coverage.xml
        --compare-branch=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        --fail-under=80
        --show-uncovered
        --exclude "*/migrations/*" "manage.py"

# Checks that every model change has a corresponding migration file, that no
# migration builds an index or constraint in a way that takes ACCESS EXCLUSIVE on a
# live table (#1081), and that no migration adds a constraint a populated table could
# already violate (#1098) — see docs/development/database-migrations.md.
# Requires a Postgres service because makemigrations --check calls
# check_consistent_history(), which connects to the DB to verify applied
# migrations are consistent with the on-disk migration files.
migration-check:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266): nothing downstream needs this job
  # (a pure pipeline-greenness leaf), and `changes:` already re-fires on main
  # push pipelines whenever a merge actually touches these paths — so a
  # docs-only or frontend-only merge no longer pays for a full migrate +
  # concurrency/constraint-safety cycle it cannot affect.
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py makemigrations --check --dry-run --verbosity=1
    # Fails on a new AddIndex/AddConstraint that is not concurrent. The escape
    # hatch is an inline `# concurrency-exempt: <reason>` comment on the operation.
    - python manage.py check_migration_concurrency
    # Proves the constraint-safety gate below still fires before trusting its "clean" verdict (#1093).
    - python manage.py check_migration_constraint_safety --self-test
    # Fails on a new AddConstraint/NOT NULL/unique-together that could crash-loop against
    # pre-existing rows with no preceding repair step (#1098). The escape hatch is an
    # inline `# constraint-safe: <reason>` comment on the operation.
    - python manage.py check_migration_constraint_safety

# Catches two branches cut off the same point on main each adding a migration
# at the same next sequential number (e.g. both add 0042_...). Django applies
# whichever merges first without complaint, and the second branch's migration
# silently never runs. migration-check above only inspects the working
# branch's own tree and has no visibility into what has landed on main since
# the branch point — this job fetches main and diffs against it (#1099).
# MR-pipeline only: needs $CI_MERGE_REQUEST_TARGET_BRANCH_NAME for a real
# merge-base, which isn't set on branch/default-branch pipelines.
migration-numbering-check:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
  before_script:
    - apk add --no-cache git bash
  script:
    # Self-test immediately before the real invocation, same image (#1093) —
    # proves the collision detector still fires before trusting it on this MR.
    - bash scripts/check-migration-numbering.sh --self-test
    - scripts/check-migration-numbering.sh

# Validates the OpenAPI schema generated by drf-spectacular has no ERROR-level
# issues.  Does not require a database or Redis — Django loads in DEBUG mode
# with a fake DATABASE_URL so the schema introspection path runs without
# connecting.
backend-schema-validate:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — see migration-check's comment above.
  rules:
    - changes:
        - backend/**/*
  variables:
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@localhost:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://localhost:6379/0"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py spectacular --validate
  allow_failure: false

# Fuzzes the OpenAPI contract itself: boots a real backend against seeded demo
# data, authenticates as a normal (non-admin) board member, and drives
# schemathesis against every documented operation, asserting the response
# actually matches the declared schema, status code, and content type
# (#1080). backend-schema-validate above only proves the generated DOCUMENT is
# well-formed — it has no way to catch a view that bypasses its serializer and
# returns a body the schema never described (the TruePPM red-team finding
# #1080 is built on: same class as their #2515/#2649, and Visiban's own
# #1108). "Authenticate as a normal board member — not a superuser" is a
# direct requirement of #1080: provision_fuzz_token refuses to mint a token
# for any user carrying is_superuser/is_site_admin/can_access_all_content.
#
# Blocking (allow_failure: false) as of #1120 — #1080's own phased plan
# (baseline non-blocking for one release, #1080 acceptance criterion 3: "blocking
# by end of 1.2"). What the baseline found and how each point was resolved:
#
#   - Undocumented 404s from version-prefix fuzzing: negative testing mutated
#     the literal `v1` URL segment because drf-spectacular's catch-all
#     `re_path(r"^api/v(?!1/)[\w]+/", ...)` (visiban/urls.py) synthesized a
#     malformed path template (`/api/v{var}[\w]/`, literal regex syntax
#     leaking into the OpenAPI path) for `UnsupportedVersionView` — schemathesis
#     dutifully fuzzed that literal template into URLs that never matched the
#     real regex, landing on Django's HTML 404 debug page instead of a JSON
#     response. Fixed by excluding the view from the schema entirely
#     (`@extend_schema(exclude=True)`) — it's an internal safety net, not a
#     documented operation, so the honest fix is to stop describing it, not to
#     carve around it with --exclude-path-regex.
#   - A second, more serious bug the same investigation turned up: any
#     board-scoped nested route (`board_pk` and friends — untyped string path
#     segments, not `<int:...>`-typed) crashed with an unhandled 500 on a
#     non-numeric value, because `boards/views/_helpers.py` and six other view
#     modules resolved them with `django.shortcuts.get_object_or_404`, which
#     doesn't catch the ORM's `ValueError` the way `rest_framework.generics`'s
#     version does. Fixed by swapping the import in all seven files (defends
#     any lookup driven by a request body/query value, e.g. `move-group`'s
#     `group_id`, not just a URL path segment). A second, independent fix
#     landed on main while this branch was in flight (board-pk-nonnumeric-404):
#     `lookup_value_regex = r"\d+"` on the six board-scoped viewsets, so a
#     non-numeric id now fails to match the URL pattern at all rather than
#     reaching the view — closes the same hole at the routing layer, which is
#     the more correct fix for anything registered through a router. That
#     routing-level fix has its own side effect, though: an URL matching
#     *nothing* is resolved by Django itself, before any view runs — the
#     *technical* 404 debug page under `DEBUG=True` (true of this job),
#     reintroducing the exact "HTML instead of JSON" noise from the point
#     above, now for the entire board-resource route family instead of just
#     the version segment. `ApiNotFoundView` (visiban/urls.py, registered
#     dead last) closes that: it makes sure *something* always matches under
#     `/api/v1/`, so Django's resolver never has to render the fallback
#     itself. It also required a genuine design decision, not just a copy of
#     `UnsupportedVersionView`'s auth-gating: `/api/v1/` mixes authenticated
#     and deliberately public routes (the anonymous email-confirmation
#     redirect), so the catch-all cannot require auth — an anonymous caller
#     who garbles a public path's URL must still get a plain 404, not a 401
#     (a real regression this branch's own test suite caught:
#     accounts/tests/test_email_confirm.py's `..._returns_404_from_router`).
#     A follow-up verification run found the catch-all's own pattern
#     (`^api/v1/.*$`) still fell through to Django's raw response for a path
#     containing a literal embedded newline byte — `.` doesn't match `\n`.
#     `re.DOTALL` isn't available here: an inline `(?s)` flag in the pattern
#     string makes Django's own reverse-resolution machinery raise
#     `ValueError: Non-reversible reg-exp portion: '(?s'` on every request
#     (found the hard way — the first attempt 500'd everything), and
#     `re_path()` doesn't accept a pre-compiled DOTALL pattern either — its
#     system checks call `.startswith(...)` on `_regex`, assuming a string.
#     Fixed with `[\s\S]*` instead of `.*` (a character class always
#     matches `\n`, no flag needed).
#   - 72 operations reachable only via 404 (random path-parameter ids never
#     matching seeded rows): `backend/schemathesis_hooks.py`, loaded via
#     SCHEMATHESIS_HOOKS below, is a `map_path_parameters` hook that substitutes
#     real ids pulled from `seed_demo_data`'s board/cards/columns/swimlanes/
#     labels/members at hook-load time. `--generation-database` (hypothesis's
#     own example-replay cache) and `--phases stateful` (schemathesis's
#     OpenAPI-`links`/Location-header-based chaining — this schema declares no
#     links, and no Visiban view sets a Location header on create) were both
#     investigated and ruled out; a path-parameter hook against real seeded
#     rows is what this schemathesis version actually supports for this.
#     Groups, custom-fields, saved-filters, attachments, and group
#     invite-links/labels previously had no seeded row at all and still 404ed
#     under fuzzing; #1125 extended seed_demo_data with one of each and
#     schemathesis_hooks.py maps their path parameters the same way as every
#     other board-scoped resource above.
#   - 12 admin-only operations returned only 403: expected — #1080 requires
#     provision_fuzz_token to refuse an admin/superuser account, so this job's
#     token can never reach `/api/v1/admin/*`. Accepted as documented residual
#     scope rather than adding a second admin-scoped pass: only 10 operations
#     sit behind IsSiteAdmin (accounts/admin_views.py's `_ADMIN_PERMISSIONS`;
#     was 9 before #1203 added AdminUserClearLockoutView), all with
#     dedicated coverage already (accounts/tests/test_admin_api.py,
#     test_invite_links.py, test_pat_scopes.py) — a second full fuzz pass for
#     that surface is disproportionate to what's actually gated.
#
# Reaching real 200-path responses (the seeding above) also let negative-data
# fuzzing reach two more unhandled 500s: CardViewSet.move and
# GroupViewSet.transfer_ownership both read `request.data.get(...)` without
# checking the parsed body is a JSON object first, so a bare number/string/
# array/null/bool body raised AttributeError. Both fixed with an
# isinstance(request.data, dict) guard. This is a repeatable pattern — a grep
# for `request.data.get(` across boards/views and groups/views turns up ~30
# more call sites with the same shape — so a future run's randomness finding
# another instance is a real, open possibility, not fully closed by this
# branch; each one found gets the same fix, following this precedent.
#
# Reaching real 200-path responses (the seeding above) surfaced the exact bug
# class #1108 fixed on CardSerializer and #1119 is tracking for Group/
# GroupDetail on several more serializers (Board, BoardFull, BoardUser,
# CurrentUser — filed as #1123) and a separate, structural gap: most write
# endpoints' 400 validation-error response isn't documented in the schema at
# all (filed as #1124). Neither was a CI-config fix, so both were recorded as
# scoped, justified baseline entries in backend/schemathesis-baseline.json
# (schemathesis's own "accepted known failures" mechanism — matched by
# operation + check + failure-class + schema-path/status-code, never by the
# random value schemathesis generated, so the file doesn't need touching every
# run) rather than blocking this flip on #1119/#1123/#1124 landing first.
# #1124's entries were pruned when visiban/schema_hooks.py started documenting
# a generic 400 (#1165). #1119/#1123 closed without their entries being pruned;
# #1170 pruned them (`st run ... --baseline PATH --baseline-update
# --baseline-prune`, two full-length runs with different seeds — a short run
# reports valid entries as unobserved, so only entries unobserved by both
# were dropped), taking the baseline from 41 entries to 12. Every surviving
# entry now carries a "reason" field explaining why it's accepted (most are
# @action/APIView endpoints with no @extend_schema, so drf-spectacular's
# automatic inference doesn't match the real response) so the job resumes
# catching a regression in the area the pruned entries used to mask.
#
# Scoped to the file classes #1080 names (views/, serializers.py, urls.py), so
# a schema-shape change gets checked without running on every unrelated
# branch (e.g. a frontend-only MR). No unconditional main fallback (#1266):
# nothing downstream `needs:` this job — it only gates pipeline greenness —
# and `changes:` already re-fires on main push pipelines whenever a merge
# actually touches these paths, so a docs-only merge no longer pays for a
# full server boot + seed + up to 600s of fuzzing it cannot affect.
backend-schema-fuzz:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  allow_failure: false
  # Baseline identities include the *check name*, and one failure class can come
  # from more than one check: an empty-body response trips MissingContentType under
  # content_type_conformance AND under response_schema_conformance (which bundles it
  # with MalformedJson). Baseline both identities or the finding still fails the job
  # deterministically — this is not flakiness, so there is no retry here (#1120).
  # A red run here is a REAL, replayable defect — never a flake (#1165). The seed
  # only chooses *which* part of the input space this run explores; a case that
  # fails is deterministic for its input, so a green re-run just means a different
  # seed missed it. Three main pipelines went red on 2026-09-26 for exactly this
  # reason (a POST /groups/ 500 and two undocumented 400s) and "passed on retry".
  # Therefore:
  #   * the only retries are the `default:` ones for runner-infrastructure
  #     failures (`runner_system_failure`/`stuck_or_timeout_failure`); an
  #     assertion failure is never retried;
  #   * the seed is generated here, printed, and overridable with FUZZ_SEED so
  #     the exact failing run can be replayed (see docs/api/openapi.md);
  #   * `after_script` prints the triage steps on failure.
  # Do not "fix" a red run by re-running it or by baselining it: fix the endpoint
  # (a 5xx) or declare the response in the schema (an undocumented 4xx).
  rules:
    - changes:
        - backend/**/views/**/*
        - backend/**/serializers.py
        - backend/**/urls.py
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    # CI-only file; provision_fuzz_token writes the raw PAT here (mode 0600),
    # never to job output — see the command's docstring.
    VISIBAN_FUZZ_TOKEN_FILE: "/tmp/visiban_fuzz_token"
    # Loaded automatically by `st run` (schemathesis/core/hooks.py's
    # load_from_env) — a file path (not a bare module name) so it loads
    # correctly regardless of script:'s cwd; see schemathesis_hooks.py's own
    # sys.path handling for why that matters here specifically.
    SCHEMATHESIS_HOOKS: "backend/schemathesis_hooks.py"
    # `st run` is itself a Python process; a bare "Segmentation fault (core
    # dumped)" with no Python-level traceback (seen once on this branch,
    # !892) is otherwise undiagnosable from the CI log alone. Cheap and
    # inert on every normal run — only fires on an actual native-level crash.
    PYTHONFAULTHANDLER: "1"
  cache:
    - key:
        prefix: "pip"
        files: [backend/requirements.txt]
      paths: [.cache/pip/]
      policy: pull
    - key:
        prefix: "pip-test"
        files: [backend/requirements-test.txt]
      paths: [.cache/pip/]
      policy: pull
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet -r backend/requirements-test.txt
    - cd backend
    - python manage.py migrate --noinput
    # Deterministic, git-diffable demo data — a real member's-eye view of a
    # populated board, not an empty database where every path-parameterized
    # operation 404s before schemathesis can reach its core logic.
    - python manage.py seed_demo_data --force
    - python manage.py provision_fuzz_token --username demo2
    - python manage.py runserver 0.0.0.0:8000 &
    # Poll liveness instead of a fixed sleep, same pattern as oidc-smoke.
    - |
      for i in $(seq 1 30); do
        python3 -c "import requests; requests.get('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
  script:
    # The two email-confirm endpoints and the 3rdparty/signup safety-net (#1321)
    # only 302 to the SPA at FRONTEND_URL, which does not run in this job —
    # following that redirect is a "Connection refused" NonFatalError, and any
    # NonFatalError exits `st run` 1. Their redirect behavior is covered by
    # accounts/tests/test_email_confirm.py and
    # accounts/tests/test_social_signup_redirect.py instead.
    # Fresh seed per run for coverage, but recorded up front (a crash before
    # st's own summary would otherwise lose it) and pinned via FUZZ_SEED to replay.
    - echo "${FUZZ_SEED:-$(python3 -c 'import secrets; print(secrets.randbits(64))')}" > /tmp/fuzz_seed
    - echo "backend-schema-fuzz seed=$(cat /tmp/fuzz_seed)  (to replay, run the pipeline with variable FUZZ_SEED=$(cat /tmp/fuzz_seed))"
    - |
      st run http://localhost:8000/api/schema/ \
        --seed "$(cat /tmp/fuzz_seed)" \
        -H "Authorization: Token $(cat ${VISIBAN_FUZZ_TOKEN_FILE})" \
        --exclude-path-regex 'confirm-email|3rdparty/signup' \
        --checks response_schema_conformance,status_code_conformance,content_type_conformance \
        --phases examples,fuzzing \
        --max-examples 10 \
        --max-time 600 \
        --workers 4 \
        --baseline backend/schemathesis-baseline.json \
        --report junit \
        --report-junit-path schemathesis-junit.xml \
        --no-color
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        cat <<EOF
      ============================================================================
      backend-schema-fuzz FAILED — treat this as a REAL defect, not a flake.
      A different seed passing does not mean the endpoint is fine; it means that
      seed did not reach the failing input (#1165).
        1. Find the failing operation and status in the "FAILURES" section above.
        2. 5xx            -> fix the endpoint: validation belongs in the serializer
                             and must answer 400, never raise.
           undocumented 4xx -> declare the response (@extend_schema, or a
                             visiban/schema_hooks.py rule if it is a whole class).
           schema mismatch -> fix the serializer or the annotation.
        3. Reproduce: 'st replay <Test Case ID>' with the request in the log, or
           re-run this job with variable FUZZ_SEED=$(cat /tmp/fuzz_seed 2>/dev/null).
        4. Do NOT retry the job or add a baseline entry to turn it green.
      ============================================================================
      EOF
      fi
  artifacts:
    reports:
      junit: schemathesis-junit.xml
    when: always
    expire_in: 1 week

# ─── Issue Board Lens (experiment) tests ─────────────────────────────────────
# The git_lens app is only installed when GIT_LENS_ENABLED=true, so its
# integration tests (models, views, RBAC, caching) cannot run in the main
# backend-test job (which runs flag-off, where they skip cleanly). This
# dedicated job enables the flag, verifies the additive migration is complete,
# and runs the full git_lens suite. Mirrors the OIDC conditional-app pattern.
backend-test-git-lens:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # Runs whenever backend-test-coverage runs, not only on git_lens changes.
  # The coverage combine job `needs` this job's data file; if it were absent
  # from the pipeline, every git_lens line would score 0% and the total would
  # drop back below the threshold on branches that touch no git_lens file.
  # `.gitlab-ci.yml` is in the list so a change to this job re-runs it.
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    GIT_LENS_ENABLED: "True"
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet -r backend/requirements-test.txt
  script:
    - cd backend
    - python manage.py makemigrations --check --dry-run git_lens
    # Instrumented, and the data file is published for backend-test-coverage to
    # combine.  git_lens' views/serializers/models are exercised only with
    # GIT_LENS_ENABLED=True, which is set here and nowhere else, so an
    # uninstrumented run made ~230 well-tested statements score 0% and pinned
    # the project total to the 88-90% knife edge the gate sits on.
    # accounts/tests/test_demo_mode.py rides along (#1179): its route-table
    # sweep walks whatever URLconf is mounted, and this is the only job where
    # git_lens' routes exist, so without it the demo fence's sweep never
    # covers the lens write endpoints.
    - coverage run --parallel --data-file=.coverage.git-lens -m pytest git_lens/ accounts/tests/test_demo_mode.py -q
  artifacts:
    paths:
      - backend/.coverage.*
    when: always
    expire_in: 1 day

# ─── MCP server tests ────────────────────────────────────────────────────────
# The mcp_server app is only installed and only mounts /mcp when
# MCP_SERVER_ENABLED=true, so its transport/auth/tool tests skip cleanly in the
# main backend-test job (which runs flag-off). This dedicated job enables the
# flag and runs the suite. Mirrors the git_lens conditional-app pattern above.
# ALLOWED_HOSTS must contain the host the tests use, because the MCP transport
# derives its DNS-rebinding allowlist from it.
#
# Runs whenever backend-test-coverage runs, not only on mcp_server changes.
# The coverage combine job `needs` this job's data file; if it were absent
# from the pipeline, every mcp_server line would score 0% and the total would
# drop back below the threshold on branches that touch no mcp_server file.
# `.gitlab-ci.yml` is in the list so a change to this job re-runs it.
backend-test-mcp:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - changes:
        - backend/**/*
        - requirements*.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://redis:6379/0"
    REDIS_CACHE_URL: "redis://redis:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    MCP_SERVER_ENABLED: "True"
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - pip install --quiet -r backend/requirements-test.txt
  script:
    - cd backend
    # The app ships no models; assert that stays true so a future model addition
    # cannot land without its migration.
    - python manage.py makemigrations --check --dry-run
    # Instrumented, and the data file is published for backend-test-coverage to
    # combine. mcp_server's transport/auth/tools are exercised only with
    # MCP_SERVER_ENABLED=True, which is set here and nowhere else, so an
    # uninstrumented run scored ~400 well-tested statements as 0% and pinned
    # the project total below the 90% gate.
    - coverage run --parallel --data-file=.coverage.mcp -m pytest mcp_server/ -q
  artifacts:
    paths:
      - backend/.coverage.*
    when: always
    expire_in: 1 day

# ─── OIDC smoke test ─────────────────────────────────────────────────────────
#
# End-to-end smoke test for the OIDC authorization code flow.  Exercises:
#   - Discovery endpoint parsing (/.well-known/openid-configuration)
#   - IdP login form submission and code exchange
#   - Visiban callback routing and session creation
#   - Identity claim mapping (email, username) via allauth
#
# Runs a real Keycloak 24 instance as a service.  The realm, client, and test
# user are provisioned by scripts/oidc_provision.py via the Admin REST API so
# no custom Docker image or file mount is needed.
#
# The backend is started with `runserver` in the background (not daphne) so
# that the process exits cleanly when the job ends without a SIGKILL dance.
#
# FRONTEND_URL is pointed at the liveness endpoint so the post-login redirect
# resolves inside the job without needing the React dev server running.
#
# Runs on any change to OIDC-related files. No unconditional main fallback
# (#1266): nothing downstream needs this job, and `changes:` already re-fires
# on main push pipelines when a merge touches these paths — so an unrelated
# merge no longer pays for a Keycloak JVM boot it cannot affect. Doubly worth
# trimming here since that boot is already the slowest, flakiest leg below.
# allow_failure: true — Keycloak boot is slow on the shared small runner and the
# job historically times out far more often than it succeeds, so a red run must
# not block unrelated MRs.  The job is still reported in the pipeline summary.
#
# Debugging note: the 120s readiness budget was too tight for Keycloak's JVM boot
# when sharing a single vCPU with postgres/redis/python.  We raised the wait to
# 240s and enabled CI_DEBUG_SERVICES so the Keycloak container log is captured in
# the trace — this distinguishes a slow boot from a crash/OOM.  If the log shows
# CPU starvation rather than a crash, move this job to saas-linux-medium-amd64.

oidc-smoke:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - changes:
        - backend/accounts/**/*
        - backend/visiban/settings.py
        - scripts/oidc_provision.py
        - scripts/oidc_smoke_test.py
        - oidc/**/*
        - docker-compose.oidc.yml
  allow_failure: true
  services:
    - name: quay.io/keycloak/keycloak:24.0.5
      alias: keycloak
      command: ["start-dev"]
      variables:
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost,127.0.0.1"
    # Capture the Keycloak (and other) service-container logs in the job trace so
    # a boot timeout can be diagnosed as slow-boot vs crash/OOM without guessing.
    CI_DEBUG_SERVICES: "true"
    OIDC_CLIENT_ID: "visiban"
    OIDC_CLIENT_SECRET: "test-oidc-secret"
    OIDC_SERVER_URL: "http://keycloak:8080/realms/visiban-test"
    OIDC_PROVIDER_NAME: "Keycloak"
    # Point post-login redirect back to the liveness endpoint so the full
    # callback flow resolves without needing the frontend running.
    FRONTEND_URL: "http://localhost:8000/api/health/liveness/"
  before_script:
    # Address Keycloak by IPv4 literal.
    #
    # GitLab's service DNS returns both an A record and an IPv6 ULA (fd76::/8),
    # and glibc prefers the IPv6 one. Reached over IPv6, Keycloak classifies the
    # client as *external* — SslRequired.EXTERNAL only recognises IPv4 private
    # ranges as local — and the master realm's default sslRequired=external then
    # refuses plain HTTP outright with
    #   403 {"error":"invalid_request","error_description":"HTTPS required"}
    # on every request. That is what "did not become ready within 240s" has
    # actually been since 2026-08-03: an immediate, consistent 403, not a slow
    # boot. Pinning /etc/hosts does not help — the resolver still returns both
    # records — so the address is substituted into the URLs instead, which also
    # keeps the issuer consistent between the provisioner and Django.
    - |
      KC_IPV4="$(getent ahostsv4 keycloak | awk 'NR==1{print $1}')"
      if [ -z "${KC_IPV4}" ]; then
        echo "ERROR: could not resolve an IPv4 address for the keycloak service" >&2
        exit 1
      fi
      export KEYCLOAK_BASE="http://${KC_IPV4}:8080"
      export OIDC_SERVER_URL="${KEYCLOAK_BASE}/realms/visiban-test"
      echo "keycloak reachable at ${KEYCLOAK_BASE} (IPv4)"
    - pip install --quiet -r backend/requirements.txt requests
    # Provision Keycloak: waits for readiness, then creates realm/client/user.
    # 240s budget — Keycloak's JVM boot routinely exceeds the previous 120s when
    # sharing a single vCPU with postgres/redis/python on the small runner.
    - python scripts/oidc_provision.py --keycloak-url "${KEYCLOAK_BASE}" --wait-timeout 240
    # Run migrations
    - cd backend && python manage.py migrate --noinput
    # Start the backend in the background; give it a few seconds to bind
    - python manage.py runserver 0.0.0.0:8000 &
    # Poll the liveness endpoint instead of a fixed sleep — faster on warm
    # runners, reliable on slow ones. Gives up after 30 seconds.
    # Uses python requests (already installed) — no curl in python:3.12-slim.
    - |
      for i in $(seq 1 30); do
        python3 -c "import requests; requests.get('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
  script:
    - python scripts/oidc_smoke_test.py
        --base-url http://localhost:8000
        --username testuser
        --password testpassword
        --expected-email testuser@example.com

# ─── Helm — lint ─────────────────────────────────────────────────────────────
#
# Validates the Helm chart renders without errors, AND that its values conform
# to helm/visiban/values.schema.json. The schema is the load-bearing half:
# Helm silently accepts a values key no template reads, so before #1116 an
# invented or misspelled key changed nothing on the pod while the operator
# believed it was applied — indistinguishable from the setting having no effect.
#
# Every shipped overlay is linted separately. Linting the defaults alone would
# leave values-dev.yaml and values-prod.yaml uncovered, and the schema is the
# only thing that catches an unused key in them. Each overlay gets the minimum
# extra --set it needs to RENDER, so a schema violation is the only thing that
# can fail here.
#
# Dependency tarballs are committed under helm/visiban/charts/ so no network
# access is required. Runs on any change to the chart or values. The
# main-branch leg reuses the same `changes: *helm-paths` filter as
# helm-install/helm-netpol below (#1266) rather than an unconditional
# fallback: nothing needs helm-lint, and helm-template is needed only with
# `optional: true`, so neither has to rerun against a main commit that
# provably didn't touch anything they check.

.rules-helm: &rules-helm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &helm-paths
        - helm/**/*
        - scripts/helm-structure-check.sh
        - scripts/helm-install-drill.sh
        - scripts/helm-netpol-drill.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths

helm-lint:
  stage: lint
  image:
    name: ${DOCKERHUB_MIRROR}/alpine/helm:3.16.4
    entrypoint: [""]
  <<: *rules-helm
  variables:
    # Render-time validation in templates/_validate.tpl refuses to render the
    # chart while values.yaml still carries placeholder secrets / hosts. CI
    # supplies these overrides so the chart can be lint+templated against its
    # committed defaults without baking real values into values.yaml.
    HELM_CI_OVERRIDES: >-
      --set-string secret.djangoSecretKey=ci-not-a-real-secret
      --set backend.email.backend=console
      --set backend.settings.allowedHosts=ci.visiban.local
  script:
    - helm lint helm/visiban -f helm/visiban/values.yaml $HELM_CI_OVERRIDES
    - helm template visiban helm/visiban -f helm/visiban/values.yaml $HELM_CI_OVERRIDES > /dev/null
    # Overlays (#1116). values-prod.yaml selects the smtp email backend, which
    # _validate.tpl refuses to render without a real From: address.
    - helm lint helm/visiban -f helm/visiban/values-dev.yaml $HELM_CI_OVERRIDES
    - |
      helm lint helm/visiban -f helm/visiban/values-prod.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set backend.settings.allowedHosts=ci.visiban.local \
        --set backend.email.fromAddress=noreply@visiban.local \
        --set backend.email.host=smtp.visiban.local
    # Public demo overlay (#1180). It deliberately ships without its secrets, so
    # the render guards refuse it until they are supplied — exactly what CI
    # supplies here, and nothing else, so the committed file is what is linted.
    - |
      helm lint helm/visiban -f helm/visiban/values-demo.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set-string demo.loginHint.password=ci-visitor-pw-1 \
        --set-string demo.adminPassword=ci-admin-password-1 \
        --set-string demo.memberPassword=ci-member-password-1

# ─── Helm — template (deploy contract) ───────────────────────────────────────
#
# Static deploy-contract gate (#1116). `helm lint` proves the templates PARSE;
# it cannot know whether the rendered manifests still honor the contract a
# deploy depends on. That gap is what let #1038 ship: an OIDC env-var name
# mismatch that silently disabled SSO, a hook-ordering bug that made SECRET_KEY
# rotation impossible, and zero email wiring — all of them rendering green. It
# is also what let #1117 ship: a pre-install migrate hook that could not reach
# the database it was installed alongside.
#
# Two halves, both cluster-free and therefore always-on:
#   kubeconform -strict       every rendered object validates against the real
#                             Kubernetes API schema, unknown fields included
#   helm-structure-check.sh   the runtime contract a refactor can silently break
#                             (migrate placement, secret rotation reaching the
#                             migrating pod, nginx upstream, probe paths,
#                             transport limits, netpol coverage)
#
# The runtime half lives in helm-install and helm-netpol below.

helm-template:
  stage: lint
  image:
    name: ${DOCKERHUB_MIRROR}/alpine/helm:3.16.4
    entrypoint: [""]
  <<: *rules-helm
  variables:
    KUBECONFORM_VERSION: "0.6.7"
    # 4.44.3 has a confirmed upstream bug (fixed by 4.53.3): a yq expression of
    # the shape `select(cond) | field // default` run against a multi-document
    # stream emits a result for EVERY document, not just the ones matching
    # `select`, whenever the post-select pipe hits a `//` fallback. This is
    # exactly scripts/helm-structure-check.sh's shape in check_valkey_auth's
    # server_ref/server_cmd queries (section 11b), so under 4.44.3 the single
    # expected secretKeyRef line arrives buried in ~24 extra blank "/" lines —
    # a false-positive FAIL, not a real chart defect (#1211, !1096).
    YQ_VERSION: "4.53.3"
  before_script:
    - apk add --no-cache bash curl tar findutils grep sed
    - curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
    - curl -sSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
    - chmod +x /usr/local/bin/yq
  script:
    # Render the way a real deploy is shaped — a pinned tag, NetworkPolicies on
    # (they are off by default, and section 7 of the structure check needs them)
    # and OIDC configured, since the OIDC env block is behind a conditional and
    # is exactly where #1038's blocker 1 lived. The scheduled-job CronJobs
    # (#1157) are off by default, so they are switched on here — otherwise
    # kubeconform never sees templates/cronjobs.yaml render at all.
    - |
      helm template visiban helm/visiban \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set backend.settings.allowedHosts=ci.visiban.local \
        --set backend.email.backend=console \
        --set networkPolicy.enabled=true \
        --set backend.oauth.oidc.serverUrl=https://idp.ci.local/realms/visiban \
        --set scheduledJobs.enabled=true \
        --set scheduledJobs.pruneBoardEvents.enabled=true \
        --set scheduledJobs.pruneNotifications.enabled=true \
        > /tmp/rendered.yaml
    # -ignore-missing-schemas: no CRDs are rendered today, but the flag keeps a
    # future ServiceMonitor/PrometheusRule from turning this into a hard red
    # while every core kind stays validated.
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml
    # Both shipped overlays get the same treatment — a values file that renders
    # an invalid object is a values file nobody can install.
    - |
      helm template visiban helm/visiban -f helm/visiban/values-dev.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set backend.settings.allowedHosts=ci.visiban.local \
        > /tmp/rendered-dev.yaml
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered-dev.yaml
    - |
      helm template visiban helm/visiban -f helm/visiban/values-prod.yaml \
        --set-string secret.djangoSecretKey=ci-not-a-real-secret \
        --set backend.settings.allowedHosts=ci.visiban.local \
        --set backend.email.fromAddress=noreply@visiban.local \
        --set backend.email.host=smtp.visiban.local \
        > /tmp/rendered-prod.yaml
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered-prod.yaml
    # Public demo overlay (#1180): the seed hook Job, the reset CronJob, the demo
    # Secret, the egress NetworkPolicy, the ResourceQuota/LimitRange and the
    # demo `helm test` Pod all only render here. Rendered twice: as shipped, and
    # with the reset off (no CronJob, empty DEMO_RESET_SCHEDULE).
    - |
      for reset in true false; do
        helm template visiban helm/visiban -f helm/visiban/values-demo.yaml \
          --set-string secret.djangoSecretKey=ci-not-a-real-secret \
          --set-string demo.loginHint.password=ci-visitor-pw-1 \
          --set-string demo.adminPassword=ci-admin-password-1 \
          --set-string demo.memberPassword=ci-member-password-1 \
          --set demo.reset.enabled=$reset \
          > /tmp/rendered-demo-$reset.yaml
        kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered-demo-$reset.yaml
      done
    # Self-test FIRST (#1093). This gate's failure mode is a GREEN pipeline over
    # a chart that no longer holds the contract, so "it passed" is not evidence
    # that it can still fail. The fixtures replay the #1038 shapes.
    - bash scripts/helm-structure-check.sh --self-test helm/visiban
    - bash scripts/helm-structure-check.sh helm/visiban

# ─── Helm — runtime drills (kind) ────────────────────────────────────────────
#
# The half helm-template cannot reach: actually BOOT the chart (#1116).
#
# Both jobs build the backend and frontend images from the working tree and
# side-load them into kind. They deliberately do NOT pull a published image:
# the MR-time *-docker-build jobs run kaniko with --no-push, so there is no
# per-commit image to pull, and drilling the HEAD chart against the last
# RELEASED image would mean a red here is version skew rather than a deploy
# regression — which is how a drill earns a reputation for crying wolf and
# stops being read.
#
# kind needs a Docker daemon, so these two are the only jobs in this file that
# use docker:dind. That is not a reversal of the kaniko decision for image
# builds (which stands, and is about pushing images without privileged mode) —
# there is simply no way to run a Kubernetes cluster in CI without one.
#
# Not `interruptible`: a rebased push must not abort a half-provisioned cluster
# and leak it into the dind daemon.

.helm-drill-base: &helm-drill-base
  stage: test
  interruptible: false
  image: ${DOCKERHUB_MIRROR}/docker:27-cli
  services:
    # Explicit name: + alias: (#1198 gate finding): GitLab derives a service's
    # DNS alias from a bare image string (`- docker:27-dind`), but that
    # derivation is not something to lean on once the image string carries a
    # registry prefix — DOCKER_HOST/APISERVER_HOST below hardcode `docker` and
    # a silently-wrong alias hangs the drill until timeout rather than failing
    # loudly.
    - name: ${DOCKERHUB_MIRROR}/docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    KIND_VERSION: "0.24.0"
    KUBECTL_VERSION: "1.31.2"
    HELM_VERSION: "3.16.4"
    # Calico is only used by helm-netpol, but it lives HERE on purpose. A
    # job-level `variables:` REPLACES an anchored one rather than merging into
    # it, so giving helm-netpol its own block to hold CALICO_VERSION silently
    # dropped every variable above — the tool URLs became ".../v/kind-linux-amd64",
    # 404'd to a small HTML page, and `tar` failed with "invalid magic" nine
    # seconds in. One shared block is the fix; do not re-split it.
    CALICO_VERSION: "v3.28.2"
    # kind writes a kubeconfig pointing at 127.0.0.1. The API server actually
    # runs inside the dind SERVICE container, which is a different container
    # from this job, so the drills retarget the kubeconfig at this hostname.
    APISERVER_HOST: "docker"
  before_script:
    - apk add --no-cache bash curl
    # Fail loudly on an empty version rather than downloading a 404 page and
    # letting `tar` report "invalid magic" from three commands later.
    - |
      for v in KIND_VERSION KUBECTL_VERSION HELM_VERSION; do
        eval "val=\${$v}"
        [ -n "$val" ] || { echo "ERROR: $v is empty — a variables: merge clobber?"; exit 1; }
      done
    - curl -fsSLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64" && chmod +x /usr/local/bin/kind
    - curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
    - curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp linux-amd64/helm && mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - kind version && kubectl version --client=true 2>/dev/null | head -1 && helm version --short
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 2; done
    - |
      # This dind daemon is a fresh, un-authenticated container per job
      # (#1198) — unlike the runner's own image:/services: pulls, which the
      # runner authenticates to the Dependency Proxy automatically, nothing
      # logs THIS daemon in. Base images, kindest/node, and in-cluster chart
      # images are all pulled here anonymously otherwise.
      # helm-install-drill.sh and helm-netpol-drill.sh rely on this login for
      # every docker pull they do through the proxy.
      #
      # CI_DEPENDENCY_PROXY_SERVER is empty on a project with no working
      # group Dependency Proxy (e.g. a personal-namespace fork — the
      # Dependency Proxy is a group-level-only feature), so this is a no-op
      # there rather than a hard failure; DOCKERHUB_MIRROR's own fallback
      # (see the drill scripts) is what keeps such a fork building at all.
      #
      # --password-stdin, not -p: an argv-visible token is readable from the
      # container's own process list for the life of the command (#1084
      # fixup convention).
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
      fi

helm-install:
  # Boots the chart and asserts it SERVES. ONE `helm install --wait` of the
  # chart's own defaults completes against a cluster with no pre-existing
  # database (#1117's acceptance criterion — this needed a two-phase
  # --no-hooks workaround while the migrate Job was a pre-install hook),
  # `helm test` passes (the same hook operators run), the one-time admin
  # password is retrievable from the shared emptyDir, a placeholder SECRET_KEY
  # is REJECTED (the fail-closed guard is asserted, not assumed), a
  # DJANGO_SECRET_KEY rotation applied in a single `helm upgrade` takes effect
  # AND replaces the pods — #1038 blocker 2 on the path that actually broke —
  # three replicas migrate without deadlocking on the advisory lock, and
  # `helm uninstall` leaves nothing behind. Then the public demo (#1180): a
  # fresh install of values-demo.yaml seeds itself, `helm test` proves the
  # fence (sign-in 200, board create 403 demo_read_only, card move 200), a
  # reset from the CronJob succeeds and the published login survives it.
  # See scripts/helm-install-drill.sh.
  <<: *helm-drill-base
  timeout: 40m
  # Only the static chart check (helm-template), not the whole `lint` stage —
  # stage-based ordering was making this wait on unrelated jobs (frontend-lint,
  # backend-lint, shellcheck, ...) before booting a 40min cluster. `optional:
  # true` because helm-template has no schedule rule, so it's absent from
  # scheduled pipelines that still run this drill.
  needs:
    - job: helm-template
      optional: true
  rules:
    # Advisory on the nightly schedule: a blip on a shared runner pulling Calico
    # manifests or base images is a signal, not a hard red.
    #
    # Excludes the Sonar nightly (#1369): this 40min drill has nothing to do
    # with a coverage-import-only scan, and SONAR_SCHEDULED is meant to run
    # every night — without the exclusion, adding it would turn a weekly-ish
    # cost into a nightly one for zero benefit to either job.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *helm-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths
  script:
    # DRILL_VALKEY_AUTH=1 adds step 9, the authenticated-Valkey install
    # (#1211). Inline, not a job-level `variables:` block, which would replace
    # the shared anchor's variables (see the warning above).
    - DRILL_VALKEY_AUTH=1 bash scripts/helm-install-drill.sh

helm-netpol:
  # NetworkPolicy ENFORCEMENT drill. A SEPARATE cluster from helm-install, with
  # disableDefaultCNI + Calico, because kind's default kindnetd DOES NOT
  # IMPLEMENT NetworkPolicy — the chart's policies are admitted there and
  # silently ignored, so a policy selecting the wrong pods passes every other
  # gate in this file. That is exactly how the migrate Job came to be missing
  # from the datastore allow-list (#1116) — that Job is gone as of #1117, but
  # the omission shape it demonstrated outlives it.
  #
  # Separate rather than a flag on helm-install so the common deploy smoke test
  # stays fast and two unrelated failure modes stay uncoupled.
  #
  # Also upgrades to values-demo.yaml and asserts the demo EGRESS policy
  # (#1180): backend and demo-seed pods reach DNS and the datastores and nothing
  # outside the pod network.
  #
  # Scoped to the whole chart, not just networkpolicy.yaml: the policies name
  # their clients by `app.kubernetes.io/component`, so ADDING a template that
  # opens a datastore connection breaks isolation without touching the policy
  # file itself.
  <<: *helm-drill-base
  timeout: 45m
  # See helm-install above.
  needs:
    - job: helm-template
      optional: true
  rules:
    # Excludes the Sonar nightly (#1369) — see helm-install's identical note
    # above; this is a separate 45min cluster drill with nothing to do with a
    # coverage-import scan.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *helm-paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *helm-paths
  script:
    - bash scripts/helm-netpol-drill.sh

# ─── Compose — production boot drill ─────────────────────────────────────────
#
# The Compose counterpart to helm-install above (#1152). Visiban drilled the
# Helm deploy path and not the docker-compose one, even though
# docker-compose.prod.yml + init-prod.sh is the path
# docs/getting-started/installation.md and docs/administration/upgrade.md
# tell a single-server operator to run — the most-followed deployment path in
# the docs and, until this job, the least-tested one in CI. See
# scripts/prod-compose-drill.sh for what it asserts and why.

.compose-drill-base: &compose-drill-base
  stage: test
  interruptible: false
  image: ${DOCKERHUB_MIRROR}/docker:27-cli
  services:
    # Explicit name: + alias: (#1198 gate finding, same reasoning as
    # .helm-drill-base below) — the daemon must be reachable at exactly the
    # hostname PROBE_HOST defaults to.
    - name: ${DOCKERHUB_MIRROR}/docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache bash curl openssl
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 2; done
    - |
      # See .helm-drill-base's identical block below for the full rationale:
      # this dind daemon is fresh and unauthenticated per job, and every pull
      # scripts/prod-compose-drill.sh does through the Dependency Proxy relies
      # on this login.
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
      fi

compose-prod-drill:
  <<: *compose-drill-base
  timeout: 20m
  rules:
    # Blocking on MRs and the default branch, advisory on the nightly
    # schedule — the same posture as helm-install/helm-netpol. The drill went
    # green end-to-end on two main push pipelines (2902462814 and 2902655693,
    # 2026-10-01); the schedule leg has not run the job yet (earlier scheduled
    # pipelines predate the drill's merge), so it stays advisory until it
    # does. Note this job's `changes:` includes `.gitlab-ci.yml`, so it now
    # also blocks any MR touching that file — intended, since it is proven.
    #
    # Excludes the Sonar nightly (#1369) — same reasoning as helm-install /
    # helm-netpol: a 20min compose boot drill has nothing to do with a
    # coverage-import scan, and SONAR_SCHEDULED runs every night.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED != "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &compose-prod-paths
        - docker-compose.prod.yml
        - init-prod.sh
        - .env.example
        - backend/Dockerfile.prod
        - frontend/Dockerfile.prod
        - nginx/**/*
        - scripts/prod-compose-drill.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *compose-prod-paths
  script:
    - bash scripts/prod-compose-drill.sh

# ─── Frontend — lint ──────────────────────────────────────────────────────────

# ESLint + TypeScript type checking in a single job — both need npm ci so
# combining them eliminates a redundant pod spin-up and install cycle.
frontend-lint:
  extends: .npm-cache
  stage: lint
  image: ${DOCKERHUB_MIRROR}/node:20-alpine
  variables:
    # Cap below available RAM so V8 GCs aggressively instead of OOM-killing.
    # 1500 MB caused exit 137 on the 2 GB runner; 512 MB forces earlier GC.
    NODE_OPTIONS: "--max-old-space-size=512"
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # Scope to src/ to avoid scanning build artefacts and reduce memory pressure
    # from eslint loading the full working tree. --max-warnings 15 matches the
    # sast job allowance for pre-existing react-hooks/exhaustive-deps warnings.
    - npm run lint -- src/ --max-warnings 15
    - npx tsc -p tsconfig.app.json --noEmit
    - npx tsc -p tsconfig.e2e.json --noEmit

# Meta-gate for #1093's house rule: every bespoke gate script under scripts/
# referenced from this file must ship a --self-test mode AND have it actually
# invoked here — a script that CAN self-test but whose job never calls it
# (the real gap this issue found in migration-numbering-check) is still a
# violation. Derives its gate list from THIS FILE at run time, so a newly
# wired gate (e.g. #1092's check-suppression-issues.sh) is picked up
# automatically with no edit to the checker itself — see
# scripts/check-gate-selftest-parity.sh and docs/development/ci-gates.md.
gate-selftest-parity:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &gate-selftest-parity-paths
        - .gitlab-ci.yml
        - scripts/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *gate-selftest-parity-paths
  before_script:
    - apk add --no-cache bash grep
  script:
    - bash scripts/check-gate-selftest-parity.sh --self-test
    - bash scripts/check-gate-selftest-parity.sh

# Stale version claims in the docs are silent misinformation (#1083): a
# "Coming in 1.1" line after 1.1 shipped, or an RC banner surviving a GA tag.
# Scans README.md, VISIBAN_FEATURES.md and docs/**, reads the current version
# from frontend/package.json (the file scripts/release.sh rewrites), and on a
# tag pipeline also asserts the tag equals that version. Runs on MRs, main
# and tags so a bad release is caught at tag time, not by a user.
docs-version-accuracy:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache bash grep
  script:
    - bash scripts/check-docs-version-accuracy.sh --self-test
    - bash scripts/check-docs-version-accuracy.sh

# ─── Frontend — test ──────────────────────────────────────────────────────────

frontend-test:
  extends: .npm-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:20-alpine
  variables:
    # Match frontend-lint: cap below available RAM so V8 GCs before OOM-kill.
    NODE_OPTIONS: "--max-old-space-size=512"
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml --coverage
  coverage: '/All files\s+\|\s+(\d+(?:\.\d+)?)\s+\|/'
  artifacts:
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/cobertura-coverage.xml
      # LCOV for SonarCloud's JS importer (#1370); consumed by sonar:scan.
      - frontend/coverage/lcov.info
    when: always

# ─── Serializer <-> TypeScript interface parity ──────────────────────────────
#
# CLAUDE.md requires Board/Card/User and related interfaces to match the backend
# serializer fields exactly. Nothing enforced it, and the failure is silent in
# both directions: a serializer field with no TypeScript field is data the SPA
# simply cannot see, and a field whose *type* drifts type-checks cleanly on both
# sides while the client reads the wrong shape (#1079).
#
# This job regenerates the OpenAPI schema with drf-spectacular — the same command
# backend-schema-validate runs, and the same reason it needs no database — and
# diffs its components against frontend/src/types/index.ts.
#
# Python, not Node, despite sitting among the frontend jobs: #1079 originally
# asked for TypeScript types generated from openapi.json, but both viable
# generators failed the dependency gate (openapi-typescript announced EOL on
# 2026-09-19; @hey-api/openapi-ts requires Node >= 22.18, which no image here
# provides, and pins a js-yaml carrying three unfixed CVSS-7.5 advisories).
# Diffing the two representations catches the same drift with no npm dependency
# at all. It stays in this position in the file so the frontend-facing gates read
# together.
#
# Known mismatches are recorded in the script's SUPPRESSIONS table, each citing a
# filed issue and each self-invalidating: a suppression whose recorded drift no
# longer matches reality fails the job and asks to be deleted, so it cannot
# outlive its reason.
serializer-ts-parity:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - changes: &serializer-ts-parity-paths
        - backend/**/*
        - frontend/src/types/index.ts
        - scripts/check-serializer-ts-parity.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *serializer-ts-parity-paths
  variables:
    # Schema generation only introspects serializers — Django never opens a
    # connection — so a syntactically valid DATABASE_URL is all this needs.
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@localhost:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://localhost:6379/0"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - pip install --quiet -r backend/requirements.txt
  script:
    # Self-test FIRST (#1093). This gate's failure mode is a GREEN pipeline over
    # a drifted contract, so prove the detection logic still fires before
    # trusting the real run's verdict. Offline, no database, no network.
    - python3 scripts/check-serializer-ts-parity.py --self-test
    - python3 scripts/check-serializer-ts-parity.py
  allow_failure: false

# Diff coverage (MR only) — #1076. Same rationale as backend-diff-coverage
# above: vitest.config.ts's aggregate thresholds (lines: 70, etc.) measure
# the whole frontend and can absorb an untested new component. This job
# reuses frontend-test's existing cobertura-coverage.xml — diff-cover reads
# Cobertura XML natively, so no new vitest reporter (e.g. lcov) is needed.
#
# src/test/ is already excluded from the coverage report itself (see
# vitest.config.ts's coverage.exclude), so those files never appear as
# "uncovered" here; the --exclude below is belt-and-suspenders per #1076's
# acceptance criteria and guards against a future reporter config change.
#
# Threshold starts at 80% of changed lines, blocking. Same escape hatch as
# the backend job — see docs/development/testing.md#diff-coverage-escape-hatch.
frontend-diff-coverage:
  stage: test
  needs: [frontend-test]
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet diff-cover
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
  script:
    - diff-cover frontend/coverage/cobertura-coverage.xml
        --compare-branch=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        --fail-under=80
        --show-uncovered
        --exclude "frontend/src/test/*" "frontend/src/**/*.test.*" "frontend/src/**/*.spec.*"

# Guards a blind spot in diff-cover that both jobs above share (#1091, follow-up
# to #1076): a brand-new source file with zero tests never appears as a row in
# coverage.xml / cobertura-coverage.xml at all, so diff-cover finds nothing to
# score for it and reports 100% — the inverse of what should happen. This is
# the per-MR counterpart to #1090 (an uninstrumented CI job reading as 0% in
# the aggregate) — same root cause, unmeasured code scored as if it were fine.
#
# Reuses the coverage.xml / cobertura-coverage.xml artifacts produced above
# rather than re-running any tests. `optional: true` on both `needs` entries
# means this job still runs (and still fails loudly, see the script's own
# "report not found" branch) even if only one of backend/frontend changed —
# but in practice a newly *added* file under backend/ or frontend/src/ always
# triggers its own coverage job via the `changes:` rules on
# backend-test-coverage / frontend-test, so both stay in lockstep with this
# job's own `changes:` list.
added-files-coverage-check:
  stage: test
  needs:
    - job: backend-test-coverage
      artifacts: true
      optional: true
    - job: frontend-test
      artifacts: true
      optional: true
  image: ${DOCKERHUB_MIRROR}/node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - frontend/**/*
        - .gitlab-ci.yml
        - scripts/check-added-files-covered.mjs
  before_script:
    - apk add --no-cache git
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
  script:
    - node scripts/check-added-files-covered.mjs
        --target-ref origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        --no-fetch

# Self-test for added-files-coverage-check, per the house rule in #1093 (not
# yet standardized elsewhere — this is the first gate to adopt it): a bespoke
# gate script's detection logic must be provable in its own job, on the same
# image as the real check, so a shared-job skip can't silently take both down
# together. Builds its own synthetic git repo + coverage fixtures in a temp
# dir; touches nothing in this repository and needs no network or database —
# see check-added-files-covered.mjs's `selfTest()`.
added-files-coverage-check-self-test:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/check-added-files-covered.mjs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - scripts/check-added-files-covered.mjs
  before_script:
    - apk add --no-cache git
  script:
    - node scripts/check-added-files-covered.mjs --self-test

# ─── Frontend — E2E (Playwright) ─────────────────────────────────────────────
#
# Runs the Playwright suite against the Vite dev server using the official
# Microsoft Playwright Docker image (browsers pre-installed, no download step).
# API calls are intercepted by page.route() so no backend is required.
#
# Starts as allow_failure: true to tolerate transient flakiness during the
# initial rollout period.  Promote to required after three consecutive clean
# weeks of pipeline history on main.
#
# Uses workers: 1 (via playwright.config.ts) to stay within the 2 GB runner
# memory budget (Chromium ~500 MB + Vite dev server ~400 MB).

playwright-e2e:
  stage: test
  needs: []
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  allow_failure: true
  # No unconditional main fallback (#1266) — nothing needs this job, and it's
  # one of the more expensive ones to run needlessly (browser image pull +
  # full e2e suite).
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx playwright test --output=test-results
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    reports:
      junit: frontend/test-results/junit.xml
    expire_in: 7 days

# ─── WebSocket event reachability (#1078) ────────────────────────────────────
#
# Reconciles the three places a WebSocket event name lives — emitted (the
# registries in backend/boards/broadcast.py and backend/groups/broadcast.py),
# documented (docs/api/websockets.md), handled (BoardView.tsx / GroupDetail.tsx
# and the two socket hooks) — and fails when any name is missing from one of
# them. CLAUDE.md declares the {event, data} board_* schema a public 1.0+
# contract; until this job nothing enforced it, so a name could be added to two
# of the three and look complete from every angle.
#
# Ported from the same defect class TruePPM found in its beta-readiness audit:
# a shipped alert queried a metric name the app never emitted, so the alert
# could never fire and the panel was permanently blank — while both docs pages
# had the correct name. Nothing compared the three.
#
# Pure stdlib Python and no database, so it runs on the plain python image with
# no install step. The --self-test invocation runs FIRST and on the same image:
# a bespoke gate whose detectors have silently stopped detecting is worse than
# no gate, because the green tick still reads as a verdict (#1093).
ws-event-reachability:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &ws-event-reachability-paths
        - backend/boards/**/*
        - backend/groups/**/*
        - backend/git_lens/**/*
        - frontend/src/hooks/**/*
        - frontend/src/components/Board/BoardView.tsx
        - frontend/src/pages/GroupDetail.tsx
        - docs/api/websockets.md
        - scripts/check-ws-event-reachability.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *ws-event-reachability-paths
  script:
    # Prove the detection logic fires against known-bad input before trusting
    # this job's verdict on the real tree.
    - python scripts/check-ws-event-reachability.py --self-test
    - python scripts/check-ws-event-reachability.py
  allow_failure: false

# ─── RBAC coverage (#1143) ────────────────────────────────────────────────────
#
# The deterministic half of the `rbac-check` agent gate. Three of that agent's
# six questions are mechanical — is there an authentication gate, is the caller's
# role resolved through the shared resolver, and does every write action apply a
# minimum-role check — and this asserts all three over the board/group-scoped
# view modules by AST. The other three (is this the *right* minimum role, group
# inheritance correctness, cross-board isolation beyond the mechanical lookup
# case) still need the agent, which is why this script has a distinct exit code
# for a view it cannot classify rather than a silent pass.
#
# Same conversion as #1078, #1092 and #1093: an agent round-trip per MR costs
# latency and tokens and leaves no record, while a script under a second leaves
# its misses visible as code.
#
# Pure stdlib Python, no database, no Django import — so it runs on the plain
# python image with no install step. The --self-test invocation runs FIRST and on
# the same image (#1093).
rbac-coverage:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &rbac-coverage-paths
        - backend/boards/views/**/*
        - backend/boards/models.py
        - backend/boards/permissions.py
        - backend/groups/views.py
        - backend/git_lens/views.py
        - scripts/check-rbac-coverage.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *rbac-coverage-paths
  script:
    # Prove the detection logic fires against known-bad input before trusting
    # this job's verdict on the real tree.
    - python scripts/check-rbac-coverage.py --self-test
    # Exit 3 is "unhandled pattern — hand it to the rbac-check agent". It is a
    # failure, deliberately: a view whose authorization this script cannot read
    # must not be reported as one it checked and approved.
    - |
      set +e
      python scripts/check-rbac-coverage.py
      rc=$?
      set -e
      if [ "$rc" -eq 3 ]; then
        echo ""
        echo "FAILED (exit 3): one or more views could not be classified statically."
        echo "Run the rbac-check agent on each DEFER above, then either fix the gap"
        echo "or record its review in AGENT_REVIEWED in scripts/check-rbac-coverage.py."
        echo "See docs/development/rbac-and-broadcast-gates.md."
      fi
      exit $rc
  allow_failure: false

# ─── Broadcast deferral (#1143) ───────────────────────────────────────────────
#
# The deterministic half of the `broadcast-check` agent gate: every write on a
# board/group-scoped view reaches a broadcast, every raw broadcast sits inside a
# transaction.on_commit() callable, no commit hook holds an ORM row it read from
# the enclosing scope, and no emit call sits in a loop over rows of one channel.
#
# Event *naming* and the emitted/documented/handled three-way match belong to
# ws-event-reachability (#1078) and are deliberately not re-checked here. The
# per-recipient field-leak question stays with the agent — it needs to know
# which serializer fields a role may see.
#
# Same image and self-test-first discipline as rbac-coverage above.
broadcast-deferral:
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  # No unconditional main fallback (#1266) — nothing needs this job.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &broadcast-deferral-paths
        - backend/boards/**/*
        - backend/groups/**/*
        - backend/git_lens/**/*
        - scripts/check-broadcast-deferral.py
        - scripts/check-rbac-coverage.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *broadcast-deferral-paths
  script:
    - python scripts/check-broadcast-deferral.py --self-test
    - |
      set +e
      python scripts/check-broadcast-deferral.py
      rc=$?
      set -e
      if [ "$rc" -eq 3 ]; then
        echo ""
        echo "FAILED (exit 3): one or more broadcasts could not be classified statically."
        echo "Run the broadcast-check agent on each DEFER above, then either fix the"
        echo "gap or record its review in AGENT_REVIEWED in"
        echo "scripts/check-broadcast-deferral.py."
        echo "See docs/development/rbac-and-broadcast-gates.md."
      fi
      exit $rc
  allow_failure: false

# ─── Changelog check (MR only) ────────────────────────────────────────────────
#
# Fails when no changelog fragment was added and the MR contains changes that
# warrant a changelog entry. Each MR drops a file in changelog.d/ instead of
# editing CHANGELOG.md directly — this eliminates merge conflicts.
#
# Fragment naming: <issue-or-slug>.<type>.md  (e.g. 434.fixed.md)
# Valid types: added, changed, fixed, security
#
# Auto-skips for MRs that only touch:
#   - CI/CD config (.gitlab-ci.yml, .gitlab/)
#   - Documentation (docs/, *.md other than changelog fragments, README*)
#   - Developer tooling (CLAUDE.md, .gitignore, scripts/, Makefile, *.sh)
#   - Test files only (frontend/src/test/, backend/*/tests/)
# To skip manually for a legitimate edge case, add the ~no-changelog label.

changelog-check:
  extends: .on-mr
  stage: lint
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  before_script:
    - apk add --no-cache git
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=100
    - BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD || echo "")
    - |
      if [ -z "$BASE" ]; then
        echo "INFO — could not determine merge base; skipping changelog check."
        exit 0
      fi
    - |
      # Skip if the MR carries the no-changelog label
      if echo "$CI_MERGE_REQUEST_LABELS" | tr ',' '\n' | grep -qx 'no-changelog'; then
        echo "INFO — 'no-changelog' label present; skipping."
        exit 0
      fi
    - CHANGED=$(git diff --name-only $BASE HEAD)
    - |
      # Strip files that never need a changelog entry
      MEANINGFUL=$(echo "$CHANGED" | grep -Ev \
        '^\.gitlab(-ci\.yml|/)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(docs/|README|CLAUDE\.md|\.gitignore|Makefile|scripts/|mkdocs\.yml)' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '\.(md|sh)$' \
        || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev \
        '^(frontend/src/test/|frontend/e2e/|backend/.*/tests/)' \
        || true)
      if [ -z "$MEANINGFUL" ]; then
        echo "INFO — only non-product files changed; skipping changelog check."
        exit 0
      fi
    - |
      # Accept either a changelog fragment OR a direct CHANGELOG.md edit
      # (the latter supports in-flight MRs during the transition period).
      HAS_FRAGMENT=$(echo "$CHANGED" | grep -c '^changelog\.d/.*\.\(added\|changed\|fixed\|security\)\.md$' || true)
      HAS_CHANGELOG=$(echo "$CHANGED" | grep -c 'CHANGELOG.md' || true)
      if [ "$HAS_FRAGMENT" -gt 0 ]; then
        echo "OK — changelog fragment found."
      elif [ "$HAS_CHANGELOG" -gt 0 ]; then
        echo "OK — CHANGELOG.md updated directly (legacy mode)."
      else
        echo "ERROR — No changelog fragment found." >&2
        echo "" >&2
        echo "  Add a file to changelog.d/ named: <issue-or-slug>.<type>.md" >&2
        echo "  Valid types: added, changed, fixed, security" >&2
        echo "  Example:  echo 'Description of change (#123)' > changelog.d/123.fixed.md" >&2
        echo "" >&2
        echo "  Or apply the ~no-changelog label if this MR genuinely needs no entry." >&2
        exit 1
      fi

# ─── Suppression marker check (main + schedule, not MR-only) ─────────────────
#
# #1092: a suppression (pytest skip/xfail, eslint-disable, coverage omit) is
# added for a reason that's true *today* and nothing ever revisits it — see
# #1090, where git_lens read as 0% covered for months because a job was
# uninstrumented and nothing flagged that the number had stopped meaning
# anything.
#
# Convention: a suppression waiting on tracked work (as opposed to being
# permanently intentional) carries a SUPPRESSED-UNTIL(#N) marker naming the
# issue that would remove it. This job greps for the marker, looks up each
# cited issue via the GitLab API, and fails — naming file, line, and issue —
# if any cited issue is already closed. See scripts/check-suppression-issues.sh
# and docs/development/suppressions.md for the full contract; unit-tested in
# scripts/tests/check-suppression-issues.test.sh.
#
# Deliberately NOT MR-only: the triggering event is "an issue closed", not
# "a commit landed" on the branch that added the marker. That commit may have
# merged long before the cited issue closes, so an MR-only job would never
# fire again after merge. Also runs on MR for early feedback when a marker is
# added citing an issue that is already closed at authoring time.
#
# --self-test runs immediately before the real invocation, on the same
# image, per #1093's meta-gate (every bespoke CI gate must carry a self-test
# or main goes red when that gate lands).
suppressions-check:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache curl
  script:
    - sh scripts/check-suppression-issues.sh --self-test
    - sh scripts/check-suppression-issues.sh

# ─── Kaizen yield watch (scheduled, report-only by default) ──────────────────
#
# #1144: /kaizen (#1094) only ran when someone remembered to. This job folds
# newly merged MRs' `## Gates` ledgers into a running per-(gate, diff-shape)
# zero-finding streak (state: .claude/kaizen-yield-state.json) and reports
# any pair at the /kaizen threshold (10 consecutive 0-finding runs). It never
# edits CLAUDE.md or the fast-path table. Report-only unless the schedule sets
# KAIZEN_FILE_ISSUES=true AND a KAIZEN_API_TOKEN variable (opt-in; files at
# most one issue per candidate). Fails open: never blocks anything. Opt-in
# schedule variable KAIZEN_YIELD_WATCH=true, like the other scheduled jobs.
# See docs/development/kaizen-yield-watch.md.
kaizen-yield-watch:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $KAIZEN_YIELD_WATCH == "true"'
  script:
    - python3 scripts/kaizen_yield_watch.py --self-test
    - |
      if [ "$KAIZEN_FILE_ISSUES" = "true" ]; then
        python3 scripts/kaizen_yield_watch.py --write-state kaizen-yield-state.json --file-issues
      else
        python3 scripts/kaizen_yield_watch.py --write-state kaizen-yield-state.json
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - kaizen-yield-state.json

# ─── Security (MR only) ───────────────────────────────────────────────────────
#
# Security jobs run only on MR pipelines — they are the gate before merging
# and do not need to run on every WIP commit.

# bandit: Python SAST for security issues — shell injection, hardcoded
# credentials, use of random instead of secrets, SQL injection patterns, etc.
# Runs at medium severity (-ll) so only Medium/High findings block the merge.
# Skips migration files (auto-generated, safe to ignore) and test files
# (test utilities like mock tokens are intentionally insecure-looking).
backend-sast:
  extends: .pip-cache
  stage: security
  # Reads source only, not test output — runs alongside `test` instead of
  # waiting for the whole stage (including the 40-45min helm drills) to
  # finish first.
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*.py
  before_script:
    - pip install --quiet bandit
  script:
    # Single scan: write JSON artifact, then print a readable summary and exit
    # with bandit's own exit code. bandit does not support two simultaneous
    # output formats, so we parse the JSON to produce log output instead of
    # running a second full scan.
    # Use && ... || ... to capture the exit code safely under set -e.
    - |
      bandit -r backend/ \
        --severity-level medium \
        --confidence-level medium \
        --exclude backend/boards/migrations,backend/groups/migrations,backend/accounts/migrations,backend/visiban/migrations \
        --skip B101 \
        -f json -o bandit-report.json && BANDIT_EXIT=0 || BANDIT_EXIT=$?
      python3 - <<'PY'
      import json
      d = json.load(open("bandit-report.json"))
      results = d.get("results", [])
      metrics = d.get("metrics", {}).get("_totals", {})
      print(f"bandit: {metrics.get('loc', '?')} lines scanned, {len(results)} issue(s)")
      for r in results:
          print(f"  [{r['issue_severity']}/{r['issue_confidence']}] {r['test_id']} {r['issue_text']}")
          print(f"    {r['filename']}:{r['line_number']}")
      PY
      exit $BANDIT_EXIT
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - bandit-report.json

# eslint-plugin-security: JS/TS SAST for injection, prototype pollution,
# non-literal regexp/require, and other common frontend security issues.
# Runs as a dedicated security job (separate from style linting) so failures
# are clearly security-attributed and block merges independently.
frontend-sast:
  extends: .npm-cache
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/src/**/*.{ts,tsx}
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/src/**/*.{ts,tsx}
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # ESLint v9 uses flat config and removed --no-eslintrc.  Write a temporary
    # flat config *inside the frontend dir* so bare-specifier imports resolve
    # against the local node_modules.  --no-config-lookup prevents the project's
    # eslint.config.js from being merged in, keeping this job focused only on
    # the security rules below.
    # detect-object-injection is set to warn: it fires on common TypeScript
    # bracket-access patterns and produces many false positives in React code.
    - |
      cat > eslint-security.config.mjs <<'ESLINTEOF'
      import security from 'eslint-plugin-security';
      import tsParser from '@typescript-eslint/parser';
      import reactHooks from 'eslint-plugin-react-hooks';
      import reactRefresh from 'eslint-plugin-react-refresh';
      import tseslint from 'typescript-eslint';
      const rules = { 'security/detect-object-injection': 'warn', 'security/detect-non-literal-regexp': 'error', 'security/detect-non-literal-require': 'error', 'security/detect-possible-timing-attacks': 'warn', 'security/detect-eval-with-expression': 'error' };
      // Register react-hooks, react-refresh, and @typescript-eslint plugins so that
      // eslint-disable-next-line comments referencing their rules are recognised as
      // valid (prevents "Definition for rule X was not found" errors).  No rules from
      // these plugins are enabled — only security/ rules are enforced here.
      const linterOptions = { reportUnusedDisableDirectives: 'off' };
      export default [
        { files: ['**/*.{ts,tsx}'], languageOptions: { parser: tsParser }, linterOptions, plugins: { security, 'react-hooks': reactHooks, 'react-refresh': reactRefresh, '@typescript-eslint': tseslint.plugin }, rules },
        { files: ['**/*.{js,mjs,jsx}'], linterOptions, plugins: { security }, rules },
      ];
      ESLINTEOF
      npx eslint --no-config-lookup --config eslint-security.config.mjs src/
  allow_failure: true

# pip-audit: checks Python packages against the OSV vulnerability database.
# On MRs: only when requirements.txt changes; allow_failure so a new CVE in an
# existing dep doesn't block unrelated MRs.
# On the weekly CVE schedule: always runs; allow_failure: false so the pipeline
# fails and GitLab sends a failure email to maintainers.
backend-dep-scan:
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/requirements.txt
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
      allow_failure: false
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit -r backend/requirements.txt --format json -o pip-audit-report.json || true
    - pip-audit -r backend/requirements.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pip-audit-report.json

# npm audit: flag HIGH or CRITICAL CVEs in frontend npm dependencies.
# Same MR / schedule split as backend-dep-scan above.
frontend-dep-scan:
  extends: .npm-cache
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/package-lock.json
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CVE_SCAN == "true"'
      allow_failure: false
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npm audit --audit-level=high
  after_script:
    - cd frontend && npm audit --json > ../npm-audit-report.json 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - npm-audit-report.json

# License compliance — flag GPL-2.0/GPL-3.0 dependencies that are incompatible
# with the project's Apache 2.0 license. Non-blocking so it warns but doesn't
# gate merges.

backend-license-check:
  extends: [.on-mr, .pip-cache]
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  before_script:
    - pip install --quiet -r backend/requirements.txt pip-licenses
  script:
    - pip-licenses --format=plain --fail-on="GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2)"
  allow_failure: true

frontend-license-check:
  extends: [.on-mr, .npm-cache]
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx license-checker --failOn "GPL-2.0;GPL-3.0" --summary
  allow_failure: true

# trivy: filesystem scan for OS-level CVEs in the Docker base images and
# IaC misconfigurations in Dockerfiles and Helm charts.
#
# Why trivy in addition to pip-audit / npm audit:
#   - pip-audit and npm audit only see application-layer dependencies.
#     trivy also scans the OS packages installed in the Docker image
#     (e.g. Alpine apk packages in python:3.12-slim or node:20-alpine)
#     for CVEs that the app-layer scanners never see.
#   - --scanners vuln,config catches both CVEs and IaC issues (Dockerfile
#     USER root, ADD instead of COPY, missing HEALTHCHECK, etc.) in one pass.
#
# Runs on any change to a Dockerfile, requirements.txt, package-lock.json,
# or Helm chart, plus always on main. allow_failure: true so a newly
# published OS CVE in a base image does not immediately block merges —
# findings are visible in the job log and artifact for triage.
trivy-scan:
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image:
    name: ghcr.io/aquasecurity/trivy:0.74.0
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/Dockerfile
        - frontend/Dockerfile
        - backend/requirements.txt
        - frontend/package-lock.json
        - helm/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # Scan the repo filesystem — catches vuln in declared deps and IaC issues
    # in Dockerfiles and Helm templates. --exit-code 0 so the job is non-
    # blocking; severity threshold is HIGH,CRITICAL for the visible summary.
    - trivy fs .
        --scanners vuln,config
        --severity HIGH,CRITICAL
        --exit-code 0
        --format table
    - trivy fs .
        --scanners vuln,config
        --severity HIGH,CRITICAL
        --exit-code 0
        --format json
        --output trivy-report.json
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-report.json

# OSV-Scanner: unified Python + npm dependency vulnerability scan using the
# OSV.dev advisory database (PyPA, GitHub Advisory, and 20+ ecosystem feeds).
# Complements pip-audit and npm audit with first-party OSV data, which has
# lower false-positive rates than NVD.
#
# Runs unconditionally on every MR and on main — no `changes:` filter. OSV
# advisories are database-driven: a HIGH can be published against a version
# already sitting in a committed, unchanged lockfile, so a changes-gated rule
# would only ever catch it after it lands on main. The job is a few seconds of
# static-binary download plus a fast scan, so running it on every pipeline is
# cheap. Also runs on the weekly CVE schedule for the same reason pip-audit /
# npm-audit do: to catch a freshly-published advisory against dependencies
# nobody touched this week either.
#
# Severity gate: OSV-Scanner has no native severity threshold (confirmed on
# v2.3.5 — no --severity / --fail-on / --audit-level flag), so it exits
# non-zero on ANY non-ignored advisory. scripts/osv-severity-gate.sh
# classifies the JSON output and FAILS only on HIGH/CRITICAL (blocks the
# pipeline); MEDIUM/LOW/unscored WARN (exit 2, mapped to allow_failure below —
# visible in the pipeline as a yellow warning, but non-blocking). Accepted
# risks are suppressed via an osv-scanner.toml next to the relevant lockfile
# (auto-discovered — do not pass --config, which would force a single global
# file), with a documented, expiring IgnoredVulns entry — same escape-hatch
# shape as migration-check's `# concurrency-exempt:` comment. See
# scripts/osv-severity-gate.sh for the full exit-code contract; it is
# unit-tested in scripts/tests/osv-severity-gate.test.sh.
#
# Runs on alpine + a pinned binary download rather than the distroless
# ghcr.io/google/osv-scanner image: the severity gate needs a shell and jq,
# which the distroless image doesn't have. Matches the gitleaks-scan /
# trivy-scan jobs' pinned-binary approach.
dep-scan-osv:
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OSV_SCAN == "true"'
  allow_failure:
    exit_codes:
      - 2
  before_script:
    - apk add --no-cache wget jq
    - wget -q -O /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.3.5/osv-scanner_linux_amd64"
    - chmod +x /usr/local/bin/osv-scanner
  script:
    # Write JSON report first (osv-scanner exits non-zero on any finding; the
    # severity verdict is delegated entirely to the gate script below).
    - osv-scanner scan source
        --lockfile backend/requirements.txt
        --lockfile frontend/package-lock.json
        --format json
        --output-file osv-report.json
        || true
    # Self-test immediately before the real invocation, same image (#1093) —
    # proves the severity classifier still fires before trusting its verdict.
    - sh scripts/osv-severity-gate.sh --self-test
    - sh scripts/osv-severity-gate.sh osv-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - osv-report.json

# gitleaks: full working-tree secret scan using the upstream default ruleset.
# Complements the GitLab secret-detection component included at the top of
# this file (different implementation and ruleset), and — unlike it — is not
# limited to what a diff-scoped analyzer sees: `gitleaks dir .` scans every
# file in the checkout, unconditionally, since a secret can land in any file.
# Scoped, documented allowlist for genuine false positives (npm lockfile
# integrity hashes, API doc examples, test fixtures) lives in .gitleaks.toml.
# Pinned static binary, matching the osv/trivy jobs.
#
# Also wired as a local pre-commit hook (scripts/gitleaks-precommit.sh, via
# scripts/setup-hooks.sh) so a secret is caught before it is even committed.
# That hook matters here specifically: per the workflow rules above, a branch
# with no open MR gets zero CI, so a secret pushed to such a branch would
# otherwise go unscanned by anything in this file until an MR is opened.
gitleaks-scan:
  stage: security
  # See backend-sast above — source-only, no test dependency.
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache wget
    - wget -q -O /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - chmod +x /usr/local/bin/gitleaks
  script:
    - gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

# ─── Nightly SonarCloud scan (#1369, part of the #1368 quality epic) ─────────
#
# There is no SonarCloud job in this file today — the dashboard only refreshes
# when someone runs `sonar-scanner` by hand, so it is stale and never carries
# coverage. Mirrors TruePPM's `sonar:scan` (trueppm/.gitlab-ci.yml).
#
# Trigger: ONLY the dedicated nightly schedule (SONAR_SCHEDULED == "true"),
# never MR or push pipelines, so day-to-day pipeline latency is unchanged.
# SonarCloud does not run tests; it imports the coverage reports the `test`
# stage already produces via the `sonar.*.reportPaths` in
# sonar-project.properties.
#
# `needs:` backend-test-coverage and frontend-test with `artifacts: true` so
# their reports land in this job's workspace. Both already run on every
# scheduled pipeline (their rules fall back to `$CI_COMMIT_BRANCH ==
# $CI_DEFAULT_BRANCH`, which is true for any schedule targeting main, Sonar's
# included) — no rule change needed on either job. stage: security keeps this
# job after `test` (a job cannot `needs:` a later-stage job).
#
# allow_failure: true so a Sonar/network hiccup never turns the nightly red.
# Failure visibility: this job is NOT wired to any alert — a red run is only
# visible by looking at the schedule's pipeline history or the SonarCloud
# dashboard itself (no new analysis for that day). That is a known, accepted
# gap for this first cut; #1382 owns writing it up in the maintainer runbook.
#
# Coverage import (#1370): sonar-project.properties points
# `sonar.python.coverage.reportPaths` / `sonar.javascript.lcov.reportPaths` at
# the rewritten reports that scripts/sonar-scan.sh --prep-only generates from
# the two producer artifacts. A missing report only warns, so a single failed
# producer (e.g. an allow_failure coverage job) still lets the rest of the
# import proceed instead of aborting the whole scan.
sonar:scan:
  stage: security
  image: ${DOCKERHUB_MIRROR}/sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
  needs:
    - job: backend-test-coverage
      artifacts: true
    - job: frontend-test
      artifacts: true
  variables:
    # Full history so SonarCloud's new-code detection and SCM blame are
    # accurate (the default shallow clone makes Sonar warn and skip blame
    # attribution).
    GIT_DEPTH: "0"
    # Keep the analysis cache inside the workspace so it can be cached below.
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  cache:
    key: sonar-scanner
    paths:
      - .sonar/cache
  script:
    # Rewrite both coverage reports so their file paths resolve from the repo
    # root (backend <source> root, frontend `SF:src/` -> `SF:frontend/src/`).
    # The rewrites live in scripts/sonar-scan.sh so CI and a developer's local
    # scan share one implementation; it is POSIX sh because this image has no
    # bash. A missing report only warns, so one failed producer still lets the
    # other import proceed.
    - sh scripts/sonar-scan.sh --prep-only
    # SONAR_TOKEN (masked, protected CI/CD variable) and SONAR_HOST_URL
    # (defaults to sonarcloud.io) are read from the environment by
    # sonar-scanner automatically. Don't block on the quality-gate compute
    # task — this is a dashboard refresh, not a merge gate.
    - sonar-scanner -Dsonar.qualitygate.wait=false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED == "true"'
  allow_failure: true

# ─── Build verification (MR only) ─────────────────────────────────────────────
#
# Verify Docker images build successfully before merging. Catches Dockerfile
# drift early without pushing to any registry.
# Uses kaniko instead of Docker-in-Docker — no privileged mode needed, works
# out of the box on Kubernetes runners.
# Runs in the test stage alongside tests — build doesn't depend on test
# results, so running them in parallel saves a full stage of waiting.

backend-docker-build:
  stage: test
  # No needs: [] — let lint finish before kaniko starts so both don't compete
  # for RAM on the same runner. resource_group serializes the two kaniko jobs
  # so they don't overlap with each other either.
  resource_group: kaniko-build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - backend/Dockerfile
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      # The Dockerfile's FROM now resolves through DOCKERHUB_MIRROR (#1198)
      # via --build-arg BASE_REGISTRY below, which is the GitLab Dependency
      # Proxy on a project where it's enabled, so kaniko needs proxy
      # credentials to pull it. CI_DEPENDENCY_PROXY_SERVER is empty on a
      # project with no working group Dependency Proxy (e.g. a
      # personal-namespace fork), hence the guard — DOCKERHUB_USERNAME/TOKEN
      # is kept as a fallback auth entry in case a FROM line is ever pointed
      # back at docker.io directly.
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS=""
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        AUTHS="\"${CI_DEPENDENCY_PROXY_SERVER}\":{\"auth\":\"$(b64 "${CI_DEPENDENCY_PROXY_USER}" "${CI_DEPENDENCY_PROXY_PASSWORD}")\"}"
      fi
      if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
        [ -n "$AUTHS" ] && AUTHS="${AUTHS},"
        AUTHS="${AUTHS}\"https://index.docker.io/v1/\":{\"auth\":\"$(b64 "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}")\"}"
      fi
      printf '{"auths":{%s}}' "${AUTHS}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor --context=backend --dockerfile=backend/Dockerfile --no-push --snapshot-mode=redo --build-arg BASE_REGISTRY=${DOCKERHUB_MIRROR:-docker.io/library}

frontend-docker-build:
  stage: test
  resource_group: kaniko-build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - frontend/Dockerfile
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      # See backend-docker-build above: the Dockerfile's FROM now resolves
      # through DOCKERHUB_MIRROR (#1198) via --build-arg BASE_REGISTRY below.
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS=""
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        AUTHS="\"${CI_DEPENDENCY_PROXY_SERVER}\":{\"auth\":\"$(b64 "${CI_DEPENDENCY_PROXY_USER}" "${CI_DEPENDENCY_PROXY_PASSWORD}")\"}"
      fi
      if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
        [ -n "$AUTHS" ] && AUTHS="${AUTHS},"
        AUTHS="${AUTHS}\"https://index.docker.io/v1/\":{\"auth\":\"$(b64 "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}")\"}"
      fi
      printf '{"auths":{%s}}' "${AUTHS}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor --context=frontend --dockerfile=frontend/Dockerfile --no-push --snapshot-mode=redo --build-arg NODE_OPTIONS=--max-old-space-size=512 --build-arg BASE_REGISTRY=${DOCKERHUB_MIRROR:-docker.io/library}

# ─── Docker push (amd64 + arm64) ───────────────────────────────────────────────
#
# Builds and pushes images with kaniko — the same daemonless builder the
# MR-time *-docker-build jobs already use. No Docker daemon, no privileged
# mode, no self-hosted runner.
#
# Why this changed (2026-09-14, !852): these jobs previously ran `docker
# buildx` against a Docker socket mounted by a self-hosted runner's
# config.toml. That runner ("nuc runner", group runner 53511568) went stale on
# 2026-07-18; every push since had been scheduled onto a GitLab SaaS runner and
# failed with "Cannot connect to the Docker daemon at unix:///var/run/docker.sock".
# The last successful push was 2026-06-26. kaniko removes that single point of
# failure for amd64 — these jobs run on any runner.
#
# ARM64 (#1084, restored here): kaniko cannot cross-build, so amd64 stays on
# kaniko and arm64 gets its own native leg below (`*-docker-push-arm64`) on the
# dedicated Apple Silicon runner (tag: arm64, Max1-Runner-Visiban, id
# 56802474) — a SHELL executor against that runner's own Docker Desktop
# daemon, whose VM is itself arm64, so the build is NATIVE with no QEMU. This
# is the same shape TruePPM uses (`.docker-publish-arm64-base`). A prior
# attempt at this in the same GitLab-SaaS-arm64-runner shape kaniko amd64 uses
# hit `no_matching_runner` (verified on pipeline 2845582400) — this project's
# GitLab plan has no usable SaaS arm64 runner, hence the dedicated host.
#
# A `*-manifest` job per image assembles the amd64 (kaniko) and arm64 (native)
# single-arch images — each pushed under a `-amd64`/`-arm64` suffixed tag on
# BOTH registries, since a manifest list can only reference digests in its own
# repository — into the real `:<tag>`, `:latest`, and (for stable releases)
# `:MAJOR.MINOR` tags as proper multi-arch manifest lists, via `manifest-tool`.
#
# Fail-loud, not hang: a `no_matching_runner` job sits pending forever rather
# than failing, which would silently hang a release pipeline (the exact
# failure mode this design avoided re-introducing the first time). Rather than
# rely on a job `timeout:` (does not cover pending/queue time — see
# docs/maintainers/ci-runners.md), `arm64-runner-preflight` below queries the
# GitLab Runners API directly for an online runner tagged `arm64` and fails
# within seconds if none is found, before either arm64 leg is even scheduled.
#
# On main-branch merges: :latest and :<short-sha> to the GitLab registry
# (amd64 only — arm64 and the manifest jobs run on release tags only, see
# their `rules:`).
# On release tags: this leg pushes only arch-suffixed intermediate tags (see
# the destinations() comment below) — the real :<tag>, :latest, and (for
# stable releases) :MAJOR.MINOR alias are written exclusively by
# `*-manifest`, on both the GitLab registry and GHCR, as multi-arch
# (linux/amd64 + linux/arm64) manifest lists.

.kaniko-push-common:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      # Assemble a docker config covering every registry a push job may touch:
      # the GitLab registry (push), GHCR (push on tags), the GitLab Dependency
      # Proxy (pull — the Dockerfiles' base images now resolve through it via
      # --build-arg BASE_REGISTRY, #1198), and Docker Hub directly as a
      # fallback. Each entry is added only when its credentials are present,
      # so a fork without GHCR_TOKEN still builds and pushes to its own
      # registry.
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      # CI_DEPENDENCY_PROXY_SERVER is empty on a project with no working group
      # Dependency Proxy (e.g. a personal-namespace fork) — guarded so that
      # case doesn't inject an empty-keyed auth entry.
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        AUTHS="${AUTHS},\"${CI_DEPENDENCY_PROXY_SERVER}\":{\"auth\":\"$(b64 "${CI_DEPENDENCY_PROXY_USER}" "${CI_DEPENDENCY_PROXY_PASSWORD}")\"}"
      fi
      if [ -n "${GHCR_USER}" ] && [ -n "${GHCR_TOKEN}" ]; then
        AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      fi
      if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
        AUTHS="${AUTHS},\"https://index.docker.io/v1/\":{\"auth\":\"$(b64 "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}")\"}"
      fi
      printf '{"auths":{%s}}' "${AUTHS}" > /kaniko/.docker/config.json
    - |
      # Emit the --destination flags for one image. $1 = image name under
      # each registry root.
      #
      # Corrected 2026-09-28 (#1084 re-audit): this used to push the real,
      # unsuffixed `:<tag>`/`:latest`/`:MINOR` names directly on a release tag,
      # on BOTH registries, in addition to the `-amd64`-suffixed intermediate
      # tags — on the theory that `*-manifest` below would immediately
      # overwrite them with the real multi-arch manifest. It does, when the
      # arm64 leg succeeds. But `*-manifest` `needs:` the arm64 leg, so if
      # that leg (or `arm64-runner-preflight` above it) ever fails — which it
      # would have on the very next release tag after #1084 first merged, see
      # the token fix above; no tag had actually been cut yet when this was
      # caught — the amd64-only push here would have ALREADY landed under the
      # real tag names on both registries, including GHCR `:latest`, with
      # nothing to roll it back. The pipeline goes red; the bad image is
      # already live.
      #
      # Now: on a release tag, this leg pushes ONLY `-amd64`-suffixed
      # destinations, on both registries. `*-manifest` (which needs both this
      # job and the arm64 leg) is the ONLY thing that ever writes the real
      # `:<tag>`/`:latest`/`:MINOR` names — so a failed or skipped arm64 leg
      # leaves whatever was already published under those names (the previous
      # release, or the last main-branch merge's amd64 image) untouched,
      # rather than silently replacing it with an incomplete one.
      #
      # On an ordinary main-branch merge (no tag), nothing changes: plain
      # amd64-only :latest/:<short-sha> to the GitLab registry only — no
      # arm64 leg or manifest job runs off a branch push (see their `rules:`
      # — release tags only), so there is no multi-arch alternative to defer
      # to here, and GHCR is untouched by main-branch merges as before.
      destinations() {
        img="$1"
        if [ -n "${CI_COMMIT_TAG}" ]; then
          # Only the exact-tag `-amd64` destination — no `${MINOR}-amd64`
          # (removed 2026-09-28, #1084 re-audit): `*-manifest`'s
          # `manifest-tool` call below builds the multi-arch manifest from
          # `${TAG}-ARCH` sources only and aliases `:latest`/`:MINOR` onto
          # that SAME manifest via `--tags`, so a separate `${MINOR}-ARCH`
          # source was never read by anything — dead registry clutter.
          echo "--destination=${CI_REGISTRY_IMAGE}/${img}:${CI_COMMIT_TAG}-amd64"
          echo "--destination=ghcr.io/visiban/visiban/${img}:${CI_COMMIT_TAG}-amd64"
        else
          echo "--destination=${CI_REGISTRY_IMAGE}/${img}:latest"
          echo "--destination=${CI_REGISTRY_IMAGE}/${img}:${CI_COMMIT_SHORT_SHA}"
        fi
      }

backend-docker-push:
  extends: .kaniko-push-common
  needs: [backend-test-coverage]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      # shellcheck disable=SC2046 — word splitting is intended; one flag per line.
      /kaniko/executor \
        --context=backend \
        --dockerfile=backend/Dockerfile \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=${DOCKERHUB_MIRROR:-docker.io/library} \
        $(destinations backend)

frontend-docker-push:
  extends: .kaniko-push-common
  needs: [frontend-test]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      /kaniko/executor \
        --context=frontend \
        --dockerfile=frontend/Dockerfile \
        --snapshot-mode=redo \
        --build-arg NODE_OPTIONS=--max-old-space-size=512 \
        --build-arg BASE_REGISTRY=${DOCKERHUB_MIRROR:-docker.io/library} \
        $(destinations frontend)

# ─── Docker push — arm64 preflight (#1084) ────────────────────────────────────
#
# GitLab has no native "job has been pending too long with no runner" failure:
# a job `timeout:` only covers execution time once a runner has picked it up,
# not queue time. Without this job, a release tag pipeline whose one arm64
# runner (Max1-Runner-Visiban, id 56802474, tags: arm, arm64, apple, macosx,
# mac, ios) is offline would leave `backend-docker-push-arm64` /
# `frontend-docker-push-arm64` sitting `pending` indefinitely — exactly the
# `no_matching_runner` hang this feature was deliberately left out of !852 to
# avoid re-introducing.
#
# Queries the group Runners API directly (`GET /groups/visiban/runners`, same
# read the human-run `glab api "projects/visiban%2Fvisiban/runners?type=group_type"`
# in docs/maintainers/ci-runners.md approximates from the project side) and
# fails within seconds if no runner tagged `arm64` is online, before either
# arm64 leg is scheduled.
#
# Needs RUNNER_STATUS_TOKEN: a fine-grained PAT with the `read_runner`
# permission, scoped to the `visiban` group (id 126306686) — the Runners API
# is not part of GitLab's CI_JOB_TOKEN-allowed endpoint set, so a job token
# cannot make this call. See docs/maintainers/tokens-and-rotation.md.
#
# Corrected 2026-09-28: this job originally referenced a variable named
# RUNNERS_READ_TOKEN, which was never actually created — only RUNNER_STATUS_TOKEN
# (same purpose, described "ARM64") exists as a configured project variable. No
# release tag had been cut since #1084 first merged, so the mismatch had not
# yet failed a real pipeline, but the next one would have — this preflight would
# have skipped both arm64 legs and the manifest jobs silently (see the
# destinations() fix below for why that's worse than it sounds). Also corrected
# here: the query now hits `/groups/visiban/runners`, not
# `/projects/${CI_PROJECT_ID}/runners` — RUNNER_STATUS_TOKEN's `read_runner`
# grant is scoped to the group, not the project, and verified directly
# (`glab api "groups/visiban/runners?tag_list=arm64"` returns
# Max1-Runner-Visiban) against the endpoint this job actually calls.
#
# Do NOT use the runner's reported `architecture` field to sanity-check
# anything beyond "is it online" — `Max1-Runner-Visiban` reports `amd64`
# there because the gitlab-runner binary runs under Rosetta, despite the
# host and every image it builds being genuinely native arm64.
arm64-runner-preflight:
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    - apk add --no-cache bash curl jq
  script:
    # The arm64 legs source scripts/docker-push-retry.sh rather than invoke it;
    # its daemon-free self-test runs here, ahead of them (gate-selftest-parity).
    - bash scripts/docker-push-retry.sh --self-test
    - |
      # `set -eu` only, not `-o pipefail` — alpine's default /bin/sh (busybox
      # ash) doesn't support that option and errors out immediately on it,
      # matching every other inline script in this file (none use pipefail).
      set -eu
      if [ -z "${RUNNER_STATUS_TOKEN:-}" ]; then
        echo "ERROR: RUNNER_STATUS_TOKEN not set — cannot verify an arm64 runner is online"
        echo "before scheduling the arm64 build jobs. Configure a fine-grained PAT with the"
        echo "read_runner permission, scoped to the visiban group, under Settings -> CI/CD ->"
        echo "Variables (Masked + Protected). See docs/maintainers/tokens-and-rotation.md."
        exit 1
      fi
      ONLINE_ARM64="$(curl -sSf --header "PRIVATE-TOKEN: ${RUNNER_STATUS_TOKEN}" \
        "${CI_API_V4_URL}/groups/visiban/runners?scope=online&tag_list=arm64" \
        | jq 'map(select(.online == true)) | length')"
      if [ "${ONLINE_ARM64:-0}" -lt 1 ]; then
        echo "ERROR: no online runner tagged 'arm64' found (expected Max1-Runner-Visiban,"
        echo "id 56802474). Without this check, backend-docker-push-arm64 /"
        echo "frontend-docker-push-arm64 would sit pending forever (no_matching_runner)"
        echo "and hang this release pipeline instead of failing."
        echo "Bring the runner online — see docs/maintainers/ci-runners.md — then re-run"
        echo "this pipeline."
        exit 1
      fi
      echo "OK: ${ONLINE_ARM64} online runner(s) tagged arm64."

# ─── Docker push — arm64 native leg (#1084) ────────────────────────────────────
#
# Runs on the dedicated Apple Silicon macOS runner (tag: arm64) under the
# SHELL executor — no `image:`/`services:` (meaningless under a shell
# executor) and no dind, matching TruePPM's `.docker-publish-arm64-base`
# shape. Builds against that runner's own already-running Docker Desktop,
# whose VM is itself arm64, producing a NATIVE linux/arm64 image with no
# QEMU emulation.
#
# `--provenance=false --sbom=false`: Docker Desktop's BuildKit otherwise
# attaches a provenance/SBOM attestation even to a single-platform build,
# turning the pushed `-arm64` tag into a small manifest list rather than a
# plain image manifest. `manifest-tool`'s `--template`/`--platforms`
# substitution (in `*-manifest` below) expects a plain per-platform manifest
# at each source tag, so this keeps the arm64 leg's output in that shape.
#
# Pushes ONLY the `-arm64`-suffixed tag, to BOTH registries (a manifest list
# can only reference digests in its own repository) — `*-manifest` assembles
# the real `:<tag>` / `:latest` / `:MINOR` tags from this plus the amd64 leg's
# `-amd64`-suffixed tag. `resource_group` serializes the backend/frontend legs
# since both run against the one physical host's Docker Desktop daemon.
# `after_script` always logs out and removes the tags this job pushed, so the
# arch-suffixed images and registry credentials don't linger on the shared
# host daemon between releases. This now includes the GitLab Dependency Proxy
# login taken in before_script below (#1204, follow-up to #1198's
# DOCKERHUB_MIRROR rollout) — the arm64 Dockerfile builds pull their base
# images through the same proxy the amd64 kaniko legs use.
.arm64-docker-push-base:
  stage: deploy
  tags: [arm64]
  resource_group: arm64-docker-build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    - |
      set -eu
      if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — the arm64 leg pushes to GHCR too"
        echo "(a manifest list can only reference digests in its own repository), so"
        echo "this cannot proceed silently."
        exit 1
      fi
      # --password-stdin, never -p: on this persistent shared host a password in
      # argv is readable via `ps` by anything else running there (#1205).
      printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
      printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
      # Base images now resolve through DOCKERHUB_MIRROR (#1198) via
      # --build-arg BASE_REGISTRY in each job's script below — the GitLab
      # Dependency Proxy on a project where it's enabled — so this persistent
      # shell runner needs its own proxy login too, same convention as the
      # kaniko jobs' /kaniko/.docker/config.json and .helm-drill-base (see
      # docs/maintainers/ci-runners.md#dependency-proxy), just via `docker
      # login` since this is a real Docker daemon rather than kaniko's
      # credential file. Guarded on CI_DEPENDENCY_PROXY_SERVER being
      # non-empty: it's empty on a project with no working group Dependency
      # Proxy (e.g. a personal-namespace fork), where DOCKERHUB_MIRROR's shell
      # fallback below already sends the build straight to docker.io/library
      # and needs no login. This fails loud rather than degrading silently: if
      # the proxy variable IS set but the login itself fails (expired/bad
      # credential), that's a real misconfiguration on a project that expects
      # the proxy to work — better to stop the release here than let this leg
      # quietly fall through to an anonymous docker.io pull mid-build and risk
      # the #1198 rate limit, or worse, push a base image the amd64 kaniko leg
      # never used.
      if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ]; then
        printf '%s' "${CI_DEPENDENCY_PROXY_PASSWORD}" | docker login "${CI_DEPENDENCY_PROXY_SERVER}" -u "${CI_DEPENDENCY_PROXY_USER}" --password-stdin
      fi

backend-docker-push-arm64:
  extends: .arm64-docker-push-base
  needs:
    - job: arm64-runner-preflight
    - job: backend-test-coverage
  script:
    - |
      set -eu
      TAG="${CI_COMMIT_TAG}"
      GL_REF="${CI_REGISTRY_IMAGE}/backend:${TAG}-arm64"
      GH_REF="ghcr.io/visiban/visiban/backend:${TAG}-arm64"
      . "${CI_PROJECT_DIR}/scripts/docker-push-retry.sh"
      docker build \
        --provenance=false \
        --sbom=false \
        --file backend/Dockerfile \
        --build-arg BASE_REGISTRY="${DOCKERHUB_MIRROR:-docker.io/library}" \
        --tag "${GL_REF}" \
        backend
      ARCH="$(docker image inspect "${GL_REF}" --format '{{.Architecture}}')"
      if [ "${ARCH}" != "arm64" ]; then
        echo "ERROR: built image reports architecture '${ARCH}', expected arm64."
        echo "This runner may no longer be the Apple Silicon host — see docs/maintainers/ci-runners.md."
        exit 1
      fi
      push_with_retry "${GL_REF}"
      docker tag "${GL_REF}" "${GH_REF}"
      push_with_retry "${GH_REF}"
  after_script:
    - docker rmi "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_TAG}-arm64" "ghcr.io/visiban/visiban/backend:${CI_COMMIT_TAG}-arm64" 2>/dev/null || true
    - docker logout "${CI_REGISTRY}" || true
    - docker logout ghcr.io || true
    # Tolerates never having logged in (e.g. a fork with no group Dependency
    # Proxy, where the before_script login above was skipped) — `|| true`
    # covers both "not logged in" and any other logout failure, so a proxy
    # credential never lingers on this persistent shared host (#1204).
    - '[ -z "${CI_DEPENDENCY_PROXY_SERVER:-}" ] || docker logout "${CI_DEPENDENCY_PROXY_SERVER}" || true'

frontend-docker-push-arm64:
  extends: .arm64-docker-push-base
  needs:
    - job: arm64-runner-preflight
    - job: frontend-test
  script:
    - |
      set -eu
      TAG="${CI_COMMIT_TAG}"
      GL_REF="${CI_REGISTRY_IMAGE}/frontend:${TAG}-arm64"
      GH_REF="ghcr.io/visiban/visiban/frontend:${TAG}-arm64"
      . "${CI_PROJECT_DIR}/scripts/docker-push-retry.sh"
      docker build \
        --provenance=false \
        --sbom=false \
        --file frontend/Dockerfile \
        --build-arg NODE_OPTIONS=--max-old-space-size=512 \
        --build-arg BASE_REGISTRY="${DOCKERHUB_MIRROR:-docker.io/library}" \
        --tag "${GL_REF}" \
        frontend
      ARCH="$(docker image inspect "${GL_REF}" --format '{{.Architecture}}')"
      if [ "${ARCH}" != "arm64" ]; then
        echo "ERROR: built image reports architecture '${ARCH}', expected arm64."
        echo "This runner may no longer be the Apple Silicon host — see docs/maintainers/ci-runners.md."
        exit 1
      fi
      push_with_retry "${GL_REF}"
      docker tag "${GL_REF}" "${GH_REF}"
      push_with_retry "${GH_REF}"
  after_script:
    - docker rmi "${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_TAG}-arm64" "ghcr.io/visiban/visiban/frontend:${CI_COMMIT_TAG}-arm64" 2>/dev/null || true
    - docker logout "${CI_REGISTRY}" || true
    - docker logout ghcr.io || true
    # See backend-docker-push-arm64's after_script above.
    - '[ -z "${CI_DEPENDENCY_PROXY_SERVER:-}" ] || docker logout "${CI_DEPENDENCY_PROXY_SERVER}" || true'

# ─── Docker push — manifest assembly (#1084) ───────────────────────────────────
#
# Combines the amd64 (kaniko, `-amd64`-suffixed) and arm64 (native leg above,
# `-arm64`-suffixed) single-arch images into real multi-arch manifest lists
# under `:<tag>`, `:latest`, and (for stable releases) `:MAJOR.MINOR`, on both
# the GitLab registry and GHCR. `manifest-tool push from-args --template
# <repo>:<tag>-ARCH --target <repo>:<tag> --tags latest[,MINOR]` was verified
# to expand this tag set correctly.
#
# `manifest-tool` reads registry credentials from an existing Docker client
# config file (its 3rd, non-interactive auth option) — built the same way
# `.kaniko-push-common` builds one, so no `docker` CLI/daemon is needed here;
# a plain `alpine` image suffices.
#
# Binary is fetched as a version-pinned, checksum-verified release tarball
# (matching this file's Cosign/Trivy/Syft/manifest-tool-elsewhere pinning
# convention) rather than piping an install script through `sh`. The tarball's
# internal layout isn't part of the pin — only its sha256 is — so the
# linux-amd64 binary is located defensively rather than assumed at a
# hardcoded path.
.manifest-tool-common:
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    - apk add --no-cache curl tar
    - |
      set -eu
      MANIFEST_TOOL_VERSION=2.2.2
      MANIFEST_TOOL_SHA256=bdca525326694849594ab3ba63638fdb664690c9384df947bd3cff943d14736b
      curl -sSfL "https://github.com/estesp/manifest-tool/releases/download/v${MANIFEST_TOOL_VERSION}/binaries-manifest-tool-${MANIFEST_TOOL_VERSION}.tar.gz" -o /tmp/manifest-tool.tar.gz
      echo "${MANIFEST_TOOL_SHA256}  /tmp/manifest-tool.tar.gz" | sha256sum -c -
      mkdir -p /tmp/manifest-tool-extracted
      tar xzf /tmp/manifest-tool.tar.gz -C /tmp/manifest-tool-extracted
      MT_BIN="$(find /tmp/manifest-tool-extracted -type f -name '*linux-amd64*' | head -1)"
      if [ -z "${MT_BIN}" ]; then
        echo "ERROR: no linux-amd64 binary found in the manifest-tool release tarball. Contents:"
        find /tmp/manifest-tool-extracted -type f
        exit 1
      fi
      cp "${MT_BIN}" /usr/local/bin/manifest-tool
      chmod +x /usr/local/bin/manifest-tool
    - |
      set -eu
      if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot assemble the GHCR manifest list."
        exit 1
      fi
      mkdir -p /root/.docker
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      printf '{"auths":{%s}}' "${AUTHS}" > /root/.docker/config.json

backend-manifest:
  extends: .manifest-tool-common
  needs:
    - job: backend-docker-push
    - job: backend-docker-push-arm64
  script:
    - |
      set -eu
      IMG="backend"
      TAG="${CI_COMMIT_TAG}"
      TAGS_ARG="latest"
      if echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        MINOR="$(echo "${TAG}" | grep -oE '^v[0-9]+\.[0-9]+' | tr -d 'v')"
        TAGS_ARG="latest,${MINOR}"
      fi
      for REG in "${CI_REGISTRY_IMAGE}" "ghcr.io/visiban/visiban"; do
        manifest-tool push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "${REG}/${IMG}:${TAG}-ARCH" \
          --target "${REG}/${IMG}:${TAG}" \
          --tags "${TAGS_ARG}"
      done

frontend-manifest:
  extends: .manifest-tool-common
  needs:
    - job: frontend-docker-push
    - job: frontend-docker-push-arm64
  script:
    - |
      set -eu
      IMG="frontend"
      TAG="${CI_COMMIT_TAG}"
      TAGS_ARG="latest"
      if echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        MINOR="$(echo "${TAG}" | grep -oE '^v[0-9]+\.[0-9]+' | tr -d 'v')"
        TAGS_ARG="latest,${MINOR}"
      fi
      for REG in "${CI_REGISTRY_IMAGE}" "ghcr.io/visiban/visiban"; do
        manifest-tool push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "${REG}/${IMG}:${TAG}-ARCH" \
          --target "${REG}/${IMG}:${TAG}" \
          --tags "${TAGS_ARG}"
      done

# ─── Helm — publish chart to GHCR (release tags) ─────────────────────────────
#
# The chart is the deployment path docs/getting-started/kubernetes.md recommends
# for production, and until #1116 it was published nowhere: operators had to
# `git clone` the repo to install it. The backend and frontend images already go
# to ghcr.io/visiban/visiban on a release tag; the chart now goes with them, as
# an OCI artifact, so `helm install oci://ghcr.io/visiban/charts/visiban` works.
#
# Cosign-signed keyless (Sigstore via SIGSTORE_ID_TOKEN), so an operator can
# `cosign verify` the chart they pull rather than trusting the registry.
#
# Credentials: GHCR_USER + GHCR_TOKEN (the existing `visiban-ghcr-push` PAT,
# scope write:packages). Missing credentials FAIL this job rather than skipping
# it — a release that silently ships no chart is the failure mode this job
# exists to prevent.

helm-publish:
  stage: deploy
  image:
    name: ${DOCKERHUB_MIRROR}/alpine/helm:3.16.4
    entrypoint: [""]
  # needs the manifest jobs (added 2026-09-28, #1084 re-audit): the chart's
  # appVersion check below only confirms Chart.yaml matches the release tag,
  # not that an image actually exists at that tag on GHCR. Before this, a
  # failed/skipped arm64 leg could leave the real :<tag> image unpublished
  # while this job still ran unconditionally, signed, and pushed a chart
  # pointing at an image reference that doesn't exist — the same "published
  # something that points at nothing" failure class this whole branch fixes,
  # just one hop further downstream (see backend-manifest/frontend-manifest).
  #
  # docs-version-accuracy is included here too, deliberately: before this
  # `needs:` existed, this job (stage: deploy) implicitly wouldn't start
  # until every `stage: lint` job — including docs-version-accuracy, which
  # exists "so a bad release is caught at tag time" — had passed, via
  # GitLab's default stage ordering. Adding an explicit `needs:` list
  # replaces that implicit ordering rather than adding to it, so leaving
  # docs-version-accuracy off here would have silently dropped a gate this
  # job used to have.
  needs: [backend-manifest, frontend-manifest, docs-version-accuracy]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache bash curl
    # Pinned and checksum-verified: an unpinned signing tool is a supply-chain
    # hole in the job whose whole purpose is supply-chain provenance.
    - |
      COSIGN_VERSION=2.4.3
      COSIGN_SHA256=caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708
      curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
      echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
  script:
    - |
      if [ -z "${GHCR_USER}" ] || [ -z "${GHCR_TOKEN}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot publish the Helm chart."
        echo "Configure both under Settings → CI/CD → Variables (Masked + Protected) before tagging."
        exit 1
      fi
    # The chart's appVersion must match the tag being released. A chart that
    # ships pointing at the previous release's images is #1038's root cause
    # (a chart two minor versions stale), and it is invisible until someone
    # installs it.
    - |
      APP_VERSION="$(helm show chart helm/visiban | awk '/^appVersion:/{print $2}' | tr -d '"')"
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: Chart.yaml appVersion ($APP_VERSION) does not match the release tag ($TAG_VERSION)."
        echo "Bump appVersion in helm/visiban/Chart.yaml before tagging."
        exit 1
      fi
      echo "appVersion check passed: $APP_VERSION"
    - printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
    # `helm registry login` above only populates Helm's own registry config —
    # it has no effect on cosign, which resolves registry auth through
    # go-containerregistry's default keychain (the Docker credential store).
    # Without this, `cosign sign` below fails closed with
    # "UNAUTHORIZED: authentication required" even though the push two lines
    # down succeeds — the two tools simply don't share a credential store
    # (#1284, first caught on v1.2.0-alpha.2 once #1268 let execution reach
    # this far for the first time).
    - printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "$GHCR_USER" --password-stdin
    - helm package helm/visiban --destination /tmp
    - |
      CHART_FILE="$(ls /tmp/visiban-*.tgz)"
      CHART_NAME="$(helm show chart helm/visiban | awk '/^name:/{print $2}')"
      helm push "$CHART_FILE" "oci://ghcr.io/visiban/charts" 2>&1 | tee /tmp/helm-push.log
      # Sign the by-digest reference `helm push` reports, not the tag — a tag can
      # be moved, a digest cannot.
      CHART_DIGEST="$(awk '/Digest: /{print $2}' /tmp/helm-push.log)"
      cosign sign --yes "ghcr.io/visiban/charts/${CHART_NAME}@${CHART_DIGEST}"

# ─── GHCR manual push — REMOVED (2026-09-28, #1084 re-audit) ──────────────────
#
# `ghcr-push-backend` / `ghcr-push-frontend` used to push :latest to GHCR
# on demand (kaniko, amd64-only) via the play button on any pipeline's
# deploy stage. Removed: since #1084 restored multi-arch publishing, GHCR
# `:latest` is a real linux/amd64+arm64 manifest list between release tags
# (see the "Docker push" comment block above) — these jobs had no `rules:`
# restricting them to any particular pipeline, so clicking either one on
# ANY pipeline would silently overwrite that multi-arch manifest with a
# single-arch amd64 image, with no arm64 leg or manifest-assembly step to
# put it back. A manual job nobody remembers exists is exactly how that
# regression ships. There is no arch-safe on-demand equivalent yet — an
# on-demand GHCR push would need the same runner-preflight + per-arch +
# manifest-assembly shape as the real release path above, for a job whose
# entire reason to exist was being cheaper than that. If one is needed
# again, it must be arch-proofed the same way, not resurrected as a bare
# kaniko destination. See docs/maintainers/tokens-and-rotation.md for the
# GHCR_TOKEN rotation test this removal changes.
#
# `.gitlab/ghcr-push.yml`, a standalone alternate-config pipeline with the
# same amd64-only kaniko-to-`:latest` shape, was removed alongside these for
# the same reason — it wasn't included in this file's pipeline and no
# schedule targeted it, but a maintainer running it manually (CI/CD → Run
# pipeline → select that config file) would have hit the identical
# regression.

# ─── Scheduled — release image survival ───────────────────────────────────────
#
# TruePPM's beta-readiness audit #0 (🔴 URGENT, see #1074): a GitLab
# container-registry cleanup policy with no keep-regex deleted the released
# v0.3.0-alpha.3 backend/frontend images days after that release shipped —
# confirmed 404, no version-pinned install possible, rollback impossible. The
# publish jobs had gone green; the images vanished afterward, from a project
# setting that lives outside this repo and that no pipeline asserts. There is
# no commit to review and no job that goes red on its own when that happens —
# the only way to notice is to go look, on a schedule.
#
# Checks the newest vX.Y.Z release's backend/frontend images on BOTH
# registries Visiban publishes to (${CI_REGISTRY_IMAGE} and
# ghcr.io/visiban/visiban — see
# docs/administration/container-image-retention.md for the retention setting
# recorded on each). Runs on every scheduled pipeline, same slot helm-install
# and helm-netpol already use, so this needs no new schedule infrastructure.
# Deliberately NOT allow_failure (unlike those two): a self-hoster who cannot
# pull the version the docs told them to run has no working install, so a
# missing image is a release defect and must read red.
#
# `crane` (go-containerregistry) inspects manifests without a daemon or a
# pull — kaniko-free, matching the rest of this repo's registry tooling.
# Same docker-config auth shape as .kaniko-push-common, read-only here.
check-release-images:
  stage: deploy
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache bash git crane jq
    - |
      mkdir -p "$HOME/.docker"
      b64() { printf '%s:%s' "$1" "$2" | base64 | tr -d '\n'; }
      AUTHS="\"${CI_REGISTRY}\":{\"auth\":\"$(b64 "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}")\"}"
      if [ -n "${GHCR_USER}" ] && [ -n "${GHCR_TOKEN}" ]; then
        AUTHS="${AUTHS},\"ghcr.io\":{\"auth\":\"$(b64 "${GHCR_USER}" "${GHCR_TOKEN}")\"}"
      fi
      printf '{"auths":{%s}}' "${AUTHS}" > "$HOME/.docker/config.json"
    # Scheduled pipelines otherwise clone at the project's default depth,
    # which may not include every historical tag — fetch them explicitly so
    # resolve_latest_release_tag() sees the real newest release.
    - git fetch origin --tags --force
  script:
    - bash scripts/check-release-images.sh --self-test
    - bash scripts/check-release-images.sh

# ─── GitHub Release ────────────────────────────────────────────────────────────
#
# Runs only on version tag pipelines, after both images are confirmed pushed
# and (#1084) the multi-arch manifest lists assembled — so the GHCR references
# in the release notes already resolve to linux/amd64+arm64 by the time the
# release is visible.
# Reads release notes for the tag from CHANGELOG.md and creates a GitHub Release
# with GHCR image references appended. rc/beta/alpha tags are marked pre-release.
# GH_TOKEN CI variable (repo-scoped PAT) is passed through automatically.

github-release:
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  needs: [backend-docker-push, frontend-docker-push, backend-manifest, frontend-manifest]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  before_script:
    - apk add --no-cache github-cli
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
              | sed '/^[[:space:]]*$/d' | sed '/^---[[:space:]]*$/d')
      if [ -z "$NOTES" ]; then
        NOTES="See [CHANGELOG.md](https://gitlab.com/visiban/visiban/-/blob/main/CHANGELOG.md) for details."
      fi

      PRERELEASE_FLAG=""
      if echo "${CI_COMMIT_TAG}" | grep -qE '\-(rc|beta|alpha)\.'; then
        PRERELEASE_FLAG="--prerelease"
      fi

      NOTES_FILE=$(mktemp)
      printf '%s\n\n---\n\n**Docker images**\n\n```\nghcr.io/visiban/visiban/backend:%s\nghcr.io/visiban/visiban/frontend:%s\n```\n' \
        "$NOTES" "${CI_COMMIT_TAG}" "${CI_COMMIT_TAG}" > "$NOTES_FILE"

      gh release create "${CI_COMMIT_TAG}" \
        --repo "visiban/visiban" \
        --title "${CI_COMMIT_TAG}" \
        --notes-file "$NOTES_FILE" \
        ${PRERELEASE_FLAG}
      rm -f "$NOTES_FILE"

# ─── Docs — versioned with mike ───────────────────────────────────────────────
#
# mike manages a versioned MkDocs site on the gh-pages branch.
# Docs are deployed by scripts/release.sh as part of the release process.
#
# This CI job exists only as a manual recovery tool — e.g. if a release script
# run was interrupted after tagging but before mike deployed. To redeploy:
# CI/CD → Run pipeline on main → set DOCS_VERSION=<version tag> → play job.
# The docs content used is whatever is on main at the time of the manual trigger.
#
# After mike pushes to gh-pages, GitLab triggers a new pipeline on that branch.
# The "pages" job (which must be named exactly "pages") runs there, copies the
# branch content to public/, and GitLab Pages serves it at docs.visiban.com.
#
# Required CI/CD project variable (Settings → CI/CD → Variables):
#   DOCS_DEPLOY_TOKEN — a project access token with "write_repository" scope,
#                       used so mike can push to the gh-pages branch.
#                       Create at Settings → Access Tokens → role: Developer,
#                       scope: write_repository. Store as a masked variable.
#
# Added: 2026-03-13

docs-deploy:
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  needs: []
  variables:
    DOCS_VERSION: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet -r docs/requirements.txt
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    # Restore existing gh-pages history so mike can append to it.
    # Force-update in case a stale local branch exists from a previous job on the same runner.
    - git fetch origin gh-pages --depth=1 && (git branch -f gh-pages origin/gh-pages 2>/dev/null || git branch gh-pages origin/gh-pages) || true
  script:
    # Self-test runs first, per #1093's gate-selftest-parity rule.
    - bash scripts/resolve-docs-version.sh --self-test
    - |
      # Resolution + v-prefix normalization lives in a standalone script so
      # it's unit-testable (scripts/tests/resolve-docs-version.test.sh) —
      # see scripts/resolve-docs-version.sh for why normalization must be
      # unconditional across all three VERSION sources (#1270).
      if ! VERSION=$(scripts/resolve-docs-version.sh); then
        # Manual trigger from main without DOCS_VERSION set and no APP_VERSION found.
        echo "INFO: no version to deploy. Re-run with DOCS_VERSION=<tag> to publish docs."
        exit 0
      fi
      if echo "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
        MINOR=$(echo "$VERSION" | grep -oE '^v?[0-9]+\.[0-9]+')
        mike deploy --push --update-aliases "$VERSION" "${MINOR}" latest
        mike set-default --push "${MINOR}"
      else
        mike deploy --push --update-aliases "$VERSION" next
      fi
  rules:
    # Auto-deploy on version tags (pushed by scripts/release.sh)
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
      variables:
        DOCS_VERSION: $CI_COMMIT_TAG
    # Auto-deploy on main when docs content or mkdocs config changes
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - mkdocs.yml
      when: on_success
    # Manual recovery on main — set DOCS_VERSION in pipeline variables
    #
    # allow_failure: true is required here even though this is already a
    # manual job: when `when: manual` is set inside a `rules:` entry (as
    # opposed to bare at the job level), GitLab defaults allow_failure to
    # false, not true — so without this, an un-triggered docs-deploy blocks
    # main's pipeline from ever reporting "success", which shows as
    # "blocked"/manual (not green) on the pipeline widget and the
    # shields.io/GitLab pipeline badge. seed-demo-data and nightly-load-test
    # already set this explicitly for the same reason.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

# ─── Weekly CVE dependency scan ───────────────────────────────────────────────
#
# backend-dep-scan and frontend-dep-scan (defined in the security stage above)
# run on a weekly GitLab CI schedule with CVE_SCAN=true set as a schedule
# variable. Unlike their MR counterparts they use allow_failure: false, so a
# new HIGH/CRITICAL CVE causes the pipeline to fail and GitLab emails all
# maintainers who have "Failed pipeline" notifications enabled.
#
# To enable email notifications:
#   Profile → Notifications → Global notification level → "Watch"
#   or set per-project in Project → Notification settings → "Failed pipeline"
#
# The schedule itself is configured in GitLab: CI/CD → Schedules
#   Description : Weekly CVE scan
#   Interval    : 0 8 * * 1  (Mondays 08:00 UTC)
#   Target branch: main
#   Variables   : CVE_SCAN = true
#
# ─── Scheduled branch cleanup ─────────────────────────────────────────────────
#
# Deletes remote branches that have been fully merged into main.
# Runs on a GitLab CI schedule (e.g. weekly) — not on every push.
#
# Requires the same DOCS_DEPLOY_TOKEN variable used by docs-deploy
# (write_repository scope is sufficient to delete branches).
#
# Protected branches (main, gh-pages) are never touched — GitLab enforces
# this server-side regardless, but the grep exclude below makes the intent
# explicit. The gh-pages branch is managed by mike and must never be deleted.
#
# To configure the schedule: CI/CD → Schedules → New schedule → set branch
# to main and cron to "0 3 * * 1" (Mondays at 03:00 UTC).

cleanup-merged-branches:
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  needs: []
  before_script:
    - apk add --no-cache git
    - git config user.email "ci@visiban.com"
    - git config user.name "Visiban CI"
    - git remote set-url origin "https://oauth2:${DOCS_DEPLOY_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch --prune origin
  script:
    - |
      # grep -v exits 1 when no lines match (all merged branches already gone).
      # The || true prevents pipefail from killing the job in that success case.
      merged=$(git branch -r --merged origin/main \
        | { grep -v 'origin/main$\|origin/HEAD\|origin/gh-pages' || true; } \
        | sed 's|origin/||' \
        | xargs)
      if [ -z "$merged" ]; then
        echo "No merged branches to delete."
      else
        echo "Deleting: $merged"
        echo "$merged" | xargs git push origin --delete
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ─── Demo data seed ───────────────────────────────────────────────────────────
#
# Refreshes the Visiban Demo Board on the dedicated demo environment.
# Runs weekly via a GitLab CI schedule and can be triggered manually at any time.
#
# Setup:
#   1. Create a protected CI/CD variable DEMO_DATABASE_URL pointing to the demo
#      environment's PostgreSQL instance (Settings → CI/CD → Variables).
#   2. Create a GitLab schedule (CI/CD → Schedules) targeting main with cron
#      "0 4 * * 1" (Mondays at 04:00 UTC) and set variable SEED_SCHEDULE=true.
#
# The --wipe flag deletes the "Visiban Demo Board" and recreates it from scratch.
# --force overrides the DEBUG=False guard so the command runs in CI without DEBUG=True.
# Board-scoped wipe: only the demo board is deleted; all other data is untouched.
#
# PROTECTION: The "demo" environment must be configured as a protected environment
# in GitLab (Settings → CI/CD → Protected environments) so only maintainers can
# trigger this job. Without this, any developer with push access can wipe the demo board.

seed-demo-data:
  stage: deploy
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  environment:
    name: demo
    deployment_tier: staging
  variables:
    DATABASE_URL: $DEMO_DATABASE_URL
    REDIS_URL: $DEMO_REDIS_URL
    DJANGO_SECRET_KEY: $DEMO_SECRET_KEY
    DEBUG: "False"
    ALLOWED_HOSTS: "localhost"
    # Set SEED_VALUE in the schedule or manual trigger variables to use a custom
    # random seed. Leave unset to use the default (42).
    SEED_VALUE: ""
  before_script:
    # Fail fast with a clear message if the required CI/CD variables are missing.
    # Without these the job dies mid-pip-install with an unhelpful Django traceback.
    # Setup instructions: docs/administration/demo-data.md#required-gitlab-cicd-variables
    - |
      missing=""
      [ -z "$DJANGO_SECRET_KEY" ] && missing="$missing DEMO_SECRET_KEY"
      [ -z "$DATABASE_URL" ]      && missing="$missing DEMO_DATABASE_URL"
      [ -z "$REDIS_URL" ]         && missing="$missing DEMO_REDIS_URL"
      if [ -n "$missing" ]; then
        echo "ERROR: Required CI/CD variable(s) not set:$missing"
        echo "Add them at Settings → CI/CD → Variables (Protected + Masked, scoped to the 'demo' environment)."
        echo "See docs/administration/demo-data.md for full setup instructions."
        exit 1
      fi
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    # Use today's date (YYYYMMDD) as the random seed so each weekly refresh
    # produces a naturally varied board while remaining reproducible within
    # the same day. Override by setting SEED_VALUE in the CI schedule variables.
    - python manage.py seed_demo_data --wipe --force --seed ${SEED_VALUE:-$(date +%Y%m%d)}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SEED_SCHEDULE == "true"'
    - when: manual
      allow_failure: true

# ─── Seed export drift check ──────────────────────────────────────────────────
#
# Regenerates sample-boards/demo_board.{json,csv} and fails if they
# differ from the committed versions. Catches model changes that invalidate the
# static files. Run on MR pipelines when seed commands or models are touched.

seed-export-check:
  extends: .pip-cache
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py migrate --run-syncdb --no-input
    - python manage.py seed_demo_data --export
    - cd ..
    - |
      if ! git diff --exit-code sample-boards/demo_board.json sample-boards/demo_board.csv; then
        echo "ERROR: sample-boards/demo_board.{json,csv} are out of date. Run 'python manage.py seed_demo_data --export' and commit the result."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/boards/management/commands/seed_demo_data.py
        - sample-boards/demo_board.*

# ─── Nightly load test ─────────────────────────────────────────────────────────
#
# Measures p50/p95/p99 latency for the endpoints most sensitive to data volume
# and fails the pipeline if any exceeds its committed budget (#1082).
#
# Why this exists alongside perf-check/perf-bench: those two are both a
# query-COUNT check (static N+1 review and on-demand query counting) — neither
# can see a regression that keeps the query count and query text identical and
# just makes the same queries slower, which is the normal shape of a missing-
# index or data-volume regression. This job measures wall-clock latency
# directly, against a large seeded fixture, closing that gap. See
# docs/development/nightly-load-test.md for the full contract (fixture size,
# budget-derivation rule, how to re-derive at each release) and
# backend/nightly-load-test-baseline.json for the committed budgets.
#
# To configure the schedule: CI/CD → Schedules → New schedule → target branch
# main, cron "0 3 * * *" (daily at 03:00 UTC), variable LOAD_TEST_SCHEDULE=true.
# Can also be run manually at any time (advisory — allow_failure: true) via
# "Run pipeline" or the pipeline's manual job button.
nightly-load-test:
  extends: .pip-cache
  stage: test
  needs: []
  image: ${DOCKERHUB_MIRROR}/python:3.12-slim
  services:
    - name: ${DOCKERHUB_MIRROR}/postgres:17-alpine
      alias: postgres
    - name: ${DOCKERHUB_MIRROR}/valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: "${CI_POSTGRES_DB}"
    POSTGRES_USER: "${CI_POSTGRES_USER}"
    POSTGRES_PASSWORD: "${CI_POSTGRES_PASSWORD}"
    DATABASE_URL: "postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB}"
    REDIS_URL: "redis://valkey:6379/0"
    REDIS_CACHE_URL: "redis://valkey:6379/1"
    DJANGO_SECRET_KEY: "${CI_DJANGO_SECRET_KEY}"
    DEBUG: "True"
    ALLOWED_HOSTS: "localhost"
    # Swimlane-replication factor for seed_demo_data --scale — see that
    # command's docstring. 20 -> 200 swimlanes, ~2,400 cards, matching the
    # fixture backend/nightly-load-test-baseline.json's budgets were derived
    # against. Override in a manual pipeline run to test a different fixture
    # size without editing this file.
    LOAD_TEST_SCALE: "20"
    LOAD_TEST_ITERATIONS: "40"
    LOAD_TEST_WARMUP: "5"
    # CI-only file; provision_fuzz_token writes the raw PAT here (mode 0600),
    # never to job output — same pattern as backend-schema-fuzz.
    VISIBAN_LOAD_TEST_TOKEN_FILE: "/tmp/visiban_load_test_token"
  before_script:
    - pip install --quiet -r backend/requirements.txt
    - cd backend
    - python manage.py migrate --noinput
    # A dedicated, larger board — never the normal demo board — so this job's
    # fixture size is independent of and cannot collide with seed-demo-data's
    # weekly refresh of "Visiban Demo Board".
    - python manage.py seed_demo_data --force --scale ${LOAD_TEST_SCALE} --with-notifications
    - python manage.py provision_fuzz_token --username demo2 --token-file "${VISIBAN_LOAD_TEST_TOKEN_FILE}"
    - python manage.py runserver 0.0.0.0:8000 &
    # Poll liveness instead of a fixed sleep, same pattern as oidc-smoke /
    # backend-schema-fuzz.
    - |
      for i in $(seq 1 30); do
        python3 -c "import requests; requests.get('http://localhost:8000/api/health/liveness/', timeout=2)" \
          2>/dev/null && break
        sleep 1
      done
    - cd ..
  script:
    # Self-test immediately before the real invocation, same image (#1093) —
    # proves the percentile/budget-comparison detection logic still fires
    # before trusting this run's verdict.
    - python3 scripts/nightly_load_test.py --self-test
    - python3 scripts/nightly_load_test.py
        --base-url http://localhost:8000
        --token-file "${VISIBAN_LOAD_TEST_TOKEN_FILE}"
        --board-name "Visiban Load Test Board"
        --budget-file backend/nightly-load-test-baseline.json
        --iterations "${LOAD_TEST_ITERATIONS}"
        --warmup "${LOAD_TEST_WARMUP}"
        --output nightly-load-test-results.json
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - nightly-load-test-results.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LOAD_TEST_SCHEDULE == "true"'
    - when: manual
      allow_failure: true

# ─── Scheduled — pipeline schedule configuration audit ─────────────────────────
#
# #1213: nightly-load-test above required a manual, one-time GitLab UI step
# (CI/CD → Schedules → New schedule) that was never done, and nothing in this
# repo asserted it existed — the schedule is GitLab project configuration,
# not a file a diff touches. The gap sat unnoticed long enough for a real
# ~40% p95 regression to ship undetected. Same failure shape as
# check-release-images (#1074): config that lives outside the repo, that no
# commit touches and no job goes red on, so the only way to notice it
# drifting is to go and look, on a schedule.
#
# Derives the set of variables every `$CI_PIPELINE_SOURCE == "schedule" &&
# $VAR == "true"` rule in this file actually needs (never hardcoded — same
# reasoning as gate-selftest-parity) and fails, naming the variable, if no
# *active* GitLab pipeline schedule sets it. See scripts/check-pipeline-schedules.sh
# and docs/development/ci-gates.md.
#
# Runs on every scheduled pipeline, same slot check-release-images/
# helm-install/helm-netpol already use, so this needs no new schedule of its
# own to be exercised. Requires GITLAB_API_TOKEN (already configured for
# suppressions-check) with at least Reporter access to read pipeline
# schedules; fails open (warns, does not block) if that lookup is
# inconclusive rather than report a false MISSING.
#
# SCHEDULE_AUDIT_ACCEPTED_GAPS below lists gaps #1213's own audit already
# found and filed as #1232 — a documented, temporary exception (same shape as
# check-release-images' ACCEPTED_GAPS), not a way to quiet this gate
# permanently. Remove each entry as its schedule is created.
schedule-config-check:
  stage: lint
  needs: []
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    # SUPPRESSED-UNTIL(#1232): dep-scan-osv, seed-demo-data's weekly refresh,
    # and kaizen-yield-watch have never had a schedule configured either —
    # filed as its own issue rather than fixed here so #1213 stays scoped to
    # nightly-load-test. Remove each name as #1232 closes it.
    #
    # SUPPRESSED-UNTIL(#1369): sonar:scan's SONAR_SCHEDULED is new in this
    # commit. Creating the actual GitLab pipeline schedule (and the
    # SONAR_TOKEN variable) is a maintainer-only step listed under #1369's
    # "Maintainer follow-up" — remove SONAR_SCHEDULED from this list once
    # that schedule exists, so this gate starts asserting it stays configured.
    SCHEDULE_AUDIT_ACCEPTED_GAPS: "OSV_SCAN SEED_SCHEDULE KAIZEN_YIELD_WATCH SONAR_SCHEDULED"
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/check-pipeline-schedules.sh --self-test
    - bash scripts/check-pipeline-schedules.sh

# Runs on the gh-pages branch after docs-deploy pushes to it.
# Copies the branch content to public/ for GitLab Pages to serve.
# The job name must be exactly "pages" for GitLab Pages to pick it up.
pages:
  stage: deploy
  image: ${DOCKERHUB_MIRROR}/alpine:3.19
  needs: []
  script:
    - cp -r . public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages"'
