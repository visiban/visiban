# Hosted demo override (#1034) — try.visiban.com.
#
# Layered on top of the production stack; the root compose files are untouched:
#
#   docker compose -f docker-compose.prod.yml -f deploy/demo/docker-compose.demo.yml up -d
#
# What it changes:
#   * nginx is parked behind an unused profile — Caddy terminates TLS
#     (automatic Let's Encrypt) and reverse-proxies instead.
#   * caddy serves the built SPA from the shared frontend-dist volume and
#     proxies /api, /ws, /accounts, /_allauth, /static and /media to the
#     backend. /admin/ and /mcp are deliberately NOT exposed: the demo admin
#     password is public, so nothing beyond the app itself should be reachable.
#
# Demo settings (DEMO_MODE, passwords, ...) come from the repo-root .env — copy
# deploy/demo/.env.example there. Read deploy/demo/README.md first: this stack
# must run on its own dedicated host with its own database.

services:
  nginx:
    profiles: ["disabled-by-demo-override"]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    volumes:
      - ./deploy/demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend-dist:/srv:ro
      # Bind mounts (not named volumes) so the nightly `down -v` does not
      # discard the issued certificate — re-issuing every night would hit the
      # Let's Encrypt duplicate-certificate rate limit within a week.
      - ./deploy/demo/caddy-data:/data
      - ./deploy/demo/caddy-config:/config
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
