# Default values for visiban.

# -- Number of backend (Django) replicas
backendReplicaCount: 1

# -- Number of frontend (Nginx) replicas
frontendReplicaCount: 1

backend:
  image:
    repository: ghcr.io/visiban/visiban/backend
    pullPolicy: IfNotPresent
    tag: "v1.2.0-alpha.4"

  service:
    type: ClusterIP
    port: 8000

  # Django settings — override via --set or a values override file.
  # Sensitive values (secretKey, db credentials) go in the Secret; see below.
  settings:
    debug: "false"
    # Comma-separated list of allowed hosts / ingress hostnames. Rendered into
    # ALLOWED_HOSTS verbatim: the chart does NOT append localhost/127.0.0.1
    # (#1230). The first entry is also the Host header the chart's probes and
    # helm tests send. For `kubectl port-forward`, send the real Host header
    # (curl -H "Host: <your host>") rather than adding `localhost` here.
    allowedHosts: "visiban.example.com"
    # The render FAILS when allowedHosts has a catch-all or loopback entry --
    # exactly "*", "localhost", "localhost.localdomain", "ip6-localhost",
    # "127.0.0.1", "0.0.0.0", "[::ffff:127.0.0.1]", the IPv6 loopback or
    # unspecified address in any spelling ("[::1]", "::1", "[::]", ...), or a
    # leading-dot form of these (".localhost") (#1360): the frontend nginx
    # forwards any client Host, so such an
    # entry re-opens Host-header poisoning to anyone who reaches the Service.
    # Set true only if you knowingly need one (e.g. a browser on a
    # `kubectl port-forward`); NOTES.txt then lists the entries on every
    # install/upgrade. Refused when demo.enabled is true.
    allowUnsafeHosts: false
    # Comma-separated CORS origins for the frontend
    corsAllowedOrigins: "https://visiban.example.com"
    # Public URL of the frontend SPA — used by allauth for OAuth redirects.
    frontendUrl: "https://visiban.example.com"
    # Public hostname for OAuth callback URLs.
    siteDomain: "visiban.example.com"
    # Set to true to disable secure cookie flags (SESSION_COOKIE_SECURE,
    # CSRF_COOKIE_SECURE) and HSTS. Required when ingress.tls.enabled is false
    # AND there is no upstream TLS terminator setting X-Forwarded-Proto: https.
    forceInsecureCookies: false
    # Comma-separated list of CIDRs / single IPs that may reach /admin/.
    # Empty (default) restricts /admin/ to loopback only — use kubectl
    # port-forward to access. Example: "10.0.0.0/8,192.168.1.42".
    adminAllowedIPs: ""
    # Email verification mode — "optional", "mandatory", or "none".
    emailVerification: "optional"
    # Maximum accepted upload size, in bytes (attachments and board imports).
    # Wired to MAX_UPLOAD_SIZE_BYTES. The frontend nginx client_max_body_size
    # and the ingress proxy-body-size annotation are BOTH derived from this
    # (+10 MB of multipart framing headroom), so raising it raises the whole
    # path at once — see visiban.transportBodyLimitMB in _helpers.tpl.
    maxUploadSizeBytes: 10485760
    # Maximum Trello JSON export accepted by the board import wizard, in bytes
    # (default 25 MB). Wired to VISIBAN_IMPORT_MAX_SIZE. The transport limits
    # are derived from the LARGER of this and maxUploadSizeBytes.
    importMaxSizeBytes: 26214400
    # Number of reverse proxies in front of the backend that append to
    # X-Forwarded-For (NUM_PROXIES). Unset (null) keeps the backend default of
    # 1: the frontend nginx alone. Raise it only when another proxy sits in
    # front of the frontend Service, e.g. 2 behind a Cloudflare Tunnel
    # (values-demo.yaml). Too low and every client shares one throttle bucket;
    # too high and a client can choose its own via a spoofed header.
    numProxies: null

  # SMTP / email backend.  Required to send password reset and email
  # verification messages.  When backend == "console" emails are written to
  # stdout instead of sent (suitable for staging or air-gapped clusters).
  email:
    # "" | smtp | console | locmem.
    #
    # Empty (the default since 1.2) leaves EMAIL_BACKEND unset, so the backend
    # resolves email from the EMAIL_* values below OR from the configuration a
    # site admin saves in Admin → Settings → Email — whichever the admin
    # selects. Setting this to an explicit value PINS the backend and disables
    # that admin UI entirely, which is the right choice only when you
    # deliberately want env-only configuration (or a third-party relay backend).
    #
    # Translated to django.core.mail.backends.<x>.EmailBackend when non-empty.
    backend: ""
    host: ""
    port: 587
    user: ""
    useTls: true
    # Implicit TLS/SSL (port 465). Mutually exclusive with useTls.
    useSsl: false
    # Used as the From: address on outgoing mail. Must be a real address —
    # values containing "example.com" are rejected at chart-render time when a
    # host is configured. May be left empty if you intend to configure email
    # entirely from Admin → Settings → Email after the install.
    fromAddress: ""
    # Optional: name of a pre-existing Secret containing the SMTP password.
    # When set, the chart will not store password in its own Secret.
    existingSecret: ""
    passwordKey: "email-password"
    # Only used when existingSecret is empty.
    password: ""

  # OAuth provider credentials — leave empty to disable a provider
  oauth:
    google:
      clientId: ""
      clientSecret: ""
    github:
      clientId: ""
      clientSecret: ""
    gitlab:
      clientId: ""
      clientSecret: ""
    # Generic OIDC — for Keycloak, Authentik, Dex, Okta, or any OIDC-compliant IdP.
    # All three fields (serverUrl, clientId, clientSecret) must be set to enable.
    oidc:
      serverUrl: ""
      clientId: ""
      clientSecret: ""
      # Label shown on the login button (default: "SSO").
      providerName: "SSO"

  # Database migrations. Applied by the `migrate` init container on the backend
  # Deployment, which serializes concurrent replicas on a PostgreSQL advisory
  # lock (`manage.py migrate_with_lock`). Both waits are bounded so a stuck
  # deploy reports a named timeout instead of hanging silently.
  migrate:
    # Seconds to wait for the database to accept a connection. Covers a fresh
    # `helm install`, where PostgreSQL is still being scheduled and initialized
    # when this container first runs.
    connectTimeout: 300
    # Seconds to wait for another replica's in-flight migration to finish.
    # Raise it if your migrations legitimately take longer than this to apply.
    lockTimeout: 900

  # Persistent volume for user-uploaded media (attachments, avatars).
  mediaPersistence:
    enabled: true
    size: 5Gi
    # storageClassName: ""
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Pod- and container-level securityContext for the backend Deployment: its
  # migrate/collectstatic/bootstrap init containers and the app container.
  # Matches the hardening in templates/valkey.yaml (#1200) and
  # _helpers.tpl's demoSeedPodSpec (#1180) — see #1210. Passed straight
  # through with toYaml (open, like backend.resources above), so an operator
  # on a base image that cannot run as this numeric UID, or that needs a
  # writable root filesystem, can relax either block without forking the
  # chart.
  securityContext:
    pod:
      runAsNonRoot: true
      # The backend image's `visiban` user (backend/Dockerfile). Numeric
      # because the kubelet cannot verify runAsNonRoot against a user NAME.
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

frontend:
  image:
    repository: ghcr.io/visiban/visiban/frontend
    pullPolicy: IfNotPresent
    tag: "v1.2.0-alpha.4"

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Pod- and container-level securityContext for the frontend (nginx)
  # Deployment (#1224), matching the hardening in templates/valkey.yaml
  # (#1200) and backend.securityContext / postgresql.securityContext (#1210).
  # Passed straight through with toYaml (open, like backend.resources above),
  # so an operator on a base image that cannot run as this numeric UID, or
  # that needs a writable root filesystem, can relax either block without
  # forking the chart.
  #
  # nginx:1.27-alpine cannot bind its own listen port as this non-root user
  # without CAP_NET_BIND_SERVICE, which Docker/containerd's runc-based
  # runtimes do not grant an already-non-root process (the capability stays
  # out of the effective/ambient set — verified empirically, #1224). Rather
  # than add that capability back, the container listens on 8080 (see
  # templates/frontend-configmap.yaml and the frontend Service's named
  # `http` targetPort, which follows it automatically) — a non-privileged
  # port needs no capability at all. The Service's own port (80 by default,
  # frontend.service.port) is unaffected.
  securityContext:
    pod:
      runAsNonRoot: true
      # nginx:1.27-alpine's `nginx` user/group. Numeric because the kubelet
      # cannot verify runAsNonRoot against a user NAME.
      runAsUser: 101
      runAsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

ingress:
  enabled: true
  className: "nginx"
  # The nginx.ingress.kubernetes.io/proxy-body-size annotation is added
  # automatically from backend.settings.maxUploadSizeBytes / importMaxSizeBytes
  # (whichever is larger); set it here only to
  # override the derived value.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: visiban.example.com
  tls:
    enabled: false
    secretName: visiban-tls

# Secret values — prefer a gitignored values file (see values.secret.yaml.example)
# over --set to avoid leaking secrets in shell history and process lists.
# For production clusters, set existingSecret to a pre-created K8s Secret and
# leave djangoSecretKey at the default — the chart will not create its own Secret.
secret:
  # Name of a pre-existing Kubernetes Secret containing all backend credentials.
  # When set, the chart skips creating its own Secret and references this one instead.
  # The Secret must contain these keys: django-secret-key, database-url,
  # google-client-id, google-client-secret, github-client-id, github-client-secret,
  # gitlab-client-id, gitlab-client-secret. Add oidc-client-id and oidc-client-secret
  # if OIDC is enabled (OIDC_SERVER_URL is read from values, not the Secret). Add
  # email-password if backend.email.backend is "smtp" and backend.email.existingSecret
  # is empty. Keys for unused providers can be empty strings.
  existingSecret: ""
  # Django SECRET_KEY — only used when existingSecret is empty.
  # Generate with: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
  djangoSecretKey: "change-me-in-production"

# Built-in PostgreSQL subchart (bitnami/postgresql).
# Set enabled: false and supply externalDatabase to use an existing DB.
postgresql:
  enabled: true
  # subchartEnabled: true deploys the bitnami/postgresql subchart.
  # Disabled by default — Bitnami no longer publishes versioned tags to Docker Hub.
  # The chart instead deploys a StatefulSet using the official postgres image.
  subchartEnabled: false
  image: "postgres:17"
  auth:
    database: visiban
    username: visiban
    # Name of a pre-existing Secret containing the password (key: "password").
    # When set, the chart skips creating its own PostgreSQL Secret.
    existingSecret: ""
    # Only used when existingSecret is empty.
    password: "visiban"
  primary:
    persistence:
      enabled: true
      size: 5Gi
  # Pod- and container-level securityContext for the bundled PostgreSQL
  # StatefulSet, matching the hardening in templates/valkey.yaml (#1200) —
  # see #1210. Not read when subchartEnabled is true (the bitnami/postgresql
  # subchart owns its own security settings). An operator on a postgres image
  # that cannot run as this numeric UID, or that needs a writable root
  # filesystem, can relax either block without forking the chart.
  securityContext:
    pod:
      runAsNonRoot: true
      # The official postgres image's `postgres` user/group. Numeric because
      # the kubelet cannot verify runAsNonRoot against a user NAME.
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

# External database — used only when postgresql.enabled is false
externalDatabase:
  host: ""
  port: 5432
  database: visiban
  username: visiban
  password: ""

# Built-in Valkey (templates/valkey.yaml): a StatefulSet on the official,
# versioned valkey/valkey image. Valkey is the BSD-3, Linux Foundation fork of
# Redis; it speaks the same RESP wire protocol, so the backend's redis:// URLs
# and REDIS_URL env vars are unchanged.
# Set enabled: false and supply externalRedis.url to use an existing instance.
#
# Until chart 0.5.0 (#1200) this block configured the bitnami/valkey subchart,
# whose default image was the mutable bitnami/valkey:latest (Bitnami no longer
# publishes versioned tags), so every install silently drifted across Valkey
# majors. The keys below are the ones the chart's own template reads; the
# Service keeps the subchart's name (<release>-valkey-primary), so REDIS_URL
# does not change on upgrade. Other bitnami-only keys are no longer read — see
# "Bundled Valkey is no longer the Bitnami subchart" in
# docs/administration/upgrade.md.
valkey:
  enabled: true
  # Only "standalone" is supported. The backend only ever talked to the primary,
  # so the subchart's "replication" replicas were never used; the render fails
  # rather than silently dropping them.
  architecture: standalone
  image:
    # Official image. Keep the major in step with docker-compose.prod.yml so
    # Helm and Compose installs of one release run the same datastore major.
    # Never "latest" and never empty: scripts/helm-structure-check.sh fails any
    # rendered image without a pinned tag, and the render refuses both.
    repository: valkey/valkey
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  auth:
    # Password auth for the bundled Valkey (#1211). Off by default, so an
    # existing install is unchanged on upgrade; access is then restricted only
    # by NetworkPolicy (networkPolicy.enabled), which also needs a CNI that
    # enforces it. Recommended on, especially on a shared cluster.
    #
    # When true, set EXACTLY ONE of password or existingSecret — the render
    # fails on neither or both (there is no auto-generated password: it would
    # need `lookup` to survive `helm upgrade`, which GitOps renderers lack).
    # The password reaches pods only through a Secret: Valkey gets it as
    # --requirepass, and the backend percent-encodes it into REDIS_URL /
    # REDIS_CACHE_URL itself, so any character is safe — "/" and "@" included.
    # See "Bundled Valkey" in docs/getting-started/kubernetes.md.
    enabled: false
    # Chart-managed: stored in the <fullname>-valkey-auth Secret (visiban-valkey-auth
    # for a release named visiban, my-release-visiban-valkey-auth for my-release). Pass
    # it with --set-string or a values.secret.yaml file, never commit it.
    #   openssl rand -hex 32
    password: ""
    # Or a Secret you manage (the chart then renders none, and the password
    # never passes through Helm).
    #
    # Rotating either one restarts nothing on its own — there is deliberately
    # no checksum annotation, since a password hash on a pod is crackable by
    # anyone who can read pods. Afterwards run:
    #   kubectl rollout restart statefulset,deployment \
    #     -l 'app.kubernetes.io/instance=<release>,app.kubernetes.io/component in (valkey,backend)'
    existingSecret: ""
    # Key in existingSecret holding the password. Defaults to valkey-password.
    existingSecretPasswordKey: ""
  primary:
    persistence:
      # Off by default: Valkey holds only the Channels layer and the Django
      # cache, both rebuilt on their own. Enabling it keeps the AOF across pod
      # restarts in a PVC named data-<release>-valkey-0.
      enabled: false
      size: 1Gi
      # storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 150m
        memory: 192Mi
  # Appended to the server config (valkey.conf) after the chart's own
  # bind/port/dir lines.
  commonConfiguration: |-
    # Enable AOF https://valkey.io/topics/persistence/
    appendonly yes
    # Disable RDB persistence, AOF persistence already enabled.
    save ""

# External Valkey/Redis — used only when valkey.enabled is false.
# You must set both url and cacheUrl to valid (Valkey- or Redis-) connection
# strings. The values key stays `externalRedis` for backward compatibility.
externalRedis:
  url: ""
  cacheUrl: ""

# -- Network policies restrict pod-to-pod traffic to only the paths Visiban
# needs (ingress→frontend, frontend→backend, backend→postgres/valkey).
# Requires a CNI plugin that supports NetworkPolicy (Calico, Cilium, etc.).
networkPolicy:
  enabled: false

# -- Scheduled maintenance jobs (templates/cronjobs.yaml, #1157). One Kubernetes
# CronJob per enabled entry, each running a Django management command in the
# backend image with the backend's env and Secret.
#
# OFF by default, so upgrading the chart creates nothing and changes nothing.
# Turn it on with `scheduledJobs.enabled=true`: that alone schedules the two
# notification scans, which only act for users who switched the matching
# preference on. The two prune jobs DELETE data and stay off until enabled
# individually. If you already run any of these from host cron, remove that
# cron line when you enable the CronJob — two runs in the same minute can both
# pass the de-duplication check and notify twice.
scheduledJobs:
  enabled: false
  # IANA zone for every schedule below (CronJob .spec.timeZone, Kubernetes
  # 1.27+). Empty = the kube-controller-manager's zone, which is UTC on almost
  # every cluster. Visiban's own TIME_ZONE is UTC.
  timeZone: ""
  # Upper bound on one run; a job still running after this is killed and
  # marked failed rather than left hanging.
  activeDeadlineSeconds: 3600
  # Retries after a failed run before the Job is marked failed. Every command
  # here is idempotent, so one retry is safe.
  backoffLimit: 1
  # A run that could not start within this window (controller down, node
  # pressure) is skipped rather than started late.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # Finished Job objects (and their pod logs) are deleted after this long.
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # `args` are appended to `python manage.py <command>`, e.g. ["--days", "180"].
  notifyDueSoon:
    enabled: true
    schedule: "0 7 * * *"
    args: []
  notifyStaleCards:
    enabled: true
    schedule: "0 8 * * *"
    args: []
  # Deletes board change-feed events older than 30 days. The chart does not set
  # BOARD_EVENT_RETENTION_DAYS; change the window with args: ["--days", "N"].
  pruneBoardEvents:
    enabled: false
    schedule: "0 3 * * *"
    args: []
  # Deletes notifications older than 90 days (minimum 14). The chart does not
  # set NOTIFICATION_RETENTION_DAYS; change the window with args: ["--days", "N"].
  pruneNotifications:
    enabled: false
    schedule: "30 3 * * *"
    args: []

# -- Public demo mode (#1180): the chart side of a hosted, internet-facing demo
# such as try.visiban.com. OFF by default, and nothing below renders unless
# `demo.enabled` is true, so `helm upgrade` on an existing release changes
# nothing. Start from values-demo.yaml rather than switching this on by hand,
# and read "Public demo mode" in docs/administration/demo-data.md first.
#
# `demo.enabled` renders DEMO_MODE=true on every backend container, which arms
# the write fence (DemoModeMiddleware, #1179): every unsafe request is refused
# with 403 `demo_read_only` except sign-in/out and card-content edits. That
# fence is the security control. Everything else here (the reset, the egress
# policy, the quota) is containment around it.
#
# NEVER enable this on an instance holding real data: the seed hook and the
# reset CronJob EMPTY EVERY TABLE of the database (Django's flush) on every
# install, every upgrade and every scheduled run.
demo:
  enabled: false
  # The PUBLISHED visitor credential. It is printed on the login page by design
  # ("Explore the demo" signs in with it), so it is not a secret, but it still
  # reaches the pods through the chart's demo Secret. Both halves are required
  # when demo.enabled is true and refused when it is false (a published login
  # on a writable instance). username: letters, digits and . _ @ + - (max 150);
  # it must not be `admin`, `maya` or `jordan`, which the seed uses for other
  # accounts. password: 8-128 characters of letters, digits and
  # . _ @ + ~ ! * = : , ; ? - (the `helm test` hook sends it as JSON).
  loginHint:
    username: ""
    password: ""
  # The demo site admin's password. NEVER published and must differ from
  # loginHint.password; the fence refuses admin writes anyway. Required.
  adminPassword: ""
  # Password of the two seeded member accounts (maya, jordan). Not published.
  # Required.
  memberPassword: ""
  # The scheduled reset: the same seed as the install hook, on a timer. It
  # empties every table, so it also signs every visitor out; visitors are
  # warned on the login page and five minutes before. `schedule` is ALSO
  # rendered to the backend as DEMO_RESET_SCHEDULE, which drives the countdown
  # visitors see, so the two cannot drift. Only minute/hour cron fields are
  # supported (day, month and weekday must be `*`), and the CronJob always
  # runs in UTC because the backend computes the countdown in UTC. With
  # `enabled: false` the CronJob is not rendered and DEMO_RESET_SCHEDULE is
  # rendered EMPTY, so the login page stops promising a reset.
  reset:
    enabled: true
    schedule: "0 * * * *"
    # A slot the controller could not start within this window is skipped.
    startingDeadlineSeconds: 300
    # A run still going after this is killed and marked failed.
    activeDeadlineSeconds: 900
    backoffLimit: 1
    successfulJobsHistoryLimit: 1
    # Failed runs are KEPT so `kubectl logs job/...` can say why. A failed
    # reset leaves the previous (stale) demo data up; it never affects backend
    # readiness.
    failedJobsHistoryLimit: 3
  # The post-install/post-upgrade seed hook.
  seed:
    activeDeadlineSeconds: 900
    backoffLimit: 2
  # Resources of the seed hook and reset pods.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
  throttle:
    # DRF's `user` throttle scope counts per ACCOUNT, and every visitor shares
    # the one published account, so in demo mode it is a shared-fate ceiling
    # on the whole demo, not a per-visitor limit (TruePPM ADR-1197 D6). Empty
    # keeps the normal rate (5000/hour). Format: <n>/<second|minute|hour|day>.
    userRate: ""
  # Optional namespace guardrails for a demo sharing a node with other
  # workloads: a ResourceQuota capping the whole namespace, plus a LimitRange
  # that gives every container without its own requests/limits a default (a
  # quota on requests/limits rejects any pod that does not declare them).
  # Only enable this in a namespace dedicated to the demo release.
  resourceQuota:
    enabled: false
    hard:
      requests.cpu: "1"
      requests.memory: 2Gi
      limits.cpu: "6"
      limits.memory: 5Gi
      pods: "15"
    containerDefaults:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# `helm test <release>` connection probe (templates/tests/api-connection.yaml).
# Only instantiated by `helm test` — never deployed by install or upgrade.
tests:
  image:
    repository: curlimages/curl
    tag: "8.11.1"
  # Probe retries. Raise on a slow cluster where the rollout takes longer than
  # retries x 2s to admit the first backend pod.
  retries: 30
