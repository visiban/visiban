# Default values for visiban.

# -- Number of backend (Django) replicas
backendReplicaCount: 1

# -- Number of frontend (Nginx) replicas
frontendReplicaCount: 1

backend:
  image:
    repository: ghcr.io/visiban/visiban/backend
    pullPolicy: IfNotPresent
    tag: "v1.1.0"

  service:
    type: ClusterIP
    port: 8000

  # Django settings — override via --set or a values override file.
  # Sensitive values (secretKey, db credentials) go in the Secret; see below.
  settings:
    debug: "false"
    # Comma-separated list of allowed hosts / ingress hostnames
    allowedHosts: "visiban.example.com"
    # Comma-separated CORS origins for the frontend
    corsAllowedOrigins: "https://visiban.example.com"
    # Public URL of the frontend SPA — used by allauth for OAuth redirects.
    frontendUrl: "https://visiban.example.com"
    # Public hostname for OAuth callback URLs.
    siteDomain: "visiban.example.com"
    # Set to true to disable secure cookie flags (SESSION_COOKIE_SECURE,
    # CSRF_COOKIE_SECURE) and HSTS. Required when ingress.tls.enabled is false
    # AND there is no upstream TLS terminator setting X-Forwarded-Proto: https.
    forceInsecureCookies: false
    # Comma-separated list of CIDRs / single IPs that may reach /admin/.
    # Empty (default) restricts /admin/ to loopback only — use kubectl
    # port-forward to access. Example: "10.0.0.0/8,192.168.1.42".
    adminAllowedIPs: ""
    # Email verification mode — "optional", "mandatory", or "none".
    emailVerification: "optional"

  # SMTP / email backend.  Required to send password reset and email
  # verification messages.  When backend == "console" emails are written to
  # stdout instead of sent (suitable for staging or air-gapped clusters).
  email:
    # smtp | console | locmem.  Translated to django.core.mail.backends.<x>.EmailBackend
    backend: "smtp"
    host: ""
    port: 587
    user: ""
    useTls: true
    # Required when backend == "smtp".  Used as the From: address on outgoing
    # mail.  Must be a real address — values containing "example.com" are
    # rejected at chart-render time.
    fromAddress: ""
    # Optional: name of a pre-existing Secret containing the SMTP password.
    # When set, the chart will not store password in its own Secret.
    existingSecret: ""
    passwordKey: "email-password"
    # Only used when existingSecret is empty.
    password: ""

  # OAuth provider credentials — leave empty to disable a provider
  oauth:
    google:
      clientId: ""
      clientSecret: ""
    github:
      clientId: ""
      clientSecret: ""
    gitlab:
      clientId: ""
      clientSecret: ""
    # Generic OIDC — for Keycloak, Authentik, Dex, Okta, or any OIDC-compliant IdP.
    # All three fields (serverUrl, clientId, clientSecret) must be set to enable.
    oidc:
      serverUrl: ""
      clientId: ""
      clientSecret: ""
      # Label shown on the login button (default: "SSO").
      providerName: "SSO"

  # Persistent volume for user-uploaded media (attachments, avatars).
  mediaPersistence:
    enabled: true
    size: 5Gi
    # storageClassName: ""
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image:
    repository: ghcr.io/visiban/visiban/frontend
    pullPolicy: IfNotPresent
    tag: "v1.1.0"

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: visiban.example.com
  tls:
    enabled: false
    secretName: visiban-tls

# Secret values — prefer a gitignored values file (see values.secret.yaml.example)
# over --set to avoid leaking secrets in shell history and process lists.
# For production clusters, set existingSecret to a pre-created K8s Secret and
# leave djangoSecretKey at the default — the chart will not create its own Secret.
secret:
  # Name of a pre-existing Kubernetes Secret containing all backend credentials.
  # When set, the chart skips creating its own Secret and references this one instead.
  # The Secret must contain these keys: django-secret-key, database-url,
  # google-client-id, google-client-secret, github-client-id, github-client-secret,
  # gitlab-client-id, gitlab-client-secret. Add oidc-client-id and oidc-client-secret
  # if OIDC is enabled (OIDC_SERVER_URL is read from values, not the Secret). Add
  # email-password if backend.email.backend is "smtp" and backend.email.existingSecret
  # is empty. Keys for unused providers can be empty strings.
  existingSecret: ""
  # Django SECRET_KEY — only used when existingSecret is empty.
  # Generate with: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
  djangoSecretKey: "change-me-in-production"

# Built-in PostgreSQL subchart (bitnami/postgresql).
# Set enabled: false and supply externalDatabase to use an existing DB.
postgresql:
  enabled: true
  # subchartEnabled: true deploys the bitnami/postgresql subchart.
  # Disabled by default — Bitnami no longer publishes versioned tags to Docker Hub.
  # The chart instead deploys a StatefulSet using the official postgres image.
  subchartEnabled: false
  image: "postgres:17"
  auth:
    database: visiban
    username: visiban
    # Name of a pre-existing Secret containing the password (key: "password").
    # When set, the chart skips creating its own PostgreSQL Secret.
    existingSecret: ""
    # Only used when existingSecret is empty.
    password: "visiban"
  primary:
    persistence:
      enabled: true
      size: 5Gi

# External database — used only when postgresql.enabled is false
externalDatabase:
  host: ""
  port: 5432
  database: visiban
  username: visiban
  password: ""

# Built-in Redis subchart (bitnami/redis).
# Set enabled: false and supply externalRedis.url to use an existing instance.
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  image:
    tag: "7.4.3"
  master:
    persistence:
      enabled: false
  # Override the subchart default which tries to load modules not present
  # in the standard Bitnami Redis image (redisearch, rejson).
  commonConfiguration: |-
    # Enable AOF https://redis.io/topics/persistence#append-only-file
    appendonly yes
    # Disable RDB persistence, AOF persistence already enabled.
    save ""

# External Redis — used only when redis.enabled is false.
# You must set both url and cacheUrl to valid Redis connection strings.
externalRedis:
  url: ""
  cacheUrl: ""

# -- Network policies restrict pod-to-pod traffic to only the paths Visiban
# needs (ingress→frontend, frontend→backend, backend→postgres/redis).
# Requires a CNI plugin that supports NetworkPolicy (Calico, Cilium, etc.).
networkPolicy:
  enabled: false
