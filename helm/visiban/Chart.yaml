apiVersion: v2
name: visiban
description: Self-hosted Kanban board with customer swimlanes and card movement audit trail
type: application
version: 0.3.0
appVersion: "1.1.0"

dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.subchartEnabled
  - name: valkey
    version: "6.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: valkey.enabled
