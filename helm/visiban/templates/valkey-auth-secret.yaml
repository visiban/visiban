{{- /*
Bundled Valkey password (#1211). Rendered only when valkey.auth.enabled is true
and the password comes from valkey.auth.password — with
valkey.auth.existingSecret the operator owns the Secret and the chart renders
none, so the password never passes through Helm at all.

Its own Secret, not a key in the runtime Secret (visiban.secretName), so it is
chart-managed even when secret.existingSecret is set — the same reason the demo
Secret is separate.

`data` (base64), not `stringData`: the value still sits in the Helm release
like every chart-managed credential, but it does not appear as plaintext in
`helm template` / `helm get manifest` output, which is what operators paste into
issues and CI logs. Use valkey.auth.existingSecret to keep it out of the
release record entirely.
*/ -}}
{{- if and (include "visiban.valkeyAuthEnabled" .) (not .Values.valkey.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "visiban.valkeyAuthSecretName" . }}
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
type: Opaque
data:
  {{ include "visiban.valkeyAuthSecretKey" . }}: {{ .Values.valkey.auth.password | toString | b64enc | quote }}
{{- end }}
