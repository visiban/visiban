apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "visiban.fullname" . }}-nginx
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options           SAMEORIGIN always;
        add_header X-Content-Type-Options    nosniff always;

        # Transport body limit — derived from backend.settings.maxUploadSizeBytes
        # so the edge always accepts a request Django is still willing to reject
        # itself, with a message naming the real cap. A hardcoded limit below the
        # app cap 413s the upload here and Django never sees it.
        client_max_body_size {{ include "visiban.transportBodyLimitMB" . }}M;

        # Compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        # Proxy API and auth requests to the backend
        location /api/ {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_allauth/ {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # django-allauth browser-based OAuth callbacks (e.g. /accounts/google/login/callback/)
        location /accounts/ {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Attachment downloads — proxied through Django for auth and
        # board-membership checks. Django streams the file body via FileResponse
        # because the chart sets USE_X_ACCEL_REDIRECT=false (the frontend
        # container does not mount the media PVC, so X-Accel-Redirect from
        # Django to Nginx-on-frontend cannot serve the file).
        location /media/ {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Disable Nginx buffering so attachment downloads stream rather
            # than spool to disk first.
            proxy_buffering off;
        }

        # Django admin — restricted to loopback by default. Operators can grant
        # access from additional CIDRs/IPs via backend.settings.adminAllowedIPs.
        # Defense-in-depth: the same allowlist is enforced by Django middleware.
        # Without an allowlist, access via:
        #   kubectl port-forward svc/<release>-visiban-backend 8000:8000
        location /admin/ {
            allow 127.0.0.1;
            allow ::1;
            {{- if .Values.backend.settings.adminAllowedIPs }}
            {{- range $cidr := splitList "," .Values.backend.settings.adminAllowedIPs }}
            allow {{ trim $cidr }};
            {{- end }}
            {{- end }}
            deny all;

            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (Django Channels)
        # MCP (Model Context Protocol) server — only reachable when the backend
        # sets MCP_SERVER_ENABLED=true; otherwise Django 404s this path. The
        # Streamable HTTP transport holds a long-lived SSE response open, so
        # buffering is off and the read timeout matches /ws/ below. Without this
        # block /mcp would fall through to the SPA catch-all and never reach
        # Django.
        location /mcp {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location /ws/ {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # All other routes → React SPA
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
