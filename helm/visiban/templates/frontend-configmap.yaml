apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "visiban.fullname" . }}-nginx
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |
    # Cache policy for the SPA (#1633). Keyed on $uri, which nginx rewrites to
    # /index.html when try_files falls back, so SPA deep links (/boards/1) get
    # the same policy as /. Done with a map + one server-level add_header rather
    # than per-location add_header on purpose: any location that declares its own
    # add_header silently drops every server-level one (HSTS, CSP, X-Frame-Options),
    # and a map has no such side effect. An empty value emits no header at all, so
    # the proxied locations are untouched.
    #   - un-hashed entry files must be revalidated on every load, otherwise a
    #     browser keeps a stale index.html that names hashed bundles which no
    #     longer exist after a deploy and renders a blank page.
    #   - Vite's hashed /assets/* never change content under the same name.
    map $uri $visiban_cache_control {
        default                                              "";
        ~^/(index\.html|theme-init\.js|site\.webmanifest|favicon[^/]*|apple-touch-icon[^/]*|android-chrome-[^/]*)$   "no-cache";
        ~^/brand/                                            "no-cache";
        ~^/assets/                                           "public, max-age=31536000, immutable";
    }

    # Referrer-Policy fallback (#1531). Django sends its own Referrer-Policy on
    # every response (and a stricter `no-referrer` on the password-reset key
    # redirect, #1554). A server-level add_header would be appended to it and the
    # browser would honor the LAST header, silently weakening the stricter one.
    # So nginx only adds `same-origin` when the upstream sent none (static files,
    # the SPA); when Django set one the value here is empty, which emits no header,
    # and Django's passes through untouched.
    map $upstream_http_referrer_policy $visiban_referrer_policy {
        default "";
        ""      "same-origin";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # Non-privileged port — the frontend container runs as a non-root
        # user (#1224) that cannot bind <1024. The Service's own port (80 by
        # default, frontend.service.port) is unaffected: templates/
        # frontend-service.yaml targets this by the container's named `http`
        # port, not this number.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options           DENY always;
        add_header X-Content-Type-Options    nosniff always;
        add_header Referrer-Policy           $visiban_referrer_policy always;
        # Cache-Control per $visiban_cache_control (see map above); no `always`, so error
        # responses (e.g. a 404 under /assets/) are never marked cacheable.
        add_header Cache-Control $visiban_cache_control;
        # Content-Security-Policy: this ConfigMap and the bundled nginx templates
        # (nginx/app.conf.template) send the same policy; scripts/helm-structure-check.sh
        # compares them. See that file for the rationale behind each directive.
        # connect-src names the ingress host (with and without a port) for the
        # Channels WebSocket: wss:// when ingress TLS is on; both ws:// and wss://
        # when it is off, because an upstream TLS terminator is supported. With the
        # ingress disabled or no ingress.host set, only 'self' remains, which relies
        # on the browser mapping 'self' to ws/wss; set ingress.host if yours does
        # not. All of these are server-level on purpose: no location below declares
        # its own add_header, so none of them drops these by inheritance.
        {{- $wsSrc := "" }}
        {{- if and .Values.ingress.enabled .Values.ingress.host }}
        {{- $h := .Values.ingress.host }}
        {{- $wsSrc = printf " wss://%s wss://%s:*" $h $h }}
        {{- if not .Values.ingress.tls.enabled }}
        {{- $wsSrc = printf " ws://%s ws://%s:*%s" $h $h $wsSrc }}
        {{- end }}
        {{- end }}
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'{{ $wsSrc }}; font-src 'self'; frame-ancestors 'none'" always;

        # Transport body limit — derived from the larger of
        # backend.settings.maxUploadSizeBytes and importMaxSizeBytes
        # so the edge always accepts a request Django is still willing to reject
        # itself, with a message naming the real cap. A hardcoded limit below the
        # app cap 413s the upload here and Django never sees it.
        client_max_body_size {{ include "visiban.transportBodyLimitMB" . }}M;

        # Compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        # Proxy API and auth requests to the backend
        location /api/ {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # django-allauth browser-based OAuth callbacks (e.g. /accounts/google/login/callback/)
        location /accounts/ {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Attachment downloads — proxied through Django for auth and
        # board-membership checks. Django streams the file body via FileResponse
        # because the chart sets USE_X_ACCEL_REDIRECT=false (the frontend
        # container does not mount the media PVC, so X-Accel-Redirect from
        # Django to Nginx-on-frontend cannot serve the file).
        location /media/ {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Disable Nginx buffering so attachment downloads stream rather
            # than spool to disk first.
            proxy_buffering off;
        }

        # Django admin — restricted to loopback by default. Operators can grant
        # access from additional CIDRs/IPs via backend.settings.adminAllowedIPs.
        # Defense-in-depth: the same allowlist is enforced by Django middleware.
        # Without an allowlist, access via:
        #   kubectl port-forward svc/<release>-visiban-backend 8000:8000
        # (send a real Host header; a `localhost` allowedHosts entry also needs
        #  backend.settings.allowUnsafeHosts=true, #1360)
        location /admin/ {
            allow 127.0.0.1;
            allow ::1;
            {{- if .Values.backend.settings.adminAllowedIPs }}
            {{- range $cidr := splitList "," .Values.backend.settings.adminAllowedIPs }}
            allow {{ trim $cidr }};
            {{- end }}
            {{- end }}
            deny all;

            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (Django Channels)
        # MCP (Model Context Protocol) server — only reachable when the backend
        # sets MCP_SERVER_ENABLED=true (backend.settings.mcpServerEnabled);
        # otherwise Django 404s this path. The
        # Streamable HTTP transport holds a long-lived SSE response open, so
        # buffering is off and the read timeout matches /ws/ below. Without this
        # block /mcp would fall through to the SPA catch-all and never reach
        # Django.
        location /mcp {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location /ws/ {
            proxy_pass http://{{ include "visiban.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # Hashed build output. A missing file must be a real 404: falling
        # through to the SPA catch-all answers a stale index.html's asset requests
        # with 200 text/html, which browsers report as a module MIME-type error
        # and a blank page (#1633). Caching headers come from the server-level
        # add_header driven by $visiban_cache_control (not sent on 404).
        location /assets/ {
            try_files $uri =404;
        }

        # All other routes → React SPA
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
