{{- /*
Public demo mode passwords (#1180). Rendered only when demo.enabled.

  demo-login-password   the PUBLISHED visitor password (demo.loginHint.password).
                        Printed on the login page by design; it still travels as
                        a Secret so no pod spec carries a credential literal.
  demo-admin-password   the demo site admin's password. NEVER published.
  demo-member-password  the seeded member accounts' password. Not published.

Separate from the runtime Secret so it is chart-managed even when
secret.existingSecret is set, and so its checksum is its own pod annotation.
*/ -}}
{{- if include "visiban.demoEnabled" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "visiban.demoSecretName" . }}
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "visiban.demoSecretData" . | nindent 2 }}
{{- end }}
