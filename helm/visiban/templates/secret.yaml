{{- /*
Runtime Secret consumed by the backend Deployment, frontend (none) and any
post-install consumer. Contains the same data as the bootstrap Secret rendered
in secret-bootstrap.yaml — see the comment there for why both exist.
*/ -}}
{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "visiban.fullname" . }}
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "visiban.secretData" . | nindent 2 }}
{{- end }}
