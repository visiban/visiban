{{- /*
Bootstrap copy of the backend Secret, rendered as a pre-install / pre-upgrade
hook so it lands before the migrate Job runs. The runtime Secret in secret.yaml
is reconciled by Helm only after hooks complete, which means the migrate hook
would otherwise read the previous-revision value of every secret-backed env
var — making in-flight DJANGO_SECRET_KEY (or any other) rotation impossible.

Both Secrets render from the same `visiban.secretData` partial, so they always
contain identical data within a release.

The hook Secret is deleted after the upgrade completes successfully
(hook-delete-policy includes `hook-succeeded`); the runtime Secret remains as
the long-lived source consumed by the backend Deployment.

Skipped when secret.existingSecret is set — operators who manage the Secret
out of band must update it themselves before running `helm upgrade`.
*/ -}}
{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "visiban.bootstrapSecretName" . }}
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- include "visiban.secretData" . | nindent 2 }}
{{- end }}
