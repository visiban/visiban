apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "visiban.fullname" . }}-backend
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backendReplicaCount }}
  selector:
    matchLabels:
      {{- include "visiban.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or (not .Values.secret.existingSecret) (include "visiban.demoEnabled" .) }}
      annotations:
      {{- end }}
      {{- if not .Values.secret.existingSecret }}
        {{- /*
        Rotating a value in the chart-managed Secret changes no field of this pod
        template, so without this checksum `helm upgrade` would write the new
        Secret and leave every running pod on the old value — and the `migrate`
        init container, which only runs when a pod is CREATED, would never see
        the rotation at all. This annotation is what makes #1038 blocker 2 hold
        now that migrations run in the pod rather than in a hook Job that Helm
        re-created on every release (#1117).

        Omitted when secret.existingSecret is set: the chart does not render that
        Secret's contents, so it has nothing to checksum, and an operator who
        manages the Secret out of band restarts the Deployment out of band too.
        */}}
        checksum/secret: {{ include "visiban.secretData" . | sha256sum }}
      {{- end }}
      {{- if include "visiban.demoEnabled" . }}
        {{- /*
        Same reason as checksum/secret, for the demo Secret (#1180): the backend
        publishes DEMO_LOGIN_PASSWORD on the login page, so rotating
        demo.loginHint.password must replace the pods or the page keeps
        advertising the old password while the seed sets the new one.
        */}}
        checksum/demo-secret: {{ include "visiban.demoSecretData" . | sha256sum }}
      {{- end }}
      labels:
        {{- include "visiban.backend.selectorLabels" . | nindent 8 }}
    spec:
      # Hardening to match the bundled Valkey StatefulSet (templates/valkey.yaml,
      # #1200) and the demo seed pod spec (_helpers.tpl's demoSeedPodSpec,
      # #1180) — see #1210. Overridable: an operator on a base image that
      # cannot run as this numeric UID, or needs a writable root filesystem,
      # sets backend.securityContext.pod / .container in their values.
      automountServiceAccountToken: false
      securityContext:
        {{- include "visiban.backend.securityContext.pod" (.Values.backend.securityContext | default dict) | nindent 8 }}
      {{- if gt (int .Values.backendReplicaCount) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "visiban.backend.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      volumes:
        # Shared between the bootstrap init container and the backend container so
        # the one-time admin password file survives from bootstrap into the running pod.
        - name: admin-password
          emptyDir: {}
        # Scratch space for every container on this pod now that the root
        # filesystem is read-only (Python bytecode caching, DRF's temp upload
        # spool for uploads over FILE_UPLOAD_MAX_MEMORY_SIZE, etc.) — same
        # pattern as _helpers.tpl's demoSeedPodSpec.
        - name: tmp
          emptyDir: {}
        # `collectstatic` writes STATIC_ROOT (/app/staticfiles, settings.py)
        # inside its OWN init-container filesystem, not a filesystem shared
        # with the `backend` container — Kubernetes containers never share a
        # root filesystem without an explicit volume. That write already had
        # no effect on the running backend container before this change; this
        # volume only gives the command somewhere writable to point at now
        # that the root filesystem is read-only, and does not change that
        # pre-existing behavior. The pre-existing gap itself (Django admin's
        # static assets likely broken on Helm installs, since the backend
        # container never receives collectstatic's manifest) is tracked in
        # #1228, out of scope for #1210.
        - name: static
          emptyDir: {}
        {{- if .Values.backend.mediaPersistence.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "visiban.fullname" . }}-media
        {{- else }}
        - name: media
          emptyDir: {}
        {{- end }}
      initContainers:
        {{- /*
        Database migrations (#1117). An init container, NOT a Helm
        pre-install/pre-upgrade hook Job.

        Helm runs pre-install hooks BEFORE it creates any release resource, so a
        migrate hook on a fresh install resolved the bundled PostgreSQL Service
        before that Service existed: every `helm install` with the chart's own
        default values failed on "could not translate host name", unconditionally.
        An init container runs after Helm has applied the entire release, retries
        until the database answers, and reads the CURRENT runtime Secret — which
        is also what lets the bootstrap hook Secret go away.

        This runs before `bootstrap`, which needs migrated tables to exist, and
        before the app container, so no pod serves traffic against a schema that
        is still being changed.

        The concurrency the hook Job was chosen to avoid is handled by the
        command itself: `migrate_with_lock` serializes replicas on a
        session-scoped PostgreSQL advisory lock held on a dedicated connection.
        See backend/boards/management/commands/migrate_with_lock.py.
        */}}
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "manage.py", "migrate_with_lock"]
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
            - name: VISIBAN_MIGRATE_CONNECT_TIMEOUT
              value: {{ .Values.backend.migrate.connectTimeout | int | quote }}
            - name: VISIBAN_MIGRATE_LOCK_TIMEOUT
              value: {{ .Values.backend.migrate.lockTimeout | int | quote }}
          securityContext:
            {{- include "visiban.backend.securityContext.container" (.Values.backend.securityContext | default dict) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
        - name: collectstatic
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
          securityContext:
            {{- include "visiban.backend.securityContext.container" (.Values.backend.securityContext | default dict) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # See the `static` volume's note above: STATIC_ROOT needs to be
            # writable in THIS container only.
            - name: static
              mountPath: /app/staticfiles
        - name: bootstrap
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "manage.py", "ensure_site_admin"]
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
            - name: VISIBAN_ADMIN_PASSWORD_FILE
              value: /run/visiban/admin_password
          securityContext:
            {{- include "visiban.backend.securityContext.container" (.Values.backend.securityContext | default dict) | nindent 12 }}
          volumeMounts:
            - name: admin-password
              mountPath: /run/visiban
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "visiban.asgi:application"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
            - name: VISIBAN_ADMIN_PASSWORD_FILE
              value: /run/visiban/admin_password
          securityContext:
            {{- include "visiban.backend.securityContext.container" (.Values.backend.securityContext | default dict) | nindent 12 }}
          volumeMounts:
            - name: admin-password
              mountPath: /run/visiban
            - name: media
              mountPath: /app/media
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health/liveness/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health/readiness/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
