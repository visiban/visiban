apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "visiban.fullname" . }}-backend
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backendReplicaCount }}
  selector:
    matchLabels:
      {{- include "visiban.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "visiban.backend.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["gunicorn", "visiban.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/auth/user/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/auth/user/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
