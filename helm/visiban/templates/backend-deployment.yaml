apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "visiban.fullname" . }}-backend
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backendReplicaCount }}
  selector:
    matchLabels:
      {{- include "visiban.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "visiban.backend.selectorLabels" . | nindent 8 }}
    spec:
      volumes:
        # Shared between the bootstrap init container and the backend container so
        # the one-time admin password file survives from bootstrap into the running pod.
        - name: admin-password
          emptyDir: {}
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
        - name: bootstrap
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "manage.py", "ensure_site_admin"]
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
            - name: VISIBAN_ADMIN_PASSWORD_FILE
              value: /run/visiban/admin_password
          volumeMounts:
            - name: admin-password
              mountPath: /run/visiban
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "visiban.asgi:application"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
            - name: VISIBAN_ADMIN_PASSWORD_FILE
              value: /run/visiban/admin_password
          volumeMounts:
            - name: admin-password
              mountPath: /run/visiban
          livenessProbe:
            httpGet:
              path: /api/health/liveness/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health/readiness/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
