apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "visiban.fullname" . }}-frontend
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontendReplicaCount }}
  selector:
    matchLabels:
      {{- include "visiban.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "visiban.frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            {{- if .Values.backend.mediaPersistence.enabled }}
            - name: media
              mountPath: /app/media
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "visiban.fullname" . }}-nginx
        {{- if .Values.backend.mediaPersistence.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "visiban.fullname" . }}-media
            readOnly: true
        {{- end }}
