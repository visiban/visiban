{{- /*
Run `python manage.py migrate` exactly once per install/upgrade, before the
backend Deployment rolls out. Using a Helm pre-install/pre-upgrade hook Job
(instead of a per-pod init container) avoids the race where every backend
replica attempts to migrate concurrently in HA deployments — Postgres advisory
locks alone are not enough to guarantee safety for concurrent DDL.

The Job is re-created on every release (hook-delete-policy: before-hook-creation)
so a failed previous migration does not block the next attempt. `hook-weight: 0`
ensures it runs before any other hook; the backend Deployment starts only after
this Job completes successfully.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "visiban.fullname" . }}-migrate
  labels:
    {{- include "visiban.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "visiban.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            {{- include "visiban.backendEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
