<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board toolbar menus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#93c5fd}a:hover{color:#f8fafc}
</style>
</helmet>
<div style="--bg:#0f172a; --chrome:#0b1220; --panel:#1e293b; --chip:#334155; --line:#334155; --line-strong:#475569; --fg:#e2e8f0; --fg2:#cbd5e1; --fg3:#94a3b8; --strong:#f8fafc; --primary:#2563eb; --ok:#4ade80; --h:59,130,246; --sel:#60a5fa; --shadow:0 20px 50px rgba(0,0,0,0.6); background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.4; box-sizing: border-box; min-height: 100vh">

<nav aria-label="Board toolbar" style="background: var(--chrome); border-bottom: 1px solid var(--line); padding: 0 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px">
<div style="display: flex; gap: 2px">
<span aria-current="page" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; font-weight: 600; color: var(--strong); border-bottom: 2px solid var(--primary); margin-bottom: -1px">Board</span>
<a href="#summary" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; color: var(--fg2); text-decoration: none">Summary</a>
<a href="#history" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; color: var(--fg2); text-decoration: none">History</a>
<a href="#analytics" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; color: var(--fg2); text-decoration: none">Analytics</a>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; padding: 4px 0">
<button type="button" aria-expanded="true" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--sel); background: rgba(var(--h),0.22); color: var(--fg); font: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M6.5 12h3"/></svg>Filter <span style="background: var(--primary); color: #ffffff; border-radius: 999px; font-size: 11px; padding: 0 6px">2</span></button>
<button type="button" aria-expanded="true" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); font: inherit; display: inline-flex; align-items: center; gap: 8px; cursor: pointer">View<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 4.5l3.5 3.5 3.5-3.5"/></svg></button>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); font: inherit; cursor: pointer">Activity</button>
<button type="button" aria-label="More board actions" aria-expanded="true" style="width: 36px; height: 36px; border-radius: 6px; border: 0; background: var(--chip); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg></button>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); padding-left: 8px; border-left: 1px solid var(--line)"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: var(--ok)"></span>Live</span>
</div>
</nav>

<div role="search" aria-label="Board filters" style="background: var(--chrome); border-bottom: 1px solid var(--line); padding: 8px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="color: var(--fg3); font-size: 13px">Filtered by</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--chip); font-size: 13px">Label: Renewal<button type="button" aria-label="Remove filter Label: Renewal" style="width: 24px; height: 24px; border: 0; border-radius: 999px; background: transparent; color: var(--fg2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg></button></span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--chip); font-size: 13px">Swimlane: APAC<button type="button" aria-label="Remove filter Swimlane: APAC" style="width: 24px; height: 24px; border: 0; border-radius: 999px; background: transparent; color: var(--fg2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg></button></span>
<button type="button" style="height: 30px; padding: 0 10px; border: 0; background: transparent; color: var(--fg2); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline">Clear all</button>
<button type="button" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg2); font: inherit; font-size: 13px; cursor: pointer; margin-left: auto">Save filter</button>
</div>

<div style="padding: 12px 20px 40px; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; gap: 16px">

<section aria-labelledby="m-filter" style="flex: 1 1 320px; max-width: 380px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px">
<h2 id="m-filter" style="margin: 0; font-size: 15px; font-weight: 650">Filter</h2>
<label for="f-find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find a field to filter by</label>
<input id="f-find" type="search" placeholder="Find a field" style="height: 36px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); font: inherit">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="7">
<li><button type="button" style="width: 100%; min-height: 40px; padding: 0 8px; border: 0; border-radius: 6px; background: {{f.bg}}; color: var(--fg); font: inherit; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left"><span>{{f.name}}</span><span style="color: {{f.fg}}; font-size: 13px; font-weight: {{f.weight}}">{{f.value}}</span></button></li>
</sc-for>
</ul>
<div style="border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg3)">Saved filters</span>
<button type="button" style="min-height: 36px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); font: inherit; cursor: pointer; text-align: left">[Saved filter name]</button>
</div>
</section>

<section aria-labelledby="m-view" style="flex: 1 1 320px; max-width: 380px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 14px">
<h2 id="m-view" style="margin: 0; font-size: 15px; font-weight: 650">View</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="v-preset" style="font-size: 13px; color: var(--fg3)">Preset</label>
<select id="v-preset" style="height: 36px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); font: inherit"><option>Default (board default)</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="v-den" style="font-size: 13px; color: var(--fg3)">Card density</span>
<div role="group" aria-labelledby="v-den" style="display: flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden">
<button type="button" aria-pressed="true" style="flex: 1 1 0; min-height: 36px; border: 0; background: var(--primary); color: #ffffff; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg>Comfortable</button>
<button type="button" aria-pressed="false" style="flex: 1 1 0; min-height: 36px; border: 0; border-left: 1px solid var(--line-strong); background: transparent; color: var(--fg2); font: inherit; cursor: pointer">Standard</button>
<button type="button" aria-pressed="false" style="flex: 1 1 0; min-height: 36px; border: 0; border-left: 1px solid var(--line-strong); background: transparent; color: var(--fg2); font: inherit; cursor: pointer">Dense</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="v-over" style="font-size: 13px; color: var(--fg3)">Overlay</label>
<select id="v-over" style="height: 36px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); font: inherit"><option>None</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: var(--fg3)">Swimlanes</span>
<div style="display: flex; gap: 8px">
<button type="button" style="flex: 1 1 0; min-height: 36px; border-radius: 6px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); font: inherit; cursor: pointer">Collapse all</button>
<button type="button" style="flex: 1 1 0; min-height: 36px; border-radius: 6px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); font: inherit; cursor: pointer">Expand all</button>
</div>
</div>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px"><span>Show sub-columns</span><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #2563eb"></label>
<div style="border-top: 1px solid var(--line); padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px"><span style="color: var(--fg2)">On the card: Deal value, Probability</span><a href="#fields">Change</a></div>
</section>

<section aria-labelledby="m-more" style="flex: 0 1 240px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 8px; display: flex; flex-direction: column; gap: 2px">
<h2 id="m-more" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">More board actions</h2>
<button type="button" style="min-height: 40px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); font: inherit; cursor: pointer; text-align: left">Export board</button>
<button type="button" style="min-height: 40px; padding: 0 10px; border: 0; border-radius: 6px; background: var(--chip); color: var(--fg); font: inherit; cursor: pointer; text-align: left">Board settings</button>
<button type="button" style="min-height: 40px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); font: inherit; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px">Keyboard shortcuts <kbd style="font: inherit; font-size: 12px; color: var(--fg2); background: var(--chip); border-radius: 4px; padding: 0 6px">?</kbd></button>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    var f = function (name, value) { var on = !!value; return { name: name, value: value || 'Any', bg: on ? 'rgba(59,130,246,0.16)' : 'transparent', fg: on ? 'var(--strong)' : 'var(--fg3)', weight: on ? 600 : 400 }; };
    return { filters: [f('Assignee'), f('Label', 'Renewal'), f('Swimlane', 'APAC'), f('Due date'), f('Last moved'), f('Track state'), f('Deal value'), f('Probability')] };
  }
}
</script>
</body>
</html>
