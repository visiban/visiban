# ---------------------------------------------------------------------------
# SonarQube / SonarCloud configuration
# ---------------------------------------------------------------------------

sonar.projectKey=visiban_visiban
sonar.organization=visiban

sonar.sources=backend,frontend/src,scripts,.gitlab-ci.yml,docker-compose.yml,init-letsencrypt.sh
sonar.tests=backend,frontend/src/test
sonar.test.inclusions=**/tests/**,**/test/**

# ---------------------------------------------------------------------------
# False-positive suppressions
#
# Each rule below has been triaged and confirmed as a false positive.
# See https://gitlab.com/visiban/visiban/-/issues/636 for context.
# ---------------------------------------------------------------------------

sonar.issue.ignore.multicriteria=pw_tests,pw_ci,pw_compose,pw_ci2,rand_tests,rand_seed,rand_commands,sort_tests,dataset_tests,const_tests,complexity_migrations,complexity_seed,literals_migrations,literals_seed

# ── S2068: Hardcoded passwords ──────────────────────────────────────────────
# Test files: User.objects.create_user(password="x") is standard Django test setup
sonar.issue.ignore.multicriteria.pw_tests.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.pw_tests.resourceKey=**/tests/**

# CI config: ephemeral service containers destroyed after each pipeline job
sonar.issue.ignore.multicriteria.pw_ci.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.pw_ci.resourceKey=.gitlab-ci.yml

sonar.issue.ignore.multicriteria.pw_ci2.ruleKey=docker:S6437
sonar.issue.ignore.multicriteria.pw_ci2.resourceKey=.gitlab-ci.yml

# docker-compose.yml: local dev defaults; production uses .env overrides
sonar.issue.ignore.multicriteria.pw_compose.ruleKey=docker:S6437
sonar.issue.ignore.multicriteria.pw_compose.resourceKey=docker-compose.yml

# ── S2245: Weak PRNG (random module) ────────────────────────────────────────
# Test files: random values for test fixtures, not security-sensitive
sonar.issue.ignore.multicriteria.rand_tests.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.rand_tests.resourceKey=**/tests/**

# Seed data generators: random for demo content, not tokens or secrets
sonar.issue.ignore.multicriteria.rand_seed.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.rand_seed.resourceKey=**/seed_data/**

sonar.issue.ignore.multicriteria.rand_commands.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.rand_commands.resourceKey=**/management/commands/seed_*

# ── Test file style preferences (not bugs) ──────────────────────────────────
# S6325: .sort() without localeCompare — ASCII enum keys, not user-facing strings
sonar.issue.ignore.multicriteria.sort_tests.ruleKey=javascript:S6325
sonar.issue.ignore.multicriteria.sort_tests.resourceKey=**/test/**

# S6330: .dataset vs getAttribute — style preference in test assertions
sonar.issue.ignore.multicriteria.dataset_tests.ruleKey=javascript:S6330
sonar.issue.ignore.multicriteria.dataset_tests.resourceKey=**/test/**

# S2589: "expression always constant" — test_oidc_settings intentional assertions
sonar.issue.ignore.multicriteria.const_tests.ruleKey=python:S2589
sonar.issue.ignore.multicriteria.const_tests.resourceKey=**/tests/**

# ── Auto-generated code (never refactor) ────────────────────────────────────
# Migrations: Django auto-generated, cognitive complexity and literals are expected
sonar.issue.ignore.multicriteria.complexity_migrations.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.complexity_migrations.resourceKey=**/migrations/**

sonar.issue.ignore.multicriteria.literals_migrations.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.literals_migrations.resourceKey=**/migrations/**

# Seed data: verbose by design for readability; duplicated literals are intentional
sonar.issue.ignore.multicriteria.complexity_seed.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.complexity_seed.resourceKey=**/management/commands/seed_*

sonar.issue.ignore.multicriteria.literals_seed.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.literals_seed.resourceKey=**/management/commands/seed_*
