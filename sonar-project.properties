# ── CI-script findings (#1377) ──────────────────────────────────────────────
# S8707 (path traversal) and S8705 (argument injection) on scripts/*.py are
# FIXED in code first: scripts/_paths.py::resolve_within confines every
# CLI-supplied file path, and kaizen_gate_ledger.py whitelists --window /
# --project before they reach the glab argv. Where Sonar's taint engine still
# cannot see the sanitizer, a per-file criterion remains: S8705 has argv1
# (kaizen_gate_ledger.py) and argv2 (post-mr-cost.py); S6350 has argv3
# (post-mr-cost.py); S8707 has one per file (pathtrav1-4, 6-7, 9 below), and
# S2083 (the same path-traversal class under its older pythonsecurity key) has
# one criterion per file (pathtrav5, 8, 10 below), so each stays active on every
# other script. scripts/post-mr-cost.py is both partly fixed in code and
# suppressed per file (see pathtrav9 below).
#
# argv1 - pythonsecurity:S8705 on scripts/kaizen_gate_ledger.py. Sonar's taint
# engine does not recognize validate_project / validate_window as sanitizers, so
# it flagged the `glab api` call after #1377's hardening. The argv is list-form
# (no shell), glab is resolved via shutil.which, --project is mapped through the
# _KNOWN_PROJECTS allowlist (the argv gets a constant, never the CLI string),
# --window is an int, and the query is built with urlencode, so no option or
# extra parameter can be injected. Kept as defense-in-depth until a SonarCloud
# scan confirms the allowlist clears S8705 on its own; remove it then. Scoped
# to the one file so S8705 stays active on any other script.
sonar.issue.ignore.multicriteria.argv1.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.argv1.resourceKey=scripts/kaizen_gate_ledger.py
#
# pathtrav1 - pythonsecurity:S8707 (path traversal) on scripts/check_mutation_score.py
# (#1538). The CLI paths are trusted CI inputs, and every read and write path goes
# through scripts/_paths.py::resolve_within(cli_roots(), ...), which rejects any
# escape with PathEscapeError (exit 2). #1515 hardened it and the scan after that
# still flagged the --write-merged write: Sonar's taint engine does not recognize
# resolve_within as a sanitizer. Scoped to the one file so S8707 stays active on
# every other script. Remove this once a SonarCloud scan shows the sanitizer is
# recognized.
sonar.issue.ignore.multicriteria.pathtrav1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pathtrav1.resourceKey=scripts/check_mutation_score.py
