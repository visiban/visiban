# ---------------------------------------------------------------------------
# SonarQube / SonarCloud configuration
# ---------------------------------------------------------------------------

sonar.projectKey=visiban_visiban
sonar.organization=visiban

# ---------------------------------------------------------------------------
# Source / test layout (#1370)
# ---------------------------------------------------------------------------
# sonar.sources is product code; sonar.tests is test code. The two used to
# overlap (`backend` and `frontend/src` were each in both, separated only by
# sonar.test.inclusions), so test files could be counted as product source and
# drag coverage down. Backend tests live in per-app `tests/` dirs inside the
# source tree, so sonar.tests names those dirs explicitly and sonar.exclusions
# below removes the same files (plus colocated *.test.* and conftest files)
# from the product-source side. The glob is scoped to `backend/*/tests/**`
# (not `**/tests/**`) so scripts/tests/*.test.sh stay in analysis. Keep the two lists in step when a new Django
# app with a `tests/` dir is added.
sonar.sources=backend,frontend/src,scripts,.gitlab-ci.yml,docker-compose.yml,init-letsencrypt.sh
sonar.tests=backend/accounts/tests,backend/boards/tests,backend/git_lens/tests,backend/groups/tests,backend/mcp_server/tests,frontend/src/test,frontend/e2e
sonar.exclusions=backend/*/tests/**,frontend/src/test/**,**/test_*.py,**/conftest.py,**/*.test.ts,**/*.test.tsx

# ---------------------------------------------------------------------------
# Test coverage import (#1370)
# ---------------------------------------------------------------------------
# SonarCloud does NOT run tests: it imports the reports below. Without these
# keys the Coverage metric reads 0.0% regardless of how much is tested (the
# GitLab coverage badge is a separate stdout-regex mechanism that never reaches
# the scanner). The scanner runs from the repo root, so both reports are
# rewritten first by `scripts/sonar-scan.sh --prep-only` (called by the
# `sonar:scan` CI job and by a developer's local scan):
#   - backend/coverage.xml (Cobertura) has an EMPTY <source> because
#     backend/.coveragerc sets relative_files = true; the rewrite injects
#     <repo>/backend so the class filenames resolve.
#   - frontend/coverage/lcov.info records `SF:src/...` relative to frontend/;
#     the rewrite prefixes them to `SF:frontend/src/...`.
sonar.python.coverage.reportPaths=backend/coverage.sonar.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.sonar.info

# ---------------------------------------------------------------------------
# Coverage-denominator exclusions (#1370) - NOT the same as sonar.exclusions.
# ---------------------------------------------------------------------------
# These paths stay in analysis (issues and duplication are still reported) but
# are removed from the COVERAGE denominator. Test code is the measuring
# instrument, not the subject, and repo tooling has no coverage report to
# import. Nothing under product src is excluded to hit a number. Each entry:
#   - **/tests/**, **/test_*.py, **/conftest.py : Python test suites and fixtures
#   - **/*.test.ts, **/*.test.tsx               : colocated/vitest unit tests
#   - frontend/src/test/**                      : vitest unit tests + shared test utils
#   - frontend/e2e/**                           : Playwright specs (assert flows, not covered)
#   - **/migrations/**                          : Django migrations, auto-generated schema ops;
#                                                 data-migration logic is tested through its
#                                                 underlying function, not the migration module
#   - scripts/**, backend/scripts/**            : repo tooling (CI gate scripts, release helpers,
#                                                 seed builders). None of it ships in an image or
#                                                 bundle and no test runner instruments it
#   - backend/**/management/commands/seed_*     : demo/template data generators, run by hand
#   - backend/factories.py                      : test-data factory module, test infrastructure
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/conftest.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  frontend/src/test/**,\
  frontend/e2e/**,\
  **/migrations/**,\
  scripts/**,\
  backend/scripts/**,\
  backend/**/management/commands/seed_*,\
  backend/factories.py

# ---------------------------------------------------------------------------
# False-positive suppressions
#
# Each rule below has been triaged and confirmed as a false positive.
# See https://gitlab.com/visiban/visiban/-/issues/636 for context.
# ---------------------------------------------------------------------------

sonar.issue.ignore.multicriteria=pw_tests,pw_ci,pw_ci2,pw_admin_cmd,rand_tests,rand_seed,rand_commands,sort_tests,dataset_tests,const_tests,complexity_migrations,complexity_seed,literals_migrations,literals_seed,copy_dockerfile,copy_dockerfile_prod,pip_local_wheels,gitpath1,shhttp1,shhttp2

# ── S2068 / S6437: Hardcoded passwords ──────────────────────────────────────
# Test files: User.objects.create_user(password="pass") is standard Django test setup
sonar.issue.ignore.multicriteria.pw_tests.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.pw_tests.resourceKey=**/tests/**

# CI config: ci_password is a throwaway credential for ephemeral service containers
# destroyed at pipeline job end; the network is isolated and the value has no
# meaning outside CI.
sonar.issue.ignore.multicriteria.pw_ci.ruleKey=yaml:S6437
sonar.issue.ignore.multicriteria.pw_ci.resourceKey=.gitlab-ci.yml

sonar.issue.ignore.multicriteria.pw_ci2.ruleKey=secrets:S6437
sonar.issue.ignore.multicriteria.pw_ci2.resourceKey=.gitlab-ci.yml

# ensure_site_admin.py: _PASSWORD_FILE is a file-path variable whose name contains
# "password" — the value is never a credential, it is a filesystem path.
sonar.issue.ignore.multicriteria.pw_admin_cmd.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.pw_admin_cmd.resourceKey=**/management/commands/ensure_site_admin.py

# ── S6470: COPY . . in Dockerfiles ──────────────────────────────────────────
# Both Dockerfiles use `COPY . .` with a .dockerignore that explicitly excludes
# .env, .env.*, *.pem, *.key, local_settings.py, and other sensitive files.
# The COPY is safe; this is a false positive.
sonar.issue.ignore.multicriteria.copy_dockerfile.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.copy_dockerfile.resourceKey=backend/Dockerfile

sonar.issue.ignore.multicriteria.copy_dockerfile_prod.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.copy_dockerfile_prod.resourceKey=backend/Dockerfile.prod

# ── S8544: pip install of local wheels (backend/Dockerfile runtime stage) ─────
# The runtime stage runs `pip install --no-index --no-deps /wheels/*.whl`. Every
# wheel was built/downloaded in the builder stage with --require-hashes against
# backend/requirements.lock; the dj-rest-auth wheel is built locally from a
# hash-verified sdist, so its own wheel hash differs from anything in the lock
# and cannot be re-checked here. Deliberately NOT applied to Dockerfile.prod,
# which is the shipped image and is audited unsuppressed (#1378).
sonar.issue.ignore.multicriteria.pip_local_wheels.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.pip_local_wheels.resourceKey=backend/Dockerfile

# ── S2245: Weak PRNG (random module) ────────────────────────────────────────
# Test files: random values for test fixtures, not security-sensitive
sonar.issue.ignore.multicriteria.rand_tests.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.rand_tests.resourceKey=**/tests/**

# Seed data generators: random for demo content, not tokens or secrets
sonar.issue.ignore.multicriteria.rand_seed.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.rand_seed.resourceKey=**/seed_data/**

sonar.issue.ignore.multicriteria.rand_commands.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.rand_commands.resourceKey=**/management/commands/seed_*

# ── Test file style preferences (not bugs) ──────────────────────────────────
# S6325: .sort() without localeCompare — ASCII enum keys, not user-facing strings
sonar.issue.ignore.multicriteria.sort_tests.ruleKey=javascript:S6325
sonar.issue.ignore.multicriteria.sort_tests.resourceKey=**/test/**

# S6330: .dataset vs getAttribute — style preference in test assertions
sonar.issue.ignore.multicriteria.dataset_tests.ruleKey=javascript:S6330
sonar.issue.ignore.multicriteria.dataset_tests.resourceKey=**/test/**

# S2589: "expression always constant" — test_oidc_settings intentional assertions
sonar.issue.ignore.multicriteria.const_tests.ruleKey=python:S2589
sonar.issue.ignore.multicriteria.const_tests.resourceKey=**/tests/**

# ── Auto-generated code (never refactor) ────────────────────────────────────
# Migrations: Django auto-generated, cognitive complexity and literals are expected
sonar.issue.ignore.multicriteria.complexity_migrations.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.complexity_migrations.resourceKey=**/migrations/**

sonar.issue.ignore.multicriteria.literals_migrations.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.literals_migrations.resourceKey=**/migrations/**

# Seed data: verbose by design for readability; duplicated literals are intentional
sonar.issue.ignore.multicriteria.complexity_seed.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.complexity_seed.resourceKey=**/management/commands/seed_*

sonar.issue.ignore.multicriteria.literals_seed.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.literals_seed.resourceKey=**/management/commands/seed_*

# ── CI-script findings (#1377) ──────────────────────────────────────────────
# S8707 (path traversal) and S8705 (argument injection) on scripts/*.py are
# FIXED in code, not suppressed: scripts/_paths.py::resolve_within confines
# every CLI-supplied file path, and kaizen_gate_ledger.py whitelists --window /
# --project before they reach the glab argv. No criterion here for those rules,
# so they stay active on any new script.
#
# gitpath1 - javascript:S4036 on scripts/check-added-files-covered.mjs. The
# script runs `git` via spawnSync with list-form args (no shell); the args are
# CI-controlled and the --target-ref / target branch is validated (a leading `-`
# is rejected) so no option can be smuggled in. It runs only in CI images and
# developer checkouts, where PATH is fixed by the image or the developer's own
# shell; there is no attacker-influenced PATH. Resolving an
# absolute git path would break the same script on macOS/Homebrew checkouts.
# Scoped to the one file so S4036 stays active elsewhere.
sonar.issue.ignore.multicriteria.gitpath1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.gitpath1.resourceKey=scripts/check-added-files-covered.mjs

# shhttp1 / shhttp2 - shell:S5332 on scripts/helm-structure-check.sh and
# scripts/render-nginx-hsts.sh. Every `http://` is a string pattern or fixture
# that the script asserts against (the nginx `proxy_pass http://backend:8000`
# upstream, the rendered chart's in-cluster `http://<release>-backend`) - no
# request is made, and in-cluster service-to-service HTTP is the design (TLS
# terminates at the ingress). Scoped per file so S5332 stays active on any shell
# that makes a real cleartext request.
sonar.issue.ignore.multicriteria.shhttp1.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.shhttp1.resourceKey=scripts/helm-structure-check.sh
sonar.issue.ignore.multicriteria.shhttp2.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.shhttp2.resourceKey=scripts/render-nginx-hsts.sh
