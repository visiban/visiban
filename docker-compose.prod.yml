# Production stack — run via init-prod.sh on first boot,
# then: docker compose -f docker-compose.prod.yml up -d
#
# Required .env variables (in addition to the standard ones):
#   APP_VERSION=v1.1.0          (image tag to pull; REQUIRED — see #1074. No longer
#                                defaults to the mutable "latest" tag; .env.example
#                                ships a pinned value)
#   DOMAIN=yourdomain.com
#   TLS_MODE=letsencrypt        (letsencrypt | selfsigned | none)
#   CERTBOT_EMAIL=admin@yourdomain.com   (required only when TLS_MODE=letsencrypt)

# Pinned rather than derived from the checkout directory. Unpinned, the project
# name comes from the directory basename — `visiban` on a default clone, which
# is what docker-compose.yml used to default to as well. That collision shared
# `<project>_pgdata` between the dev and production stacks and let `up` on one
# recreate the other's `db` / `valkey` / `backend` containers in place.
# `visiban` is exactly what a default clone already resolved to, so pinning it
# here changes nothing for an existing install.
name: visiban

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: visiban
      POSTGRES_USER: visiban
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — do not use a default in production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visiban"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Valkey is the BSD-3, Linux Foundation fork of Redis (after Redis 7.4's move
  # to the non-OSI RSALv2/SSPL license). Wire-compatible with Redis 7 — the
  # redis:// URL scheme, REDIS_PASSWORD auth, and RESP protocol are unchanged.
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data
    command: valkey-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs migrations and collectstatic once before the backend starts. Exits 0 on
  # success; the backend service waits for this to complete. The admin
  # bootstrap (ensure_site_admin) runs in the backend container instead — see
  # the comment there.
  #
  # `collectstatic` writes STATIC_ROOT (/app/staticfiles, settings.py) into
  # the `staticfiles` volume below, which `backend` also mounts (read-only).
  # Without a shared volume, this one-shot container's filesystem — manifest
  # and all — is discarded when it exits, and `backend` never receives
  # collectstatic's output: whitenoise.storage.CompressedManifestStaticFiles-
  # Storage then has no `staticfiles.json` to resolve `{% static %}` against,
  # and /admin/ 500s (`ValueError: Missing staticfiles manifest entry`) under
  # DEBUG=false. Same bug class as #1228's Helm chart finding — this service
  # had it too (confirmed: neither backend-init nor backend mounted a shared
  # staticfiles volume before this change).
  backend-init:
    image: ghcr.io/visiban/visiban/backend:${APP_VERSION:?APP_VERSION must be set in .env — see .env.example. Pin it to a released tag (e.g. v1.1.0); it no longer silently falls back to the mutable 'latest' tag (#1074)}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://visiban:${DB_PASSWORD:?DB_PASSWORD must be set — do not use a default in production}@db:5432/visiban
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@valkey:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@valkey:6379/1
      DEBUG: "false"
    volumes:
      - mediafiles:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  backend:
    image: ghcr.io/visiban/visiban/backend:${APP_VERSION:?APP_VERSION must be set in .env — see .env.example. Pin it to a released tag (e.g. v1.1.0); it no longer silently falls back to the mutable 'latest' tag (#1074)}
    # ensure_site_admin runs HERE, not in backend-init: it writes the one-time
    # admin password to /tmp/visiban_admin_password, and a file written in the
    # one-shot backend-init container vanished with it — so the documented
    # `exec backend cat /tmp/visiban_admin_password` found nothing and a fresh
    # install had no way to its first login. It is idempotent (a no-op once a
    # site admin exists), so running it on every start is safe.
    command: ["sh", "-c", "python manage.py ensure_site_admin && exec daphne -b 0.0.0.0 -p 8000 visiban.asgi:application"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://visiban:${DB_PASSWORD:?DB_PASSWORD must be set — do not use a default in production}@db:5432/visiban
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@valkey:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@valkey:6379/1
      DEBUG: "false"
      # Read by the healthcheck below. Set explicitly (not only via env_file) so
      # a DOMAIN exported in the shell but missing from .env fails closed here
      # instead of as a KeyError in the probe that keeps nginx from starting.
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    volumes:
      - mediafiles:/app/media
      # See backend-init's comment above (#1228). Read-only: this container
      # never writes STATIC_ROOT itself, only reads what backend-init wrote.
      - staticfiles:/app/staticfiles:ro
    depends_on:
      backend-init:
        condition: service_completed_successfully
    # The probe sends Host: $DOMAIN — the Host nginx forwards for real traffic,
    # and one ALLOWED_HOSTS must already contain. A bare urlopen() sent
    # Host: localhost, which ALLOWED_HOSTS=<your domain> rejects with a 400, so
    # the backend never turned healthy and nginx (which waits on it) never
    # started. Adding localhost to ALLOWED_HOSTS instead would let any client
    # reach Django with that Host through nginx's catch-all server block.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os, urllib.request as u; u.urlopen(u.Request(\"http://localhost:8000/api/health/liveness/\", headers={\"Host\": os.environ[\"DOMAIN\"]}))'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Runs the daily maintenance commands (#1157) — notify_due_soon at 07:00 UTC
  # and notify_stale_cards at 08:00 UTC by default; the prune jobs only when
  # their SCHEDULE_* variable is set. See docs/administration/scheduled-jobs.md.
  # Opt-in via the `scheduler` profile, so an existing `docker compose up -d`
  # starts exactly what it did before. Enable it with COMPOSE_PROFILES=scheduler
  # in .env (comma-separate if you also use letsencrypt), then `up -d` again.
  scheduler:
    image: ghcr.io/visiban/visiban/backend:${APP_VERSION:?APP_VERSION must be set in .env — see .env.example. Pin it to a released tag (e.g. v1.1.0); it no longer silently falls back to the mutable 'latest' tag (#1074)}
    command: ["python", "manage.py", "run_scheduler"]
    restart: unless-stopped
    profiles: ["scheduler"]
    # A job in progress when the service is stopped gets time to finish its
    # current batch; the loop itself exits on SIGTERM between jobs.
    stop_grace_period: 2m
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://visiban:${DB_PASSWORD:?DB_PASSWORD must be set — do not use a default in production}@db:5432/visiban
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@valkey:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@valkey:6379/1
      DEBUG: "false"
    depends_on:
      backend-init:
        condition: service_completed_successfully

  # Copies the pre-built frontend assets from the release image into the shared
  # volume so nginx can serve them. Exits immediately after the copy completes.
  # nginx waits for this service to complete before starting.
  frontend-build:
    image: ghcr.io/visiban/visiban/frontend:${APP_VERSION:?APP_VERSION must be set in .env — see .env.example. Pin it to a released tag (e.g. v1.1.0); it no longer silently falls back to the mutable 'latest' tag (#1074)}
    # The image itself runs as the non-root `nginx` user (#1528), but a fresh
    # named volume is root-owned, so this one-shot copy job must run as root
    # to write into it. The long-running nginx service mounts it read-only.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp -r /usr/share/nginx/html/. /dist/"]
    volumes:
      - frontend-dist:/dist

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      # The rendered config is written here at startup; the rest of the root
      # filesystem stays read-only. mode=0755, not Docker's default 1777: the
      # root master reloads conf.d/*.conf every 6 hours (below), so a
      # world-writable directory would let a compromised worker plant config.
      - /etc/nginx/conf.d:mode=0755
    ports:
      - "80:80"
      - "443:443"
    # init-prod.sh copies the correct nginx template to nginx/active.conf.template
    # based on TLS_MODE. envsubst renders it at container startup.
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    # Exec form on one line on purpose. The previous folded (`>`) scalar kept
    # the newlines of its more-indented continuation lines, so sh ran the
    # redirections as separate commands and died on a bare `&&` — nginx
    # crash-looped on every install.
    #
    # The background loop reloads nginx every 6 hours so a certificate the
    # certbot service renewed is actually served; nginx otherwise keeps the
    # certificate it loaded at startup until that one expires. A reload with
    # nothing changed is a no-op.
    command: ["/bin/sh", "-c", "envsubst '$${DOMAIN}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf || exit 1; (while :; do sleep 6h; nginx -s reload; done) & exec nginx -g 'daemon off;'"]
    volumes:
      - ./nginx/active.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend-dist:/usr/share/nginx/html:ro
      - mediafiles:/app/media:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  # Renews the Let's Encrypt cert every 12 hours (certbot skips if not due).
  # Only started when TLS_MODE=letsencrypt (via Compose profiles).
  certbot:
    # Pinned: this is the only service that owns TLS issuance and renewal, and
    # an untagged image resolves to `latest` on every `compose pull` — a silent
    # version change in the TLS path with no diff and no pipeline event. Every
    # sibling service here already carried a floor; this one did not.
    # v5.8.0 is what `latest` resolved to when this was pinned (2026-09-01), so
    # the pin is a no-op today and a floor from here on.
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    profiles: ["letsencrypt"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  frontend-dist:
  mediafiles:
  # Shared between backend-init (writes, via collectstatic) and backend
  # (reads, read-only) — see backend-init's comment above (#1228).
  staticfiles:
