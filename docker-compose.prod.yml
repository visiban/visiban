# Production stack — run via init-prod.sh on first boot,
# then: docker compose -f docker-compose.prod.yml up -d
#
# Required .env variables (in addition to the standard ones):
#   APP_VERSION=v1.0.0-rc.11   (image tag to pull; defaults to "latest" if unset)
#   DOMAIN=yourdomain.com
#   TLS_MODE=letsencrypt        (letsencrypt | selfsigned | none)
#   CERTBOT_EMAIL=admin@yourdomain.com   (required only when TLS_MODE=letsencrypt)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: visiban
      POSTGRES_USER: visiban
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — do not use a default in production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visiban"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs migrations, collectstatic, and admin bootstrap once before the backend
  # starts. Exits 0 on success; the backend service waits for this to complete.
  backend-init:
    image: ghcr.io/visiban/visiban/backend:${APP_VERSION:-latest}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_site_admin"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://visiban:${DB_PASSWORD:?DB_PASSWORD must be set — do not use a default in production}@db:5432/visiban
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      DEBUG: "false"
    volumes:
      - mediafiles:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    image: ghcr.io/visiban/visiban/backend:${APP_VERSION:-latest}
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "visiban.asgi:application"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://visiban:${DB_PASSWORD:?DB_PASSWORD must be set — do not use a default in production}@db:5432/visiban
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      DEBUG: "false"
    volumes:
      - mediafiles:/app/media
    depends_on:
      backend-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health/liveness/\")'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Copies the pre-built frontend assets from the release image into the shared
  # volume so nginx can serve them. Exits immediately after the copy completes.
  # nginx waits for this service to complete before starting.
  frontend-build:
    image: ghcr.io/visiban/visiban/frontend:${APP_VERSION:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp -r /usr/share/nginx/html/. /dist/"]
    volumes:
      - frontend-dist:/dist

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      - "80:80"
      - "443:443"
    # init-prod.sh copies the correct nginx template to nginx/active.conf.template
    # based on TLS_MODE. envsubst renders it at container startup.
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    command: >
      /bin/sh -c
      "envsubst '$${DOMAIN}'
       < /etc/nginx/templates/default.conf.template
       > /etc/nginx/conf.d/default.conf
       && nginx -g 'daemon off;'"
    volumes:
      - ./nginx/active.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend-dist:/usr/share/nginx/html:ro
      - mediafiles:/app/media:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  # Renews the Let's Encrypt cert every 12 hours (certbot skips if not due).
  # Only started when TLS_MODE=letsencrypt (via Compose profiles).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    profiles: ["letsencrypt"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  frontend-dist:
  mediafiles:
