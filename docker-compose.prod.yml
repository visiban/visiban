# Production stack — run via init-letsencrypt.sh on first boot,
# then: docker compose -f docker-compose.prod.yml up -d
#
# Required .env variables (in addition to the standard ones):
#   APP_VERSION=v1.0.0-rc.11   (image tag to pull; defaults to "latest" if unset)
#   DOMAIN=yourdomain.com
#   CERTBOT_EMAIL=admin@yourdomain.com

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: visiban
      POSTGRES_USER: visiban
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — do not use a default in production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visiban"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    image: ghcr.io/visiban/visiban/backend:${APP_VERSION:-latest}
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py ensure_site_admin &&
             daphne -b 0.0.0.0 -p 8000 visiban.asgi:application"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://visiban:${DB_PASSWORD:?DB_PASSWORD must be set — do not use a default in production}@db:5432/visiban
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      DEBUG: "false"
    volumes:
      - mediafiles:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Copies the pre-built frontend assets from the release image into the shared
  # volume so nginx can serve them. Exits immediately after the copy completes.
  # nginx waits for this service to complete before starting.
  frontend-build:
    image: ghcr.io/visiban/visiban/frontend:${APP_VERSION:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp -r /usr/share/nginx/html/. /dist/"]
    volumes:
      - frontend-dist:/dist

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Render the nginx config template at container startup so the host never
    # needs to run envsubst manually.  envsubst '${DOMAIN}' restricts
    # substitution to $DOMAIN only — all nginx variables ($host, $uri, etc.)
    # are left untouched.
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    command: >
      /bin/sh -c
      "envsubst '$${DOMAIN}'
       < /etc/nginx/templates/default.conf.template
       > /etc/nginx/conf.d/default.conf
       && nginx -g 'daemon off;'"
    volumes:
      - ./nginx/app.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend-dist:/usr/share/nginx/html:ro
      - mediafiles:/app/media:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started

  # Renews the Let's Encrypt cert every 12 hours (certbot skips if not due).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  frontend-dist:
  mediafiles:
