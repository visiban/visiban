# gitleaks configuration for Visiban.
#
# Extends the upstream default ruleset (the maintained set of provider/key
# patterns) and adds ONLY a small, documented allowlist for values that look
# secret-shaped but are never real credentials. Each entry carries the reason
# it is safe so the allowlist stays auditable and does not quietly mask a real
# leak. Built from an actual `gitleaks dir .` run against this tree — every
# entry below corresponds to a real finding, not a speculative exemption.
#
# Run locally:  gitleaks dir . --config .gitleaks.toml
title = "Visiban gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Visiban false-positive allowlist — doc examples and test fixtures, never real secrets"

# Path-scoped: files that structurally contain high-entropy or token-shaped
# strings which are documentation examples, test fixtures, or generated
# artifacts, not secrets.
paths = [
  # npm lockfiles carry sha512-/integrity checksum values on every dependency.
  '''(^|/)package-lock\.json$''',
  # Example env file exists precisely to show placeholder values
  # (DJANGO_SECRET_KEY=change-me-in-production, REDIS_PASSWORD=change-me-in-production).
  '''\.env\.example$''',
  # API reference docs — every page under docs/api/ shows example curl
  # requests with `Authorization: Bearer <token>` headers and example
  # raw_token/share_token response fields (docs/api/authentication.md,
  # docs/api/admin.md, docs/api/boards.md, docs/api/cards.md,
  # docs/api/websockets.md). Documentation, not credentials.
  '''(^|/)docs/api/.*\.md$''',
  # Personal-access-token feature doc — walks through minting and using a
  # token, so it necessarily shows an example token value in curl headers.
  '''(^|/)docs/features/personal-access-tokens\.md$''',
  # Frontend test fixtures for the access-tokens and admin/API-auth UI —
  # mock token strings (e.g. `vbn_...`, `test-key-abc123`) asserted against
  # in the test, never a real credential.
  '''(^|/)frontend/src/test/accessTokensTab\.test\.tsx$''',
  '''(^|/)frontend/src/test/adminPage\.test\.tsx$''',
  '''(^|/)frontend/src/test/apiAuth\.test\.ts$''',
  # CI drill script (#1180): hardcoded demo-mode fixture passwords
  # (netpol-visitor-pw-1, etc.), passed via --set-string only to satisfy the
  # Helm chart's own render guards while proving the egress NetworkPolicy
  # under a real kind+Calico cluster. Never a real credential — the whole
  # point of the drill is that these are thrown away with the cluster.
  '''(^|/)scripts/helm-netpol-drill\.sh$''',
  # Helm structure check (#1200): VALKEY_GUARD_CASES/VALKEY_GUARD_FIX_ARGS
  # assert that a render carrying a Bitnami-era `valkey.image.repository`
  # value (bitnami/valkey, bitnamilegacy/valkey) fails or is corrected. The
  # `--set=valkey.image.repository=<value>` strings match the generic-api-key
  # rule on shape alone — an image repository name, never a credential.
  '''(^|/)scripts/helm-structure-check\.sh$''',
]

# Commit-scoped allowlist (#1071). Serves gitleaks-scan and gitleaks-history,
# both of which read this file. A `gitleaks git` run over origin/main history
# found exactly one hit: the fixture password constant NEW_PASSWORD in
# backend/accounts/tests/test_ws_credential_revocation_e2e.py, introduced in
# commit 8079469d9. It is a literal test password used to prove that a
# password change revokes live WebSocket sessions, against a throwaway test
# database; never a real credential. It is exempted by commit, not by file, so
# a real secret later added to that file (or any other test file) is still
# caught. The working-tree scan needs no entry.
#
# Seven more commits surfaced once gitleaks-history began scanning full depth
# (main pipeline 2930635777 failed with 28 hits). All are literal test
# passwords in backend/accounts/tests/ (test_social_connect.py,
# test_password_reset.py, and an earlier revision of
# test_ws_credential_revocation_e2e.py before its inline `gitleaks:allow`),
# used against throwaway test databases. The current tree scans clean, so
# these exist only in history. Still scoped by commit, not by file.
commits = [
  "8079469d92fca8989e37ac7427a51d7c8c1b9249",
  "e45b56374107d5a46b74fc67f1d51fb2921d5f73",
  "ad48e0acbc2984aee8176870f4e3cbea1c53bc29",
  "c24bee7fd01e22c7c866187710e59b86bd732eb2",
  "935c63f8eb59afddc963c69d88c58a80521c852b",
  "a20074bbe7d20639e0f2d5846c5ddef9d2df7662",
  "3f58dcb6cba7d2de32fb3aed2173271cc2cde8d4",
  "721177740bbad794e21f718ba0c8be45e284f21f",
]
